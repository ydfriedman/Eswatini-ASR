sm. Diagnosis: positive stool antigen test (stop PPI 2 weeks before testing), positive urease breath test, positive urease test on endoscopic biopsy, or identification by histopathology.\n\n| Therapy Type & Indication | Drug & Dose | Frequency | Duration | Notes |\n| --- | --- | --- | --- | --- |\n| Triple Therapy (complete eradication) | Omeprazole 20 mg PO | 12 hourly | 10–14 days | — |\n| Triple Therapy (complete eradication) | Amoxicillin 1000 mg PO | 12 hourly | 10–14 days | — |\n| Triple Therapy (complete eradication) | Metronidazole 400 mg PO | 12 hourly | 10–14 days | — |\n| Alternative Triple Therapy | Lansoprazole 30 mg PO | 12 hourly | 10–14 days | — |\n| Alternative Triple Therapy | Clarithromycin 500 mg PO | 12 hourly | 10–14 days | — |\n| Alternative Triple Therapy | Tinidazole 500 mg PO | 12 hourly | 14 days | — |\n| Concomitant Therapy | Omeprazole 20 mg PO | 12 hourly | 7 days | — |\n| Concomitant Therapy | Amoxicillin 1000 mg PO | 12 hourly | 7 days | — |\n| Concomitant Therapy | Metronidazole 400 mg PO | 12 hourly | 7 days | — |\n| Concomitant Therapy | Clarithromycin 500 mg PO | 12 hourly | 7 days | — |\n| Bismuth-Based Therapy (treatment failure) | Pantoprazole 40 mg PO OR Esomeprazole 40 mg PO | 12 hourly | 10–14 days | — |\n| Bismuth-Based Therapy (treatment failure) | Bismuth subsalicylate 525 mg PO | 6 hourly | 10–14 days | — |\n| Bismuth-Based Therapy (treatment failure) | Metronidazole 250 mg PO (6 hourly) OR 500 mg PO (8 hourly) | — | 10–14 days | — |\n| Bismuth-Based Therapy (treatment failure) | Tetracycline 500 mg PO | 6 hourly | 10–14 days | — |\n\nNote: H. pylori diagnostic tests should be repeated 5 weeks after the last dose of eradication therapy, and the PPI should be stopped 2 weeks before the H. pylori stool antigen test to confirm eradication."}]},{"id":"Q164","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Upper GI bleeding","type":"clinical","category":"emergency","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"Man vomiting blood: pulse 118, BP 95/60, known peptic ulcer. Immediate management?","change":"New question: GI bleeding was not covered.","reference":"Resuscitate first: two large-bore (18-gauge or larger) IV lines and normal saline or Ringer's lactate to restore vital signs, urine output and mental status. Send FBP, LFT and RFT. For bleeding peptic ulcer, give IV pantoprazole 40 mg (or IV esomeprazole 40 mg) 12-hourly for 2-3 days. Once stable, he needs upper endoscopy; test for H. pylori if an ulcer is found. Suspected variceal bleeding is referred to surgery or a higher facility.","must_include":["Two large-bore IV lines","IV fluids (normal saline or Ringer's lactate)","IV pantoprazole or esomeprazole 40 mg 12-hourly","Endoscopy once stabilised"],"must_not_include":["Oral PPI only","Endoscopy before resuscitation"],"check":"verified","sources":[{"id":"ncdimh-0471","label":"NCDIMH p.170","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"170","heading":"Chapter 5: Gastroenterology and Hepatology > Gastrointestinal Bleeding > Upper GI Bleeding > Initial Management","text":"## **Initial Management**\n\nAssess severity: vital signs including orthostatic changes, JVP. Tachycardia (can be masked by βB use) suggests 10% volume loss, orthostatic hypotension 20% loss, shock >30% loss. After the patient is stabilized; upper endoscopy is required to document the source of bleeding. If upper endoscopy shows an ulcer, test for H. pylori infection.\n\n**Resuscitation:** placement of 2 large-bore (18-gauge or larger) intravenous lines, volume replacement: NS or LR to achieve normal vital signs, urine output, and mental status."},{"id":"ncdimh-0472","label":"NCDIMH p.170-171","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"170-171","heading":"Chapter 5: Gastroenterology and Hepatology > Gastrointestinal Bleeding > Upper GI Bleeding > Laboratory Investigations and Pharmacological Treatment","text":"## **Laboratory Investigations**\n\n* FBP, LFT, RFT.\n* Abdominal ultrasound\n* Viral hepatitis screening\n* H. pylori stool antigen\n\n## **Pharmacological Treatment**\n\nFor variceal bleeding refer to surgical department or higher facility for further management For bleeding peptic ulcer disease\n\nPantoprazole (IV) 40mg 12hourly for 2-3days\n**OR**\nEsomeprazole (IV) 40mg 12hourly for 2-3days"}]},{"id":"Q165","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Breast cancer","type":"clinical","category":"standard","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"45-year-old woman with a hard, fixed, irregular breast lump and a palpable axillary node. How do I refer?","change":"New question: breast cancer was not covered.","reference":"Urgent referral to the specialised breast unit: call and inform the unit. A hard, fixed, irregular lump and a palpable axillary node are features of high likelihood of malignancy.","must_include":["Urgent referral to the specialised breast unit","Call and inform the unit"],"must_not_include":["Book for the routine surgical clinic","Review again in a few months"],"check":"verified","sources":[{"id":"ncdimh-fig-breast-early-referral","label":"NCDIMH p.259","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"259","heading":"Chapter 9: Oncology > Breast Cancer > Early Referral Flow Chart for Suspected Breast Cancer","text":"### Early referral flowchart for suspected breast cancer: urgent referral to the specialised breast unit, booking, or surgical clinic, by likelihood of malignancy\n\nSuspected lump → provider-initiated clinical breast exam (PI-CBE) and direct referral to the specialised breast unit (SBU):\n- High likelihood of malignancy → URGENT REFERRAL TO SBU (call and inform the SBU): suspicious lump (fixed, hard, irregular); palpable axillary lymph node; ulceration; nodules on the skin; skin tethering; nipple retraction; nipple discharge (e.g. bloody).\n- Unsure → book SBU: palpable lump in women >25 years; non-lactational breast infection/abscess.\n- Unlikely to be malignant → book for surgical clinic: palpable lump in women <25 years; breast pain with normal PI-CBE; family history with normal PI-CBE; lactation-associated infection with non-resolution/recurrence."}]},{"id":"Q166","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Prostate cancer","type":"clinical","category":"standard","expected":"Answer from the guideline","safety":"no","original_question":"","original_reference":"","question":"58-year-old man, PSA 6 ng/mL, DRE normal. What next?","change":"New question: prostate cancer was not covered; tests a value band.","reference":"PSA 4-10 with a normal DRE: repeat the PSA after 4-6 weeks; if it has risen, refer to a urologist. Where available, the free-to-total PSA ratio and PSA density can help. An abnormal DRE, or PSA above 10, means referral to a urologist.","must_include":["Repeat PSA in 4-6 weeks","Refer to urologist if it rises"],"must_not_include":["PSA 6 is normal; no follow-up","Repeat in 5-8 years"],"check":"verified","sources":[{"id":"ncdimh-tbl-psa-risk-stratification","label":"NCDIMH p.272","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"272","heading":"Chapter 9: Oncology > Prostate Cancer > Screening and Diagnosis of Prostate Cancer > PSA levels","text":"### PSA-based prostate cancer screening: risk stratification for PSA under 4 ng/ml by age (EAU 2022), and recommendations for PSA 4-10 and >10 ng/ml in men 50-75\n\nProstate screening every two years for men above 50 with risk factors. Discuss screening at age 45 for men at high risk (African American, first-degree relative with prostate cancer at an early age) and at age 40 for very high risk (several first-degree relatives with early prostate cancer). DRE by a trained health worker, with annual PSA and rectal or pelvic ultrasound. Those with above-average risk start earlier at the clinician's discretion.\n\n**PSA under 4 ng/ml: risk stratification (EAU 2022)**\n\n| Category / PSA level | Definition | Recommendation |\n| --- | --- | --- |\n| Low Risk | PSA <1 in those <40 years; PSA <2 in those 41-60 years | Repeat screening after 5 - 8 years |\n| High Risk | PSA >1 in those <40 years; PSA >2 in those 41-60 years | Repeat screening after 2 years |\n\n**PSA above 4 ng/ml in men 50-75 years**\n\n| Category / PSA level | Definition | Recommendation |\n| --- | --- | --- |\n| 4-10 ng/ml |  | 1. If DRE is normal, repeat after 4-6 weeks; if it increases, refer for urologist review. 2. If DRE abnormal, refer to urologist. 3. If available, determine the free to total PSA ratio and PSA density, and consult |\n| > 10 ng/ml |  | Refer to urologist |"}]},{"id":"Q167","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Acute coronary syndrome","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"50-year-old at the clinic with crushing chest pain for 30 minutes, SpO2 96%. He took sildenafil last night. What do I give now?","change":"New question: tests combining two sections (ACS algorithm and PDE5 inhibitors).","reference":"Give aspirin 162-325 mg chewed now (clopidogrel 300 mg if truly allergic) and do a 12-lead ECG within 10 minutes, with IV access, monitoring and troponins. Do not give sublingual nitrates: recent PDE5 inhibitor use is a reason to hold them, and nitrates are contraindicated with sildenafil. No oxygen, since SpO2 is above 90%. Morphine 2-4 mg IV can be used cautiously if pain is uncontrolled.","must_include":["Aspirin 162-325 mg chewed","ECG within 10 minutes","No nitrates because of recent sildenafil","Oxygen only if SpO2 below 90%"],"must_not_include":["Give sublingual GTN","Give oxygen routinely"],"check":"verified","sources":[{"id":"ncdimh-tbl-acs-algorithm-steps-1-3","label":"NCDIMH p.126-127","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"126-127","heading":"Chapter 3: Cardiology > Acute Coronary Syndromes > Algorithm for ACS Management > Steps 1-3: suspect ACS, immediate actions, ECG and troponins","text":"### ACS management algorithm, steps 1-3: presentations, immediate actions in the first 10 minutes (monitoring, oxygen, aspirin, nitrates, morphine, labs), 12-lead ECG and serial troponins\n\n**STEP 1: SUSPECT ACS — Presentations**\n\n| Item | Action |\n| --- | --- |\n| Classic presentations | - Chest pain, pressure, tightness, or heaviness<br/>- Radiation to left arm, jaw, neck, or back<br/>- Dyspnea, diaphoresis, palpitations<br/>- Nausea/vomiting, epigastric discomfort<br/>- Syncope or near-syncope |\n| Atypical (especially in women, elderly, diabetics) | - Fatigue, weakness, malaise<br/>- Isolated dyspnea without chest pain<br/>- Epigastric pain resembling indigestion<br/>- Jaw or arm pain without chest discomfort |\n\n**STEP 2: IMMEDIATE ACTIONS (0–10 minutes)**\n\n| Item | Action |\n| --- | --- |\n| Monitoring | - Continuous 12-lead ECG, cardiac monitoring<br/>- Blood pressure, SpO2, HR monitoring<br/>- IV access × 2 — large bore |\n| Oxygen | - Administer ONLY if SpO2 < 90%; avoid routine O2 |\n| Aspirin | - 162–325 mg PO — chewed immediately<br/>- Hold if true allergy (use Clopidogrel 300 mg instead) |\n| Nitrates | - SL NTG 0.4 mg q5 min × 3 doses<br/>- HOLD if: SBP < 90 mmHg, HR < 50 or > 100, RV infarct, recent PDE5 inhibitor use |\n| Morphine | - 2–4 mg IV if pain uncontrolled after nitrates<br/>- Use cautiously — associated with possible increased mortality in some studies |\n| Labs | - Troponin I or T (high-sensitivity preferred), CK-MB<br/>- BMP, CBC, coagulation (PT/INR/aPTT), BNP/NT-proBNP<br/>- Lipid panel, HbA1c if diabetic history<br/>- Type & Screen |\n\n**STEP 3: 12-LEAD ECG + SERIAL TROPONINS (< 10 minutes)**\n\n| Item | Action |\n| --- | --- |\n| ECG and imaging | - Obtain and interpret 12-lead ECG within 10 minutes of arrival<br/>- Repeat ECG every 15–30 min if initial non-diagnostic<br/>- Right-sided leads (V3R–V4R) if inferior ST elevation — rule out RV infarct<br/>- Serial troponins: 0h, 3h, 6h (standard) OR 0h and 1–2h (high-sensitivity)<br/>- Chest X-ray (portable) to assess for pulmonary edema, aortic dissection<br/>- Bedside echo if hemodynamically unstable |"},{"id":"ncdimh-tbl-pde5-comparison","label":"NCDIMH p.355","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"355","heading":"Chapter 15: Urology > Erectile Function Disorders > PDE5 Inhibitors","text":"### PDE5 inhibitors for erectile dysfunction: sildenafil (Viagra) vs tadalafil (Cialis) onset, half-life, food effect, doses, side effects, contraindications, pharmacological failure\n\n|  | Sildenafil / Viagra | Tadalafil / Cialis |\n| --- | --- | --- |\n| Onset of action | 15 min – 1 hour | 15 min – 2 hours |\n| ½ life | 3–5 hours | 17.5 hours |\n| Food effect | Reduced absorption with fatty foods | None |\n| Dosages | 25, 50, 100 mg | 5, 10, 20 mg |\n| Side effects | Headache, dyspepsia, facial flushing, blurred/blue vision (rare), myalgia, backache | (same as left) |\n| Contraindications | Nitrates | Nitrates |\n| Pharmacological failure | Counsel the patient to take the medication at least 8 times at the maximum dose, 1 hour before sex, on an empty stomach, together with sexual stimulation, before it is deemed medication failure. Then refer to urology. | (same as left) |"}]},{"id":"Q168","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Atrial fibrillation","type":"clinical","category":"standard","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"Stable patient with chronic AF and a fast ventricular rate. What's the treatment approach?","change":"New question: tests a short strategy table.","reference":"Rate control with digoxin, a calcium channel blocker or a beta-blocker, plus anticoagulation with warfarin to an INR of 2-3 (anticoagulation is for all patients with AF). Rhythm control (electrical cardioversion or amiodarone) is for haemodynamically unstable patients with recent-onset AF.","must_include":["Rate control: digoxin, calcium channel blocker or beta-blocker","Anticoagulate with warfarin, INR 2-3"],"must_not_include":["No anticoagulation needed","Cardiovert as first-line treatment for this stable patient"],"check":"verified","sources":[{"id":"ncdimh-tbl-af-strategies","label":"NCDIMH p.121","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"121","heading":"Chapter 3: Cardiology > Heart Failure > Drugs Used in Management of Heart Failure > Strategies for Treatment of Atrial Fibrillation","text":"### Strategies for treatment of atrial fibrillation: rate control, rhythm control, anticoagulation\n\n| Strategies | Drugs and Considerations |\n| --- | --- |\n| Rate control – for hemodynamically stable patients with chronic AF and fast AV conduction | Digoxin, calcium channel blockers, beta-blockers |\n| Rhythm control – for hemodynamically unstable patients with AF of recent onset | Electrical cardioversion. Pharmacological cardioversion – amiodarone |\n| Anticoagulation – for all patients | Warfarin to achieve INR of 2-3 |"}]},{"id":"Q169","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Heart failure","type":"clinical","category":"emergency","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"At a health centre: suspected heart failure, swollen legs, basal crackles, SpO2 86%. What do I do?","change":"New question: heart failure was not covered; tests a facility-level algorithm.","reference":"She is congested with SpO2 below 90%: give IV furosemide 40 mg (with oxygen for the low saturation) and transfer to the regional hospital. Do the basic tests the health centre can (U&Es, CBC, glucose, CXR, ECG). Guideline-directed therapy (RAAS inhibitor, beta-blocker, MRA if EF ≤35%, ± SGLT2 inhibitor) is started once she is euvolaemic.","must_include":["IV furosemide 40 mg","Transfer to the regional hospital","Oxygen for low saturation"],"must_not_include":["Start a beta-blocker now while congested","Manage at the health centre without transfer"],"check":"verified","sources":[{"id":"ncdimh-fig-hf-diagnosis-management","label":"NCDIMH p.117","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"117","heading":"Chapter 3: Cardiology > Heart Failure > Algorithm for Diagnosis and Management of Heart Failure","text":"### Algorithm for diagnosis and management of heart failure (by facility level, echo availability, congestion; guideline-directed therapy and CRT)\n\n1. Suspected heart failure? Take a history and examine.\n   - Clinic history: symptoms (acute: raised JVD, PND, lower limb swelling); function limitation (NYHA class); prior cardiac disease, pregnancies; prior comorbidities (HTN, disease, others); drugs, toxins.\n   - Physical exam: vital signs; signs of congestion (raised JVD, hepatomegaly); lower limb swelling; murmur; crackles.\n2. Investigations by facility level:\n   - Health Center: LABS: U&Es, CBC, glycemia, CXR, ECG. If congested with SatO2 <90%: give IV Lasix (furosemide) 40 mg and transfer to the regional hospital.\n   - Regional Hospital: U&Es, CBC, glycemia, HbA1c, chest X-ray, ECG, +/- cardiac ultrasound. Refer on to the referral hospital as needed.\n   - Referral Hospital: U&Es, CBC, glycemia, HbA1c, ferritin, chest X-ray, cardiac ultrasound, ECG, coronary CTA, cardiac MRI.\n3. Still suspect heart failure? (at DH/PH/referral hospital) Yes → Is heart ultrasound (echo) available?\n   - No: treat as HFrEF (EF ≤40%) and refer to cardiology.\n   - Yes: HFrEF & HFmrEF on echo → look for cardiomyopathy or valvular heart disease.\n     - Not congested: work up causes (genetics, inflammatory, toxins, pregnancy, metabolic).\n4. If congested (from either path): IV Lasix (8-hourly), morphine (if no low BP), nitrates (if available), oxygen (if low SpO2).\n   - Cardiogenic shock: IV inotropes/pressors, until euvolemic.\n5. When euvolemic, start guideline-directed medical therapy: 1. RAASi; 2. beta-blocker; 3. MRA (EF ≤35%); 4. SGLT2i → RAASi + BB + MRA ± SGLT2i.\n6. After 3 months of GDMT, if EF ≤35% plus LBBB: CRT (cardiac resynchronisation therapy)."}]},{"id":"Q170","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Asthma in children","type":"clinical","category":"standard","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"8-year-old with asthma on daily low-dose ICS, still has symptoms most days. Inhaler technique and adherence are good. Next step?","change":"New question: tests the paediatric asthma steps.","reference":"Step up to step 3: low-dose ICS-LABA (preferred from age 6) or medium-dose ICS, with SABA as needed. A LABA must never be used without an ICS in children. Review 2-3 months after the change.","must_include":["Low-dose ICS-LABA (or medium-dose ICS)","SABA as reliever","Never LABA without ICS"],"must_not_include":["LABA on its own","Stop the inhaled steroid"],"check":"verified","sources":[{"id":"ncdimh-tbl-asthma-steps-6-11","label":"NCDIMH p.332-333","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"332-333","heading":"Chapter 14: Pulmonology > Asthma Severity & Control Assessment > Treatment Steps – Children 6-11 Years","text":"### Asthma treatment steps for children 6-11 years: controller and reliever for steps 1-5, ICS dose ranges, key points\n\nChildren aged 6–11 years can perform spirometry reliably. Management follows a step-based approach similar to adults but with important differences in drug doses and preferred options.\n\n| Step | Severity | Preferred Controller | Reliever |\n| --- | --- | --- | --- |\n| 1 | Mild intermittent | No daily controller | As-needed SABA OR as-needed low-dose ICS + SABA (when symptoms occur) |\n| 2 | Mild persistent | Low-dose ICS daily (preferred) OR LTRA | As-needed SABA |\n| 3 | Moderate persistent | Low-dose ICS-LABA (preferred in ≥6 yrs) OR medium-dose ICS | As-needed SABA |\n| 4 | Severe persistent | Medium-to-high-dose ICS-LABA + LTRA | As-needed SABA |\n| 5 | Refractory | Refer to paediatric specialist. Consider biologic (mepolizumab ≥6 yrs, dupilumab ≥6 yrs, omalizumab ≥6 yrs) | As-needed SABA + add-on LAMA (tiotropium ≥6 yrs) |\n\n**ICS dose ranges, children 6-11 years (mcg/day): low / medium / high**\n\n| Step | Severity | Preferred Controller | Reliever |\n| --- | --- | --- | --- |\n| Budesonide DPI |  | Low 100–200; medium 201–400 | High >400 |\n| Fluticasone propionate DPI/MDI |  | Low 50–100; medium 101–200 | High >200 |\n| Beclometasone dipropionate MDI |  | Low 100–200; medium 201–400 | High >400 |\n| Ciclesonide MDI |  | Low 80–160; medium 161–320 | High >320 |\n\n**Note:** Key points for 6–11 years: confirm the diagnosis with spirometry (FEV1/FVC <0.80 abnormal in children). Preferred device: MDI + spacer for all ages; DPI from about 7 years with good technique. ICS-LABA approved from age 6; use fixed-dose combinations where available. LABA should never be used without ICS in children. LTRA (montelukast) is an alternative/add-on, especially with allergic rhinitis; note the FDA boxed warning for neuropsychiatric events. Tiotropium (LAMA) mist inhaler is licensed as add-on from age 6 (steps 4–5)."},{"id":"ncdimh-tbl-asthma-step-up-down","label":"NCDIMH p.332","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"332","heading":"Chapter 14: Pulmonology > Asthma Severity & Control Assessment > Stepping Up / Stepping Down","text":"### When to step asthma treatment up or down\n\n| STEP UP – indications | STEP DOWN – criteria |\n| --- | --- |\n| Uncontrolled symptoms | Well controlled ≥3 months |\n| ≥2 exacerbations/year | No exacerbations in past year |\n| ≥1 severe exacerbation/year | Reduce ICS dose by 25–50% |\n| PEF / FEV1 <80% predicted | Do not stop ICS completely (risk of exacerbation) |\n| First check: technique, adherence, triggers | Review in 2–3 months after change |"}]},{"id":"Q171","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Organophosphate poisoning","type":"clinical","category":"emergency","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"Farm worker drank an organophosphate pesticide; drooling, sweating, pinpoint pupils. Which antidotes and doses?","change":"New question: poisoning other than paracetamol was not covered.","reference":"This is the cholinergic toxidrome. Give atropine sulfate 2 mg IM and pralidoxime 1-2 g IV infusion over 15-30 minutes, repeated after 1 hour if needed and then 12-hourly (or 30 mg/kg IV over 20 minutes followed by 4-8 mg/kg/hour), alongside resuscitation and supportive care.","must_include":["Atropine 2 mg IM","Pralidoxime 1-2 g IV over 15-30 min"],"must_not_include":["Induce vomiting"],"check":"verified. Note: the table gives atropine as a single 2 mg IM dose and does not describe repeat dosing or titration; 'induce vomiting' is a general must-not, not stated in the source.","sources":[{"id":"ncdimh-tbl-antidotes","label":"NCDIMH p.198","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"198-199","heading":"Chapter 6: Injuries and Trauma > Poisoning > List of common pesticides and chemical poisons with their antidotes","text":"### Antidotes and doses for common poisons: pesticides (organophosphates, carbamates, organochlorines, rodenticides), industrial chemicals (arsenic, methanol, ethylene glycol, cyanide, methaemoglobinaemia), drugs (paracetamol, iron, benzodiazepines, opioids, isoniazid, digoxin), envenomations and bites\n\n| Group | Poison / Agent | Antidote & Dose |\n| --- | --- | --- |\n| Agricultural Pesticides | Organophosphates (malathion, acephate, dichlorvos, dimethoate, fenitrothion, monocrotophos, phorate, quinalphos) | Atropine sulfate 2 mg IM (mid-lateral outer thigh). Pralidoxime 1–2 g IV infusion (10–20 mg/mL) over 15–30 min; repeat in 1 hr if needed, then q12hr; or 30 mg/kg IV over 20 min followed by 4–8 mg/kg/hr maintenance infusion |\n| Agricultural Pesticides | Carbamates (propoxur, aldicarb, carbaryl, carbofuran, methomyl) | Pralidoxime 1–2 g IV infusion (10–20 mg/mL) over 15–30 min; repeat in 1 hr if needed, then q12hr; or 30 mg/kg IV over 20 min followed by 4–8 mg/kg/hr maintenance infusion |\n| Agricultural Pesticides | Organochlorines (endosulfan, gamma benzene hexachloride, heptachlor, chlordane) | Cholestyramine 4 g PO q12–24hr; increase over 1-month intervals. Maintenance: 8–16 g/day PO divided q12hr (max 24 g/day) |\n| Agricultural Pesticides | Rodenticides (bromadiolone) | Vitamin K. Adults: 2.5–10 mg PO/SC; may increase to 25–50 mg; repeat in 12–48 hr. Newborn: 0.5–1 mg IM within 1 hr of birth |\n| Industrial Chemicals | Arsenic | D-Penicillamine 30–40 mg/kg/day PO for 1–6 months (2 hr before or 3 hr after meals) OR dimercaprol 3 mg/kg IM deep q4hr for 48 hr, then q12hr for 10 days |\n| Industrial Chemicals | Methyl alcohol | Ethanol: loading 600 mg/kg IV (7.6 mL/kg of 10% solution) or 600–700 mg/kg PO/NG (95% solution diluted to ≤20%). Maintenance 0.15 mL/kg/hr PO (IV: 1.4 mL/kg/hr of 10% ethanol) |\n| Industrial Chemicals | Ethylene glycol | Folic acid/folinic acid: 60 mg IM over 12–24 hr stat, then 15 mg PO q8hr for 48–72 hr. Ethanol: same dosing as methyl alcohol. Pyridoxine HCl: 10–25 mg PO q8hr, observe at 6 hr. Thiamine: 100 mg IV; then 50–100 mg/day IM or IV; then 5–30 mg TID for 1 month |\n| Industrial Chemicals | Cyanide | Hydroxocobalamin 70 mg/kg (usually 5 g) IV infusion over 15 min; an additional 5 g IV may be given based on severity and clinical response |\n| Industrial Chemicals | Methemoglobinemia (nitrites, nitrates, dapsone, copper, aniline, chlorates, naphthalene) | Methylene blue 1 mg/kg IV over 5–30 min. If MetHb remains >30% or symptoms persist, repeat up to 1 mg/kg 1 hr after first dose |\n| Drugs | Acetaminophen (paracetamol) | N-acetylcysteine 140 mg/kg loading dose, then 70 mg/kg q4hr for 3 days or until acetaminophen is undetectable in blood |\n| Drugs | Iron | Deferoxamine 1 g IM initially, then 500 mg q8hr for 48 hr |\n| Drugs | Benzodiazepines | Flumazenil 0.2 mg IV over 15 sec, then 0.1 mg at 60-sec intervals until consciousness restored. Maintain 0.3–0.6 mg based on patient and benzodiazepine used |\n| Drugs | Opioids | Naloxone 0.4–2 mg PO depending on opioid amount; repeat in 2–3 min if needed |\n| Drugs | Isoniazid | Pyridoxine 10–25 mg PO q8hr for 48 hr |\n| Drugs | Digoxin | Digoxin-specific antibodies (DigiFab): each 40 mg vial binds 0.5 mg digoxin. Dose equimolar to ingested digoxin (76–80 mg FAB = 1 mg digoxin) |\n| Envenomations & Bites | Snake bite | Anti-snake venom (ASV) polyvalent: mild 5 vials (50 mL); moderate 5–10 vials (50–100 mL); severe 10–20 vials (100–200 mL) |\n| Envenomations & Bites | Dog bite (rabies exposure) | Anti-rabies human immunoglobulin 20 IU/kg |\n| Envenomations & Bites | Botulism | Botulinum antitoxin: IV infusion via volumetric pump; start at 0.5 mL/min for the first 30 min to minimize allergic reactions |"},{"id":"ncdimh-tbl-toxidromes","label":"NCDIMH p.194","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"194-195","heading":"Chapter 6: Injuries and Trauma > Poisoning > Toxidromes","text":"### Toxidromes: mental status, pupils, vital signs, other features and example agents (sympathomimetic, cholinergic, anticholinergic, hallucinogenic, opioid, sedative-hypnotic, serotonin syndrome)\n\nUse the tabulated toxidromes to identify toxins and apply the antidotes.\n\n| Toxidrome | Mental status | Pupils | Vitals | Other manifestations | Examples of toxic agents |\n| --- | --- | --- | --- | --- | --- |\n| Sympathomimetic | Hyperalert, agitation, hallucination, paranoia, anxiety, delirium | Mydriasis | Hyperthermia, tachycardia, hypertension, widened pulse pressure | Diaphoresis, tremors, hyperreflexia, seizures, hyperpyrexia | Cocaine, amphetamines, ephedrine, theophylline, caffeine, phencyclidine (PCP), lysergic acid (LSD). Withdrawal from narcotics, benzodiazepines, alcohol, long-term beta-blocker therapy |\n| Cholinergic | Confusion, drowsiness, coma, headache, insomnia, giddiness | Miosis | Bradycardia, hypotension, tachypnea, bradypnea, hypothermia | Salivation, urinary incontinence, defaecation, gastric cramping, hypermotility, emesis, diaphoresis, lacrimation, GI cramps, bronchoconstriction, muscle fasciculations and weakness, seizures | Organophosphate and carbamate insecticides, nerve agents, nicotine, physostigmine, edrophonium |\n| Anticholinergic | Agitation, hallucinations, delirium, coma | Mydriasis | Hyperthermia, tachycardia, hypertension, tachypnea | Dry flushed skin, dry mucous membranes, decreased bowel sounds, urinary retention, myoclonus | Antihistamines, TCA, antiparkinsonism agents, atropine, antispasmodics |\n| Hallucinogenic | Hallucinations, perceptual distortions, depersonalization, agitation | Mydriasis (usually) | Hyperthermia, tachycardia, hypertension, tachypnea | Nystagmus | Phencyclidine, MDMA, MDE |\n| Opioid | CNS depression, coma | Miosis | Bradypnea, apnea | Hyporeflexia, pulmonary edema, needle marks | Phencyclidine, MDMA, MDE (as printed) |\n| Sedative hypnotic | CNS depression, confusion, stupor, coma | Variable | Often normal; hypothermia, bradycardia, hypotension, bradypnea, apnea | Hyporeflexia | Benzodiazepines, barbiturates, alcohols, zolpidem |\n| Serotonin syndrome | Confusion, agitation, coma | Mydriasis | Hyperthermia, tachycardia, hypertension, tachypnea | Tremors, myoclonus, hyperreflexia, clonus, diaphoresis, flushing, trismus, rigidity, diarrhoea | MAOIs, SSRIs, meperidine, dextromethorphan, TCA |\n\nPCP, phencyclidine; LSD, lysergic acid; TCA, tricyclic antidepressant; MDMA, 3,4-methylenedioxymethamphetamine; MDEA, methylenedioxyethylamphetamine; CNS, central nervous system; GI, gastrointestinal; MAOI, monoamine oxidase inhibitor; SSRI, selective serotonin reuptake inhibitor."}]},{"id":"Q175","area":"NCDs and emergencies","document":"Cross-document","topic":"Cervical screening in WLHIV","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"32-year-old woman living with HIV at the ART clinic: VIA positive, small lesion, whole transformation zone visible, nothing suspicious. What now?","change":"New question: needs the HIV and NCD guidelines together; tests the cervical topic from a different angle than the prompt example.","reference":"Treat her at the same visit with ablation (thermal ablation or cryotherapy): she is eligible because the lesion is small (≤75%), the transformation zone is fully visible and there is no suspicion of cancer; VIA-positive lesions should be treated immediately (screen-and-treat). Repeat VIA at 12 months, then continue yearly screening as a woman living with HIV.","must_include":["Same-visit ablation (thermal ablation or cryotherapy)","Eligible because the lesion is small, TZ fully visible, no suspicion of cancer","Repeat VIA at 12 months"],"must_not_include":["Refer for LEEP for this eligible lesion","Rescreen in 3 years"],"check":"CONFLICT in source: the NCDIMH algorithm (p.251) says VIA positive in women living with HIV → refer for LEEP/oncology, while the VIA management table (p.252) and HIV 2022 (p.257) give same-visit ablation for eligible lesions. Reference follows the table; clinician to decide.","sources":[{"id":"ncdimh-tbl-via-results-management","label":"NCDIMH p.252","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"252","heading":"Chapter 9: Oncology > Cervical Cancer > Management by VIA result","text":"### Management by VIA screening result: negative, positive eligible for ablation, positive ineligible (LEEP), suspicious for cancer: eligibility, action and follow-up\n\n| VIA Screening Result | Treatment Eligibility / Findings | Clinical Action & Procedure | Follow-Up Timeline |\n| --- | --- | --- | --- |\n| VIA Negative | No lesions or suspicious areas identified | Discharge: return to routine screening (annual for HIV+; 2 years for HIV-) | 12 - 24 months (based on HIV status) |\n| VIA Positive (eligible for ablation) | Lesion ≤75% of ectocervix; TZ fully visible (type 1); no endocervical extension; no suspicion of cancer | Ablative treatment (same visit): thermal ablation or cryotherapy | 12 months (repeat VIA) |\n| VIA Positive (ineligible for ablation) | Large lesion (≥75% coverage); high-grade lesion suspected; tissue diagnosis needed | Refer for LEEP | 6 months (VIA or HPV) |\n| Suspicious for Cancer | Visible mass/cauliflower growth; bleeds easily on contact; extension to vaginal walls | Urgent referral to secondary/tertiary level for colposcopy and biopsy | Immediate (per specialist) |"},{"id":"hiv-2022-txt-p257-t0479","label":"HIV 2022 p.257","doc":"Integrated HIV Management Guidelines 2022","pages":"257","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.8.1 Cervical cancer > Diagnosis of cervical pre-cancer","text":"## Diagnosis of cervical pre-cancer\n\nThe definitive diagnosis of cervical precancer is confirmed by histopathological examination of tissue specimens taken from the lesion.\n- VIA positive: acetowhite areas visualized after application of acetic acid are indicative of cervical pre-cancer and must be treated immediately. If an obvious abnormal/fungating lesion is noted, do not apply acetic acid but conduct a biopsy examination and histologically confirmed if it is cancerous.\n- Pap smear: If the histology of the smear shows abnormal cells, conduct a biopsy of the abnormal area with a colposcope. Biopsy performed with the aid of colposcopy (colposcopy directed biopsy) is the standard method for diagnosis of cervical pre-cancer lesions and pre-clinical invasive cancer."},{"id":"hiv-2022-txt-p257-t0480","label":"HIV 2022 p.257","doc":"Integrated HIV Management Guidelines 2022","pages":"257","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.8.1 Cervical cancer > Approaches","text":"## Approaches\n\n- “Screen-and-treat” approach: In this approach, treatment decisions are based on the results of the VIA(or HPV DNA) screening test. Women with a positive VIA screen can be treated with cryotherapy, thermal ablation or LEEP with histopathology depending on eligibility, at the primary or tertiary health care level.\n- “Screen, triage and treat” Clients with a positive screen (on Pap smear, or HPV) can be examined with VIA, cytology or colposcopy triage. If a pre-cancerous lesion is detected, it can be treated immediately with cryotherapy, thermal ablation or LEEP.\n\n## Treatment methods\n\n- Ablation with cryotherapy or thermal ablation\n- Loop electrosurgical excision procedure (LEEP)\n- Cold knife conization"},{"id":"ncdimh-fig-cervical-screening-algorithm","label":"NCDIMH p.251","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"251","heading":"Chapter 9: Oncology > Cervical Cancer > Cervical Cancer Screening & Treatment Algorithm","text":"### Cervical cancer screening and treatment algorithm: HIV-negative women vs women living with HIV (HPV DNA testing, VIA/VILI triage, screen-and-treat, stop age)\n\nA. General population (HIV-negative women):\n1. Age 25-50 years: HPV DNA testing; screen every 5 years.\n2. HPV negative: rescreen in 5 years. HPV positive: triage testing.\n3. VIA every 2 years (rescreen in 2 years):\n   - Negative: rescreen in 2 years.\n   - Positive: refer for LEEP/colposcopy.\n4. Stop screening after age 50 + two negative tests.\n\nB. Women living with HIV:\n1. HIV positive, age 25+ OR at diagnosis: HPV DNA testing; screen every 3 years.\n2. HPV negative: rescreen in 3 years. HPV positive: triage testing.\n3. VIA every year or VILI every year (return in 1 year):\n   - Negative: return in 1 year.\n   - Positive: refer for LEEP/oncology.\n4. Stop screening after age 50 + two negative tests.\n\nSingle-visit screen-and-treat: SCREEN → TRIAGE → TREAT (same day) → FOLLOW-UP; same-day care when feasible.\nVIA: visual inspection with acetic acid. VILI: visual inspection with Lugol's iodine."}]},{"id":"Q177","area":"NCDs and emergencies","document":"Cross-document","topic":"Epilepsy, ART and pregnancy","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"26-year-old woman on TLD, newly diagnosed epilepsy, hoping to get pregnant next year. Which antiepileptic?","change":"New question: needs the NCD, HIV and mental health guidelines together.","reference":"Avoid valproate (contraindicated in pregnancy). Avoid phenytoin and phenobarbital with dolutegravir (co-administration not recommended), and carbamazepine also interacts with DTG. Lamotrigine fits both constraints: start low (25 mg once daily when not on valproate) and titrate slowly. Because she plans pregnancy, consult a specialist and give folate. Antiepileptics can reduce hormonal contraceptive efficacy, so review her contraception until she wants to conceive.","must_include":["Not valproate (contraindicated in pregnancy)","Not phenytoin or phenobarbital with DTG; carbamazepine interacts","Lamotrigine, started low and titrated slowly","Specialist consultation and folate"],"must_not_include":["Sodium valproate","Phenytoin with TLD"],"check":"verified, but the drug choice is combined from several sources: no single source names a drug for this case. Lamotrigine follows from the MH Desk Guide switch list (lamotrigine, levetiracetam, valproate CR) minus valproate; levetiracetam is not in the NCDIMH drug table. Clinician to confirm the expected answer.","sources":[{"id":"ncdimh-box-epilepsy-psychoeducation-cautions","label":"NCDIMH p.248","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"248-249","heading":"Chapter 8: Neurology > Epilepsy > Psychoeducation, cautions and follow-up","text":"> **Epilepsy psychoeducation and psychosocial interventions, cautions and special populations (drug interactions, pregnancy, children, PLHIV), and follow-up**\n>\n> Psychoeducation & psychosocial interventions:\n> - Epilepsy is caused by abnormal electrical brain activity, NOT spirits or witchcraft.\n> - Chronic condition: medication controls seizures in most if taken daily.\n> - People with epilepsy can marry, work, have children and lead normal lives.\n> - Avoid open fires, swimming alone, heights, heavy machinery, alcohol excess.\n> - Observe local driving laws; may qualify for disability benefits.\n> - All AEMs: taper slowly; an abrupt stop causes breakthrough seizures.\n> - Review every 3-6 months; check adherence and side effects.\n> \n> Cautions & special populations:\n> - Check drug-drug interactions: AEMs reduce the efficacy of hormonal contraceptives and antiretrovirals.\n> - Rare: severe bone marrow depression, Stevens-Johnson syndrome.\n> - Pregnancy: consult a specialist; supplement folate; valproate contraindicated.\n> - Children: weight-based dosing; monitor growth and development.\n> - PLHIV: check interactions with antiretrovirals before prescribing.\n> - (Printed in the same cell:) minimum 2 years seizure-free before [stopping AEMs].\n> \n> Follow-up (every 1-3 months initially, then 3-6 monthly): review seizure frequency (decreased or stopped?); check medication adherence and side effects; assess functional status (school, work, daily activities); screen for depression/anxiety comorbidity; if no seizures for 2+ years, discuss gradual tapering with a specialist; if seizures continue despite an adequate dose, increase the dose, check adherence, or refer to a specialist."},{"id":"ncdimh-tbl-antiepileptic-drugs","label":"NCDIMH p.246-248","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"246-248","heading":"Chapter 8: Neurology > Epilepsy > Epilepsy Management — Pharmacological Treatment","text":"### Antiepileptic medicines: sodium valproate, carbamazepine, phenytoin, phenobarbital, lamotrigine: adult and child doses, contraindications, side effects; principles of AED treatment\n\nAntiepileptic medications: start one medication at the lowest dose and increase slowly until seizures are controlled. 1. Start low and go slow with a single AED as monotherapy, chosen by seizure type and epilepsy syndrome; titrate to the maximal dose. 2. If the first AED is ineffective at the maximum tolerated dose, introduce an alternative AED slowly without tapering the first. 3. If there is a good response to the second AED, consider withdrawing the original gradually. 4. If the first add-on AED is ineffective or has undesirable side effects, withdraw it slowly and replace it with another add-on AED. 5. If seizures are not controlled on two AEDs, some patients may benefit from a third. 6. Prefer an add-on AED with a different mode of action. 7. Review the diagnosis if seizures continue despite this approach and 2-3 years have elapsed.\n\n| Class | Drug | Dosage and Frequency | Contraindications | Side Effects |\n| --- | --- | --- | --- | --- |\n| Anticonvulsant | Sodium valproate | Adults: 200 mg TDS PO; maintenance 400-1800 mg/day divided into 3 doses. Children: 10-15 mg/kg/day PO divided into 2 doses; maintenance <20 kg: 20-40 mg/kg/day; >20 kg: 20-30 mg/kg/day | Hepatic impairment; von Willebrand disease | Tremor, dizziness, weight gain, alopecia, diuresis, thrombocytopenia, impaired hepatic function |\n| Anticonvulsant | Carbamazepine | Adults: 200 mg BD PO; maintenance 800-1200 mg/day divided into 2 doses. Children: 10-20 mg/kg/day PO divided into 2 doses; maintenance 20-30 mg/kg/day | Absence and myoclonic seizures; bone marrow suppression; hypersensitivity to tricyclic antidepressants | Blurred/double vision, nystagmus, ataxia, drowsiness, hyponatremia, rash, cytopenia, liver dysfunction, Stevens-Johnson syndrome, toxic epidermal necrolysis |\n| Anticonvulsant | Phenytoin | Adults: 100 mg TDS PO; maintenance 300-900 mg/day divided into 3 doses. Children: 5-8 mg/kg/day divided into 2 doses | Absence and myoclonic seizures; febrile convulsions | Gingival hypertrophy, rash, confusion, fever, slurred speech, double vision, ataxia, bone marrow depression, hepatitis |\n| Barbiturate | Phenobarbital | Adults: 30 mg NOCTE PO; maintenance 30-120 mg/day divided into 2 doses. Children: 3-5 mg/kg/day divided into 2 doses | Airway obstruction; dyspnea; marked hepatic impairment | Nausea, rash, sedation, lethargy, dependence, alteration of sleep cycle, hyperactivity, ataxia, liver dysfunction |\n| Anticonvulsant | Lamotrigine | Adults: 25 mg every other day [with valproate], 25 mg OD [without valproate]; maintenance 100-200 mg/day [with valproate], 100-400 mg/day [without valproate]. Children: 0.15 mg/kg/day [with valproate], 0.3 mg/kg/day [without valproate]; maintenance 1-3 mg/kg/day [with valproate], 4.5-7.5 mg/kg/day [without valproate] | Hypersensitivity to the drug or its ingredients. Be cautious and titrate slowly if used with sodium valproate | Drowsiness, dizziness, diplopia, rash, cytopenia, liver injury, Stevens-Johnson syndrome, toxic epidermal necrolysis |"},{"id":"hiv-2022-fig-9-formulation-sequence","label":"HIV 2022 p.213","doc":"Integrated HIV Management Guidelines 2022","pages":"213","heading":"Chapter 9: ART for Children and Adolescents > 9.6.1 Transitioning regimens and formulations in children and adolescents > Sequence of transition to optimal ARV drug formulations","text":"### The sequence of transition to optimal ARV drug formulations for stable children and adolescents\n\nWith ABC/3TC 120/60mg scored dispersible tablet:\n1. pDTG 10mg dispersible tablet: cannot swallow tablets whole, >1 month of age, weighs >3kg to <20kg.\n2. DTG 50mg film coated tablet: weighs >20kg and can swallow tablet whole.\n3. TLD: weighs >30kg.\nIt is NOT recommended to co-administer DTG with anticonvulsants such as phenytoin or phenobarbital (consult expert or consider substituting DTG with EFV as alternative). Iron, aluminum, magnesium and calcium-containing medicines bind with and reduce absorption of DTG; if co-administered, DTG should be taken with food to enhance DTG absorption or taken at alternate times (6 hours apart)."},{"id":"hiv-2022-box-palliative-symptom-control","label":"HIV 2022 p.262","doc":"Integrated HIV Management Guidelines 2022","pages":"262-263","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.9 Palliative Care and Management for PLHIV > General Principles of Treatment","text":"> **General principles of treatment, nausea and neuropathic pain dosing (palliative care)**\n>\n> Key message: Give palliative care medication by the mouth, by the clock, by the ladder.\n> \n> Dosing for nausea: prescribe an anti-emetic for 7–10 days, after which nausea should subside.\n> - Haloperidol: 1.5 – 5 mg, every night, for 5–7 days OR\n> - Metoclopramide: 10 mg, 3 times daily, for 5–7 days\n> \n> Management of neuropathic pain:\n> - Amitriptyline: Adults: 10–75 mg or 0.5–2 mg/kg at night (then increase slowly as needed).\n> - Sodium valproate: Adults: 200 mg – 1.2 g once a day\n> - Gabapentin: Adults: 300–400 mg in divided doses, increase gradually according to the response. Maximum 2400 mg/ day.\n> If sodium valproate and gabapentin are not available, carbamazepine can be used, but it should be noted that carbamazepine can interact with DTG and EFV. Carbamazepine: Adults: start at 100 mg twice a day and can be increased up to 800 mg twice a day."},{"id":"mental-health-deskguide-0206","label":"MH Desk Guide p.85","doc":"Mental Health Desk Guide 2022","pages":"85-86","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Autism Spectrum Disorder > Seizures: caution with anticonvulsants","text":"### **CAUTION**\n\n* Patients on HAART who are taking phenytoin, phenobarbital and/or carbamazepine should be switched to Lamotrigine, Levetiracetam or Sodium valproate CR to avoid potential drug-drug interactions.\n* Carbamazepine CR is mostly preferred as it is less sedative.\n* Prescribe Carbamazepine (plain and CR) concurrently with folic acid 5 mg daily, because it inhibits folate metabolism.\n* Lamotrigine has high risk of inducing Steven Johnson Syndrome, cautious while prescribing it and it is better prescribed by a Medical Practitioner.\n* Check serum plasma levels of anticonvulsants every 6 to 12 months for monitoring purposes.\n* Check serum concentration levels of anticonvulsants if seizures are not controlled despite of good adherence and high dose before changing to another anti-convulsant.\n* Sodium valproate causes weight gain as a side effect.\n\n## **N;B**\n\n* Prescribe a combination of one mood stabilizer and one anti-psychotic medication for a patient.\n* Avoid Carbamazepine and phenytoin to patients who are on HAART as it reduces serum concentration of NNTRIs and PIs"}]},{"id":"Q049","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"Major depressive disorder","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What are the diagnostic criteria for major depressive disorder in the Mental Health Desk Guide?","original_reference":"Symptoms for 2 weeks, with depressed mood most of the day nearly every day and/or markedly diminished interest or pleasure, plus 4–5 other symptoms (sleep or appetite disturbance, weight change, poor concentration, psychomotor change, guilt, worthlessness/hopelessness, fatigue, body pains, recurrent thoughts of death or suicide). Children and adolescents may present with irritable rather than sad mood.","question":"28-year-old man: low mood and loss of interest for 3 weeks, poor sleep, poor appetite, tiredness and poor concentration. Does he meet criteria for major depressive disorder?","change":"Was 'list the diagnostic criteria in the Mental Health Desk Guide'; removed the document name and turned into a case.","reference":"Yes. MDD requires symptoms for at least 2 weeks, with depressed mood and/or markedly diminished interest or pleasure most of the day nearly every day, plus 4-5 other symptoms (e.g. disturbed sleep, disturbed appetite or weight change, poor concentration, psychomotor change, guilt, worthlessness/hopelessness, fatigue, body pains, recurrent thoughts of death or suicide). He has both core symptoms for 3 weeks plus 4 others (sleep, appetite, fatigue, concentration). Screen for suicide risk.","must_include":["Yes, meets criteria","Duration of at least 2 weeks","Core: depressed mood and/or loss of interest","Plus 4-5 other symptoms"],"must_not_include":["Needs 6 months of symptoms","Cannot diagnose without psychotic symptoms"],"check":"verified","sources":[{"id":"mental-health-deskguide-0023","label":"MH Desk Guide p.16","doc":"Mental Health Desk Guide 2022","pages":"16","heading":"Chapter 3: Overview of Different Psychiatric Conditions > Major Depressive Disorder","text":"- It is a common mood disorder characterized by negative changes in feelings, thinking, and behaviour resulting in loss of normal functioning.\n\n## **DIAGNOSTIC CRITERIA OF MAJOR DEPRESIVE DISORDER AS PER DSM V;**\n\n- Duration of symptoms is two weeks.\n- The patient should present with one or both of the two symptoms (1) and/or (2)\n  1. Depressed mood most of the day, nearly every day;\n  2. Marked diminished interest or pleasure in all, or almost all, activities most of the day."},{"id":"mental-health-deskguide-0024","label":"MH Desk Guide p.16","doc":"Mental Health Desk Guide 2022","pages":"16","heading":"Chapter 3: Overview of Different Psychiatric Conditions > Major Depressive Disorder > Plus other four/five symptoms","text":"## **Plus other four/five symptoms;**\n\n- Disturbed sleeping pattern (insomnia or hypersomnia) nearly every day.\n- Disturbed appetite (increase or decrease)\n- Weight gain or loss. In children consider failure to make expected weight gain.\n- Diminished ability to think or concentrate, or indecisiveness, nearly everyday\n- Psychomotor retardation\n- Psychomotor agitation (irritability or being angry easily)\n- Guilt feeling (self-blame)\n- Generalized body pains including headache\n- Feeling worthless and hopelessness,\n- Fatigue or loss of energy nearly everyday\n- Recurrent thoughts of death or suicidal attempt\n\n**Note:**\n- children and adolescent may present with irritable mood instead of sad mood\n- Few patients may present with psychotic symptoms (hallucinations, delusions or illusions)"},{"id":"ncdimh-box-mdd-assessment","label":"NCDIMH p.308","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"308","heading":"Chapter 13: Psychiatry > Major Depressive Disorder > Screening and Diagnosis of Major Depressive Disorder","text":"Screen all clients accessing services for major depressive disorder with the PHQ-9 (self-administered or by a provider).\n\n> **Major depressive disorder: 8-step assessment, DSM-5/ICD-11 criteria (5 of 9 for 2+ weeks), severity classification and when to refer urgently**\n>\n> Assessment steps:\n> 1. Screen: 'Have you felt sad/depressed most of the time for the past 2 weeks?' AND 'Have you lost interest in activities you usually enjoy?'\n> 2. Assess core symptoms: 5 or more of 9 criteria present for 2+ weeks.\n> 3. Assess functional impairment: work, relationships, self-care, daily activities.\n> 4. RULE OUT: bipolar disorder (past mania?), psychosis, medical causes (hypothyroidism, anaemia, HIV, stroke, diabetes).\n> 5. Screen for suicide/self-harm: 'Do you have thoughts of harming yourself or not wanting to live?'\n> 6. Assess alcohol and substance use (may co-occur or cause symptoms).\n> 7. Determine severity: mild / moderate / severe (any psychotic features?).\n> 8. DIAGNOSIS confirmed if 5+ criteria are met, at least 1 being depressed mood or anhedonia.\n> \n> DSM-5 / ICD-11 criteria (5 of 9, lasting 2+ weeks): depressed mood most of the day (or irritability in children/adolescents); markedly diminished interest or pleasure (anhedonia); significant weight loss/gain or appetite change; insomnia or hypersomnia nearly every day; psychomotor agitation or retardation (observable by others); fatigue or loss of energy nearly every day; feelings of worthlessness or excessive/inappropriate guilt; difficulty concentrating or making decisions; recurrent thoughts of death or suicidal ideation.\n> \n> Severity: mild – few symptoms beyond the minimum, mild functional impairment; moderate – between mild and severe, moderate impairment; severe – most symptoms, marked impairment, may have psychotic features.\n> \n> When to refer urgently: active suicidal ideation with plan or intent; psychotic features (hallucinations, delusions); severe self-neglect or inability to care for self; no response after 2 adequate medication trials; suspected bipolar disorder."}]},{"id":"Q050","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"Antidepressants","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What are the first-line antidepressants and their starting doses, and when is amitriptyline preferred over an SSRI?","original_reference":"Amitriptyline 25 mg at bedtime for 3 days then 50 mg (titrate by 25 mg every 7–14 days, max 150–200 mg/day); fluoxetine 10–20 mg daily (max 60–80 mg); sertraline 25–50 mg at bedtime (max 200 mg). Amitriptyline is preferred when sedation is desirable (e.g. psychomotor agitation). SSRIs are preferred when sedation is not wanted, with suicidality, and in the elderly, children and frail patients; TCAs can be fatal in overdose.","question":"45-year-old woman with moderate depression and recent suicidal thoughts, starting medication. Amitriptyline or an SSRI, and at what starting dose?","change":"Was three-part (all first-line doses + when to prefer amitriptyline); now one patient where the choice matters.","reference":"An SSRI. Fluoxetine and sertraline are preferred when there is suicidality (and when sedation is not wanted, in the elderly, children and frail patients); tricyclics can be fatal in overdose and should be avoided as far as possible in patients with suicidal thoughts. Start fluoxetine 10-20 mg once daily (max 60-80 mg/day) or sertraline 25-50 mg at bedtime (max 200 mg/day). Do a suicide risk assessment at every visit; SSRIs can cause agitation and increased suicide risk in the first 2-4 weeks.","must_include":["SSRI (fluoxetine or sertraline), not amitriptyline","Reason: suicidality / TCAs fatal in overdose","Fluoxetine 10-20 mg daily or sertraline 25-50 mg at bedtime","Suicide risk assessment at follow-up"],"must_not_include":["Amitriptyline as first choice for her","Fluoxetine 40 mg or more as the starting dose"],"check":"verified","sources":[{"id":"mental-health-deskguide-tbl-p70-0149","label":"MH Desk Guide p.70, Table 21","doc":"Mental Health Desk Guide 2022","pages":"70","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Major Depressive Disorders","text":"### Tables 21-22. First-line (amitriptyline, fluoxetine, sertraline) and second-line (duloxetine) antidepressants for major depressive disorder: doses, titration, maximum doses\n\n**Table 21 - First line: tricyclic antidepressants**\n\n| Medicine | Dose | Frequency | Duration | Max dose | Codes |\n| --- | --- | --- | --- | --- | --- |\n| Amitriptyline po | Initial dose 25 mg for 3 days, then 50 mg | Bedtime | Short to long-term | 150-200 mg/day | A E |\n| Then increase the dose gradually by 25 mg at an interval of 7-14 days if there is no response. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n\n**Table 21 - First line: SSRIs (alternative)**\n\n| Medicine | Dose | Frequency | Duration | Max dose | Codes |\n| --- | --- | --- | --- | --- | --- |\n| Fluoxetine po | Initial dose 10-20 mg | Once daily | Short to long-term | 60-80 mg/day | A E |\n| Increase the dose gradually by 10-20 mg at an interval of 4-8 weeks if there is no response. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Sertraline po | Initial dose 25-50 mg | Bedtime | Short to long-term | 200 mg/day | A E |\n| Increase the dose gradually by 25-50 mg at an interval of 7-14 days if there is no response. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n\n**Table 22 - Second line: SNRI**\n\n| Medicine | Dose | Frequency | Duration | Max dose | Codes |\n| --- | --- | --- | --- | --- | --- |\n| Duloxetine po | Initial dose 20-30 mg | Once daily | Short to long-term | 120 mg/day | S E |\n| Increase the dose gradually by 20-30 mg at an interval of 7-14 days if there is no response. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n\n**Note:** Amitriptyline is better prescribed if sedation is desirable. Fluoxetine and sertraline are better if sedation is not desirable, and for depression with suicidality, the elderly, children and frail physically ill patients."},{"id":"mental-health-deskguide-0157","label":"MH Desk Guide p.71","doc":"Mental Health Desk Guide 2022","pages":"71-72","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Major Depressive Disorders > If the patient presents with insomnia","text":"## **CAUTION**\n\n* Tricyclic Antidepressants (TCAs) can be fatal in overdose, conduct suicide risk assessment of the patient every follow up visit. Avoid prescribing it to patients with suicidal thoughts/attempt as much as possible.\n* Avoid TCAs in the children, elderly and patients with heart disease, urinary retention, glaucoma and epilepsy.\n* For depression with psychomotor agitation consider amitriptyline if there are no other contraindications.\n\n# DRUG INTERACTIONS AND ANTI-DEPRESSANTS & HAART\n\nMost first line HAART do not interact with anti-depressants\n1. Nevirapine may decrease levels of fluoxetine\n2. Ritonavir increase levels of amitriptyline and fluoxetine\n3. Darunavir decreases levels of sertraline\n4. Fluvoxamine increases levels of PIs & NNRTIs"},{"id":"mental-health-deskguide-tbl-p71-0154","label":"MH Desk Guide p.71","doc":"Mental Health Desk Guide 2022","pages":"71","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Major Depressive Disorders > Insomnia and Psychotic Symptoms","text":"### Tables 23-24. Major depressive disorder: lorazepam for insomnia; antipsychotics (haloperidol, risperidone, olanzapine, aripiprazole) for depression with psychosis – doses and titration; cautions for SSRIs and TCAs\n\n**Table 23 - Insomnia in major depressive disorder**\n\n| Medicine | Dose | Frequency | Duration | Max dose | Codes |\n| --- | --- | --- | --- | --- | --- |\n| Lorazepam po | 1-2 mg | Bedtime | 5-7 days | 2 mg | B E |\n\n**Table 24 - Depressive disorder with psychosis: prescribe antidepressants concurrently with one antipsychotic**\n\n| Medicine | Dose | Frequency | Duration | Max dose | Codes |\n| --- | --- | --- | --- | --- | --- |\n| Haloperidol po | Initial dose 1.5-3 mg | Once to twice a day | Short to long-term | 20 mg/day | A E |\n| Increase the dose gradually by 1.5 mg at an interval of 7-14 days if the patient presents with psychosis. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Risperidone po | Initial dose 1-2 mg | Once to twice a day | Short to long-term | 6 mg/day | B E |\n| Increase the dose gradually at an interval of 3-14 days by 50-200mg [as printed] if the patient presents with psychosis. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Olanzapine po | Initial dose 5-10 mg | Once to twice a day | Short to long-term | 25 mg/day | B E |\n| Increase the dose gradually by 5 mg at an interval of 7-14 days if the patient presents with psychosis. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Aripiprazole po | Initial dose 2-5 mg | Once to twice a day | Short to long-term | 30 mg/day | B E |\n| Increase the dose gradually at an interval of 3-14 days by 5-10 mg if the patient presents with psychosis. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n\n**Note:** Caution: SSRIs may cause agitation and an increased suicide risk during the first 2-4 weeks. TCAs can be fatal in overdose – conduct a suicide risk assessment at every follow-up visit and avoid them in patients with suicidal thoughts/attempt as much as possible. Avoid TCAs in children, the elderly and patients with heart disease, urinary retention, glaucoma and epilepsy. For depression with psychomotor agitation consider amitriptyline if no other contraindications; consider sertraline/fluoxetine for depression with psychomotor retardation."}]},{"id":"Q051","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"Special populations","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Should antidepressants be prescribed to a 10-year-old with depression or to a pregnant woman, according to the desk guide?","original_reference":"Under 12 years: no antidepressants; provide counselling and refer. Pregnant and breastfeeding women: avoid antidepressants as far as possible and refer (they are managed at step 3, the specialised psychiatric hospital).","question":"10-year-old boy with depression. Can I start an antidepressant?","change":"Was two-part (child and pregnant woman) with 'according to the desk guide'; split and kept the child.","reference":"No. Under 12 years, do not prescribe antidepressants: provide counselling and refer (children with MDD are managed at the specialised psychiatric hospital level).","must_include":["No antidepressants under 12 years","Counselling","Refer"],"must_not_include":["Start fluoxetine at a low dose","Start amitriptyline"],"check":"verified; NCDIMH p.309 notes fluoxetine is the only SSRI recommended for adolescents ≥12, consistent with no antidepressants under 12","sources":[{"id":"mental-health-deskguide-tbl-p72-0159","label":"MH Desk Guide p.72, Table 25","doc":"Mental Health Desk Guide 2022","pages":"72","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Major Depressive Disorders > Drug Interactions and Anti-Depressants & Haart > Table 25: Special Considerations in the Management of Major Depressive Disorders","text":"### TABLE 25: SPECIAL CONSIDERATIONS IN THE MANAGEMENT OF MAJOR DEPRESSIVE DISORDERS\n\nTABLE 25: SPECIAL CONSIDERATIONS IN THE MANAGEMENT OF MAJOR DEPRESSIVE DISORDERS\n\n| Special case | Intervention |\n| --- | --- |\n| If younger than 12 years | • No antidepressants, provide counselling then refer |\n| Pregnant women and breastfeeding mothers | • Antidepressants should be avoided as far as possible and the refer |\n| Depression with psychotic symptoms | • Prescribe anti-depressants + anti-psychotics |\n| BAD, depressive phase. | • Prescribe mood stabilizer + anti-depressant + antipsychotic |\n| If symptoms of mania emerge during treatment of depression | • Immediately stop antidepressants and refer |"},{"id":"ncdimh-tbl-mdd-special-cases","label":"NCDIMH p.312","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"312","heading":"Chapter 13: Psychiatry > Major Depressive Disorder > Special cases","text":"### Major depressive disorder special cases: children under 12, pregnancy and breastfeeding, psychotic depression, bipolar depression, emerging mania, PLHIV drug interactions\n\n| Special Case | Intervention |\n| --- | --- |\n| If younger than 12 years | No antidepressants; provide counselling then refer |\n| Pregnant women and breastfeeding mothers | Antidepressants should be avoided as far as possible, then refer |\n| Depression with psychotic symptoms | Prescribe antidepressants + antipsychotics |\n| BAD (bipolar affective disorder), depressive phase | Prescribe mood stabilizer + antidepressant + antipsychotic |\n| If symptoms of mania emerge during treatment of depression | Immediately stop antidepressants and refer |\n| PLHIV | Nevirapine may decrease the level of fluoxetine; ritonavir increases levels of amitriptyline and fluoxetine; darunavir decreases the level of sertraline; fluvoxamine increases levels of PIs and NNRTIs; carbamazepine is contraindicated as it increases levels of PIs and NNRTIs (as printed) |"},{"id":"mental-health-deskguide-tbl-p24-0036","label":"MH Desk Guide p.24, Table 2","doc":"Mental Health Desk Guide 2022","pages":"24","heading":"Chapter 3: Overview of Different Psychiatric Conditions > Major Depressive Disorder > Table 2: Stepwise Management of Major Depressive Disorders","text":"### TABLE 2: STEPWISE MANAGEMENT OF MAJOR DEPRESSIVE DISORDERS\n\n**Step 1: Community Clinic Level**\n\n| Entry point | Management |\n| --- | --- |\n| - Mild symptoms of Major Depressive Disorder - No psychosis symptoms - No suicide attempt/thoughts - Stable depression on treatment (continuation phase) | - Take vital signs - Provide health education and support - Encourage family support - Provide counselling - Conduct MSE and physical examinations - Take vital signs - Assess side effects of medications - Assess adherence to medications - Refill medications as indicated - Refer to doctor led services every 6 months for review If not improved within 2 months go to step 2 |\n\n**Step 2: General Hospital or Health Centre**\n\n| Entry point | Management |\n| --- | --- |\n| - Moderate form of Major Depressive Disorder - Presence of psychosis and suicide thoughts/attempt - Failure at step 1 | - Take vital signs - Conduct MSE and physical examination each visit - Assess side effects and adherence of medications - Provide health education and encourage family support - Initiate or review medications as indicated - Conduct Suicidal Risk Assessment - Assess the need for inpatient care - Counselling If not improved after 2 months go to step 3 |\n\n**Step 3: Specialized Psychiatric Hospital**\n\n| Entry point | Management |\n| --- | --- |\n| - Failure at step 2. - Children with Major Depressive Disorder - Elderly, pregnant women and breastfeeding mothers with any form of Major Depressive Disorder - Severe form of Major Depressive Disorder with or without psychosis or suicidality - Suicide attempt regardless of the severity of Major Depressive Disorder | - Doctor led services - Clinical Psychologist for psychotherapy |"}]},{"id":"Q052","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"Suicide risk","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A patient scores 22 on the Suicide Risk Assessment Form. What is the risk level and recommended management?","original_reference":"High risk (21–30): immediate assessment by a psychiatrist or clinical psychologist, psychiatric admission recommended, and involuntary admission may be required. (0–10 low: may go home with advice; 11–20 medium: assessment by a health professional, consider admission if living alone, previous attempt or clinically depressed.) Do not leave the person alone and remove means of self-harm.","question":"Patient scores 22 on the Suicide Risk Assessment Form. What is the risk level and what do I do?","change":"Shortened; content unchanged.","reference":"High risk (21-30): immediate assessment by a psychiatrist or clinical psychologist; psychiatric admission is recommended and involuntary admission may be required. Do not leave the person alone and remove means of self-harm. (0-10 low: may go home with advice; 11-20 medium: assessment by a health professional, consider admission.)","must_include":["High risk","Immediate psychiatrist or clinical psychologist assessment","Psychiatric admission recommended","Involuntary admission may be required"],"must_not_include":["Medium risk","Send home with advice"],"check":"verified; 'do not leave alone / remove means' is general suicide safety (MH Desk Guide suicide section), not in the scoring table. The Amendment chart uses 20-30 for high","sources":[{"id":"mental-health-deskguide-tbl-p112-0268","label":"MH Desk Guide p.112","doc":"Mental Health Desk Guide 2022","pages":"112","heading":"Appendices > Appendix I: Suicide Risk Assessment Form > Recommendations (scoring and risk)","text":"### Suicide risk assessment form: recommendations by total score\n\nRECOMMENDATIONS:\n\n| SCORING: | RISK: | SUGGESTED MANAGEMENT PLAN: |\n| --- | --- | --- |\n| 0 - 10 | LOW | May be sent home with advice to see health care professional |\n| 11 - 20 | MEDIUM | Assessment by health care professional.<br/>Admission may be an option if patient:<br/>- Lives alone<br/>- Has a history of previous suicide attempt; or<br/>- Is clinically depressed |\n| 21 - 30 | HIGH | Immediate assessment by Psychiatrist or Clinical Psychologist.<br/>Psychiatric admission recommended.<br/>Involuntary admission may be required. |"},{"id":"hiv-amendment-2024-fig-10.3-suicide-risk","label":"Amendment p.44","doc":"HIV Management Amendment 2024","pages":"44","heading":"Chapter 10: HIV/NCDs & Mental Health > 10.1 Psychological Care & Support > Suicide screening","text":"### Figure 10.3 Suicide screening using Suicide Risk Assessment Tool score chart\n\nSuicide Risk Assessment Tool score: risk and management\n- 0-10: low. Provide psychotherapy and refer for psychiatric services.\n- 11-20: medium. Provide psychotherapy and refer for psychiatric services.\n- 20-30: high. Refer to psychiatric centre / involuntary admission.\n\nProvide psychotherapy or refer. Rule out mental disorders such as major depressive disorder and manage as indicated (Mental Health Desk Guide, 2022)."}]},{"id":"Q053","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"PHQ-9","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How are PHQ-9 scores interpreted?","original_reference":"0–4 normal/remission; 5–9 minimal symptoms (support, educate); 10–14 mild major depression (antidepressant or psychotherapy, clinical judgment); 15–19 moderate (antidepressant, psychotherapy or both); 20+ severe (antidepressant plus psychotherapy, follow frequently).","question":"Adult scores 16 on the PHQ-9. What does that mean and how should it be treated?","change":"Was 'how are PHQ-9 scores interpreted' (whole table); now one score.","reference":"A score of 15-19 is major depression of moderate severity (called 'moderately severe' in the HIV Amendment and PrEP charts). It warrants treatment: an antidepressant, psychotherapy, or both (the HIV Amendment chart gives psychotherapy plus pharmacotherapy). Screen for suicide risk.","must_include":["Moderate / moderately severe depression (15-19 band)","Treatment warranted","Antidepressant and/or psychotherapy"],"must_not_include":["No treatment needed","Severe depression requiring immediate referral (that is 20+)","Mild depression"],"check":"verified; band labels differ slightly between documents (moderate vs moderately severe)","sources":[{"id":"mental-health-deskguide-tbl-p115-0274","label":"MH Desk Guide p.115","doc":"Mental Health Desk Guide 2022","pages":"115","heading":"Appendices > Appendix II: Depression Screening Form PHQ-9 > Guide for Interpreting PHQ-9 Scores","text":"### Guide for Interpreting PHQ-9 Scores (Score, Recommended Actions)\n\nGuide for Interpreting PHQ-9 Scores\n\n| Score | Recommended Actions |\n| --- | --- |\n| 0-4 | Normal range or full remission. The score suggests the patient may not need depression treatment. |\n| 5-9 | Minimal depressive symptoms. Support, educate |\n| 10-14 | Major depression, mild severity. Use clinical judgment about treatment, based on patient's duration of symptoms and functional impairment. Treat with antidepressant or psychotherapy. |\n| 15-19 | Major depression, moderate severity. Warrants treatment for depression, using antidepressant, psychotherapy or a combination of treatment. |\n| 20 or higher | Major depression, severe severity. Warrants treatment with antidepressant and psychotherapy, especially if not improved on monotherapy; follow frequently. |"},{"id":"hiv-amendment-2024-fig-10.2-phq9","label":"Amendment p.44","doc":"HIV Management Amendment 2024","pages":"44","heading":"Chapter 10: HIV/NCDs & Mental Health > 10.1 Psychological Care & Support > Depression screening (PHQ-9)","text":"### Figure 10.2 Depression screening using PHQ-9 score chart\n\nPHQ-9 score: severity and action\n- 0-4: no or minimal depression. Action: none.\n- 5-9: mild depression. Action: monitor and repeat PHQ-9 after 2 weeks to 3 months depending on symptom severity.\n- 10-14: moderate depression. Action: counselling + pharmacotherapy.\n- 15-19: moderately severe depression. Action: psychotherapy + pharmacotherapy.\n- 20-27: severe depression. Action: start pharmacotherapy and refer immediately to the National Psychiatric Hospital.\n\nIf a client scores 10 and above, they must be given psychotherapy as indicated in Section 5.9.2 of the 2022 Integrated HIV Management Guidelines and Annex 11.24."},{"id":"prep-2025-tbl-phq9","label":"PrEP 2025 p.82","doc":"PrEP Implementation Guidelines 2025","pages":"82","heading":"6 Annexes > Annex 5: Mental Health and Alcohol Abuse Screening Tools > Patient Health Questionnaire (PHQ-9)","text":"### Annex 5. PHQ-9 depression screening questionnaire (9 items scored 0-3) and score interpretation: 0-4 none, 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe, with proposed treatment actions\n\n| Over the last 2 weeks, how often have you been bothered by any of the following problems? | Not at all | Several days | More than half the days | Nearly every day |\n| --- | --- | --- | --- | --- |\n| 1. Little interest or pleasure in doing things. | 0 | 1 | 2 | 3 |\n| 2. Feeling down, depressed or hopeless. | 0 | 1 | 2 | 3 |\n| 3. Trouble falling or staying asleep, or sleeping too much. | 0 | 1 | 2 | 3 |\n| 4. Feeling tired or having little energy. | 0 | 1 | 2 | 3 |\n| 5. Poor appetite or overeating. | 0 | 1 | 2 | 3 |\n| 6. Feeling bad about yourself – or that you are a failure or have let yourself or your family down. | 0 | 1 | 2 | 3 |\n| 7. Trouble concentrating on things, such as reading the newspaper or watching television. | 0 | 1 | 2 | 3 |\n| 8. Moving or speaking so slowly that other people could have noticed. Or the opposite – being so fidgety or restless that you have been moving around a lot more than usual. | 0 | 1 | 2 | 3 |\n| 9. Thoughts that you would be better off dead, or of hurting yourself in some way. | 0 | 1 | 2 | 3 |\n| Total score: add the column scores (0–27). Then: if you checked off any problems, how difficult have these made it for you to do your work, take care of things at home, or get along with other people? Not difficult at all / Somewhat difficult / Very difficult / Extremely difficult. | (same as left) | (same as left) | (same as left) | (same as left) |\n\n**Score interpretation: PHQ-9 score – depression severity – proposed treatment actions**\n\n| Over the last 2 weeks, how often have you been bothered by any of the following problems? | Not at all | Several days | More than half the days | Nearly every day |\n| --- | --- | --- | --- | --- |\n| 0–4 | None–minimal | None–minimal | None | None |\n| 5–9 | Mild | Mild | Watchful waiting; repeat PHQ-9 at follow-up | Watchful waiting; repeat PHQ-9 at follow-up |\n| 10–14 | Moderate | Moderate | Treatment plan, considering counselling, follow-up and/or pharmacotherapy. | (same as left) |\n| 15–19 | Moderately severe | Moderately severe | Active treatment with pharmacotherapy and/or psychotherapy. | Active treatment with pharmacotherapy and/or psychotherapy. |\n| 20–27 | Severe | Severe | Immediate initiation of pharmacotherapy and, if severe impairment or poor response to therapy, expedited referral to a mental health specialist for psychotherapy and/or collaborative management. | (same as left) |"}]},{"id":"Q054","area":"Mental health and substance use","document":"Mental Health Desk Guide 2022","topic":"Drug interactions with ART","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which mood stabilisers or anticonvulsants should be avoided in patients on ART, and what should be used instead?","original_reference":"Avoid carbamazepine, phenytoin and phenobarbital because they reduce NNRTI and protease inhibitor levels; switch to lamotrigine, levetiracetam or sodium valproate CR. (Carbamazepine, if used, should be given with folic acid 5 mg daily.)","question":"Patient on an efavirenz-based ART regimen needs a mood stabiliser for bipolar disorder. Can I use carbamazepine?","change":"Was a general question; now one patient.","reference":"Avoid it. Carbamazepine, phenytoin and phenobarbital should be avoided in patients on ART because they interact with NNRTIs and protease inhibitors (the Mental Health Desk Guide says they reduce their levels). Use sodium valproate (preferred in PLHIV) or lamotrigine instead; patients already on these anticonvulsants should be switched to lamotrigine, levetiracetam or sodium valproate CR.","must_include":["Avoid carbamazepine with ART","Drug interaction with NNRTIs/PIs","Sodium valproate (or lamotrigine) instead"],"must_not_include":["Carbamazepine is safe with ART","Phenytoin as the alternative"],"check":"verified; the documents disagree on direction (MH Desk Guide: reduces NNRTI/PI levels; HIV 2022 p.252: 'increases levels') — both say avoid; clinician to note","sources":[{"id":"mental-health-deskguide-0195","label":"MH Desk Guide p.82","doc":"Mental Health Desk Guide 2022","pages":"82","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management Bipolar Affective Disorders (BAD) > Mood Stabilizerers","text":"# **CAUTION;**\n\n- Check serum levels of Sodium Valproate, Carbamazepine and Lamotrigine levels yearly or every six months if the patient is on a maximum dose. (B)\n- Always prescribe carbamazepine together with folic acid 5 mg daily.\n- Avoid carbamazepine, phenytoin and phenobarbital to patients who are using **HAART** as these can reduce serum concentration of non-nucleoside reverse transcriptase inhibitors and protease inhibitors.\n- Sodium valproate may induce weight gain as a side effect.\n- Lamotrigine does not induce weight gain.\n- Do not prescribe an antidepressant alone to a patient with bipolar disorder depressive episode, it may precipitate a manic episode."},{"id":"mental-health-deskguide-0206","label":"MH Desk Guide p.85-86","doc":"Mental Health Desk Guide 2022","pages":"85-86","heading":"Chapter 4: Job Aids for Different Psychiatric Conditions > Pharmacological Management of Autism Spectrum Disorder > Seizures: caution with anticonvulsants","text":"### **CAUTION**\n\n* Patients on HAART who are taking phenytoin, phenobarbital and/or carbamazepine should be switched to Lamotrigine, Levetiracetam or Sodium valproate CR to avoid potential drug-drug interactions.\n* Carbamazepine CR is mostly preferred as it is less sedative.\n* Prescribe Carbamazepine (plain and CR) concurrently with folic acid 5 mg daily, because it inhibits folate metabolism.\n* Lamotrigine has high risk of inducing Steven Johnson Syndrome, cautious while prescribing it and it is better prescribed by a Medical Practitioner.\n* Check serum plasma levels of anticonvulsants every 6 to 12 months for m
