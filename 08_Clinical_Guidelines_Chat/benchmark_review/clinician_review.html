line in RPR/VDRL titre = adequate treatment response.\n   - Non-reactive → Past treated syphilis or very early infection → History of prior treatment? (check records) → No → Treat for syphilis; Yes → No treatment.\n\nBelow the figure an older chart is printed over the text of 7.1.2 (overlapping shapes): SERUM → RPR/VDRL → Positive results / Negative results; positive → RDT/Tp → Positive results / Negative results; positive → Confirmed syphilis: treat. Legend fragment: 'Tp = [treponemal test]; [RP]R = Non-trepo[nemal test]'."}]},{"id":"Q063","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Congenital syphilis","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How should an asymptomatic newborn whose mother had a reactive syphilis test be managed?","original_reference":"Give a single IM dose of benzathine penicillin 50,000 IU/kg whether or not the mother was treated; examine at birth and every 3 months until serology is confirmed negative. Hospitalise symptomatic babies. Confirmed early congenital syphilis: aqueous penicillin 50,000 IU/kg IV 12-hourly (8-hourly after day 7) for 10 days, or procaine penicillin 50,000 IU/kg IM daily for 10 days.","question":"Well baby at birth; mother had a reactive syphilis test in pregnancy and was treated. What do I do for the baby?","change":"Added the detail that the mother was treated (the rule applies either way).","reference":"Give the baby a single IM dose of benzathine penicillin 50,000 IU/kg, whether or not the mother was treated. Examine at birth and every 3 months until serology is confirmed to be, and remain, negative. Hospitalise babies who are symptomatic. (Confirmed early congenital syphilis is treated with aqueous penicillin 50,000 IU/kg IV 12-hourly for the first 7 days of life and 8-hourly thereafter, 10 days in total, or procaine penicillin 50,000 IU/kg IM daily for 10 days.)","must_include":["Benzathine penicillin 50,000 IU/kg IM single dose","Even though the mother was treated","Follow-up every 3 months until serology negative"],"must_not_include":["Adult dose (2.4 million units)","No treatment needed because the mother was treated","Erythromycin as first choice"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p115-t0279","label":"STI 2026 draft p.115-116","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"115-116","heading":"11.0 STI’s In Children and Adolescents > 11.1 Congenital syphilis","text":"## 11.1 Congenital syphilis\n\nCongenital syphilis may occur if the pregnant mother has syphilis. However, the risk is minimal if she has been given penicillin during pregnancy.\n- All infants of RPR/RDT-Tp/VDRL-reactive mothers should be examined at birth and at 3 months intervals until it is confirmed that serological tests are, and remain, negative. Any antibody carried over from mother to baby usually disappears within 3 months of birth.\n- It is recommended that all infants born to RPR/RDT-Tp/VDRL- reactive mothers, should be treated with a single IM dose of Benzathine Penicillin, 50, 000 IU/kg, whether or not the mothers were treated during pregnancy (with or without penicillin).\n- Hospitalization is recommended for all symptomatic babies born to mothers who were RPR/RDT-Tp/VDRL-reactive.\nCongenital syphilis is divided into early (first 2 years of life) and late (becomes apparent later in life).\nSigns and symptoms of early congenital syphilis More commonly, a child aged 2 to 12 weeks is brought in with a history of failure to thrive and having a generalised bullous or papulosquamous rash. The rash may cover the entire body but usually affects the buttocks, thighs, face, palms and soles. Occasionally, flat grey condylomata lata lesions may be seen in body folds. There may be generalised lymphadenopathy, enlargement of liver and spleen and anaemia. Since the infection is systemic, any organ of the body may be affected.\nDiagnosis of latent (early or late) congenital syphilis the diagnosis of latent (early or late) congenital syphilis is usually made during routine testing of an asymptomatic child whose mother has a positive syphilis blood test. Such cases should be referred to a higher level for thorough examination, including cerebrospinal fluid examination to rule out latent neurosyphilis."},{"id":"sti-vh-draft-2026-txt-p116-t0280","label":"STI p.116-117","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"116-117","heading":"11.0 STI’s In Children and Adolescents > 11.1 Congenital syphilis > Management","text":"## Management\n\nRecommended regimens for early congenital syphilis (up to 2 years of age) Symptomatic infants and asymptomatic infants (up to two years of age) should be treated for early congenital syphilis:\n- Aqueous Penicillin, 100,000~150,000 IU/kg/day IV in 2 divided doses daily for 10 days administered as 50,000 IU/kg/dose IV every 12 hours, during the first 7 days of life and every 8 hours thereafter for a total of 10 days. OR\n- Procaine Penicillin, 50,000 IU/kg IM in a single daily dose for 10 days.\nAntimicrobials other than penicillin (such as Erythromycin) are not recommended for congenital syphilis, except in cases of allergy to penicillin. Tetracyclines should not be used in young children.\nRecommended regimens for late congenital syphilis (more than 2 years duration)\n- Aqueous Penicillin 200, 00 to 300,000 IU/kg/day IV or IM in divide doses (50,000IU/ kg/dose every 4-6 hours) for 10-14 days. For penicillin hypersensitive patients (after the first month of life):\n- Erythromycin base / stearate, 7.5-12.5 mg/kg/day orally QID for 30 days."},{"id":"sti-vh-draft-2026-chart-syphilis-in-pregnancy","label":"STI p.80","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"80","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > 7.1.2 Syphilis in pregnancy > Chart 8","text":"### Syndromic chart for syphilis in pregnancy (chart 8)\n\nPregnant woman at her first antenatal care (ANC) visit → Take history and examine; explain need for syphilis screening; provide HIV testing and counselling and do pre-test counselling for HIV. Then:\n- Any STI(s) present? YES → Treat according to appropriate flow chart.\n- Take blood for: RPR/RDT-Tp; HIV test, after counselling; other routine ANC tests.\n   - RPR/RDT-Tp (syphilis test) positive?\n      - NO → Provide health promotion package to pregnant woman and partner.\n      - YES → Mother: treat with Benzathine Penicillin, 2.4 million units IM weekly x 3 weeks. Offer examination and treatment to partner. Provide health promotion package to pregnant woman and partner. Repeat RPR/RDT-Tp testing after 3 months of treatment.\n        AND treat all newborns of mother with positive RPR/RDT-Tp: Rx: Benzathine Penicillin 50 000 IU/kg IM stat/ Procaine Penicillin G 150 000 IU/kg IM, 12 hourly for 14 days. If allergic Erythromycin 50mg/kg divided doses 6 hourly 30 days.\n   - HIV test positive? YES → Provide post-test counselling; refer to PMTCT, where available. NO → Repeat HIV test every 3 months if any STI present.\n\nHealth promotion package:\n- Educate, ensure compliance, and counsel on treatment.\n- Promote abstinence or condom use during treatment.\n- Promote correct and consistent condom use also provide condoms and lubricants.\n- Issue one notification slip for each sexual partner and emphasize the importance of partner treatment.\n- Offer HIV counselling and testing, as per Integrated HIV Guidelines.\n- Offer voluntary medical male circumcision.\n- Offer pre exposure prophylaxis as per guideline."}]},{"id":"Q064","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Neonatal conjunctivitis","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How is neonatal conjunctivitis treated in the baby and the mother?","original_reference":"Newborn: ceftriaxone 50 mg/kg IM single dose (max 125 mg) plus erythromycin syrup 50 mg/kg/day in 4 divided doses for 14 days; clean eyes with saline. It is an emergency, so treat within 24 hours. Mother: ceftriaxone 1 g IM (or cefixime 400 mg) plus azithromycin 1 g stat (or erythromycin 500 mg QID 7 days); examine and treat the partner. Prevention: 1% tetracycline eye ointment for all newborns at delivery.","question":"Baby 5 days old with purulent discharge from both eyes. How do I treat the baby and the breastfeeding mother?","change":"Turned into a case; kept as a natural two-part question (baby and mother).","reference":"Neonatal conjunctivitis is a medical emergency: treat within 24 hours to prevent blindness. Treat the baby for both gonorrhoea and chlamydia: ceftriaxone 50 mg/kg IM single dose (maximum 125 mg) plus erythromycin syrup 50 mg/kg/day orally in 4 divided doses for 14 days, and clean the eyes with saline or distilled water. Mother: ceftriaxone 1 g IM stat (or cefixime 400 mg orally stat) plus azithromycin 1 g orally stat (or erythromycin 500 mg QID for 7 days). Examine and treat the partner too.","must_include":["Emergency, treat within 24 hours","Baby: ceftriaxone 50 mg/kg IM, max 125 mg","Baby: erythromycin syrup 50 mg/kg/day in 4 doses for 14 days","Mother: ceftriaxone 1 g IM + azithromycin 1 g","Treat the partner"],"must_not_include":["Topical tetracycline alone as treatment","Adult ceftriaxone dose for the baby"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p68-t0183","label":"STI 2026 draft p.68-69","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"68-69","heading":"5.0 Management of STIs Associated Syndromes > 5.7. Neonatal conjunctivitis > Prevention measures:","text":"## Prevention measures:\n\n- Screen all pregnant women for Sexually Transmitted Infections during pregnancy and provide appropriate treatment;\n- Routine application of tetracycline eye ointment (1%) to all new-born’s at the time of delivery;\n- Provide health promotion package to parents.\n- All new-born babies with conjunctivitis should be treated for both N. gonorrhoea and C. trachomatis because of the possibility of mixed infections. Clean the eyes with distilled water or saline.\n- Persons caring for infected infants should always wash their hands carefully. Parents (mother and father or partner) should be examined and treated.\n\n## For the new-born\n\n- Ceftriaxone, 50mg/kg body weight (max. 125mg) IM single dose, up to maximum of 125mg PLUS\n- Erythromycin syrup, 50mg/kg body weight orally daily in 4 divided doses for 14 days.\n\n## For Breast feeding mother.\n\n- Ceftriaxone, 1g IM STAT OR Cefixime, 400mg orally STAT PLUS\n- Azithromycin, 1g orally STAT OR Erythromycin, 500mg orally QID for 7 days"},{"id":"sti-vh-draft-2026-txt-p68-t0180","label":"STI p.68","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"68","heading":"5.0 Management of STIs Associated Syndromes > 5.7. Neonatal conjunctivitis > Description","text":"## Description\n\nNeonatal conjunctivitis is the condition where the baby develops purulent conjunctivitis in one or both eyes within four weeks of birth. It is a medical emergency and unless treatment is initiated within 24 hours there could be permanent damage to the eyes resulting in blindness. STI-related infections are passed from the mother to the neonate during vaginal delivery.\n\n## Etiology\n\nN. Gonorrhoeae C. Trachomatis\n\n## Clinical features\n\nNew-born babies usually present with redness and swelling of eyelids or “sticky eyes” due to the discharge from the eyes. The symptoms and signs may occur within one week of the birth."}]},{"id":"Q065","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Hepatitis B treatment","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which adults with chronic hepatitis B are eligible for antiviral treatment under the updated (2024 WHO-aligned) criteria?","original_reference":"Any of: significant fibrosis/cirrhosis (APRI >0.5 or elastography >7 kPa; cirrhosis APRI >1 or >12.5 kPa); HBV DNA >2000 IU/mL with ALT above normal (30 U/L men, 19 U/L women); special risk factors (HIV/HDV/HCV coinfection, family history of liver cancer/cirrhosis, immunosuppression, diabetes/MASLD, extrahepatic manifestations); or, without HBV DNA testing, persistently abnormal ALT (two values over 6–12 months). First-line: TDF or entecavir monotherapy.","question":"Man with chronic hepatitis B: HBV DNA 5,000 IU/mL, ALT 45 U/L, no cirrhosis, HIV negative. Does he need antiviral treatment?","change":"Removed 'under the updated (2024 WHO-aligned) criteria'; now one patient.","reference":"Yes. Under the 2024 criteria, treatment is recommended when HBV DNA is >2000 IU/mL together with ALT above the upper limit of normal (30 U/L for men, 19 U/L for women); he has both. (Other criteria: significant fibrosis or cirrhosis by APRI/elastography; special risk factors such as HIV/HDV/HCV coinfection, family history of liver cancer, immunosuppression, diabetes; or, without HBV DNA testing, persistently abnormal ALT.) First-line treatment is tenofovir (TDF) or entecavir monotherapy.","must_include":["Yes, treat","HBV DNA >2000 IU/mL with ALT above normal (30 U/L for men)","TDF or entecavir"],"must_not_include":["ALT must be more than 2× normal","HBV DNA must exceed 20,000 IU/mL (older threshold)","Lamivudine monotherapy"],"check":"verified; HIV 2022 Annex 11.10 uses the older 20,000 IU/mL threshold — the STI draft (2024 WHO) supersedes it","sources":[{"id":"sti-vh-draft-2026-txt-p102-t0257","label":"STI 2026 draft p.102","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"102","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Treatment eligibility","text":"## Treatment eligibility\n\nFollowing the 2024 WHO HBV guideline update, treatment is recommended for all adults and adolescents ( ≥ 12 years) with chronic HBV, including pregnant women and girls of reproductive age, who meet any of the following criteria:\n- Significant fibrosis or cirrhosis: evidence of significant fibrosis ( ≥ F2) - APRI score >0.5 or transient elastography (Fibroscan®) >7 kPa - or cirrhosis (F4) by clinical criteria, APRI >1, or elastography >12.5 kPa, regardless of HBV DNA or ALT;\n- Active disease: HBV DNA >2000 IU/mL together with ALT above the upper limit of normal (30 U/L for men and boys, 19 U/L for women and girls);\n- Special risk factors: HIV, HDV or HCV coinfection; family history of liver cancer or cirrhosis; immune suppression (e.g. long-term steroids, transplant); comorbidities (e.g. diabetes, metabolic dysfunction-associated steatotic liver disease); or extrahepatic manifestations (e.g. glomerulonephritis, vasculitis) - regardless of APRI, HBV DNA or ALT;\n- No access to HBV DNA testing: where HBV DNA testing is not available, persistently abnormal ALT alone (two values above the upper limit of normal over a 6-12 month period), regardless of APRI score.\nPatients who do not yet meet treatment criteria should be monitored (ALT and HBV DNA where available) at least annually. Before starting treatment, renal function (or urinalysis where renal function tests are unavailable) should be checked in all patients, since this may affect drug choice and dosing."},{"id":"sti-vh-draft-2026-txt-p102-t0258","label":"STI p.102","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"102-103","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Treatment regimen","text":"## Treatment regimen\n\nFor all adults, adolescents and children aged 2 years or older who need antiviral therapy, tenofovir disoproxil fumarate (TDF) or entecavir (ETV) - nucleos(t)ide analogues with a high genetic barrier to resistance - are the preferred first-line regimens, used as monotherapy rather than combined. Where TDF monotherapy is not available, TDF plus lamivudine (3TC) or TDF plus emtricitabine (FTC) is an acceptable alternative first-line regimen. Entecavir or tenofovir alafenamide (TAF) is\npreferred for people with osteoporosis or impaired renal function. Older agents - telbivudine, lamivudine monotherapy and adefovir - are no longer recommended except on specialist advice, owing to a low barrier to resistance."},{"id":"sti-vh-draft-2026-fig-14-hbv-assessment-treatment","label":"STI p.104","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"104","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Treatment of chronic hepatitis B > Figure 14","text":"### Figure 14: Algorithm for assessment, treatment and monitoring of people with chronic hepatitis B infection (WHO, 2024)\n\nHBsAg positive →\nInitial assessment - assessment for treatment eligibility: 1. severity of liver disease using non-invasive tests (APRI or transient elastography); 2. ALT and HBV DNA level; 3. medical history: screening for presence of coinfections (e.g. HIV, HDV or HCV), comorbidities (e.g. diabetes, steatotic liver disease), immune suppression (e.g. long-term steroids, transplant), extrahepatic manifestations (e.g. glomerulonephritis, vasculitis), or family history of liver cancer or cirrhosis. General care measures: 1. counselling on lifestyle (e.g. alcohol consumption, diet and physical activity); 2. preparation for starting treatment (e.g. adherence support, risk factors for renal dysfunction and baseline renal function as indicated); 3. preventive measures (e.g. HBsAg screening of family and household members and sexual contacts, with HBV vaccination of those negative).\nTreatment eligibility - treat all adults and adolescents (aged ≥12 years) (including pregnant and non-pregnant women and girls of reproductive age) with: 1. significant fibrosis (≥F2) or cirrhosis (F4) regardless of HBV DNA or ALT levels (clinical criteria for cirrhosis; non-invasive tests: APRI >0.5 or transient elastography >7 kPa (adults)); OR 2. HBV DNA >2000 IU/mL AND ALT level > ULN; OR 3. presence of any of the following (regardless of APRI score, HBV DNA or ALT level): coinfection (e.g. HIV, HDV, HCV); family history of liver cancer or cirrhosis; immune suppression; comorbidities (e.g. diabetes, metabolic dysfunction-associated steatotic liver disease); extrahepatic manifestations (e.g. glomerulonephritis or vasculitis); OR (in absence of access to HBV DNA assay) 4. persistently abnormal ALT levels alone.\nAntiviral treatment regimen: initiate antiviral therapy and monitor: TDF or ETV; TDF + 3TC or TDF + FTC (if no access to TDF monotherapy); ETV or TAF in persons with osteoporosis or impaired kidney function or in children and adolescents.\nDefer treatment and monitor if: ALT persistently normal AND HBV DNA <2000 IU/mL AND absence of coinfections, comorbidities, immune suppression, extrahepatic manifestations, family history of liver cancer or cirrhosis.\nMonitoring: every 6 months - surveillance for HCC (AFP and ultrasound) (persons with cirrhosis or family history of liver cancer or cirrhosis); every 12 months - treatment response and/or disease progression: adherence at each visit, if on treatment; non-invasive tests (APRI or transient elastography); ALT and HBV DNA level; monitoring of renal function (creatinine), as indicated."}]},{"id":"Q066","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Hepatitis B in pregnancy","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A pregnant woman is HBsAg positive, and HBV DNA testing is not available. What prevents transmission to her baby?","original_reference":"Offer tenofovir (TDF) prophylaxis (where DNA/HBeAg testing is unavailable, offer to all HBsAg-positive pregnant women), ideally from at least the second trimester until delivery. Give the infant hepatitis B birth-dose vaccine within 24 hours, then the EPI schedule. Breastfeeding is not contraindicated and caesarean section is not indicated for HBV. Test the infant for HBsAg at 6–12 months.","question":"Pregnant woman, HBsAg positive, HIV negative; HBV DNA testing not available. What do I do to prevent transmission to the baby?","change":"Added HIV-negative so the answer cannot default to ART.","reference":"Offer tenofovir (TDF) prophylaxis (where DNA/HBeAg testing is unavailable, offer to all HBsAg-positive pregnant women), ideally from at least the second trimester until delivery. Give the infant hepatitis B birth-dose vaccine within 24 hours, then the EPI schedule. Breastfeeding is not contraindicated and caesarean section is not indicated for HBV. Test the infant for HBsAg at 6–12 months.","must_include":["Tenofovir (TDF) prophylaxis for all HBsAg-positive pregnant women when DNA/HBeAg testing is unavailable","From at least the second trimester until delivery","Birth-dose hepatitis B vaccine within 24 hours","Breastfeeding is not contraindicated"],"must_not_include":["No prophylaxis without a viral load result","Avoid breastfeeding","Caesarean section to prevent HBV transmission"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-fig-12-hbv-pmtct-algorithm","label":"STI 2026 draft p.101","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"101","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Prevention of hepatitis B mother-to-child transmission (PMTCT) > Figure 12","text":"### Figure 12: Algorithm on use of antiviral prophylaxis for prevention of mother-to-child transmission in pregnant women and adolescent girls with CHB, and assessment of treatment eligibility for their own health (WHO, 2024)\n\n1 Serological testing: HBsAg testing in pregnant women and adolescent girls (using RDT or laboratory-based immunoassay) → HBsAg +ve / HBsAg -ve.\n2 Assessment for antiviral prophylaxis (HBsAg +ve): assessment of eligibility for antiviral prophylaxis → HBV DNA or HBeAg testing available / not available.\n3 Maternal intervention - antiviral prophylaxis:\n- HBV DNA <200,000 IU/mL or HBeAg negative → no maternal tenofovir prophylaxis.\n- HBV DNA ≥200,000 IU/mL or HBeAg positive → start maternal tenofovir prophylaxis (from at least second trimester of pregnancy until at least after delivery).\n- Testing not available → offer maternal tenofovir prophylaxis to all HBsAg +ve pregnant women and adolescents.\n4 Maternal intervention - long-term antiviral treatment: assessment of eligibility for long-term treatment in pregnant women and adolescent girls for their own health: 1. significant fibrosis (≥F2) or cirrhosis (F4) regardless of HBV DNA or ALT levels (clinical criteria for cirrhosis; non-invasive tests: APRI >0.5 or transient elastography >7 kPa (adults)); OR 2. HBV DNA >2000 IU/mL AND ALT level > ULN; OR 3. presence of any of the following: coinfection (e.g. HIV, HDV, HCV); family history of liver cancer or cirrhosis; immune suppression; comorbidities (e.g. diabetes, metabolic dysfunction-associated steatotic liver disease); extrahepatic manifestations (e.g. glomerulonephritis or vasculitis); OR 4. persistently abnormal ALT levels alone (in absence of access to HBV DNA assay).\n5 Infant interventions: hepatitis B birth dose vaccination of the infant followed by 2 or 3 doses of vaccine."},{"id":"sti-vh-draft-2026-txt-p100-t0253","label":"STI p.100","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"100","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Prevention of hepatitis B mother-to-child transmission (PMTCT)","text":"## Prevention of hepatitis B mother-to-child transmission (PMTCT)\n\nMost chronic HBV infection is acquired perinatally or in early childhood, and infection acquired as a neonate becomes chronic in about 90% of cases, compared with under 5% when acquired as an adult. All pregnant women should be tested for HIV, syphilis and HBsAg at least once, as early as possible in pregnancy, or at admission for delivery if not previously tested. Since 2020 WHO has recommended antiviral (tenofovir, TDF) prophylaxis for HBsAg-positive pregnant women with high HBV DNA ( ≥ 200 000 IU/mL) or a positive HBeAg test, given from at least the second trimester until delivery. Where HBV DNA or HBeAg testing is not available, the 2024 WHO guideline recommends offering TDF prophylaxis to all HBsAg-positive pregnant women and adolescent girls. Regardless of maternal antiviral prophylaxis, every infant should receive a timely birth-dose of hepatitis B vaccine within 24 hours of birth, followed by the remaining doses in the national EPI schedule; there is no evidence that caesarean delivery reduces HBV transmission risk, so standard obstetric practice should be followed."},{"id":"sti-vh-draft-2026-txt-p101-t0254","label":"STI p.101","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"101","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Newborn care and follow-up of infants exposed to HBV","text":"## Newborn care and follow-up of infants exposed to HBV\n\nAll newborns should receive the first dose of hepatitis B vaccine within 24 hours of birth regardless of the mother's HBV status, with particular attention to infants of HBsAg-positive mothers; subsequent doses follow the national EPI schedule. If birth does not occur at a health facility, the birth dose should be given at first contact with a health facility. Breastfeeding is not contraindicated in HBV infection. HBsAg testing of an exposed infant is unreliable before 6 months of age; exposed infants should be tested for HBsAg between 6 and 12 months, and referred for specialist evaluation if chronic infection (HBsAg positive for 6 months or more) is confirmed."}]},{"id":"Q067","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Hepatitis C","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How is hepatitis C diagnosed and how is cure confirmed?","original_reference":"Screen with anti-HCV antibody (RDT/ELISA); a reactive result shows exposure only and must be confirmed with HCV RNA or core antigen. Treat with pangenotypic DAAs (usually 12 weeks) for everyone aged 3 and above, without genotyping. Cure (SVR12) is an undetectable HCV RNA 12 weeks after finishing treatment.","question":"40-year-old woman with a reactive anti-HCV rapid test. Does she have hepatitis C, and how will I know she's cured after treatment?","change":"Turned into a case; kept as a natural two-part question.","reference":"Not yet confirmed. A reactive antibody test shows exposure only; confirm current infection with HCV RNA (or HCV core antigen). If viraemic, treat with a pangenotypic DAA regimen (no genotyping needed; usually 12 weeks). Cure is an undetectable HCV RNA 12 weeks after completing treatment (SVR12).","must_include":["Antibody = exposure only","Confirm with HCV RNA or core antigen","Cure = undetectable HCV RNA 12 weeks after treatment (SVR12)"],"must_not_include":["The antibody test confirms active infection","A negative antibody test confirms cure","Genotyping is required before treatment"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p100-t0251","label":"STI 2026 draft p.100","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"100","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Diagnosis of hepatitis C","text":"## Diagnosis of hepatitis C\n\nInitial diagnosis is serological, using an RDT or ELISA for anti-HCV antibodies; a non-reactive result indicates no infection. A reactive antibody test indicates exposure only, and must be confirmed with a molecular test for HCV RNA (qualitative or quantitative) or HCV core antigen to distinguish current from past, spontaneously-cleared infection. If recent infection is suspected, a negative confirmatory test should be repeated 12-24 weeks later before infection is excluded."},{"id":"sti-vh-draft-2026-txt-p106-t0263","label":"STI p.106","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"106-107","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis C (HCV) > Assessment of treatment response and monitoring","text":"## Assessment of treatment response and monitoring\n\nA single undetectable HCV RNA result 12 weeks after completing treatment (SVR12), by qualitative or quantitative NAT assay, is the benchmark for cure. Routine laboratory monitoring (full blood count, creatinine, AST/ALT) can be limited to a\nbaseline and end-of-treatment specimen. People with cirrhosis should have ultrasound and/or AFP for hepatocellular carcinoma every 6 months."},{"id":"sti-vh-draft-2026-fig-17-hcv-algorithm","label":"STI p.108","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"108","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis C (HCV) > Treatment of chronic hepatitis C > Figure 17","text":"### Figure 17: Algorithm for screening, diagnosis, assessment, treatment and follow-up of people with chronic HCV infection (WHO)\n\n1 Serological testing: conduct anti-HCV antibody testing (use rapid diagnostic test or laboratory-based immunoassay) → anti-HCV + / anti-HCV -.\n2 Confirmation of current infection (anti-HCV +): proceed to viral load testing - use lab-based HCV RNA (qualitative or quantitative) or HCV core antigen (cAg) assays or point-of-care HCV RNA assays → HCV RNA test + or cAg+ = HCV viraemic infection; HCV RNA test - or cAg- = no HCV viraemic infection.\n3 Treatment assessment: offer and start treatment for adults (≥18 years), adolescents (12-17 years) and children (≥3 years). Assess before treatment initiation: liver fibrosis with non-invasive testing (e.g. APRI, FIB-4) to determine if there is cirrhosis; other considerations (comorbidities, pregnancy, potential drug-drug interactions).\n- ≥18 years and 3-17 years without cirrhosis: sofosbuvir/velpatasvir 12 weeks; sofosbuvir/daclatasvir 12 weeks; glecaprevir/pibrentasvir 8 weeks.\n- ≥18 years and 3-17 years with compensated cirrhosis: sofosbuvir/velpatasvir 12 weeks; glecaprevir/pibrentasvir 8 weeks*; sofosbuvir/daclatasvir 24 weeks; sofosbuvir/daclatasvir 12 weeks**.\n4 Monitoring: assess cure - sustained virological response (SVR) at 12 weeks after the end of treatment (HCV RNA SVR, qualitative or quantitative nucleic acid test [NAT]); detection of hepatocellular carcinoma (HCC) in persons with cirrhosis (every 6 months) with ultrasound or AFP."},{"id":"sti-vh-draft-2026-txt-p105-t0262","label":"STI p.105","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"105","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis C (HCV) > Treatment of chronic hepatitis C","text":"## Treatment of chronic hepatitis C\n\nHCV infection is curable. WHO recommends pangenotypic direct-acting antiviral (DAA) regimens for all adults, adolescents and children aged 3 years and above with chronic HCV, regardless of disease stage, to prevent progression to cirrhosis and hepatocellular carcinoma and to stop onward transmission. Pangenotypic regimens remove the need for genotyping before starting treatment. Fibrosis assessment (APRI or transient elastography) can help determine whether cirrhosis is present and the follow-up needed after cure, but should not delay treatment initiation. DAAs have very few contraindications with other medicines and few side-effects, so routine toxicity monitoring can be limited to a specimen at the start and end of treatment. The goals of treatment are to achieve a sustained virologic response (cure), prevent progression to complications, prevent onward transmission, and improve quality of life."}]},{"id":"Q068","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Sexual violence","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What presumptive STI treatment should an adult survivor of sexual assault receive?","original_reference":"Ceftriaxone 1 g IM (or cefixime 400 mg, or spectinomycin 2 g IM) plus azithromycin 1 g (or doxycycline 100 mg BD 7 days) plus metronidazole 2 g stat (or 400 mg BD 7 days). Also: syphilis and HIV tests, pregnancy test and emergency contraception within 72 hours, HIV PEP per national guidelines, hepatitis B vaccine if not immune, and follow-up at ~1 week and ~12 weeks.","question":"28-year-old woman presents 20 hours after a sexual assault. What presumptive STI treatment do I give, and what else must be done today?","change":"Turned into a case within 72 hours; kept the natural pair (STI treatment + other urgent measures).","reference":"Presumptive STI treatment: ceftriaxone (or cefixime 400 mg, or spectinomycin 2 g IM) plus azithromycin 1 g stat (or doxycycline 100 mg 12-hourly for 7 days) plus metronidazole 2 g stat (or 400 mg 12-hourly for 7 days). Same day: HIV test and HIV PEP as soon as possible (within 72 hours; TDF + 3TC/FTC + DTG for 28 days), pregnancy test and emergency contraception, syphilis test, hepatitis B vaccination if not immune, treatment of injuries, and psychological first aid; arrange follow-up.","must_include":["Ceftriaxone + azithromycin + metronidazole","HIV PEP within 72 hours","Pregnancy test and emergency contraception","Hepatitis B vaccination if unvaccinated"],"must_not_include":["No PEP because she presented after 12 hours","Wait for test results before presumptive treatment"],"check":"CONFLICT in source: Table 12 gives ceftriaxone 1 g IM; Chart 11 (marked 'updated per WHO 2021') gives ceftriaxone 250 mg IM. Reference leaves the dose open — clinician to decide which the benchmark expects","sources":[{"id":"sti-vh-draft-2026-tbl-12-sexual-assault-presumptive","label":"STI 2026 draft p.92, Table 12","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"92","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.5 Management of Survivors Of Sexual Violence > Table 12","text":"### Table 12: Presumptive STI treatment for survivors of sexual assault\n\nInclude other measures: (the text after the table lists syphilis and HIV tests, pregnancy test and emergency contraception, HIV PEP and hepatitis B vaccine).\n\n| Treatment |\n| --- |\n| Ceftriaxone 1g IMI STAT OR Cefixime 400mg STAT OR Spectinomycin 2g IM STAT |\n| PLUS |\n| Azithromycin 1g IMI STAT OR Doxycycline 100mg 12hrly x 7 days |\n| PLUS |\n| Metronidazole 2g PO STAT OR Metronidazole 400mg PO 12hrly x 7 days |\n\n'7 days' for the metronidazole alternative is cut off by the cell border on the page."},{"id":"sti-vh-draft-2026-fig-11-sexual-violence","label":"STI p.93, Chart 11","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"93","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.5 Management of Survivors Of Sexual Violence > 7.5.1 Chart 11 (Figure 11)","text":"### Figure 11: Syndromic treatment for management of survivors of sexual violence\n\nSuspected sexual violence → Take history and examine: HVS, microscopy, pregnancy test, HIV rapid test, hepatitis B status, syphilis RDT.\n\nPresenting within 72 hours:\n- Presumptive STI treatment [updated per WHO 2021]: ceftriaxone 250 mg IM stat PLUS azithromycin 1 g orally stat PLUS metronidazole 2 g orally stat.\n- HIV post-exposure prophylaxis [updated per WHO 2024]: initiate as soon as possible, ideally within 24 hours; preferred 3-drug regimen TDF + 3TC (or FTC) + DTG; full 28-day course prescribed at first visit; provide starter pack if full course not available, with rapid follow-up; if HIV positive: refer for chronic HIV care.\n- Hepatitis B [added]: initiate hepatitis B vaccination if unvaccinated; complete vaccination series at follow-up.\n- Emergency contraception [updated window]: if pregnancy test is negative: levonorgestrel 1.5 mg orally stat (up to 72 hours), OR ulipristal acetate 30 mg orally stat (up to 120 hours), OR copper IUD insertion (up to 120 hours, most effective method). If pregnancy test positive, refer to ANC. If negative, repeat test at 6 weeks.\n\nPresenting after 72 hours:\n- Presumptive STI treatment [updated per WHO 2021]: ceftriaxone 250 mg IM stat PLUS azithromycin 1 g orally stat PLUS metronidazole 2 g orally stat.\n- HIV status: HIV PEP is not recommended beyond 72 hours; if HIV negative: follow up per national guidelines; if HIV positive: refer for chronic HIV care.\n- Hepatitis B [added]: initiate hepatitis B vaccination if unvaccinated; complete vaccination series at follow-up.\n- Pregnancy status: if within 120 hours: emergency contraception still possible (ulipristal acetate or copper IUD); if pregnancy confirmed: refer to ANC and follow up; if no pregnancy: repeat test at 6 weeks.\n\nFollow-up schedule [added]: 2 weeks: assess PEP adherence and side effects, wound review. 6 weeks: repeat pregnancy test, repeat HIV test, syphilis serology. 3 months: repeat HIV test, repeat syphilis serology. 6 months: final HIV test, complete hepatitis B vaccination series.\n\nAll survivors at every visit: advise on legal protection and support with medico-legal documentation; provide psychological first aid at time of crisis and ongoing mental health support (screen for PTSD, depression, anxiety); treat all physical injuries, including tetanus prophylaxis per wound status and immunisation history; if pregnancy resulted from the assault, therapeutic termination may be considered after consultation with relevant authorities per national law.\n\nSources (printed): WHO Guidelines for HIV Post-Exposure Prophylaxis (2024); WHO Guidelines for the Management of Symptomatic STIs (2021); WHO Clinical Management of Rape and Intimate Partner Violence Survivors; CDC nPEP Guidelines (2025). Verify all regimens against Eswatini national formulary and guidelines before implementation."}]},{"id":"Q126","area":"STIs and viral hepatitis","document":"STI 2026","topic":"False premise","type":"edge-case","category":"false-premise","expected":"correct-premise","safety":"yes","original_question":"Since breastfeeding is contraindicated for mothers with hepatitis B, what formula should I recommend?","original_reference":"Correct: breastfeeding is NOT contraindicated in HBV. Infant needs hep B birth dose within 24 h and EPI schedule; consider maternal TDF prophylaxis.","question":"Since breastfeeding is contraindicated for mothers with hepatitis B, what formula should I recommend?","change":"Unchanged (behaviour test).","reference":"Correct: breastfeeding is NOT contraindicated in HBV. Infant needs hep B birth dose within 24 h and EPI schedule; consider maternal TDF prophylaxis.","must_include":["Corrects the premise: breastfeeding is NOT contraindicated in HBV","Hepatitis B birth dose within 24 hours"],"must_not_include":["Recommends a formula","Agrees breastfeeding is contraindicated"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p101-t0254","label":"STI 2026 draft p.101","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"101","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > Hepatitis B and C viral infection > Newborn care and follow-up of infants exposed to HBV","text":"## Newborn care and follow-up of infants exposed to HBV\n\nAll newborns should receive the first dose of hepatitis B vaccine within 24 hours of birth regardless of the mother's HBV status, with particular attention to infants of HBsAg-positive mothers; subsequent doses follow the national EPI schedule. If birth does not occur at a health facility, the birth dose should be given at first contact with a health facility. Breastfeeding is not contraindicated in HBV infection. HBsAg testing of an exposed infant is unreliable before 6 months of age; exposed infants should be tested for HBsAg between 6 and 12 months, and referred for specialist evaluation if chronic infection (HBsAg positive for 6 months or more) is confirmed."}]},{"id":"Q152","area":"STIs and viral hepatitis","document":"Multiple","topic":"One-word query","type":"edge-case","category":"very-short","expected":"ask-clarifying-or-overview","safety":"no","original_question":"Syphilis?","original_reference":"Ask what aspect (testing, treatment, pregnancy, congenital) or give a brief overview with an offer to go deeper: RPR/RDT testing, benzathine penicillin 2.4 MU IM (x3 weekly for latent), partner treatment, newborn management.","question":"Syphilis?","change":"Unchanged (behaviour test).","reference":"Ask what aspect (testing, treatment, pregnancy, congenital) or give a brief overview with an offer to go deeper: RPR/RDT testing, benzathine penicillin 2.4 MU IM (x3 weekly for latent), partner treatment, newborn management.","must_include":["Asks what aspect, or gives a brief overview with an offer to go deeper"],"must_not_include":["Contradicts itself about having regimen information"],"check":"verified","sources":[{"id":"anc-0047","label":"ANC p.24","doc":"Antenatal Care Guidelines","pages":"24","heading":"3.4 Point of care tests","text":"## **3.4 Point of care tests:**\n\nAll point of care tests must be done as stipulated in the contact schedule or in the next contact if it was missed.\n\n### **RPR test for syphilis.**\n\n* Every pregnant woman is tested for syphilis at the first antenatal contact, and retest should be done every 8 weeks. If RPR positive give one (1) dose Benzathine Penicillin 2.4mu IM stat, then weekly x 2 doses. Encourage partner tracing and treatment.\n* If hyper-sensitive to benzathine penicillin, refer to STI guidelines for treatment\n* Take blood for TPHA in the next contact if RPR positive and treated in the previous contact."},{"id":"sti-vh-draft-2026-txt-p74-t0205","label":"STI 2026 draft p.74","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"74","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > Treponemal tests","text":"## Treponemal tests\n\nTreponemal rapid diagnostic test (RDT/Tp), Fluorescent Treponemal Antibody test (FTA), the Treponema pallidum Haemagglutination Assay (TPHA) and the Treponema pallidum particle agglutination (TPPA) assay are specific tests which, if positive, indicate true infection. Once they are positive, they remain positive for life even after successful treatment. Therefore, they cannot be used for monitoring the patient’s response to treatment."}]},{"id":"Q176","area":"STIs and viral hepatitis","document":"Cross-document","topic":"HIV/HBV coinfection","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"Newly diagnosed HIV, HBsAg positive, CD4 450, feels well. When do I start ART, and does the regimen matter?","change":"New question: needs the HIV and STI/viral hepatitis guidelines together.","reference":"Start ART rapidly (within 0-7 days): hepatitis B coinfection is a priority group, and all HBV/HIV coinfected people start treatment regardless of CD4, WHO stage or viral load. The regimen must include tenofovir (TDF), which is active against both viruses (e.g. TLD). Check ALT at baseline (and HBV DNA/HBeAg where available). Never stop or substitute TDF later without reviewing HBV status, because stopping can cause a hepatitis flare.","must_include":["Start ART rapidly regardless of CD4","Regimen must include TDF","Do not stop TDF without reviewing HBV status (flare risk)"],"must_not_include":["Wait until CD4 falls","A regimen without TDF"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p122-t0292","label":"STI 2026 p.122","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"122","heading":"12.0 STI’S In People Living With HIV > Hepatitis B and HIV Co-infection","text":"## Hepatitis B and HIV Co-infection\n\nFor the definition, clinical features, screening priorities and treatment of hepatitis B, see section 7.0 (Hepatitis B and C viral infection). In people living with HIV who are co-infected with hepatitis B virus, WHO recommends that the antiretroviral regimen include tenofovir disoproxil fumarate (TDF), which is active against both viruses; TDF should not be discontinued or substituted without first reviewing HBV status, since stopping TDF in a person with HBV/HIV co-infection can precipitate a hepatitis flare. All patients co-infected with HBV and HIV should start antiviral treatment regardless of CD4 count, WHO clinical stage, or HBV/HIV viral load."},{"id":"hiv-2022-tbl-5.2-baseline-labs","label":"HIV 2022 p.89","doc":"Integrated HIV Management Guidelines 2022","pages":"89","heading":"Chapter 5: Basic Care Package for HIV-Positive Individuals > 5.2 Baseline Laboratory Evaluation of PLHIV > Table 5.2","text":"### Table 5.2 Baseline Laboratory Evaluation Differentiated by Client Category\n\nBaseline laboratory samples should be collected on the same day as the HIV diagnosis although absence of results should not delay ART initiation.\n\n| Population | Baseline Test | Comments |\n| --- | --- | --- |\n| All PLHIV: Mild/ Moderate immunodeficiency | Re-testing for verification<br/>CD4 count<br/>FBC | Required; refer to Chapter 3 on HIV testing services (HTS). |\n| Advanced Immunodeficiency | TBLAM, CrAg, X-pert MTB/RIF, Serum CrAg, CSF CrAg | Refer to Section 6.2 for guidance<br/>If CD4 ≤100 cells/mm³, see Figure 6.3 for the CrAg screening algorithm<br/>• If positive and symptomatic for meningitis, refer the client to the hospital for further investigation<br/>• If positive and asymptomatic, refer to Table 6.19 for fluconazole pre-emptive treatment.<br/>• Reflexive test following CD4 result of ≤100 cells/mm³ |\n| All TB presumptive clients | Lateral flow urine lipoarabinomannan assay (LF TB-LAM) | • LF TB-LAM is an additional diagnostic tool.<br/>• LF TB-LAM is now offered to all symptomatic PLHIV<br/>• If LF TB-LAM is positive, start DS-TB treatment and follow-up sputum results.<br/>See Figure 6.1 for the TB screening algorithm. |\n| All PLHIV | Alanine aminotransferase or aspartate aminotransferase (AST/ALT) | • Required to make management decisions for PLHIV with a positive HBsAg test<br/>• If not available, look for signs of liver disease before ART initiation. |\n| All PLHIV | Creatinine | • Recommended for clients being initiated on TDF.<br/>• If not available, rule out renal dysfunction clinically before ART initiation, especially in clients with hypertension and diabetes, and run creatinine when later available. See Section 7.5 and Section 7.7.4 |\n| All PLHIV | Haemoglobin/full blood count | • Full blood count with platelets and prothrombin time test can also be used in the absence of liver function tests.<br/>• Recommended for clients being initiated on zidovudine (AZT). If not available, perform point-of-care haemoglobin using HemoCue® or clinically assess clients for the presence of anaemia. |\n| All PLHIV | Hepatitis B surface antigen | • Can be done as a rapid point of care test.<br/>• If positive, initiate the client on tenofovir (TDF)-based regimen. |\n| All PLHIV | Pregnancy test | • Recommended for women of childbearing age including adolescent girls. |\n| All PLHIV | Random blood sugar | • Recommended for patients at risk of developing diabetes mellitus and those initiating a DTG and PI-based ART regimen |"},{"id":"hiv-2022-tbl-7.1-art-timing","label":"HIV 2022 p.146","doc":"Integrated HIV Management Guidelines 2022","pages":"146","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.2 When to start ART > Table 7.1 Timing of ART initiation","text":"### Table 7.1 Timing of ART initiation\n\nIndividuals who test positive for HIV and belong to any of these special populations should be urgently assessed for rapid ART initiation: clients with advanced immunodeficiency (CD4 ≤200 cells/mm3 or WHO clinical stage 3 or 4); children under 5 years of age; pregnant and lactating women; clients coinfected with TB; the HIV-positive partner in a sero-different relationship; clients with hepatitis B coinfection; clients with HIV-associated nephropathy.\n\n| Term | Definition (days after HIV diagnosis) |\n| --- | --- |\n| Same day ART initiation | Day 0 |\n| Rapid ART initiation | 0 to 7 days |\n| Early ART initiation | 0 to 14 days |\n| Delayed ART initiation | > 14 days |\n\nDelay ART initiation for clients with: TB meningitis - 4 weeks after starting TB treatment; cryptococcal meningitis - 2-6 weeks after starting antifungal treatment."}]},{"id":"Q012","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Foetal assessment","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the normal foetal heart rate range during antenatal care, and how much may symphysis-fundal height differ from gestational age?","original_reference":"Normal FHR is 110–160 beats/minute (<110 or >160 is abnormal). SFH should correspond to gestational age within ±2 cm.","question":"At a 30-week ANC visit the foetal heart rate is 104 beats/min. Is that normal?","change":"Split a stitched two-part question (FHR + SFH); kept the FHR part as a case.","reference":"No. A normal foetal heart rate is 110-160 beats/minute; below 110 (or above 160) is abnormal, so 104 is abnormal and needs further assessment.","must_include":["Not normal / abnormal","Normal range is 110-160 beats/min"],"must_not_include":["104 is within normal limits","A normal range other than 110-160"],"check":"verified; the ANC guideline gives the range but no specific action for an abnormal FHR","sources":[{"id":"anc-0046","label":"ANC p.24","doc":"Antenatal Care Guidelines","pages":"24","heading":"3.3 Foetal Assessment.","text":"## **3.3 Foetal Assessment.**\n\n* Foetal heart rate (FHR) must be monitored in all pregnant women. A normal FHR is 110 – 160 beats/minute; while an Abnormal FHR <110 b/m and >160 b/m;\n* A symphysis fundal height (SFH) is measured in all pregnant women using a tape measure and the measurement should correspond to the gestational age of the pregnancy with an allowance of 2cm either ways.\n* Enquire about fetal movement from 20 weeks\n* Radiological investigation – **An Ultrasound scan is to be done for every pregnant woman before 24 weeks to identify the following:** gestational age, foetal viability, anomalies (multiple pregnancies, etc.). In case of complications such as antepartum haemorrhage mal-presentations, IUGR, an additional ultrasound may be performed."}]},{"id":"Q013","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Syphilis in pregnancy","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How often should pregnant women be tested for syphilis, and how is an RPR-positive result treated?","original_reference":"Test at the first ANC contact and retest every 8 weeks. If RPR positive, give benzathine penicillin 2.4 MU IM stat, then weekly for 2 more doses; encourage partner tracing and treatment; take blood for TPHA at the next contact. If allergic to penicillin, refer to the STI guidelines.","question":"Pregnant woman at her first ANC contact, RPR positive, no penicillin allergy. How do I treat?","change":"Split a two-part question (testing interval + treatment); kept the treatment part as a case.","reference":"Give benzathine penicillin 2.4 million units IM stat, then weekly for 2 more doses (3 weekly doses in total). Encourage partner tracing and treatment, and take blood for TPHA at the next contact. If she were allergic to benzathine penicillin, refer to the STI guidelines for treatment; the newborn of a mother with a positive syphilis test also needs treatment after delivery.","must_include":["Benzathine penicillin 2.4 million units IM","Weekly, 3 doses in total","Treat / trace the partner","TPHA at the next contact"],"must_not_include":["A single dose of benzathine penicillin only","Doxycycline in pregnancy","Wait for TPHA before treating"],"check":"verified; ANC p.24 ('1 dose stat then weekly x2') and p.43 ('weekly for three weeks') agree on 3 doses","sources":[{"id":"anc-0047","label":"ANC p.24","doc":"Antenatal Care Guidelines","pages":"24","heading":"3.4 Point of care tests","text":"## **3.4 Point of care tests:**\n\nAll point of care tests must be done as stipulated in the contact schedule or in the next contact if it was missed.\n\n### **RPR test for syphilis.**\n\n* Every pregnant woman is tested for syphilis at the first antenatal contact, and retest should be done every 8 weeks. If RPR positive give one (1) dose Benzathine Penicillin 2.4mu IM stat, then weekly x 2 doses. Encourage partner tracing and treatment.\n* If hyper-sensitive to benzathine penicillin, refer to STI guidelines for treatment\n* Take blood for TPHA in the next contact if RPR positive and treated in the previous contact."},{"id":"anc-0102","label":"ANC p.43-44","doc":"Antenatal Care Guidelines","pages":"43-44","heading":"7.3 Syphilis","text":"## **7.3 Syphilis**\n\n* At first contact with pregnant woman, conduct a rapid blood test for syphilis(RPR)\n* Give benzathine penicillin G 2.4 million units intramuscularly once weekly for three consecutive weeks .\n* Once pregnant women have been diagnosed with syphilis ensure that partner get treated.\n\n**Note: Although erythromycin and azithromycin treat the pregnant women they do not cross the placental barrier completely and as a result the foetus is not treated. It is therefore**\n\n**necessary to treat the new born infant soon after delivery . ( Refer to neonatal clinical care guidelines)Syphilis during pregnancy can lead to severe adverse compli cations to the foetus or newborn.**"},{"id":"sti-vh-draft-2026-chart-syphilis-in-pregnancy","label":"STI 2026 draft p.80, Chart 8","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"80","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > 7.1.2 Syphilis in pregnancy > Chart 8","text":"### Syndromic chart for syphilis in pregnancy (chart 8)\n\nPregnant woman at her first antenatal care (ANC) visit → Take history and examine; explain need for syphilis screening; provide HIV testing and counselling and do pre-test counselling for HIV. Then:\n- Any STI(s) present? YES → Treat according to appropriate flow chart.\n- Take blood for: RPR/RDT-Tp; HIV test, after counselling; other routine ANC tests.\n   - RPR/RDT-Tp (syphilis test) positive?\n      - NO → Provide health promotion package to pregnant woman and partner.\n      - YES → Mother: treat with Benzathine Penicillin, 2.4 million units IM weekly x 3 weeks. Offer examination and treatment to partner. Provide health promotion package to pregnant woman and partner. Repeat RPR/RDT-Tp testing after 3 months of treatment.\n        AND treat all newborns of mother with positive RPR/RDT-Tp: Rx: Benzathine Penicillin 50 000 IU/kg IM stat/ Procaine Penicillin G 150 000 IU/kg IM, 12 hourly for 14 days. If allergic Erythromycin 50mg/kg divided doses 6 hourly 30 days.\n   - HIV test positive? YES → Provide post-test counselling; refer to PMTCT, where available. NO → Repeat HIV test every 3 months if any STI present.\n\nHealth promotion package:\n- Educate, ensure compliance, and counsel on treatment.\n- Promote abstinence or condom use during treatment.\n- Promote correct and consistent condom use also provide condoms and lubricants.\n- Issue one notification slip for each sexual partner and emphasize the importance of partner treatment.\n- Offer HIV counselling and testing, as per Integrated HIV Guidelines.\n- Offer voluntary medical male circumcision.\n- Offer pre exposure prophylaxis as per guideline."}]},{"id":"Q014","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Nutrition in pregnancy","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How much weight should a pregnant woman gain if her pre-pregnancy BMI is 27?","original_reference":"7–11.5 kg (overweight, BMI 25–29.9). For reference: underweight 12.5–18 kg, normal 11.5–16 kg, obese 5–9 kg.","question":"Pregnant woman, pre-pregnancy BMI 27. How much weight should she aim to gain?","change":"Shortened; content unchanged.","reference":"7-11.5 kg. A BMI of 27 is in the overweight range (25-29.9), for which the target gestational weight gain is 7-11.5 kg.","must_include":["7-11.5 kg","BMI 27 is overweight (25-29.9)"],"must_not_include":["11.5-16 kg (normal-weight target)","5-9 kg (obese target)","10-12 kg as her target"],"check":"verified","sources":[{"id":"anc-0073","label":"ANC p.32","doc":"Antenatal Care Guidelines","pages":"32","heading":"5.1 Weight gain","text":"## 5.1 Weight gain\n\nObesity during pregnancy increases the odds of spontaneous and recurrent miscarriages, suboptimal ultrasound screening for foetal anomalies, congenital heart and neural tube defects, wound Infections, anaesthesia complications, depression, breastfeeding problems, and many other adverse outcomes.\n\nMost normal gestational weight gain occurs after 20 weeks of gestation. On an average a pregnant mother needs to gain 10-12 kg weight. However, recommended weight gain depends on the woman's pre-pregnant body mass index (BMI). Women who are underweight at the start of pregnancy (BMI < 18.5 kg/m2) should aim to gain 12.5–18 kg. Women who are normal weight at the start of pregnancy (BMI 18.5–24.9 kg/m2) should aim to gain 11.5–16 kg. Overweight women (BMI 25–29.9 kg/m2) should aim to gain 7–11.5 kg. Obese women (BMI > 30 kg/m2) should aim to gain 5–9 kg. Pregnant women are discouraged from engaging in stringent weight reduction diets. Nonetheless, women should be advised on appropriate weight management before pregnancy. If, however they are already obese by the time they get pregnant, nutrition counselling / advice should be provided to ensure optimum weight gain without compromising the maternal and foetal health status."}]},{"id":"Q015","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Micronutrients","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What daily iron, folic acid and calcium supplementation is recommended for all pregnant women?","original_reference":"30–60 mg elemental iron plus 400 µg (0.4 mg) folic acid daily, and calcium 1.5 g daily.","question":"24-year-old at her first ANC visit, healthy, Hb normal. Which daily supplements do I prescribe?","change":"Turned into a case; content unchanged.","reference":"Daily oral iron and folic acid, 30-60 mg elemental iron plus 400 µg (0.4 mg) folic acid (the ANC tablet is 60 mg iron + 400 µg folic acid; give 3 months' supply and refill), and calcium 1.5 g daily. Routine multiple micronutrient supplements (multivitamins, vitamin D, E, B6, zinc, omega 3/6) are not recommended.","must_include":["Iron 30-60 mg elemental daily","Folic acid 400 µg (0.4 mg) daily","Calcium 1.5 g daily"],"must_not_include":["Folic acid 5 mg as the routine dose","Routine multivitamin / multiple micronutrient supplements","Double-dose iron (that is for moderate anaemia)"],"check":"verified","sources":[{"id":"anc-0077","label":"ANC p.34","doc":"Antenatal Care Guidelines","pages":"34","heading":"5.5 Micronutrient supplementation","text":"## 5.5 Micronutrient supplementation\n\nAll pregnant women should take daily oral iron and folic supplementation with 30mg to 60 mg of elemental iron and 400 ug (0.4mg) folic acid to prevent anaemia, puerperal sepsis, low birth weight, and preterm birth.\n\nPregnant women should also receive daily calcium supplements of 1.5gram per day.\n\nEncourage women to increase iron-intake by combining foods that help absorption such as spinach, livers, guavas and oranges with your vegetables.\n\nUse margarine (sparingly) where possible as this is fortified with iron. The expecting mother to be encouraged to eat Folic acid rich foods such as green leafy vegetables, beans, bread and Calcium rich foods such as milk, yoghurt and cheese.\n\n**NB:** The use of multiple micronutrient supplementation including multivitamins, Vitamin D, E, B6, Zinc, omega 3 & 6, etc. is not recommended for routine antenatal care clients."},{"id":"anc-tbl-preventive-measures","label":"ANC p.26","doc":"Antenatal Care Guidelines","pages":"26","heading":"3.0 Providing ANC Services > 3.6 Preventive Measures","text":"### Preventive measures in ANC by risk condition: iron/folate for anaemia (60 mg iron + 400 mcg folic acid daily), calcium 1500 mg for pre-eclampsia, mebendazole 500 mg, malaria, HIV testing and ART, hepatitis B testing\n\n| Risk condition | Assess, check, record | Treat and advise | Scheduled contact |\n| --- | --- | --- | --- |\n| Iron deficiency anaemia | Check the woman's supply of the prescribed dose of iron/folate and whether she is taking them regularly as advised. Ask about diet. | Start iron/folate supplements at the first contact. Give 3 months' supply of daily iron/folate (1 tablet = 60 mg iron + 400 mcg folic acid), to be taken daily by all pregnant women to prevent anaemia. Refill the supply of iron/folate at subsequent contacts.<br/>Counsel on adherence to prevent anaemia.<br/>Counsel on correct and consistent use, management of side effects, and appropriate iron-rich food intake including food preparation. | All scheduled contacts |\n| Pre-eclampsia | All women are at risk of pre-eclampsia. Check the woman's supply of calcium tablets at each contact. | Dispense 1500 mg of elemental calcium. Give 1500 mg to every pregnant woman at risk of developing pre-eclampsia (multiple pregnancy, obesity, family history of pre-eclampsia, diabetes) from 20 weeks until delivery. | All scheduled contacts |\n| Intestinal worms | Check when the woman last received a dose of mebendazole (if within the previous 6 months, wait until 6 months have passed). | Give mebendazole (500 mg) once during the second or third trimester of pregnancy to every woman. | Contact 2 at 20 weeks |\n| Malaria | Check when the last dose of an antimalarial was given. | Counsel on use of bed nets.<br/>Perform RDT if she has malaria symptoms and treat if positive. | All contacts |\n| HIV | Check knowledge of HIV status and partner's status. | Counsel and offer HIV testing to HIV-negative women and those of unknown HIV status. If negative, retest as per schedule; encourage partner HIV testing. If positive and not on treatment, start ART (see National HIV integrated guidelines, PMTCT section).<br/>Provide adherence and psychosocial support; if on ART provide support; encourage and emphasise the use of condoms and encourage VMMC. | All scheduled contacts |\n| Hepatitis B | Check knowledge about hepatitis; history of blood transfusion, jaundice, contact/exposure to hepatitis B. | Test for hepatitis B; if positive, counsel and refer to the next level of care. If negative, counsel and repeat when the next HIV/syphilis screening is done. | 1st contact |"}]},{"id":"Q016","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Antepartum haemorrhage","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How is antepartum haemorrhage defined and classified by severity?","original_reference":"Bleeding from or into the genital tract from 28 weeks until delivery. Spotting; minor (<50 mL, settled); major (50–1000 mL, no shock); massive (>1000 mL and/or signs of shock). Any bleeding in pregnancy should be taken seriously.","question":"Woman at 34 weeks with about 300 mL of vaginal bleeding, pulse normal, no signs of shock. How is this classified and what do I do at the clinic?","change":"Was a definition question; now a case. Kept as a natural two-part question (classification and immediate action).","reference":"This is antepartum haemorrhage (bleeding from 28 weeks until delivery), classed as a major haemorrhage: 50-1000 mL without signs of shock. Shout for help; follow ABC; check vital signs and urgent Hb; insert 2 large IV lines and correct hypovolaemia with normal saline or Ringer's lactate; oxygen 4-6 L/min if available; group and cross-match; and refer to hospital as soon as possible. Do not perform a digital vaginal examination until placenta praevia is ruled out. Treat tachycardia seriously even if she looks stable.","must_include":["Major haemorrhage (50-1000 mL, no shock)","Refer to hospital as soon as possible","2 large-bore IV lines / fluid resuscitation","No digital vaginal examination until placenta praevia is excluded"],"must_not_include":["Minor haemorrhage","Do a digital vaginal examination","Observe and send home"],"check":"verified","sources":[{"id":"anc-0084","label":"ANC p.37","doc":"Antenatal Care Guidelines","pages":"37","heading":"6.3 Antepartum haemorrhage > 6.3.1 Definition","text":"### *6.3.1 Definition*\n\nAntepartum haemorrhage (APH) is bleeding from or into the genital tract, occurring from 28 weeks of pregnancy until before delivery of the baby. **NOTE: ANY BLEEDING IN A PREGNANT WOMAN SHOULD BE TAKEN SERIOUSLY.**\n\nAPH may be classified as:\n* Spotting—staining, streaking, blood spotting on underwear or sanitary pad.\n* Minor hemorrhage—blood loss less than 50 ml that has settled.\n* Major hemorrhage—blood loss of 50-1000 ml with no signs of clinical shock\n* Massive hemorrhage—blood loss greater than 1000 ml and/or signs of clinical shock."},{"id":"anc-tbl-aph-diagnosis","label":"ANC p.38","doc":"Antenatal Care Guidelines","pages":"38","heading":"6.0 Managing Complications of Pregnancy > 6.3 Antepartum Haemorrhage > 6.3.3 Diagnosis of Antepartum Haemorrhage","text":"### Antepartum haemorrhage: abruptio placentae vs placenta praevia vs ruptured uterus – signs and symptoms; general emergency management (ABC, IV lines, no digital vaginal examination, refer)\n\nAPH is bleeding from or into the genital tract from 28 weeks of pregnancy until before delivery of the baby. Any bleeding in a pregnant woman should be taken seriously. Spotting; minor haemorrhage <50 ml that has settled; major haemorrhage 50–1000 ml with no signs of shock; massive haemorrhage >1000 ml and/or signs of clinical shock.\n\n| Probable diagnosis | Signs and symptoms |\n| --- | --- |\n| Abruptio placentae | - Vaginal bleeding<br/>- Intermittent or constant abdominal pain<br/>- Shock<br/>- Tender, tense uterus<br/>- Decreased or absent fetal movement<br/>- Fetal distress or absent fetal heart sounds |\n| Placenta praevia | - Vaginal bleeding (painless, bright red), may be precipitated by intercourse<br/>- Shock<br/>- Relaxed uterus<br/>- Fetal presentation not in the pelvis; malpresentation; lower uterine pole feels empty<br/>- Normal fetal condition |\n| Ruptured uterus | - Vaginal or intra-abdominal bleeding<br/>- Severe abdominal pain (may decrease after rupture)<br/>- Shock<br/>- Abdominal distension or free fluid<br/>- Abnormal uterine contour<br/>- Tender abdomen<br/>- Easily palpable fetal parts<br/>- Absent fetal movement and fetal heart sounds<br/>- Rapid maternal pulse |\n\n**Management (applies to every row):** General management:<br/>Shout for help! (Inyandzaleyo!)<br/>- Follow A, B, C: airway clear, breathing, circulation.<br/>- Assess the haemodynamic status of the patient.<br/>- Vital signs: pulse, blood pressure; do urgent ward Hb.<br/>- NOTE: tachycardia should be taken seriously even in a stable-looking patient; also confusion and restlessness.<br/>- Resuscitate as appropriate: insert 2 large IV lines; correct hypovolaemia using normal saline or Ringer's lactate; strict fluid balance chart, insert Foley's catheter, monitor input and output; if available give oxygen 4–6 L per minute by face mask; blood grouping and cross-match, FBC.<br/>Refer the patient to hospital as soon as possible.<br/>NOTE: DO NOT PERFORM DIGITAL VAGINAL EXAMINATION UNTIL PLACENTA PRAEVIA IS RULED OUT."}]},{"id":"Q017","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"Severe pre-eclampsia","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"At a clinic, a woman at 32 weeks of pregnancy has a BP of 165/112 mmHg and a persistent headache. What should be done before and during transfer?","original_reference":"This is severe pre-eclampsia (SBP ≥160 or DBP ≥110 mmHg, with persistent headache as an additional severe feature). Refer her to the regional referral hospital and, at the clinic/PHU, give a pre-referral loading dose of magnesium sulphate 4 g IM; she is then managed at the hospital as per guidelines. If she convulses: do not leave her alone, shout for help, turn her to the left lateral position, keep the airway clear, protect her from injury, put nothing in her mouth, give oxygen 4–6 L/min by mask, and start an IV line once the convulsion ends.","question":"At the clinic, woman at 32 weeks, BP 165/112 with a persistent headache. What do I do before and during transfer?","change":"Shortened; content unchanged.","reference":"This is severe pre-eclampsia (SBP ≥160 or DBP ≥110 mmHg; persistent headache is a further severe feature). Refer to the regional referral hospital and, at the clinic/PHU, give a pre-referral loading dose of magnesium sulphate 4 g IM; she is then managed at hospital as per guidelines. If she convulses: do not leave her alone, shout for help, left lateral position, keep the airway clear, protect from injury, nothing in the mouth, oxygen 4-6 L/min by mask, and an IV line once the convulsion ends.","must_include":["Severe pre-eclampsia","Pre-referral magnesium sulphate 4 g IM","Urgent referral to the regional referral hospital"],"must_not_include":["Mild pre-eclampsia / manage at the clinic","Send home with antihypertensives","Delay transfer"],"check":"verified as printed (4 g IM). Earlier reviewer note: common regimens use a different IM loading dose; clinician to confirm","sources":[{"id":"anc-tbl-pre-eclampsia","label":"ANC p.39","doc":"Antenatal Care Guidelines","pages":"39","heading":"6.0 Managing Complications of Pregnancy > 6.4 Pre-eclampsia > 6.4.2 Signs and Symptoms","text":"### Pre-eclampsia: mild (BP ≥140/90 twice 4 hours apart) vs severe (BP ≥160/110, proteinuria, headache, blurred vision, epigastric pain, oliguria, thrombocytopenia) – referral and pre-referral magnesium sulphate\n\nPre-eclampsia is new-onset hypertension after 20 weeks' gestation with significant proteinuria, with or without oedema; it can present as late as 4–6 weeks postpartum.\n\n| Category | Signs and symptoms | Management |\n| --- | --- | --- |\n| Mild pre-eclampsia | - BP ≥140/90 on ≥2 occasions measured at least 4 hours apart, without evidence of end-organ damage, in women with previously normal BP before 20 weeks' gestation<br/>OR<br/>- An increase in systolic BP by 30 mmHg or diastolic BP by 15 mmHg | Refer the client to the regional referral hospital (if at the clinic, PHU). At the hospital, manage as per guidelines. |\n| Severe pre-eclampsia: any 1 of the following in the presence of pre-eclampsia | - SBP ≥160 mmHg or DBP ≥110 mmHg<br/>- Proteinuria >5 g in a 24-hour urine collection or 3+ on dipstick<br/>- Pulmonary oedema / cyanosis<br/>- Urine output <30 ml/hr (oliguria)<br/>- Persistent headaches<br/>- Blurred vision<br/>- Epigastric pain ± impaired liver function<br/>- Oligohydramnios<br/>- Decreased fetal growth<br/>- Placental abruption<br/>- Thrombocytopenia | Refer the client to the regional referral hospital (if at the clinic, PHU). Give a pre-referral loading dose of magnesium sulphate 4 g IM if at the clinic or PHU. At the hospital, manage as per guidelines. |"},{"id":"anc-tbl-eclampsia","label":"ANC p.39-40","doc":"Antenatal Care Guidelines","pages":"39-40","heading":"6.0 Managing Complications of Pregnancy > 6.5 Eclampsia > 6.5.2 Risk Factors and Symptoms","text":"### Eclampsia: risk factors, symptoms and emergency management of convulsions (left lateral, airway, oxygen, magnesium sulphate, urgent referral)\n\nEclampsia: seizures that cannot be attributed to other causes in a woman with pre-eclampsia.\n\n| Risk factors | Symptoms | Management |\n| --- | --- | --- |\n| - 1st pregnancy<br/>- Age >40 years<br/>- Overweight (BMI >35 at 1st ANC visit)<br/>- Family history of PIH / pre-eclampsia<br/>- Multiple pregnancy<br/>- Last pregnancy >10 years ago<br/>- Chronic kidney disease<br/>- Diabetes mellitus<br/>- Autoimmune diseases<br/>- Race – black<br/>- Chronic hypertension | - May be asymptomatic<br/>- Headache not relieved by simple analgesia<br/>- Altered mental state<br/>- Blindness<br/>- Shortness of breath<br/>- Blurred vision or flashing<br/>- Epigastric / right upper quadrant abdominal pain<br/>- Rapid swelling of face, hands and feet<br/>- Non-specific complaints of being unwell<br/>- Convulsions | - Urgently refer the patient to the nearest hospital.<br/>- Give a pre-referral loading dose of magnesium sulphate 4 g IM.<br/>- For a patient with convulsions: do not leave the patient alone; shout for assistance, state 'Eclampsia'; turn the patient to the left lateral position; ensure the airway is clear and the patient is breathing; protect the patient from falling/injury; do not place anything in the mouth; oxygen by mask at 4–6 L per minute; when the convulsion ends, start IV; take vital signs.<br/>- At the hospital, stabilise the patient and deliver by the safest, fastest route; manage eclampsia as per guidelines. |"}]},{"id":"Q018","area":"Pregnancy and antenatal care","document":"ANC Guidelines","topic":"ANC schedule","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the minimum number of ANC contacts recommended, and by when should every pregnant woman have an ultrasound?","original_reference":"A minimum of 8 contacts (replacing the 4-visit focused ANC model). An ultrasound should be done for every pregnant woman before 24 weeks.","question":"How many ANC contacts are recommended now, and at what gestational ages?","change":"Kept general (schedule question); split from the ultrasound part.","reference":"At least 8 contacts (the WHO 2016 model, replacing the 4-visit focused ANC): the first in the first trimester (preferably 8-12 weeks), then at 20, 26, 30, 34, 36, 38 and 40 weeks.","must_include":["8 contacts","First contact in the first trimester (8-12 weeks)","20, 26, 30, 34, 36, 38, 40 weeks"],"must_not_include":["4 visits (focused ANC) as the current model"],"check":"verified","sources":[{"id":"anc-tbl-anc-contact-schedule","label":"ANC p.13","doc":"Antenatal Care Guidelines","pages":"13","heading":"2.0 ANC Contact Schedule > 2.1 New Schedule of ANC Contacts","text":"### Eight ANC contacts schedule: 1st contact 8-12 weeks, then 20, 26, 30, 34, 36, 38 and 40 weeks\n\nA new model with eight scheduled contacts is adopted (WHO 2016), replacing focused ANC (4 visits), to reduce perinatal mortality and improve women's experience of care.\n\n| Contact | Recommended schedule |\n| --- | --- |\n| 1st contact | As soon as the woman suspects she is pregnant; during the first trimester (preferably 8–12 weeks) |\n| 2nd scheduled contact | 20 weeks |\n| 3rd scheduled contact | 26 weeks |\n| 4th scheduled contact | 30 weeks |\n| 5th scheduled contact | 34 weeks |\n| 6th scheduled contact | 36 weeks |\n| 7th scheduled contact | 38 weeks |\n| 8th scheduled contact | 40 weeks |"}]},{"id":"Q103","area":"Pregnancy and antenatal care","document":"Cross-document","topic":"Syphilis in pregnancy","type":"cross-document","category":"standard","expected":"answer from multiple sources","safety":"no","original_question":"How often should a pregnant woman with a negative syphilis test be retested?","original_reference":"The ANC guidelines say retest every 8 weeks, while the STI guidelines say repeat after 3 months if the RPR is negative. A good answer cites both and notes the difference. Treatment for a positive test is consistent: benzathine penicillin 2.4 MU IM weekly for 3 doses, and treat the partner.","question":"Pregnant woman at 16 weeks, RPR negative at booking. When should I retest her for syphilis?","change":"Turned into a case; still tests a cross-document difference.","reference":"The documents differ: the ANC guidelines say retest every 8 weeks (aligned with the contact schedule), while the STI guidelines say repeat the RPR after 3 months if negative. A good answer gives both and notes the difference. (If positive at any point: benzathine penicillin 2.4 MU IM weekly for 3 doses and treat the partner.)","must_include":["ANC guidelines: every 8 weeks","STI guidelines: after 3 months","Notes the two documents differ"],"must_not_include":["No retest needed after a negative booking test","Retest every 2 months as for HIV, presented as the syphilis rule without source"],"check":"verified","sources":[{"id":"anc-0047","label":"ANC p.24","doc":"Antenatal Care Guidelines","pages":"24","heading":"3.4 Point of care tests","text":"## **3.4 Point of care tests:**\n\nAll point of care tests must be done as stipulated in the contact schedule or in the next contact if it was missed.\n\n### **RPR test for syphilis.**\n\n* Every pregnant woman is tested for syphilis at the first antenatal contact, and retest should be done every 8 weeks. If RPR positive give one (1) dose Benzathine Penicillin 2.4mu IM stat, then weekly x 2 doses. Encourage partner tracing and treatment.\n* If hyper-sensitive to benzathine penicillin, refer to STI guidelines for treatment\n* Take blood for TPHA in the next contact if RPR positive and treated in the previous contact."},{"id":"sti-vh-draft-2026-txt-p78-t0208","label":"STI 2026 draft p.78-79","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"78-79","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1.2 Syphilis in pregnancy","text":"## 7.1.2 Syphilis in pregnancy\n\nThe clinical symptoms of syphilis are not altered by pregnancy. Since asymptomatic adult syphilis infection is common, all pregnant women should be screened for syphilis. This can reduce the complications of congenital syphilis. A rapid plasma reagent (RPR) test should be routinely done on pregnant mothers at first contact with the health care provider and treatment should be instituted if the RPR result is reactive and the partner should be treated as well. If RPR test is negative repeat after 3 months."},{"id":"anc-0049","label":"ANC p.24-25","doc":"Antenatal Care Guidelines","pages":"24-25","heading":"3.4 Point of care tests","text":"## 3.4 Point of care tests:\n\n### **TB**\n\n* Every pregnant woman should be screened for TB at every contact, if positive, Refer to National TB guidelines.\n\n<hr/>\n\n<sup>12<\/sup> WHO 2016 ANC recommendations\n\n## **Rapid hepatitis B**\n\n- All pregnant women should be screened for viral Hepatitis B during first antenatal contact\n  Rescreening is recommended for negative clients at the same time as rescreening is done for syphilis and HIV (every 8 weeks).\n- If positive, counsel and refer to next level of care to start treatment"}]},{"id":"Q122","area":"Pregnancy and antenatal care","document":"ANC","topic":"Lay language","type":"edge-case","category":"typos-lay-language","expected":"answer-robustly","safety":"yes","original_question":"pregnant lady bleeding down there at 30 weeks, about a cup full, what now","original_reference":"Recognise antepartum haemorrhage; ~a cup (~250 mL) is a major haemorrhage (50–1000 mL). State that any bleeding in pregnancy is serious and needs urgent assessment/referral; note the detailed management pages of the ANC guideline were not ava
