cautions may be warranted**\n\n| Drug | Interaction |\n| --- | --- |\n| Methadone; rifabutin | Clients could require medication dose adjustments to maintain the effectiveness of these medications while they are using CAB-LA. |\n| High-dose aspirin (>325 mg) | Clients using high-dose aspirin in the past week, other nonsteroidal anti-inflammatory drugs for pain, or anticoagulants or other antiplatelets may have a higher likelihood of bruising or bleeding at the injection site and should be made aware and counselled on mitigation strategies, if relevant. |"},{"id":"prep-2025-tbl-product-eligibility","label":"PrEP 2025 p.39","doc":"PrEP Implementation Guidelines 2025","pages":"39","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > Product-specific Eligibility Assessment","text":"### Table 10. Product-specific PrEP eligibility criteria for oral PrEP, PrEP ring, CAB-LA and LEN: follow-up attendance, age ≥16, body weight, pregnancy/breastfeeding, contraindications\n\n| Criterion | Oral PrEP | PrEP ring | CAB-LA | LEN |\n| --- | --- | --- | --- | --- |\n| Able/willing to attend PrEP visits | For all products, clients should be committed to attend scheduled follow-up appointments | (same as left) | (same as left) | (same as left) |\n| Age | ≥16 years\\* | ≥16 years\\* | ≥16 years\\* | ≥16 years\\* |\n| Body weight | ≥30 kg | ≥30 kg | ≥35 kg | ≥35 kg |\n| Pregnancy / breastfeeding | All available PrEP products are safe to use in pregnant or breastfeeding women. | (same as left) | (same as left) | (same as left) |\n| No contraindications for PrEP method | Not using nephrotoxic medication or having known creatinine clearance <60 ml/min | Not using vaginally administered antimicrobial products and no allergies to dapivirine | Not using rifampin, rifapentine, carbamazepine, oxcarbazepine, phenobarbital, phenytoin, and does not have allergy to CAB-LA | No allergy or previous reaction to LEN |\n\n*In case of a mature minor between the age of 12-15 years, oral PrEP can be considered as per the discretion of the healthcare provider."}]},{"id":"Q006","area":"TB and TB/HIV","document":"HIV Guidelines Amendment 2024","topic":"TB/HIV","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How is a person living with HIV diagnosed with TB by urine LF-LAM classified, and what does that mean for their household contacts?","original_reference":"They are classified as bacteriologically confirmed TB (by site as extrapulmonary if there is no Xpert confirmation). Their household contacts are therefore eligible for TPT.","question":"PLHIV diagnosed with TB on urine LF-LAM only, Xpert not confirmed. How do I classify it, and do the household contacts get TPT?","change":"Turned into a case; kept as a natural two-part question (classification and its consequence).","reference":"Classify as bacteriologically confirmed TB (2024 Amendment; it was 'clinically diagnosed' in 2022), and by site as extrapulmonary TB when there is no Xpert confirmation. Because it is bacteriologically confirmed, the household contacts are eligible for TPT.","must_include":["Bacteriologically confirmed TB","Extrapulmonary by site if no Xpert confirmation","Household contacts are eligible for TPT"],"must_not_include":["Classified as clinically diagnosed TB","Household contacts are not eligible for TPT"],"check":"verified","sources":[{"id":"hiv-amendment-2024-0049","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.1 Tuberculosis > 6.1.1 TB Diagnosis","text":"#### **6.1.1 TB DIAGNOSIS**\n\nClients (PLHIV) diagnosed with TB using TB LAM are classified as bacteriologically confirmed cases of TB. House-hold contacts of index cases diagnosed with TB using TB LAM are therefore eligible for TPT.\n\nTB Lam diagnosed TB patients should be classified by site as Extrapulmonary TB, iF there is no Gene Xpert/Xpert ultra MTB/RIF confirmation."},{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"}]},{"id":"Q069","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"TB screening","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What defines a 'presumptive TB' client during systematic screening?","original_reference":"Any one of the four symptoms (cough of any duration, fever, night sweats, unintended weight loss); a positive CAD/AI chest X-ray reading; or CRP >5 mg/L in ART-naive PLHIV over 10 years old. In children under 10, a history of TB contact alone counts even without symptoms.","question":"Adult at OPD with a cough for 4 days, no fever, night sweats or weight loss. Is he presumptive TB?","change":"Was a definition question; now one patient with a single symptom.","reference":"Yes. Any one of the four TB symptoms (cough of any duration, fever, night sweats, unintended weight loss) defines presumptive TB, so a cough of 4 days counts. Investigate with Xpert MTB/RIF Ultra. (Other screening criteria: a positive CAD/AI chest X-ray reading, or CRP >5 mg/L in ART-naive PLHIV over 10 years; in children under 10, TB contact alone.)","must_include":["Yes, presumptive TB","Cough of any duration counts","Any one of the four symptoms is enough"],"must_not_include":["Cough must last 2 weeks or more","Not presumptive without fever or weight loss"],"check":"verified","sources":[{"id":"tb-2025-0082","label":"TB p.42-43","doc":"Integrated TB Management Guidelines 2025","pages":"42-43","heading":"3.2 Screening tools for systematic TB screening > 3.2.1 Standard TB Symptoms Screening Tool","text":"## **3.2.1 Standard TB Symptoms Screening Tool**\n\nThe standard TB symptom screening tools include screening with the four clinical signs and symptoms of TB and are structured into two sections: one detailing the signs and symptoms in adults, and the other focusing on children under 10 years of age. The following are the four classical symptoms of TB that are applied in systematic TB screening.\n- Cough of any duration\n- Fever\n- Night sweats\n- Unintended weight loss\n\nThe presence of at least 1 sign/symptom is defined as presumptive TB. In children younger than 10 years old, having a TB contact history alone regardless of signs and symptoms is defined as presumptive TB (see Figure 8 below for the TB symptoms screening tool)."},{"id":"tb-2025-0085","label":"TB p.44","doc":"Integrated TB Management Guidelines 2025","pages":"44","heading":"3.2 Screening tools for systematic TB screening > Tuberculosis Case Finding > Figure 9: An example of a CAD/AI reading result","text":"## **Figure 9: An example of a CAD/AI reading result**\n\nimage: Chest X-ray comparison showing a normal radiograph and a radiograph with a heatmap overlay and AI score report\n\n### **3.2.3 C-Reactive Protein**\n\nC-Reactive Protein (CRP) is an indicator of systemic inflammation that can be measured with a blood test. It is recommended for ART-naïve PLHIV above 10 years old. Results above the cut-off value of > 5 mg/L is defined as presumptive TB. CRP should be used in conjunction with a national TB screening algorithm."}]},{"id":"Q070","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"TB diagnosis","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the initial diagnostic test for presumptive TB in Eswatini, and when should urine LF-LAM be added?","original_reference":"Xpert MTB/RIF Ultra for everyone with presumptive TB. Add LF-LAM for PLHIV with advanced HIV disease (CD4 <200 or WHO stage 3/4) regardless of symptoms, for PLHIV with presumptive TB regardless of CD4, and for seriously ill PLHIV. After confirmation, reflex Xpert MTB/XDR plus culture and phenotypic DST.","question":"PLHIV with CD4 of 150 and no TB symptoms. Which TB tests should I do?","change":"Was 'initial test and when to add LF-LAM'; now one patient where LF-LAM is indicated without symptoms.","reference":"Do a urine LF-LAM: it is indicated for PLHIV with advanced HIV disease (CD4 <200 or WHO stage 3/4) regardless of TB symptoms. If LF-LAM is positive, start TB treatment and also send Xpert MTB/RIF Ultra; if negative, apply the advanced HIV disease package and give TPT if eligible. (Xpert Ultra is the initial test for anyone with presumptive TB.)","must_include":["Urine LF-LAM","Indicated because CD4 <200 (AHD), even without symptoms","Xpert Ultra if LAM positive / presumptive TB"],"must_not_include":["No TB testing needed without symptoms","LF-LAM only if CD4 <100"],"check":"verified","sources":[{"id":"tb-2025-0148","label":"TB p.66","doc":"Integrated TB Management Guidelines 2025","pages":"66","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.1 Approach to TB Diagnosis > 4.1.1 WHO recommended TB diagnostic test > 4.1.1.1 The initial microbiological diagnostic tests for all persons with presumptive tuberculosis in Eswatini should include","text":"### 4.1.1.1 The initial microbiological diagnostic tests for all persons with presumptive tuberculosis in **Eswatini** should include:\n\nXpert MTB/RIF® Ultra testing (preferred diagnostic test for all presumptive case of TB). LF- LAM for PLHIV with advanced HIV disease (i.e. CD4<200 or WHO clinical stage 3 or 4) regardless of TB signs and symptoms, presumptive TB regardless of CD4 or seriously ill regardless of CD4 count"},{"id":"tb-2025-fig-plhiv-evaluation","label":"TB p.77, Figure 18","doc":"Integrated TB Management Guidelines 2025","pages":"77","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.3.4 Use of LF-LAM for TB Diagnosis in PLHIV > Figure 18: Algorithm to Evaluate for TB Among PLHIV","text":"### Figure 18. Algorithm to evaluate for TB among PLHIV: TB symptoms/CXR/CRP, seriously ill, advanced HIV disease (AHD), urine LF-LAM and Xpert, start TB treatment, AHD package, TPT\n\nAssess: TB signs and symptoms†; whether seriously ill*; advanced HIV disease (AHD)**; perform CD4 testing (if eligible); perform CXR/CRP screening if eligible and available†.\n- Positive for TB symptoms and/or CXR/CRP positive for possible TB (regardless of CD4 / AHD status) → perform Xpert MTB/RIF Ultra and urine LAM (if not yet done).\n- AHD (regardless of TB symptoms) or seriously ill → perform urine LAM: LAM positive → perform Xpert and urine LAM (if not yet done); LAM negative → apply the AHD package of care.\n- No TB symptoms, CXR/CRP negative, CD4 >200 or unknown → clinical management; provide TPT if eligible.\nResults of Xpert and LAM: both negative → clinical management, provide TPT if eligible; Xpert AND/OR LAM positive → start TB treatment and perform work-up to exclude DR-TB (collect a specimen for phenotypic and genotypic DST).\n† Refer to the national TB guidelines and SOP for TB screening. * Seriously ill: at least one of respiratory rate >30/min, heart rate >120/min, temperature >39°C, or unable to walk unaided. ** AHD: CD4 <200 cells or WHO clinical stage 3 or 4; for children <5 years and have not been on treatment for at least 12 months (as printed). @ CRP >5 mg/L is defined as possible/presumptive TB."},{"id":"tb-2025-0164","label":"TB p.72","doc":"Integrated TB Management Guidelines 2025","pages":"72","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.3 Microbiological diagnosis of TB and DR-TB","text":"Figure 16: TB and DR-TB diagnostic and treatment decision algorithm\n\nPresumptive TB (symptoms and/or CXR suggestive of TB) -> collect 2 specimens -> Xpert MTB/RIF Ultra (and urine LAM for PLHIV with CD4 <200 regardless of TB signs/symptoms, presumptive TB regardless of CD4, or seriously ill@ regardless of CD4 count). For PLHIV, start treatment if urine LAM is positive even when the Xpert test is negative; when the Xpert result is received, follow the algorithm.\nXpert result:\n- MTB detected, RR detected*: start DR-TB treatment with the short all-oral regimen according to national guidelines -> test with SLPA/Xpert XDR, C&DST and NGS -> adapt the regimen if required according to the DST result.\n- MTB detected**, RR not detected: start first-line drugs (FLD) -> test the 2nd sample with Xpert XDR/FLPA and pDST -> perform NGS for Hr/PDR-TB and adapt the regimen according to the DST result.\n- Error / invalid / no result / RIF indeterminate: repeat the Xpert test*** and follow the same algorithm.\n- MTB not detected: re-evaluate the clinical condition# -> clinically diagnosed TB: start treatment and send for C&DST, adapt the regimen if required according to the DST result; not diagnosed as TB: manage for other diseases, start TPT if eligible.\n(Footnotes for **, ***, @ and # follow in the next chunk: trace results, indeterminate RR, seriously ill adult/child, clinical evaluation.)"}]},{"id":"Q071","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"Xpert trace results","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"An HIV-negative adult with no previous TB has an Xpert Ultra result of 'MTB trace detected'. How should it be interpreted?","original_reference":"In HIV-negative adults/adolescents ≥15 with pulmonary samples, repeat Ultra on a fresh (early morning) sample and use the second result; a second trace result is sufficient to diagnose pulmonary TB (unless there is recent previous TB). In PLHIV, children <15 and extrapulmonary samples, trace is treated as a true positive.","question":"HIV-negative adult with no previous TB has an Xpert Ultra result 'MTB trace detected' on sputum. What do I do?","change":"Shortened; reference rewritten because the guideline's text and algorithm disagree for this group.","reference":"The guideline is internally inconsistent here. Its text (4.3.1) says that in HIV-negative persons an initial trace result should be repeated on a fresh specimen and the second Ultra result used for decisions (a second trace is enough to diagnose pulmonary TB unless there is recent previous TB). Its Figure 17 algorithm puts HIV-negative patients with no previous TB in the 'treat' branch, and limits repeat testing to those with previous TB. In all cases send culture and DST (Xpert XDR, pDST) to check rifampicin resistance.","must_include":["States the guideline's handling of trace results for this patient","Additional testing for rifampicin resistance"],"must_not_include":["Trace detected always means no TB","Ignore the result"],"check":"CONFLICT in source: text says repeat on a fresh specimen for all HIV-negative persons; Figure 17 says treat HIV-negative patients without previous TB. Clinician to decide the expected answer","sources":[{"id":"tb-2025-0168","label":"TB p.74, text 4.3.1","doc":"Integrated TB Management Guidelines 2025","pages":"74","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.3 Microbiological diagnosis of TB and DR-TB > 4.3.1 Interpretation of “trace calls”","text":"## **4.3.1 Interpretation of “trace calls”**\n\nAmong persons with HIV, children (≤ 15) and extra pulmonary specimens, “trace calls” should be interpreted as true positive results for use in clinical decisions and patient follow-up.\n\nAmong HIV negative persons, with an initial “trace call” positive result, a fresh specimen from the patient should undergo repeat testing and the result of the second Ultra test be used for clinical decisions and patient follow-up rifampicin resistance.\n\nWhile clinical and available radiological information should always be considered in the diagnosis of tuberculosis, a second “trace call” positive is sufficient to make a diagnosis of pulmonary TB unless there is a recent history of TB.\n\nAmong all persons that test “trace call” positive additional investigations are needed to confirm or exclude resistance to rifampicin. Figure 17 below shows the interpretation of trace results."},{"id":"tb-2025-0169","label":"TB p.74, Figure 17","doc":"Integrated TB Management Guidelines 2025","pages":"74","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.3 Microbiological diagnosis of TB and DR-TB > 4.3.1 Interpretation of “trace calls”","text":"Figure 17: Interpretation of trace result from the Xpert MTB/RIF (Ultra) test\n\nMTB trace detected:\n- Previous history of TB, HIV negative, adolescents and adults ≥15 years, pulmonary TB -> repeat (with an early morning sample):\n  - MTB+ or trace -> treat.\n  - MTB- -> clinical assessment: suggestive of TB -> treat; not TB -> evaluate for other morbidity.\n- No previous history of TB (HIV negative), PLHIV, children <15 years, EPTB -> treat.\nAfter treatment starts: culture and DST (Xpert XDR, pDST, tNGS) -> clinical assessment / adjust treatment based on the DST results.\n(Acronyms: PTB pulmonary TB; EPTB extra-pulmonary TB; MTB+ TB positive; MTB- TB negative; DST drug susceptibility test.)"}]},{"id":"Q072","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"DS-TB treatment","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What is the standard regimen and number of RHZE tablets for a new adult TB patient weighing 60 kg?","original_reference":"2RHZE/4RH (6 months). At 55–70 kg: 4 tablets daily of RHZE 150/75/400/275 mg for 2 months, then 4 tablets of RH 150/75 mg for 4 months. Add pyridoxine 25–50 mg daily. TB meningitis and bone/joint TB: 9–12 months total.","question":"New adult TB patient, 60 kg, drug-susceptible pulmonary TB. Regimen and number of tablets?","change":"Added 'drug-susceptible pulmonary' so the 6-month regimen clearly applies.","reference":"2RHZE/4RH. At 55-70 kg: 4 tablets daily of RHZE 150/75/400/275 mg for the 2-month intensive phase, then 4 tablets daily of RH 150/75 mg for the 4-month continuation phase. Give pyridoxine with isoniazid to prevent peripheral neuropathy.","must_include":["2RHZE / 4RH (6 months)","4 tablets daily (55-70 kg band) in both phases","Pyridoxine with isoniazid"],"must_not_include":["5 tablets (that is the >70 kg band)","3 tablets","9-12 months for uncomplicated pulmonary TB"],"check":"corrected: removed the adult pyridoxine dose (25-50 mg) from the original reference — no adult dose is given in the TB guideline (only 2.5 mg/kg for children)","sources":[{"id":"tb-2025-tbl-p99-0236","label":"TB p.99, Table 14","doc":"Integrated TB Management Guidelines 2025","pages":"99","heading":"6.4 Standard TB treatment regimens for adults > Table 14: Recommended treatment regimen and dosages for adult cases of new and re-registered cases","text":"### Table 14: Recommended treatment regimen and dosages for adult cases of new and re-registered cases (Phase of treatment, Drugs, Weight in Kg<br/>25-34.9, Weight in Kg<br/>35-54.9, Weight in Kg<br/>55-70, Weight in Kg<br/>>70)\n\n| Phase of treatment | Drugs | Weight in kg 25-34.9 | Weight in kg 35-54.9 | Weight in kg 55-70 | Weight in kg >70 |\n| --- | --- | --- | --- | --- | --- |\n| Intensive phase of 2 months | (RHZE) 150 mg/75 mg/400 mg/275 mg | 2 tabs | 3 tabs | 4 tabs | 5 tabs |\n| Continuation phase of 4 months | (RH) 150 mg/75 mg | 2 tabs | 3 tabs | 4 tabs | 5 tabs |\n| For severe extrapulmonary TB (TB meningitis and bone & joint TB): total treatment duration is 9-12 months, with 2 months of RHZE and 7-10 months of RH depending on the response to treatment. For TB meningitis, refer to section 6.7 for further details. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Vitamin B6 for peripheral neuropathy prophylaxis: 25-50 mg (25 mg tablets) | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |"},{"id":"tb-2025-tbl-p98-0233","label":"TB p.98, Table 13","doc":"Integrated TB Management Guidelines 2025","pages":"98","heading":"6.4 Standard TB treatment regimens for adults > Table 13: Summary of DS-TB treatment regimens for adult TB cases","text":"### Table 13: Summary of DS-TB treatment regimens for adult TB cases (TB Registration, TB Patients, Treatment Regimens)\n\n| TB registration | TB patients | Treatment regimens Intensive phase (daily) | Treatment regimens Continuation phase (daily) |\n| --- | --- | --- | --- |\n| New episode | All new cases of TB, regardless of site (except severe EP-TB\\*), type or severity of disease. | 2RHZE | 4RH |\n| Re-registered | Previously treated cases with the outcome of cure, completed or LTFU (in the previous treatment episode). | 2RHZE | 4RH |\n| Re-registered | Previously treated case with the outcome of 'failure' (in the previous treatment episode) | Repeat GeneXpert and first-line DST, then refer for DR-TB treatment. | (same as left) |\n| All patients should receive pyridoxine with isoniazid to prevent peripheral neuropathy. | (same as left) | (same as left) | (same as left) |"}]},{"id":"Q073","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"Treatment monitoring","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"When should sputum be checked during drug-susceptible pulmonary TB treatment, and can Xpert be used to monitor response?","original_reference":"Sputum smear at the end of month 2, month 5 and the end of treatment (month 6), 2 samples each time. Xpert should NOT be used to monitor treatment (it detects dead bacilli), and routine chest X-ray monitoring is not recommended.","question":"In drug-susceptible pulmonary TB, when are follow-up sputum smears done, and can Xpert be used to monitor response?","change":"Kept general; natural two-part question.","reference":"Send a sputum smear (2 samples, 'spot, spot' or 'spot, early morning') at the end of month 2, and again at the end of month 5 and the end of treatment (month 6). Do not use Xpert MTB/RIF to monitor treatment response; routine chest X-ray monitoring is also not recommended.","must_include":["Sputum smear microscopy","2 samples","End of month 2, month 5 and month 6","Xpert should NOT be used to monitor treatment"],"must_not_include":["Repeat Xpert to monitor response","Chest X-ray to monitor response"],"check":"verified","sources":[{"id":"tb-2025-0261","label":"TB p.108","doc":"Integrated TB Management Guidelines 2025","pages":"108","heading":"6.8 Monitoring Tuberculosis Treatment > 6.8.5 Bacteriological Monitoring","text":"## **6.8.5 Bacteriological Monitoring**\n\nPatients with bacteriologically confirmed PTB should be monitored by a sputum smear examination. These are usually adults and sometimes older children.\n\n* Xpert MTB/RIF® testing should NOT be used to monitor treatment response.\n* Routine monitoring of treatment response by CXR is also not recommended.\n* Serial sputum smear examinations should be performed at the recommended intervals (see Table 17) to verify the effectiveness of the treatment in killing the bacilli.\n* Two sputum samples should be obtained from the patient for examination at the end of the second and fifth month and the end of treatment for all bacteriologically confirmed PTB patients.\n* The samples should be collected as “spot, spot” or “spot, early morning samples”.\n* Sputum specimens should be collected without interrupting treatment and transported to the laboratory as soon as possible thereafter.\n* In the event of an unavoidable delay, specimens should be refrigerated or kept in as cool a place as possible."},{"id":"tb-2025-tbl-p108-0262","label":"TB p.108, Table 17","doc":"Integrated TB Management Guidelines 2025","pages":"108","heading":"6.8 Monitoring Tuberculosis Treatment > 6.8.5 Bacteriological Monitoring > Table 17: Recommended Schedule for follow-up sputum examinations for PTB patients","text":"### Table 17: Recommended Schedule for follow-up sputum examinations for PTB patients (When to monitor, Regimen for New TB cases<br/>6-month treatment regimen, Regimen for Previously treated<br/>Cases (6-month Regimen))\n\nTable 17: Recommended Schedule for follow-up sputum examinations for PTB patients Source: Treatment of tuberculosis guidelines. WHO (2018)\n\n| When to monitor | Regimen for New TB cases 6-month treatment regimen | Regimen for Previously treated Cases (6-month Regimen) |\n| --- | --- | --- |\n| At the time of diagnosis | Xpert MTB/RIF® ULTRA test Culture & DST | Xpert MTB/RIF® ULTRA test Culture & DST |\n| At the end of the initial phase | Sputum smear (end month 2) | Sputum smear (end month 2) |\n| In continuation phase | Sputum smear (end month 5) | Sputum smear (end month 5) |\n| During the last month of treatment | Sputum smear (end month 6) | Sputum smear (end month 6) |\n\nSource: Treatment of tuberculosis guidelines. WHO (2018)."}]},{"id":"Q074","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"Treatment outcomes","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How do the TB guidelines define 'treatment failure' and 'loss to follow-up'?","original_reference":"Failure: culture positive at month 2 or smear positive at month 5 or later; clinically diagnosed/EPTB patients not improving or worsening; or drug-resistant strain found during treatment (excluding baseline). Loss to follow-up: treatment interrupted for 2 or more consecutive months.","question":"Adult on drug-susceptible TB treatment is still smear positive at month 5. What is the treatment outcome and what do I do?","change":"Was a definition question (failure and LTFU); now one patient who meets the failure definition.","reference":"Treatment failure: sputum smear positive at 5 months or later (or culture positive at 2 months). Assess adherence and clinical condition, check baseline DST to rule out drug resistance, repeat Xpert Ultra and/or Xpert MTB/XDR, and send a sample for sequencing, culture and phenotypic DST; manage as DR-TB if resistance is found. (A previously treated 'failure' case is re-registered and referred for DR-TB treatment.)","must_include":["Treatment failure","Smear positive at month 5 or later","Check for drug resistance (Xpert XDR, culture/DST, sequencing)","Assess adherence"],"must_not_include":["Extend the continuation phase without testing","Classify as treatment completed"],"check":"verified","sources":[{"id":"tb-2025-tbl-p111-0271","label":"TB p.111, Table 19","doc":"Integrated TB Management Guidelines 2025","pages":"111","heading":"6.10 Treatment outcomes > Table 19: Definition of TB treatment outcomes","text":"### Table 19: Definition of TB treatment outcomes (Outcome, Definition)\n\nTable 19: Definition of TB treatment outcomes\n\n| Outcome | Definition |\n| --- | --- |\n| Cured | A bacteriologically confirmed case, who is smear or culture-negative in the last month of treatment and on at least one previous occasion (at least 7 days apart)a |\n| Treatment completed | A patient who completed treatment but who does not have a negative sputum smear or culture result in the last month of treatment and in at least one previous occasionb |\n| Treatment Failure | ● A patient whose sputum culture is positive at 2 months, or smear is positive at 5 months or later during treatment.<br/>● Clinically diagnosed PTB or extra-pulmonary TB patients with clinical condition not improving or worsening (clinically judged)<br/>● Patients found to harbour a DR strain at any time during the treatment (excluding baseline sample) |\n| Died | A patient who dies for any reason during the course of treatment |\n| Loss to follow-up | A patient whose treatment was interrupted for 2 or more consecutive months |\n| Not evaluated | Patient for whom no treatment outcome is assigned; Include former “transfer-out” in this category |\n| Treatment successc | The sum of cured and completed treatment |\n| (a) These definitions apply to bacteriologically confirmed and clinically diagnosed pulmonary TB patients, and patients with extra-pulmonary disease. (b) The sputum examination may not have been done, or the results may not be available (c) For all patients, bacteriologically confirmed and clinically diagnosed pulmonary TB patients, and extra-pulmonary TB patients. |  |"},{"id":"tb-2025-0171","label":"TB p.75-76","doc":"Integrated TB Management Guidelines 2025","pages":"75-76","heading":"Chapter 4: TB and Drug-Resistant TB Diagnosis > 4.3 Microbiological diagnosis of TB and DR-TB > 4.3.3 Repeating TB diagnostic tests during treatment for people on DS-TB treatment","text":"# 4.3.3 **Repeating TB diagnostic tests during treatment for people on DS-TB treatment**\n\nFor individuals who are on TB treatment and fail to convert at the end of two months:\n- Assess treatment adherence of patient\n- Assess clinical condition\n- Follow up on baseline DST results to rule out drug resistance\n- Consider repeating Xpert MTB/Rif Ultra and/or Xpert MTB/XDR Assay (specify the reason for the Xpert repeat on the lab request form)\n- Send a second sample for sequencing, culture and phenotypic DST if no baseline results are available\n- Decision to either continue with DS-TB treatment, assign a failure outcome or change to DR-TB is dependent on the adherence status of the patient, clinical condition, and the baseline/or repeated DST results.\n\nFor individuals who are smear-positive at 5 months of treatment.\n- Assess treatment adherence of patient\n- Assess clinical condition\n- Consider repeating Xpert ultra and/or XDR Assay (specify the reason for the Xpert repeat on the lab request form)\n- Send a second sample for sequencing, culture and phenotypic DST if no baseline results are available\n- Assign a treatment failure outcome and refer the patient to a DR-TB treatment site\n- The result of Xpert ultra, XDR-assay, sequencing, culture and phenotypic DST will assist in regimen choice for DR-TB treatment\n\n**Note:** Xpert MTB/RIF and MTB/XDR should not be used as follow-up test for monitoring response to TB treatment"},{"id":"tb-2025-tbl-p98-0233","label":"TB p.98","doc":"Integrated TB Management Guidelines 2025","pages":"98","heading":"6.4 Standard TB treatment regimens for adults > Table 13: Summary of DS-TB treatment regimens for adult TB cases","text":"### Table 13: Summary of DS-TB treatment regimens for adult TB cases (TB Registration, TB Patients, Treatment Regimens)\n\n| TB registration | TB patients | Treatment regimens Intensive phase (daily) | Treatment regimens Continuation phase (daily) |\n| --- | --- | --- | --- |\n| New episode | All new cases of TB, regardless of site (except severe EP-TB\\*), type or severity of disease. | 2RHZE | 4RH |\n| Re-registered | Previously treated cases with the outcome of cure, completed or LTFU (in the previous treatment episode). | 2RHZE | 4RH |\n| Re-registered | Previously treated case with the outcome of 'failure' (in the previous treatment episode) | Repeat GeneXpert and first-line DST, then refer for DR-TB treatment. | (same as left) |\n| All patients should receive pyridoxine with isoniazid to prevent peripheral neuropathy. | (same as left) | (same as left) | (same as left) |"}]},{"id":"Q075","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"Paediatric TB","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which children can receive the shortened 4-month TB regimen?","original_reference":"Children aged 3 months to under 16 years with non-severe TB (e.g. intrathoracic lymph node TB without airway obstruction, disease confined to one lobe without cavities/miliary pattern, uncomplicated pleural effusion, or isolated peripheral lymphadenopathy; Xpert negative/trace/very low/low; not needing hospitalisation) and no TB treatment in the past 2 years: 2HRZ(E)/2HR. Severe TB or severe malnutrition gets 6 months; TB meningitis/osteoarticular 9–12 months.","question":"5-year-old with pulmonary TB confined to one lobe, no cavities, Xpert 'trace', mild symptoms, not needing admission, no TB treatment before. Which regimen?","change":"Was 'which children can receive the 4-month regimen'; now one child meeting the criteria.","reference":"The 4-month regimen: 2HRZ(E)/2HR. Children aged 3 months to under 16 years with non-severe TB (disease confined to one lobe without cavities or miliary pattern, Xpert negative/trace/very low/low, mild symptoms not needing hospitalisation) and no TB treatment in the past 2 years get 2 months of HRZ(E) then 2 months of HR. Severe TB or severe malnutrition gets 6 months (2HRZE/4HR).","must_include":["4-month regimen","2HRZ(E)/2HR","Non-severe criteria are met"],"must_not_include":["6-month 2HRZE/4HR for this child","9-12 months"],"check":"verified","sources":[{"id":"tb-2025-0367","label":"TB p.147","doc":"Integrated TB Management Guidelines 2025","pages":"147","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.4 Treatment of TB disease in children > 8.4.1 Treatment of drug-susceptible TB in children > 8.4.1.1 Recommended anti-TB Treatment Regimens for Children","text":"## 8.4.1.1 **Recommended anti-TB Treatment Regimens for Children**\n\n- All children with a severe form of TB should receive a 6-month treatment course of TB treatment; four-drug regimens (RHZE) in the initial phase for 2 months followed by two (HR) drug regimens for the continuation phase for 4 months (2RHZE/4RH). Children with malnutrition (i.e. MUAC <11.5 cm or weight for height Z score -3 are to be treated with a 6-month regimen.\n- Children (3 months- less than 16 years) with a non-severe form of TB should receive a 4-month TB treatment course: 2 months of (RHZE) followed by 2 months of RH drug regimen (2RHZ(E)/2RH) if they have no TB treatment history in the past two years.\n- For severe forms of extrapulmonary TB such as TB meningitis and osteo-articular TB treatment duration is 9-12 months. See Table 26 for the summary of the TB treatment regimen for children and adolescents.\n- The treatment duration and dosing for new episodes and re-registered TB treatment are the same.\n- Treatment of TB in CALHIV is the same as for non-CALHIV.\n- For DR-TB treatment, refer to the DR-TB treatment Chapter 7."},{"id":"tb-2025-0370","label":"TB p.148-149","doc":"Integrated TB Management Guidelines 2025","pages":"148-149","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.4.1.2 Assessing Severity of TB Disease in Children","text":"### **8.4.1.2 Assessing the severity of TB disease in children and adolescents (3 months-<16 years old)**\n\n* If CXR and microbiological test results are available, meeting all the following criteria is defined as a non-severe form of TB.\n    - CXR findings are consistent with non-severe TB (CXR should ideally be done at baseline, but it can be performed at any point during the treatment course):\n        - Intrathoracic lymph node TB without significant airway obstruction; or\n        - PTB confined to one lobe with no cavities and no military pattern: or\n        - Uncomplicated pleural effusion (without pneumothorax or empyema)\n    - Negative TB, trace, very low or low using Xpert MTB/RIF Ultra, or sputum smear-negative\n    - The child or adolescent has mild TB symptoms that do not require hospitalization.\n\n* If only a microbiological test result is available and no CXR result, meeting all 3 criteria below is defined as a non-severe form of TB.\n    - Negative TB, trace, very low or low using Xpert MTB/RIF Ultra, or sputum smear-negative\n    - Mild TB symptoms that do not require hospitalization\n    - Complete resolution of TB signs and symptoms within 1 month of treatment initiation, completely well and normal nutrition status at 4 months of treatment\n\n✓ If both microbiological test and CXR results are not available, meeting one of the following two criteria is defined as a non-severe form of TB.\n- Isolated extra-pulmonary (i.e. peripheral) lymph node without involvement of extra-pulmonary site\n- Mild TB symptoms that do not require hospitalization OR\n- The child has a clinical diagnosis of pulmonary TB AND the child has mild symptoms that do not require hospitalization"},{"id":"tb-2025-tbl-p148-0368","label":"TB p.148, Table 34","doc":"Integrated TB Management Guidelines 2025","pages":"148","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.4 Treatment of TB disease in children > Table 34: DS-TB treatment algorithm in Children and Adolescents (0-19 years old)","text":"### Table 34: DS-TB treatment algorithm in Children and Adolescents (0-19 years old)\n\nAssess the site of TB disease*.\nA. Pulmonary TB (PTB), both new and re-registered – what is the child's age?\n   - <3 months: 2HRZE/4HR\n   - 3 months to <16 years: assess severity\n       - Non-severe: 2HRZE/2HR\n       - Severe: 2HRZE/4HR\n   - 16-19 years: 2HRZE/4HR\nB. Extra-pulmonary TB (EP-TB), both new and re-registered – what is the child's age?\n   - <3 months: 2HRZE/4HR\n   - 3 months to 19 years: assess severity\n       - Non-severe (isolated peripheral lymphadenopathy): 2HRZE/2HR\n       - Severe, bone & joint TB (incl. spine): 2HRZE/10HR\n       - Severe, TB meningitis: 6HRZ+Eto or 2HRZE/10HR\n       - Severe, all other forms of EP-TB: 2HRZE/4HR\n\n*If a child has both PTB and EP-TB severe form, treat with the regimen for the EP-TB severe form. Adjuvant steroid therapy: administer steroids for TB Meningitis, also for pericardial, spinal (sometimes), airway obstruction and TB-IRIS."}]},{"id":"Q076","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"TB/HIV - ART timing","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"When should ART be started in a newly diagnosed HIV-positive patient who has just started TB treatment, and what is different for TB meningitis?","original_reference":"As soon as possible, preferably within 2 weeks of starting TB treatment (same-day possible if clinically stable), regardless of CD4. For TB meningitis, delay ART until 4 weeks after starting TB treatment. If on TB treatment with rifampicin, DTG is increased to 50 mg twice daily.","question":"Newly diagnosed HIV, started treatment for pulmonary TB 5 days ago. When do I start ART, and which regimen?","change":"Was two-part (timing + TB meningitis difference); dropped the meningitis part and asked for the regimen instead.","reference":"Start ART as soon as possible, preferably within 2 weeks of starting TB treatment (same day if clinically stable), regardless of CD4. Use TDF 300 mg/3TC 300 mg once daily plus DTG 50 mg twice daily (because of rifampicin), returning to DTG 50 mg once daily two weeks after TB treatment is completed.","must_include":["As soon as possible, within 2 weeks of starting TB treatment","Regardless of CD4","TDF/3TC + DTG 50 mg twice daily","Back to once daily 2 weeks after TB treatment ends"],"must_not_include":["Wait 8 weeks","DTG 50 mg once daily with rifampicin","Wait until TB treatment is finished"],"check":"verified","sources":[{"id":"tb-2025-tbl-p194-0492","label":"TB p.194, Table 45","doc":"Integrated TB Management Guidelines 2025","pages":"194","heading":"10.1 TB/HIV interaction and the comprehensive package of care > 10.1.5 When to start ART? > Table 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB","text":"### Table 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB (Patient Category, When to start ART)\n\nTable 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB\n\n| Patient Category | When to start ART |\n| --- | --- |\n| Among PLHIV who are presumptive for TB | Initiate ART while rapidly investigating for TB, with close follow-up within seven days to initiate TB treatment if TB is confirmed |\n| Among PLHIV on ART and diagnosed with TB | Continue ART and initiate anti-TB treatment as soon as diagnosed, may need to adjust ART regimen/dosage if required |\n| For newly diagnosed PLHIV/returnees who also have been diagnosed with TB | Initiate ART as soon as possible preferably within 2 weeks of initiating tuberculosis treatment (including same-day anti-TB and ART treatment if clinically stable) regardless of immune status |\n| Patients with TB meningitis | Delay ART to 4 weeks post-initiation of anti-TB treatment |"},{"id":"tb-2025-tbl-p194-0493","label":"TB p.194-195, Table 46","doc":"Integrated TB Management Guidelines 2025","pages":"194-195","heading":"10.1 TB/HIV interaction and the comprehensive package of care > 10.1.6 What ART regimen to start on? > Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients","text":"### Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients (Client Category, Recommended ART regimen, Comments)\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| Clients already on TB treatment presenting for ART initiation | TDF (300 mg)/3TC (300 mg) once daily + DTG (50 mg twice daily) | - Start ART as soon as possible with increased DTG dosing of 50 mg twice daily<br/>- Return to standard DTG dosing 50 mg once daily two weeks after the completion of TB treatment |\n| Clients developing TB while on a DTG-based ART regimen | Increase DTG dose to 50 mg twice daily | Clients must return to DTG 50 mg once daily 2 weeks after completing TB treatment. |\n| Developing DS-TB while on an EFV-based ART regimen | TDF/3TC+EFV 400 mg (once daily) | - Check VL at the end of treatment. If VL is undetectable, the client can be transitioned to a once-daily FDC of TDF+3TC+DTG two weeks after completion of TB treatment<br/>- If VL is detectable, immediately switch to second line and continue adherence support (refer to the ART section) |\n| Developing DS-TB while on a protease inhibitor (PI)-based ART regimen | Consult an experienced HIV clinician or snapthirdline@mohcoag.org before choosing these options:<br/>TB patient on LPV/r:<br/>- Super-boost LPV/r to 400 mg/400 mg by adding 300 mg ritonavir, and continue until 2 weeks after completion of TB treatment<br/>- Double-dose LPV/r to 800 mg/200 mg twice daily (double dosing is only for clients >10 years of age) and continue until 2 weeks after completion of TB treatment<br/>- If evidence of VL suppression in the past 3-6 months, switch to a DTG-based second-line regimen and continue twice-daily DTG until 2 weeks after completion of TB treatment<br/>TB patient on ATV/r or DRV/r:<br/>- Do not combine with rifampicin<br/>- Change to DTG twice daily if DTG-naive, or LPV/r with adjustments as above if DTG-experienced<br/>Patients who may be failing ART:<br/>- Follow guidance on managing treatment failure | (same as left) |\n\n**For clients with multidrug-resistant TB**\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| EFV and bedaquiline (BDQ) | - EFV should not be used with BDQ.<br/>- EFV induces CYP3A activity and co-administration with BDQ may result in reduced BDQ exposure and loss of BDQ activity.<br/>- DTG is the preferred INSTI for clients receiving BDQ. | (same as left) |\n| Delamanid (DLM) and ARVs | - DLM is generally considered safe to administer with ART.<br/>- Evidence shows safety with EFV, TDF and LPV/r.<br/>- No LPV/r dose adjustment is needed for TB patients on DLM. No long-term studies have been done on drug-drug interactions between DLM and ARVs. DTG is the preferred INSTI for clients receiving DLM. | (same as left) |\n\n**Note:** For all clients, maintain the same NRTI backbone provided no dose adjustment is necessary and the client is virally suppressed."}]},{"id":"Q077","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"TB-IRIS","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A patient's TB symptoms worsen 3 weeks after starting ART. What is this likely to be and how is it managed?","original_reference":"Likely paradoxical TB-associated IRIS (risk is higher with advanced disease and DTG). Exclude other infections, continue TB treatment and ART, give symptomatic therapy (NSAIDs or prednisone 20–70 mg/day for 5–12 weeks; IV methylprednisolone if severe), and refer to a doctor. ART interruption is rarely needed except in life-threatening, especially neurological, cases.","question":"Patient started TB treatment, then ART 3 weeks ago; now fever and worsening lymph nodes. What is this likely to be, and how do I manage it?","change":"Added typical features; content unchanged.","reference":"Likely paradoxical TB-associated IRIS. First exclude other infections (and drug resistance or poor adherence). Continue anti-TB treatment and ART; most cases respond to symptomatic therapy: NSAIDs or corticosteroids, prednisone 20-70 mg/day for 5-12 weeks, or IV methylprednisolone 40 mg every 12 hours if severe. ART interruption is rarely needed, except in life-threatening (especially neurological) presentations.","must_include":["TB-associated IRIS","Exclude other causes first","Continue TB treatment and ART","Prednisone 20-70 mg/day for 5-12 weeks (IV methylprednisolone if severe)"],"must_not_include":["Stop ART routinely","Stop TB treatment","Diagnose treatment failure and switch to DR-TB regimen without testing"],"check":"verified","sources":[{"id":"tb-2025-0513","label":"TB p.200","doc":"Integrated TB Management Guidelines 2025","pages":"200","heading":"10.5 Immune Reconstitution Inflammatory Syndrome (IRIS) among patients with HIV-related TB > 10.5.2 Management of TB associated with IRIS","text":"### 10.5.2 Management of TB associated with IRIS\n\nTreatment for TB-associated IRIS depends on the presentation and disease severity. Once other infectious etiologies have been excluded, standard anti-TB therapy should be continued as the clinical situation dictates. Most patients present with non-life-threatening presentations which respond to symptom-based therapy.\na. Since the pathogenesis of the syndrome is an inflammatory one, systematic corticosteroid or non-steroidal anti-inflammatory drugs can be used to alleviate symptoms.\nb. Treatment can include prednisone 20-70 mg/day for 5-12 weeks or intravenous methylprednisolone 40 mg every 12 hours in severe situations.\nc. Other studies showed that prednisolone prophylaxis of -40 mg per day for 14 days followed by 20mg per day for 14 days may prevent IRIS in high-risk populations (Meintjes et al., 2010).\nd. Interruption of ART is rarely necessary but could be considered in life-threatening situations, especially those with neurological symptoms.\ne. Refer to the Doctor at a Health Center or Hospital"},{"id":"tb-2025-0512","label":"TB p.199-200","doc":"Integrated TB Management Guidelines 2025","pages":"199-200","heading":"10.5 Immune Reconstitution Inflammatory Syndrome (IRIS) among patients with HIV-related TB > Antecedent requirements","text":"## **Antecedent requirements**\n\nBoth of the following requirements must be met:\n1. Diagnosis of TB: the TB diagnosis was made before starting ART and this should fulfil WHO criteria for diagnosis of smear-positive PTB, smear-negative PTB or extrapulmonary TB\n2. Initial response to TB treatment: the patient's condition should have stabilized or improved on appropriate TB treatment before ART initiation – e.g. cessation of night sweats, fevers, cough, and weight loss.\n\n**(Note: this does not apply to patients starting ART within 2 weeks of starting TB treatment since insufficient time may have elapsed for a clinical response to be reported.)**\n\nA new presentation of tuberculosis that is \"unmasked\" in the weeks following initiation of ART with an exaggerated inflammatory clinical presentation or complicated by a paradoxical reaction (here termed unmasking tuberculosis-associated IRIS).\n\nClients with advanced immunodeficiency (advanced disease) are at greater risk for IRIS when initiating ART and should be closely monitored. They usually present with the following clinical manifestations:\n- Fever\n- New or worsening adenitis - peripheral or central nodes\n- New or worsening pulmonary infiltrates, including respiratory failure\n- New or worsening pleuritis, pericarditis, or ascites\n- Intracranial tuberculomas, worsening meningitis\n- Disseminated skin lesions\n- Epididymitis, hepato-splenomegaly, soft tissue abscesses\n\n**Note: *Dolutegravir (DTG)* has been *associated with a higher risk of IRIS due to the rapid viral suppression and the accompanying immune reconstitution. Clients initiating DTG should be closely monitored for the first 6 months.***"}]},{"id":"Q078","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"DR-TB","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What is the preferred regimen for rifampicin-resistant TB, and who is not eligible for it?","original_reference":"BPaLM (bedaquiline, pretomanid, linezolid, moxifloxacin) for FQ-susceptible MDR/RR-TB; no need to wait for FQ results. Not eligible: pregnant or lactating women, under 15 years, severe EPTB (meningitis, osteoarticular, miliary/disseminated), more than 1 month prior exposure to Bdq/Lzd/Pa/Dlm without excluded resistance, or QTcF >500 ms, Hb <8, low neutrophils/platelets, or existing neuropathy. Alternative: 6-month Bdq-Dlm-Lfx-Lzd-Cfz (usable in children and pregnancy).","question":"26-year-old woman, 20 weeks pregnant, newly diagnosed rifampicin-resistant pulmonary TB. Can she have BPaLM?","change":"Was 'preferred regimen and who is not eligible'; now one patient who is excluded.","reference":"No. BPaLM (6 months of bedaquiline, pretomanid, linezolid, moxifloxacin) is the preferred regimen for MDR/RR-TB, but pregnant and lactating women are not eligible. The alternative for her is the 6-month Bdq-Dlm-Lfx-Lzd-Cfz regimen, for which pregnant and lactating women are eligible (adjusted once FQ DST is available: FQ-susceptible, omit Cfz; FQ-resistant, omit Lfx).","must_include":["Not eligible for BPaLM","Reason: pregnancy","6-month Bdq-Dlm-Lfx-Lzd-Cfz regimen instead"],"must_not_include":["Start BPaLM","Wait until after delivery to treat"],"check":"verified; note age cut-off differs within the guideline: Box 1 and Table 24 say ≥15 years, section 7.3.4 says 14 years and above","sources":[{"id":"tb-2025-0292","label":"TB p.118-119, Box 1","doc":"Integrated TB Management Guidelines 2025","pages":"118-119","heading":"Chapter 7: Drug-Resistant Tuberculosis Management > 7.3 Treatment of DR-TB > Figure 20 Notes; Box 1: Eligibility for BPaLM","text":"## 7.3 Treatment of DR-TB\n\n## = no other second line drug resistance (e.g. Bdq, Cfz, Lzd, Cs), ## = other second line drug resistance (i.e. Bdq, Cfz, Lzd, Cs)\n\n## **Box 1: Eligibility criteria for the BPaLM regimen**\n\n- Rif resistance, PDR or MDR detected by genotypic or phenotypic DST\n- Clinically diagnosed TB case who had close household contact with an index case meeting the eligibility criteria for BPaLM\n- Non-pregnant & lactating women, 15 years of age and above.\n- Less than 1-month previous exposure to bedaquiline, linezolid, pretomanid or delamanid.\n  ✓ When exposure is greater than 1 month, these patients may still receive these regimens if resistance to the specific medicines with such exposure has been ruled out.\n- Have no severe extrapulmonary TB. e.g., TB meningitis, Osteoarticular, disseminated TB or miliary TB.\n- Potential of drug intolerance/AEs:\n  ✓ QTcF>500 ms\n  ✓ Hb <8.0 g/dl\n  ✓ Neutrophil <0.75/109\n  ✓ PLT <150/109\n  ✓ Existing peripheral neuropathy, etc.,)"},{"id":"tb-2025-tbl-p120-0296","label":"TB p.120, Table 24","doc":"Integrated TB Management Guidelines 2025","pages":"120","heading":"7.3 Treatment of DR-TB > 7.3.3 Summary of Types of DR-TB treatment regimens and their eligibility","text":"### Table 24: Type of DR-TB treatment regimens, the duration and composition of the regimens and eligible client groups\n\n| Oral MDR TB regimens | Regimen composition | Eligible group and a brief guide for regimen use |\n| --- | --- | --- |\n| BPaL | 6-9 Bdq-Pa-Lzd | An alternative treatment regimen for Pre-XDR-TB patients ≥15 years old. (Note: pregnant and lactating women are not eligible.) |\n| BPaLM | 6 Bdq-Pa-Lzd-Mfx | The primary treatment regimen for MDR-TB/RR-TB/PDR-TB ≥15 years old. (Note: pregnant and lactating women are not eligible.) |\n| 6 Bdq-Dlm-Lfx-Lzd-Cfz | 6 Bdq-Dlm-Lzd-Lfx-Cfz<br/>Can change as below when the FQ DST result is available.<br/>If the DST result shows.<br/>FQ susceptible, omit Cfz and continue with Bdq-Dlm-Lzd-Lfx.<br/>FQ resistant, omit Lfx and continue with Bdq-Dlm-Lzd-Cfz. | Alternative regimen to BPaLM for RR/MDR with/without FQ resistance. Children and pregnant and lactating women are eligible for this regimen. For clients with known FQ resistance, this regimen by omitting Lfx is preferable (ie. Bdq-Dlm-Lzd-Cfz) to BPaL. |\n| 9-month regimens | a. 9 Bdq-Lzd-Mfx-Z#<br/>b. 9 Bdq-Lzd-Lfx-Cfz-Z<br/>c. 9 Bdq-Dlm-Lzd-Lfx-Z<br/>(# priority regimen among the three 9 mth regimens) | MDR/RR-TB without FQ resistance who are not eligible to BPaLM or 6 Bdq-Dlm-Lfx-Lzd-Cfz regimens |\n| LTR (standardized - STDTR or individualized-ITR) | STDTR<br/>18-20 Bdq/Lzd/DLM/Cfz/Trd(Cs)<br/>ITR: composed of 4-5 likely effective drugs containing Group A&B drugs as a priority | For those who are not eligible for the BPaL or mSTR, XDR, Severe EP TB (meningitis, Osteoarticular, pericardial), disseminated or military TB |\n| Hr-TB Regimen | 6 RHZE | If the absence of Rifampicin resistance cannot be confirmed (i.e., lack of rifampicin-resistant report by sequencing which is missed to detect by pDST and Xpert test) 6RHZE is preferable to avoid drug resistance amplification, especially for Lfx which is an important core drug in second-line treatment), If Hr-TB without any confirmed additional resistance to other drugs with the availability of full DST results, a 6 (H)RZE+Lfx regimen may be used. |"},{"id":"tb-2025-0298","label":"TB p.121","doc":"Integrated TB Management Guidelines 2025","pages":"121","heading":"7.3 Treatment of DR-TB > 7.3.4 RR/MDR-TB treatment regimens > (a) BPaL / BPaLM Regimen","text":"## (a) **BPaL / BPaLM Regimen**\n\nThe BPaL/BPaLM regimens are 6-month regimens including Bedaquiline, Pretomanid, and Linezolid with additional Moxifloxacin (BPaLM) or without the additional Moxifloxacin (BPaL). The BPaLM and BPaL regimens are abbreviated:\n**BPaLM: 6 (Bdq-Pa-Lzd-Mfx) /**\n\n**BPaL: 6-9 (Bdq-Pa-Lzd)**\n\nBPaLM is the preferred treatment regimen for patients diagnosed with MDR-TB/RR-TB/PDR-TB and INH treatment failure, non-pregnant & lactating women, 14 years and above. The total treatment duration is 26 weeks (6 months). The medicines are to be given 7 days per week (except for Bdq) and administered with food for better absorption of Bdq and Pa.\n\n**Note:** Avoid dairy products, Ca+ supplements or Ca+-containing antacids at least 2 hours before a dose and within 4 hours after the dose to ensure optimum absorption of Mfx.\n\n**BPaL** is an alternative treatment regimen for patients diagnosed of Pre-XD-TB (i.e., those with MDR-TB and additional fluoroquinolone-resistance) who are non-pregnant & lactating women, 14 years and above. The recommended treatment duration is 6 months with a possibility of extension to 9 months if there is no culture conversion at month 4 of treatment."}]},{"id":"Q079","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"Newborn of mother with TB","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A baby is born to a mother who started TB treatment 3 weeks before delivery. How should the baby be managed?","original_reference":"High risk (delivered within 8 weeks of maternal treatment start): screen the newborn immediately and investigate the placenta for congenital TB. Treat if symptomatic; otherwise give TPT for 3 or 6 months and withhold BCG until 2 weeks after TPT is completed (repeat BCG if it was given just before TPT). Breastfeeding continues with IPC measures (mask, ventilation). If the mother has MDR-TB, consult an expert.","question":"Baby born to a mother who started TB treatment 3 weeks before delivery. What do I do for the baby?","change":"Shortened; content unchanged.","reference":"High risk (delivered within 8 weeks of maternal treatment start): screen the newborn immediately and investigate the placenta for congenital TB. Treat if symptomatic; otherwise give TPT for 3 or 6 months and withhold BCG until 2 weeks after TPT is completed (repeat BCG if it was given just before TPT). Breastfeeding continues with IPC measures (mask, ventilation). If the mother has MDR-TB, consult an expert.","must_include":["High risk (born within 8 weeks of the mother starting treatment)","Screen the newborn immediately","Treat if symptomatic; otherwise TPT for 3 or 6 months","Withhold BCG until 2 weeks after TPT"],"must_not_include":["Give BCG at birth as usual","Stop breastfeeding","No action because the mother is on treatment"],"check":"verified","sources":[{"id":"tb-2025-0389","label":"TB p.155","doc":"Integrated TB Management Guidelines 2025","pages":"155","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.13 Management of a Newborn from a Mother with TB","text":"- A newborn delivered within 8 weeks of the mother starting TB treatment, diagnosed with TB at delivery or soon thereafter is at a high risk of infection or disease with TB.\n- The newborn should be immediately screened for TB.\n- The presentation of TB symptoms may be nonspecific but signs of fever, feed intolerance, poor weight gain, and hepatosplenomegaly may be realized.\n- Mothers diagnosed with TB should immediately after birth have the placenta and the baby carefully investigated for possible indication of congenital TB.\n- Symptomatic neonates should be treated for TB and those who are without TB disease should be put on preventive treatment for 3 or 6 months and withhold BCG vaccination until two weeks after completion of TPT.\n- If the BCG vaccine was given immediately before TPT was initiated, the BCG should be repeated following completion of treatment if there are no contraindications.\n\nIf the baby has been exposed to a mother with MDR-TB, consult an expert. The benefits of breastfeeding still outweigh the risks during this period. However, the mother should be carefully educated on infection prevention and control she can implement while at home to prevent TB transmission. These will include:\n- Limiting contact with the neonate\n- Covering her mouth and nose with a mask while breastfeeding and breastfeeding outside if possible\n- Keep all windows wide open when indoors\n- Spend a greater part of the day outdoors"},{"id":"tb-2025-0246","label":"TB p.102","doc":"Integrated TB Management Guidelines 2025","pages":"102","heading":"6.6 Treatment of Extra-Pulmonary Tuberculosis (EPTB) > 6.6.5 Management of a newborn from a mother with TB","text":"# 6.6.5 Management of a newborn from a mother with TB\n\n- A baby born from a mother who has been on anti-TB treatment for at least 8 weeks before delivery is less likely to be infected as the woman is usually non-infectious at the time of delivery, but they should still be evaluated for TB symptoms.\n- A newborn delivered within 8 weeks of the mother starting TB treatment, diagnosed with TB at delivery or soon thereafter is at a high risk of infection or disease with TB.\n- The newborn should be immediately screened for TB.\n- The presentation of TB symptoms may be nonspecific but signs of fever, feed intolerance, poor weight gain, and hepatosplenomegaly may be realized.\n- Mothers diagnosed with TB should immediately after birth have the placenta and the baby carefully investigated for possible indication of congenital TB.\n- Symptomatic neonates should be treated for TB and those who are without TB disease should be put on preventive treatment for 3 or 6 months and withhold BCG vaccination until two weeks after completion of TPT.\n- If the BCG vaccine was given immediately before TPT was initiated, the BCG should be repeated following completion of treatment if there are no contraindications.\n\nIf the baby has been exposed to a mother with MDR-TB, consult an expert. The benefits of breastfeeding still outweigh the risks during this period. However, the mother should be carefully educated on infection prevention and control she can implement while at home to prevent TB transmission. These will include:\n- Limiting contact with the neonate\n- Covering her mouth and nose with a mask while breastfeeding and breastfeeding outside if possible\n- Keep all windows wide open when indoors\n- Spend a greater part of the day outdoors"},{"id":"tb-2025-0247","label":"TB p.102","doc":"Integrated TB Management Guidelines 2025","pages":"102-103","heading":"6.6 Treatment of Extra-Pulmonary Tuberculosis (EPTB) > 6.6.6 Treatment for Breastfeeding Women","text":"# 6.6.6 Treatment for Breastfeeding Women\n\nA woman who is breastfeeding and has TB disease should receive a full course of anti-TB treatment. Timely and properly applied treatment is the best way to prevent transmission of tubercle bacilli to the baby.\n\n- All first-line TB drugs are compatible with breastfeeding and a woman taking them can safely continue to breastfeed her baby.\n\n- The mother should be educated on the following IPC measures:\n  - ✓ Practice respiratory hygiene, including wearing surgical masks and cough etiquette\n  - ✓ Good ventilation\n  - ✓ There should be limited interaction between the mother and baby.\n  - ✓ The baby should continue to breastfeed in the normal way but be given TB preventive treatment such as 3RH and pyridoxine or Isoniazid 10mg/ kg and pyridoxine for six months after screening negative for TB.\n\n<mark> **Note:** Pyridoxine supplementation is recommended for all pregnant or breastfeeding women taking a treatment regimen with isoniazid.<\/mark>"}]},{"id":"Q080","area":"TB and TB/HIV","document":"National Integrated TB Guidelines 2025","topic":"TPT","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What TB preventive treatment regimens are available and which is used for contacts of MDR-TB patients?","original_reference":"6H, 3HP (weekly isoniazid-rifapentine, 12 doses), 3HR, 4R, 1HP, 6H with cotrimoxazole and B6, and 6 months of levofloxacin (6Lfx) for contacts of MDR/RR-TB. Shorter rifamycin regimens are preferred over 6H; 3HP is contraindicated with PIs and NVP but can be used with TDF, EFV and DTG.","question":"HIV-negative adult living with a patient who has MDR-TB. Which TB preventive treatment do I give?","change":"Was two-part (all TPT regimens + MDR contacts); now one contact.","reference":"Levofloxacin for 6 months (6Lfx), after active TB has been excluded. The TB 2025 guideline uses levofloxacin for all DR-TB household contacts regardless of age, and the 2024 HIV Amendment also changed this from levofloxacin + ethambutol to levofloxacin alone. Isoniazid- or rifamycin-based regimens (6H, 3HP, 3HR) do not cover MDR-TB.","must_include":["Levofloxacin","6 months","Exclude active TB first"],"must_not_include":["Levofloxacin plus ethambutol (2022 guidance, superseded)","3HP, 3HR or 6H for an MDR contact"],"check":"verified","sources":[{"id":"tb-2025-tbl-p212-0549","label":"TB p.212, Table 54","doc":"Integrated TB Management Guidelines 2025","pages":"212-213","heading":"11.8 TPT Regimens and Dosing","text":"### Table 54: Key characteristics of TPT regimens\n\n| Characteristics | 6H | 3HP | 3HR | 4R | 1HP | 6H(+CPT+B6) | 6Lfx |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Drug (s) | Isoniazid | Isoniazid + Rifapentine | Isoniazid + Rifampicin | Rifampicin | Isoniazid + Rifapentine | Isoniazid + Cotrimoxazole + Pyridoxine | Levofloxacin |\n| Duration (mths) | 6 | 3 | 3 | 4 | 1 | 6 | 6 |\n| Frequency | Daily | Weekly | Daily | Daily | Daily | Daily | Daily |\n| Total No. of doses | 182 | 12 | 84 | 120 | 28 | 182 | 182 |\n| Pill burden per dose (total per regimen), person weighing 50kg using adult formulations(a) | 1(182) | 6 singles (72) or 3 with FDC (36) | 3(252) | 3(360) | 3(84) | 1(182) | 1(182) |\n| Children | All ages: child-friendly (dispersible) formulation available preferred for children with HIV on LPV/r or NVP | All ages: child-friendly (dispersible) formulation available | All ages: child-friendly (dispersible) formulation available | All ages: no child-friendly formulation available, not generally feasible for children < 25kg | ≥ 13 years | Adults and adolescents; no child-friendly formulations available | All ages: child-friendly (dispersible) formulation available |\n| Pregnant women | Safe for use(c) | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available for this population | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available specifically in this population |\n| Interactions with ART | No restriction | Contraindicated: All protease inhibitors (PIs), nevirapine (NVP), doravirine and etravirine, tenofovir alafenamide (TAF)<br/>Use: tenofovir disoproxil fumarate (TDF), EFV, DTG, RAL | Contraindicated: All PIs, NVP, doravirine and etravirine<br/>Use with caution: TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Use: TDF, EFV, DTG, RAL | No restriction | No restriction (may interfere with lamivudine clearance) |\n| Toxicity | Hepatotoxicity (more), peripheral neuropathy, rash, gastrointestinal upset | Flu-like syndrome, hypersensitivity reactions, gastrointestinal upset, orange discolouration of body fluids, rash, hepatotoxicity (less) | Hypersensitivity reactions, hepatotoxicity (less), rash, gastrointestinal upset, hypoprothrombinaemia, orange discolouration of body fluids | Rash, gastrointestinal upset, hepatotoxicity (less), hypoprothrombinaemia, Orange discolouration of body Fluids | Hepatotoxicity (more), hypersensitivity reaction, rash, gastrointestinal upset, orange discolouration of body fluid | Hepatotoxicity, rash, gastro-intestinal upset | Diarrhoea, nausea and bloating, arthralgia, inflamed or torn tendons, muscle pain or weakness, prolonged QTc interval, mood or behaviour changes, insomnia |\n| Absorption | Best absorbed on an empty stomach; up to 50% reduction in peak concentration with a fatty meal | Oral rifapentine bioavailability is 70%; peak concentration increased if given with a meal | Rifampicin absorption is rapid but may be delayed or decreased by high-fat meals. |  | Same as 3HP | Same as 6H | Absorption is not influenced by food. Concomitant steroid use may increase risk of tendon rupture. Multivalent cation containing products including antacids (may contain aluminium), mineral supplements (e.g. iron or magnesium) or multivitamins may decrease absorption. Effect of warfarin may be enhanced |\n\n1HP, 1 month of daily rifapentine plus isoniazid; 3HP, 3 months of weekly rifapentine plus isoniazid; 3HR, 3 months of daily rifampicin plus isoniazid; 4R, 4 months of daily rifampicin monotherapy; 6H, 6 months of daily isoniazid monotherapy; 6Lfx, 6 months of daily levofloxacin monotherapy; B6, pyridoxine; CPT, cotrimoxazole; DTG, dolutegravir; EFV, efavirenz; FDC, fixed-dose combination; H, isoniazid; LPV/r, lopinavir–ritonavir; NVP, nevirapine; P, rifapentine; PI, protease inhibitor; H + CPT + B6 (Q-TIB), isoniazid-cotrimoxazole-pyridoxine combination; R, rifampicin; RAL, raltegravir; TAF, tenofovir alafenamide; TDF, tenofovir disoproxil fumarate.\n(a) H-300 mg; P-300 mg; H-300 mg/P-300 mg FDC; R-150 mg/H-75 mg FDC; R-300 mg/150 mg; Lfx-500 mg.\nThe Absorption row is printed on p.191 under a repeated header; the 4R absorption cell is blank in the source."},{"id":"tb-2025-tbl-p23-0021","label":"TB p.23","doc":"Integrated TB Management Guidelines 2025","pages":"23-24","heading":"1.1 Introduction > Introduction and Country Background > Table 1: Summary of Changes and New Recommendations in the Guidelines","text":"### Table 1: Summary of Changes and New Recommendations in the Guidelines (Definitions and terms use, Adapted as in the new WHO TB surveillance guidelines, 2024 includes the change of LF-LAM diagnosed TB cases to bacteriologi)\n\nTable 1: Summary of Changes and New Recommendations in the Guidelines\n\n| Definitions and terms use | Adapted as in the new WHO TB surveillance guidelines, 2024 includes the change of LF-LAM diagnosed TB cases to bacteriologically confirmed TB instead of clinically diagnosed TB. |\n| --- | --- |\n| TB Screening | New screening tool: CXR and CAD use both in health facilities and community, CRP for PLHIV, revised symptom screening tool to increase presumption index on lung cancer<br/>Approaches: Bidirectional screening of TB and COVID, Integrated Screening in the Community<br/>Strategies to ensure optimal screening coverage:<br/>• Checking the copy of the screening tool that is given out to the client (recording in the CMIS) by the screening officer/any community cadre by the attending clinicians.<br/>• Using a stamp strategy (i.e. giving a stamped slip to the client and checking by attending clinicians if screening is done or not)<br/>• Repeated screening at the multi-service delivery points<br/>• Cascade analysis and continuous quality improvement using the data of screening activities |\n| TB Diagnosis | Children: Stool sample used for TB diagnosis with GeneXpert, Treatment decision algorithms.<br/>Drug-resistant-TB: Xpert XDR and Sequencing tests. |\n| Drug-susceptible TB treatment | Four-month regimen for children 3-15 years old with non-severe pulmonary TB, 6-month (6RHZ+Eto) TB meningitis treatment regimen for children, COVID-19 vaccination for TB patients, post-TB lung disease assessment and referral<br/>Treatment support: Nutritional support for clinically indicated clients (i.e. based on BMI/MUAC), Digital adherence technology use (Smart pillbox in addition to VOT) |\n| Drug-resistant TB treatment (DR-TB) | Use of BPaLM regimen for RR/MDR TB, guidance for empirical treatment approach, especially for initially diagnosed as Hr-TB before tNGS result.<br/>Use of 6-month Bdq-Dlm-Lzd-Lfx-Cfz regimen for individuals not eligible for BPaLM regimen, especially for children, pregnant and lactating women<br/>Use of 9-month regimens for individuals not eligible for 6-month long BPaLM and Bdq-Dlm-Lzd-Lfx-Cfz regimens. These regimens include:<br/>9 Bdq-Mfz-Lzd-Z, 9 Bdq-Lzd-Lfz-Cfz-Z, 9 Bdq-Dlm-Lzd-LfX-Z |\n| Collaborative TB and HIV activities and advanced HIV disease | Synchronized the updates from National Integrated HIV Management Guidelines, 2022 including HIV prevention in presumptive TB and TB clients |\n| TB Preventive Treatment (TPT) | Use of new TPT regimens among household contacts (3HP, 3 HR as preferred regimen)<br/>Use of Levofloxacin for all DR-TB household contacts regardless of age<br/>Community-based TPT for household TB contacts |\n| Integrated TB/HIV and non-communicable diseases including mental health (New Chapter) | A New Chapter |\n| Zoonotic TB and Leprosy Management | A New Chapter |"},{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"}]},{"id":"Q104","area":"TB and TB/HIV","document":"Cross-document","topic":"TB/HIV","type":"cross-document","category":"standard","expected":"answer from multiple sources","safety":"yes","original_question":"Which TB preventive therapy regimen is preferred for an adult living with HIV on TLD, and what is used for a household contact of an MDR-TB patient?","original_reference":"3HP (weekly rifapentine + isoniazid 900/900 mg for 12 weeks) for TPT-naive PLHIV over 14 years and 30 kg; it is compatible with TDF and DTG. Contacts of MDR/RR-TB patients get levofloxacin (6Lfx). INH/CTX/B6 has been phased out as a TPT option.","question":"34-year-old man on TLD, 70 kg, never had TPT, active TB excluded. Which TB preventive therapy?","change":"Was two-part (PLHIV regimen + MDR contacts, the latter now covered by Q080); kept the PLHIV part as a case.","reference":"3HP: weekly rifapentine plus isoniazid (900 mg/900 mg) for 3 months (12 doses), with vitamin B6. It is the preferred TPT for TPT-naive PLHIV over 14 years and 30 kg, and can be used with TDF and DTG (it is contraindicated with protease inhibitors and nevirapine). 1HP is an option once available; 6H is the alternative. INH/CTX/B6 has been phased out as a TPT option.","must_include":["3HP (weekly rifapentine + isoniazid for 3 months, 12 doses)","900 mg/900 mg","Compatible with TDF/DTG","Vitamin B6"],"must_not_include":["INH/CTX/B6 FDC as an option (phased out)","3HP contraindicated with DTG","3RH as the preferred regimen for PLHIV"],"check":"verified; Table 58 (TB 2025) gives 3HP for '≥12 years and ≥25 kg' while the Amendment gives '>14 years and 30 kg' — both cover this patient","sources":[{"id":"hiv-amendment-2024-tbl-6.1.2-tpt-options","label":"Amendment p.24","doc":"HIV Management Amendment 2024","pages":"24","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.1 Tuberculosis > 6.1.2 TB Prevention","text":"### Recommended TPT options by population group (preferred and alternative regimens)\n\nRecommended TPT options are as follows:\n\n| Population group | Preferred regimen | Alternative regimen |\n| --- | --- | --- |\n| All TPT naïve PLHIV including children and adolescents above 14 years and 30kg; PLHIV on completion of DSTB or DRTB treatment despite previous TPT; PLHIV who are household contacts to bacteriologically confirmed TB, despite previous TPT | 3 months of Rifapentine/Isoniazid (3HP) 900mg/900mg; 1 month of INH/Rifapentine (1HP), once available | 6 months of INH monotherapy (6H) |\n| CLHIV (<14 years or <30kgs) | 6H | (none: cell greyed out) |\n| HIV-negative (household contact, other at-risk groups) | 3 months of Rifapentine/Isoniazid (3HP) 900mg/900mg; 3 months of Rifampicin/Isoniazid (3RH); 4 months of Rifampicin (4R) | 6 months of INH (6H) |\n| DR-TB contacts | MDR-TB/RR-TB/Rif mono-resistance: Levofloxacin. INH mono and PDR: Levofloxacin. Pre-XDR and XDR: for DRTB expert review. | (same as left) |"},{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"},{"id":"tb-2025-tbl-p212-0549","label":"TB p.212, Table 54","doc":"Integrated TB Management Guidelines 2025","pages":"212-213","heading":"11.8 TPT Regimens and Dosing","text":"### Table 54: Key characteristics of TPT regimens\n\n| Characteristics | 6H | 3HP | 3HR | 4R | 1HP | 6H(+CPT+B6) | 6Lfx |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Drug (s) | Isoniazid | Isoniazid + Rifapentine | Isoniazid + Rifampicin | Rifampicin | Isoniazid + Rifapentine | Isoniazid + Cotrimoxazole + Pyridoxine | Levofloxacin |\n| Duration (mths) | 6 | 3 | 3 | 4 | 1 | 6 | 6 |\n| Frequency | Daily | Weekly | Daily | Daily | Daily | Daily | Daily |\n| Total No. of doses | 182 | 12 | 84 | 120 | 28 | 182 | 182 |\n| Pill burden per dose (total per regimen), person weighing 50kg using adult formulations(a) | 1(182) | 6 singles (72) or 3 with FDC (36) | 3(252) | 3(360) | 3(84) | 1(182) | 1(182) |\n| Children | All ages: child-friendly (dispersible) formulation available preferred for children with HIV on LPV/r or NVP | All ages: child-friendly (dispersible) formulation available | All ages: child-friendly (dispersible) formulation available | All ages: no child-friendly formulation available, not generally feasible for childr
