to undetectable levels of <50 copies/mL. However, in certain individuals, there is persistence of low-level viraemia (LLV), defined as viral load levels of 51–999 copies/mL, despite consistent medication adherence, lack of drug interactions and no genotypic resistance. LLV has been associated with adverse virological and clinical outcomes. LLV should not be confused with blips, defined as a single VL between 50 and 200 copies/mL occurring after an initial period of virological suppression, and followed by a return to an undetectable result.\n\n**<u>Blips:<\/u>** A single VL 50–200 copies/mL preceded and followed by an undetectable VL is usually not a cause for clinical concern but does not require any change in regimen. However, it should trigger clinical vigilance, adherence reinforcement, check for possible interactions, and repeat VL in 3 months.\n\n**<u>Low-level Viremia:<\/u>** A VL result of 200 - 999 copies/mL may be indicative or predictive of virological failure. In this context:\n* Assess the patient for treatment adherence, tolerability, and toxicity.\n* Changing ART regimens is not recommended unless ART toxicity or intolerability is identified.\n* Repeat VL testing in 3 months.\n* Genotyping is not recommended unless the VL result is ≥1000 copies/mL.\n\n> **EFV single formulations are not currently in the market so clients should be optimised according to 2019 addendum guidelines.**"},{"id":"hiv-2022-fig-7.4-high-vl-management","label":"HIV 2022 p.164","doc":"Integrated HIV Management Guidelines 2022","pages":"164","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.10.3 Management of a high viral load (VL >1000 copies/mL) > Figure 7.4","text":"### Figure 7.4 Management of Clients with VL >1000 copies/mL\n\nHigh viral load (≥1000 copies/mL) test received at the facility: call client on receipt of results to arrange a clinical review within 7 days.\n1. 1 month after VL taken: review of high VL and first SUAC* - conduct the first SUAC, address barriers to adherence, explain results to the client; provide 1 month's ART refill.\n2. 2 months: 1 month after first SUAC - conduct the 2nd SUAC, address barriers to adherence; provide 1-month refill.\n3. 3 months: 1 month after second SUAC - conduct the third SUAC, address barriers to adherence; provide 1-month ART refill.\n4. 4 months: 1 month after 3rd SUAC - repeat adherence, address barriers to adherence; provide 1-month refill. Assess adherence:\n   - Adherence not good for 3 consecutive months: repeat SUAC sessions for 3 consecutive months until good adherence is achieved.\n   - Good adherence for 3 consecutive months: repeat VL; schedule review for 1 month later; review results of repeat VL:\n       - NOT SUPPRESSED** (VL ≥1000 copies/mL): explain the results to the client; check opportunistic infections and CD4; review adherence; refer to MDT for further evaluation***; provide DOTS where possible; offer PrEP to partners of clients with HVL. Then treatment failure evaluation (multidisciplinary team): discuss the case and record treatment decisions and plan in the client file; if the client is fully adherent, prepare the client to switch to a second- or third-line regimen; repeat VL after 3 months; refer to facility escalation plan.\n       - Low level viraemia (VL 50-1000 copies/mL): reinforce adherence and praise the client for their efforts; schedule follow-up visits according to the client's needs; repeat VL after 6 months; provide a 3-month ART refill; target undetectable VL if VL is detectable.\n       - Undetectable VL (VL <50): offer DSD and the client is on ART for more than 1 year.\nAt each session: provide one month ART refill; monitor and document pill counts and adherence percentage at each session; conduct and document SUAC session; screen for clinical failure; screen and treat for opportunistic infections; call client/caregiver for any missed appointments.\n* For clients on an NNRTI-based regimen, consider switching regimens after a single elevated VL (see Figure 7.3).\n** For clients with VL ≥1000 copies/mL provide index HIV testing to their partners with negative or unknown HIV status. Consult the doctor at the mother facilities or Baylor HIV/TB Hotline 7848 5571.\n*** Clients who despite adherence support have two consecutive high VL results while taking a DTG/PI-based regimen should be referred to the HIVDR clinical expert committee for consideration for genotype."}]},{"id":"Q120","area":"HIV testing, treatment and PMTCT","document":"Multiple","topic":"Ambiguous - which population","type":"edge-case","category":"ambiguous","expected":"ask-clarifying","safety":"no","original_question":"How often should we retest for HIV?","original_reference":"Ask which population, since it differs: pregnant women every 2 months (key at 34 weeks); lactating women on the MBP schedule; PrEP users per PrEP schedule; general population via risk screening/HIVST at each facility encounter (12+).","question":"How often should we retest for HIV?","change":"Unchanged (behaviour test).","reference":"Ask which population, since it differs: pregnant women every 2 months (key at 34 weeks); lactating women on the MBP schedule; PrEP users per PrEP schedule; general population via risk screening/HIVST at each facility encounter (12+).","must_include":["Asks which population, or answers per population","Pregnant: every 2 months, key at 34 weeks","Lactating: MBP schedule","PrEP users: PrEP schedule"],"must_not_include":["One interval for everyone"],"check":"verified","sources":[{"id":"hiv-2022-tbl-3.4-retesting-frequencies","label":"HIV 2022 p.60","doc":"Integrated HIV Management Guidelines 2022","pages":"60","heading":"Chapter 3: HIV Testing Services > 3.5 HIV retesting > Table 3.4 Optimal retesting frequencies for various population groups","text":"### Table 3.4 Optimal retesting frequencies for various population groups\n\n| Population | When to Retest |\n| --- | --- |\n| General population | Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: Based on the ongoing risk of exposure |\n| Couples and Partners | Sero-different couple: retest every 2 months until/unless partner has evidence of undetectable Viral Load<br/>Once partner maintains undetectable V/L, retest based on HIV exposure or annually |\n| Pregnant and Lactating Women | All HIV-negative pregnant women should be re-tested every 2 months (aligned with the ANC scheduled visits) with the most optimal time for retesting being during the third trimester visit (34 weeks gestation).<br/>At delivery: Test every woman with unknown HIV status; test all women who have not tested in the third trimester<br/>All HIV-negative lactating women should be re-tested at 6 weeks, 14 weeks, 6 months, 9 months, 12 months, 15 months and 18 months aligned with the MBP follow-up schedule.<br/>See Table 8.5 |\n| Key Populations | Retest every 8 weeks |\n| General population | Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: retest every 2 months until/unless partner has evidence of undetectable Viral Load<br/>Once partner maintains undetectable V/L, retest based on HIV exposure or annually |"},{"id":"hiv-amendment-2024-0024","label":"Amendment p.11","doc":"HIV Management Amendment 2024","pages":"11","heading":"Chapter 3: HIV Testing Services > 3.2 HIV Screening Tools > 3.2.2 HIVST As a Screening Tool > 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above","text":"# 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above\n\nScreen all individuals 12 years and above eligible for HTS with HIVST, unless among priority groups who qualify for routine testing (i.e. malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts, pregnant and lactating mothers, inpatient and key populations (KPs)). If they test HIV negative, actively link them to prevention services. If the test results are HIV positive, offer partner notification services and link to treatment services.\n\nRe-screen at every facility encounter (initial visit and every 2 months thereafter) at every entry point."}]},{"id":"Q129","area":"HIV testing, treatment and PMTCT","document":"HIV Amendment 2024","topic":"Threshold boundary/gap","type":"edge-case","category":"boundary-value","expected":"answer-precise-or-flag","safety":"yes","original_question":"Viral load result is exactly 1000 copies/mL. Is that low-level viraemia or high viral load?","original_reference":"Flag that the document is internally ambiguous: LLV is defined as 200–999 and high VL as >1000, while genotyping is advised at ≥1000 and the 2022 guideline uses ≥1000 for failure. Reasonable answer: treat as high VL (≥1000) per failure definitions, start SUAC and repeat VL, while noting the inconsistency.","question":"Viral load result is exactly 1000 copies/mL. Is that low-level viraemia or high viral load?","change":"Unchanged (behaviour test).","reference":"Flag that the document is internally ambiguous: LLV is defined as 200–999 and high VL as >1000, while genotyping is advised at ≥1000 and the 2022 guideline uses ≥1000 for failure. Reasonable answer: treat as high VL (≥1000) per failure definitions, start SUAC and repeat VL, while noting the inconsistency.","must_include":["Notes the thresholds do not meet cleanly (LLV 200-999; high VL >1000; genotype/failure ≥1000)","Treats as high VL: SUAC and repeat VL"],"must_not_include":["Calls it suppressed"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-7-summary-of-changes","label":"Amendment p.28","doc":"HIV Management Amendment 2024","pages":"28","heading":"Chapter 7: Adult Antiretroviral Therapy > Summary of Changes","text":"### Chapter 7 adult ART: summary of changes in viral load thresholds and testing, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| (no 2022 guidance) | All clients on 3rd line ART should have routine VL testing done every 6 months. |\n| Suppressed VL: VL <1000 copies/mL. Low level viraemia: VL 50 – 999 copies/mL. | Suppressed VL: VL <200 copies/mL. Low-level viraemia: VL 200 – 999 copies/mL. |\n| SUAC for all clients with a VL >1000 copies/mL. | Adherence Counselling for all clients with a VL > 200 copies/mL. |"},{"id":"hiv-amendment-2024-fig-7.1-vl-thresholds","label":"Amendment p.28","doc":"HIV Management Amendment 2024","pages":"28","heading":"Chapter 7: Adult Antiretroviral Therapy > Summary of Changes > Updated viral load thresholds","text":"### Figure 7.1 Updated viral load thresholds\n\nFollowing ART initiation, a VL decline of at least 0.5 log10 copies/mL (3-fold) is considered significant. The goal for people on ART is an undetectable VL (VL <50 copies/mL). To keep community transmission to a minimum, the threshold for viral suppression has been decreased to VL <200 copies/mL.\n\nViral load categories:\n- Undetectable viral load: VL <50 copies/mL\n- Viral suppression: VL <200 copies/mL\n- Low-level viraemia: VL 50-999 copies/mL\n- High viral load: VL >1000 copies/mL\n\nUndetectable and suppressed: U = U (undetectable = untransmittable). Low-level viraemia and high viral load: high predictor of HIV drug resistance (HIVDR).\nPTVL as part of baseline laboratory tests should not be done for clients re-engaging into care."},{"id":"hiv-2022-fig-7.4-high-vl-management","label":"HIV 2022 p.164","doc":"Integrated HIV Management Guidelines 2022","pages":"164","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.10.3 Management of a high viral load (VL >1000 copies/mL) > Figure 7.4","text":"### Figure 7.4 Management of Clients with VL >1000 copies/mL\n\nHigh viral load (≥1000 copies/mL) test received at the facility: call client on receipt of results to arrange a clinical review within 7 days.\n1. 1 month after VL taken: review of high VL and first SUAC* - conduct the first SUAC, address barriers to adherence, explain results to the client; provide 1 month's ART refill.\n2. 2 months: 1 month after first SUAC - conduct the 2nd SUAC, address barriers to adherence; provide 1-month refill.\n3. 3 months: 1 month after second SUAC - conduct the third SUAC, address barriers to adherence; provide 1-month ART refill.\n4. 4 months: 1 month after 3rd SUAC - repeat adherence, address barriers to adherence; provide 1-month refill. Assess adherence:\n   - Adherence not good for 3 consecutive months: repeat SUAC sessions for 3 consecutive months until good adherence is achieved.\n   - Good adherence for 3 consecutive months: repeat VL; schedule review for 1 month later; review results of repeat VL:\n       - NOT SUPPRESSED** (VL ≥1000 copies/mL): explain the results to the client; check opportunistic infections and CD4; review adherence; refer to MDT for further evaluation***; provide DOTS where possible; offer PrEP to partners of clients with HVL. Then treatment failure evaluation (multidisciplinary team): discuss the case and record treatment decisions and plan in the client file; if the client is fully adherent, prepare the client to switch to a second- or third-line regimen; repeat VL after 3 months; refer to facility escalation plan.\n       - Low level viraemia (VL 50-1000 copies/mL): reinforce adherence and praise the client for their efforts; schedule follow-up visits according to the client's needs; repeat VL after 6 months; provide a 3-month ART refill; target undetectable VL if VL is detectable.\n       - Undetectable VL (VL <50): offer DSD and the client is on ART for more than 1 year.\nAt each session: provide one month ART refill; monitor and document pill counts and adherence percentage at each session; conduct and document SUAC session; screen for clinical failure; screen and treat for opportunistic infections; call client/caregiver for any missed appointments.\n* For clients on an NNRTI-based regimen, consider switching regimens after a single elevated VL (see Figure 7.3).\n** For clients with VL ≥1000 copies/mL provide index HIV testing to their partners with negative or unknown HIV status. Consult the doctor at the mother facilities or Baylor HIV/TB Hotline 7848 5571.\n*** Clients who despite adherence support have two consecutive high VL results while taking a DTG/PI-based regimen should be referred to the HIVDR clinical expert committee for consideration for genotype."}]},{"id":"Q132","area":"HIV testing, treatment and PMTCT","document":"HIV 2022 / HIV Amendment 2024","topic":"Infant ARV prophylaxis","type":"edge-case","category":"dose-calculation","expected":"answer-precise","safety":"yes","original_question":"An HIV-exposed newborn weighing 2.8 kg tests HIV-negative at birth. What prophylaxis, doses and duration should be given?","original_reference":"Enhanced infant prophylaxis (eIP) with two drugs. From birth to 6 weeks (birth weight ≥2,500 g): AZT 15 mg (1.5 mL syrup) twice daily plus NVP 15 mg (1.5 mL syrup) once daily. At 6 weeks stop AZT and continue NVP until at least 14 weeks; from 6 weeks the dose is 20 mg (2 mL syrup, or ½ a 50 mg tablet) once daily. Under the 2024 Amendment, if the mother is breastfeeding and not virally suppressed, continue or restart NVP until she is undetectable. (For a birth weight under 2,000 g, call the facility doctor or the Baylor hotline.)","question":"An HIV-exposed newborn weighing 2.8 kg tests HIV-negative at birth. What prophylaxis, doses and duration should be given?","change":"Unchanged (behaviour test).","reference":"Enhanced infant prophylaxis (eIP) with two drugs. From birth to 6 weeks (birth weight ≥2,500 g): AZT 15 mg (1.5 mL syrup) twice daily plus NVP 15 mg (1.5 mL syrup) once daily. At 6 weeks stop AZT and continue NVP until at least 14 weeks; from 6 weeks the dose is 20 mg (2 mL syrup, or ½ a 50 mg tablet) once daily. Under the 2024 Amendment, if the mother is breastfeeding and not virally suppressed, continue or restart NVP until she is undetectable. (For a birth weight under 2,000 g, call the facility doctor or the Baylor hotline.)","must_include":["AZT 15 mg (1.5 mL) twice daily for 6 weeks","NVP 15 mg (1.5 mL) once daily birth-6 weeks","NVP 20 mg (2 mL) once daily from 6 weeks, at least to 14 weeks","Continue NVP if mother breastfeeding and not suppressed"],"must_not_include":["Doses for the 2,000-2,499 g band (10 mg)","Single-drug prophylaxis"],"check":"verified","sources":[{"id":"hiv-2022-tbl-8.10-infant-nvp-azt","label":"HIV 2022 p.189","doc":"Integrated HIV Management Guidelines 2022","pages":"189","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.5 > Table 8.10 Infant Dosing Regimens of NVP and AZT","text":"### Table 8.10 Infant Dosing Regimens of NVP and AZT\n\n**Birth to 6 weeks**\n\n| Infant Weight | Dosing of NVP | Dosing of AZT |\n| --- | --- | --- |\n| Birth weight 2000−2499g | 10 mg once daily (1 mL of syrup once daily) | 10 mg twice daily (1 mL of syrup twice daily) |\n| Birth weight ≥ 2500g | 15 mg once daily (1.5 mL of syrup once daily) | 15 mg twice daily (1.5 mL of syrup twice daily) |\n| Birth weight < 2000g | Call Facility Doctor or Baylor Hotline |  |\n\n**> 6 weeks to 6 months**\n\n| Infant Weight | Dosing of NVP | Dosing of AZT |\n| --- | --- | --- |\n| Any weight | 20 mg once daily (2 mL of syrup once daily) or (½ a 50 mg tablet once daily) | STOP |\n\n**6-9 months**\n\n| Infant Weight | Dosing of NVP | Dosing of AZT |\n| --- | --- | --- |\n| Any weight | 3mL once daily | Not given |\n\n**9-24 months**\n\n| Infant Weight | Dosing of NVP | Dosing of AZT |\n| --- | --- | --- |\n| Any weight | 5mL once daily | Not given |"},{"id":"hiv-2022-tbl-8.15-eip-special-cases","label":"HIV 2022 p.196","doc":"Integrated HIV Management Guidelines 2022","pages":"196","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.11 Enhanced Infant Prophylaxis (eIP) > Table 8.15","text":"### Table 8.15 Special Considerations for Enhanced Infant Prophylaxis in Exposed Infants\n\nAll HIV-exposed infants should be given eIP (NVP and AZT syrup) from the time of birth. The duration of AZT is 6 weeks post-partum. The minimum duration of NVP is 14 weeks post-delivery; NVP should be continued beyond 14 weeks if the mother is breastfeeding and has a detectable viral load, and only stopped once the mother is undetectable. Prompt consultation is advised for women viraemic on 2nd or 3rd line ART while pregnant or breastfeeding.\n\n| Situation | Action (\\*provide dosing clips and syringe) |\n| --- | --- |\n| Mother diagnosed as HIV- positive during breastfeeding (acute seroconversion) | • The infant is at extreme risk of HIV transmission. Consult MD, mother facility, or Baylor for considerations of presumptive ART for the infant. Lacking specific same-day advice, test infant same day and start routine EIP. If < 6 weeks, start AZT/NVP. If > 14 weeks, start only NVP.<br/>• Start ART on the mother immediately.<br/>• Test infant on the same day |\n| Mother diagnosed as HIV- positive during breastfeeding and refuses to be initiated on ART | • The infant is at extreme risk of HIV transmission. Consult MD, mother facility or Baylor for considerations of presumptive ART for the infant. Lacking specific same-day advice, test infant same day and start routine EIP. If < 6 weeks start AZT/NVP. If > 14 weeks, start only NVP.<br/>• Test the infant on the same day.<br/>• Continue counselling the mother on the benefits of ART for her health, the baby’s and partner’s health |\n| The child defaulted from eIP before they are 14 weeks old | • Counsel on the importance of ongoing prophylaxis and restart AZT up until 6 weeks postpartum and NVP until 14 weeks of age or until the mother has undetectable VL |\n| Mother is on 2nd or 3rd line | • Consult Baylor for guidance on appropriate Infant Prophylaxis. If lacking specific guidance start routine EIP with AZT/NVP |\n\nNote: Give AZT only up until 6 weeks post-partum regardless of the start date. Give NVP until at least 14 weeks of age but may continue for longer until the mother has a detectable VL."}]},{"id":"Q137","area":"HIV testing, treatment and PMTCT","document":"HIV 2022 / Amendment 2024","topic":"Superseded guidance","type":"edge-case","category":"outdated-version","expected":"give-current-flag-change","safety":"no","original_question":"The 2022 guidelines say first viral load at 6 months — is that still right?","original_reference":"Explain it changed: the 2024 amendment says first VL at 3 months after (re)initiation, then 9 months (plus pretreatment VL for new clients). Note the amendment's summary table is itself inconsistent ('by 6 months') but section 7.1 specifies 3 and 9 months.","question":"The 2022 guidelines say first viral load at 6 months — is that still right?","change":"Unchanged (behaviour test).","reference":"Explain it changed: the 2024 amendment says first VL at 3 months after (re)initiation, then 9 months (plus pretreatment VL for new clients). Note the amendment's summary table is itself inconsistent ('by 6 months') but section 7.1 specifies 3 and 9 months.","must_include":["No: first VL is now at 3 months after (re)initiation","Then at 9 months","Pretreatment VL for new clients"],"must_not_include":["Yes, still 6 months"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-5-summary-of-changes","label":"Amendment p.19","doc":"HIV Management Amendment 2024","pages":"19","heading":"Chapter 5: Basic Care Package for HIV-Positive Individuals > Summary of Changes","text":"### Chapter 5 basic care package: summary of changes in viral load testing, MMD and HIVDR, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| (no 2022 guidance) | Pretreatment VL for all newly diagnosed clients initiating ART. Clients returning to care should not receive PTVL. |\n| The first routine VL test is to be done by 6 months post-ART initiation. | The first routine VL test is to be done 3 months post-ART initiation. Ensure that all clients have a VL test done BY 6 months of starting ART. |\n| The 2nd routine VL test should be done 6 months after an initial suppressed VL test result. | The 2nd routine VL test should be done 6 months after an initial suppressed VL test result and then annually thereafter. For children, pregnant and breastfeeding women, it should be done every 6 months. |\n| 3MMD can be started after a suppressed VL done 6 months following ART initiation. | Up to 3MMD of ARVs can be started after an initial suppressed VL test result done at 3 months. Up to 6MMD can be given following 2 consecutive suppressed VL test results. |\n| (no 2022 guidance) | Remnant blood samples of all infants who test HIV positive may be stored and used for surveillance purposes (plasma or DBS) for HIVDR survey activities. |\n| (no 2022 guidance) | Routine HIVDR testing for all PrEP breakthrough infections. |"},{"id":"hiv-amendment-2024-fig-7.2-vl-monitoring-schedule","label":"Amendment p.29","doc":"HIV Management Amendment 2024","pages":"29","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Updated viral load monitoring schedule","text":"### Figure 7.2 Updated viral load monitoring schedule\n\nAll clients initiating or reinitiating ART should receive their first routine VL three months after (re)initiating ART and at 9 months thereafter. After two consecutive undetectable VL results, routine VL testing is done as below.\n\nSchedule: pre-treatment VL, then VL at 3 months post ART initiation, then VL at 9 months post ART, then routine VL testing.\n\nRoutine VL testing frequency:\n- Children and adolescents (0-19 years): every 6 months\n- Pregnant and breastfeeding women: every 6 months\n- 3rd line clients: every 6 months\n- Adults >19 years: annually"}]},{"id":"Q173","area":"HIV testing, treatment and PMTCT","document":"Cross-document","topic":"HIV and diabetes","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"Man on TLD, newly diagnosed type 2 diabetes. I'm starting metformin. Any dose issues, and what else should I monitor?","change":"New question: needs the HIV and NCD guidelines together.","reference":"Dolutegravir raises metformin levels: start low (250 mg twice daily or 500 mg once daily), titrate carefully and limit metformin to 1000 mg a day (500 mg twice daily); watch for metformin side effects, glucose and HbA1c. Aim for blood glucose below 10 mmol/L and HbA1c below 7%. He needs a retinal exam now (at diagnosis of type 2 diabetes) and then yearly, plus a yearly foot examination, and management of other risk factors such as hypertension and dyslipidaemia. Switching ART is considered only if his diabetes is out of control.","must_include":["Start low: 250 mg BD or 500 mg OD","Maximum metformin 1000 mg/day with DTG","Retinal exam at diagnosis, then yearly","Yearly foot examination"],"must_not_include":["Usual metformin dose up to 2 g/day","Switch him off dolutegravir straight away"],"check":"verified","sources":[{"id":"hiv-2022-box-dtg-metformin","label":"HIV 2022 p.245","doc":"Integrated HIV Management Guidelines 2022","pages":"245","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.3 Care and Management of Diabetes and HIV > DTG and metformin","text":"> **Dolutegravir and metformin (key message and dosing)**\n>\n> Key message: Switching ART regimens should only be considered if a patient is on DTG, or LPV/r based regimen and their diabetes is out of control. Switching other ARV medications is of uncertain benefit.\n> \n> Key message: Special caution should be used when metformin is co-administered with DTG, as DTG significantly increases metformin concentration, leading to potential increased adverse events.\n> 1. If the patient is already on metformin and initiating dolutegravir, monitor closely for metformin adverse effects, glucose levels, and HbA1c, and adjust the dose as necessary.\n> 2. In patients taking dolutegravir who are starting metformin, begin with a low metformin dose (250mg twice daily or 500mg once daily) and titrate up carefully. It is recommended to limit the dose of metformin to 1000 mg daily i.e., 500mg twice daily."},{"id":"hiv-2022-fig-10.1-diabetes-evaluation","label":"HIV 2022 p.246","doc":"Integrated HIV Management Guidelines 2022","pages":"246","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.3 Care and Management of Diabetes and HIV > Figure 10.1","text":"### Figure 10.1 Evaluation of clients with Diabetes and HIV infection\n\nFlow (top to bottom):\n1. HIV infection and diabetes diagnoses confirmed: conduct baseline physical assessment and laboratory investigation. Refer to practice guide for management of diabetes mellitus.\n↓\n2. Use Metformin 500 - 1000mg with or without additional insulin.\n↓\n3. Monitor blood sugar control and prevent end organ damage:\n- Blood glucose should be below 10mmol/L\n- HbA1c should be below 7%\n- Annual eye and foot examination is needed, and additional risk factors like dyslipidaemia and hypertension should be managed properly. Refer to national practice guide."},{"id":"ncdimh-tbl-dr-screening-schedule","label":"NCDIMH p.281","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"281","heading":"Chapter 10: Ophthalmology > Diabetic Retinopathy > Screening and Diagnosis of Diabetic Retinopathy","text":"### Diabetic retinopathy screening schedule: timing of first and subsequent retinal examination by risk factor (type 1, type 2, complications, poor control, other)\n\n| Risk Factors | 1st retinal examination | Subsequent examination |\n| --- | --- | --- |\n| Type 1 DM | Within 5 years of diagnosis and after onset of puberty | Annually |\n| Type 2 DM | At time of diagnosis | Annually |\n| Evidence of other diabetic complications, e.g. CVD, renal disease (nephropathy), foot ulcers (neuropathy) | Immediately | As recommended by eye care provider |\n| Poor glycaemic control | Immediately | As recommended by eye care provider |\n| Other risk factors: hyperlipidemia, smoking, cataract surgery, obesity, anaemia, leukaemias etc. | At time of diagnosis / immediately | As recommended by eye care provider |\n\n**Note:** Screening by health care workers (medical officers and nursing staff): visual acuity with a Snellen or illiterate E chart; penlight torch to examine the external eye, pupillary reaction etc. Symptoms are absent early; later fluctuating or blurred vision, spots or floaters, dark or empty areas in vision, total loss of vision."},{"id":"ncdimh-fig-diabetic-foot-algorithm-a","label":"NCDIMH p.295","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"295","heading":"Chapter 12: Podiatry > Diabetic Foot > Algorithm A: foot assessment and risk","text":"### Diabetic foot algorithm A: foot assessment in all patients with diabetes, active foot problems, and risk stratification (high, moderate, low) with actions\n\nAll patients with diabetes → foot assessment: skin; neurological; vascular; musculoskeletal.\n1. Active foot problem? (any of: ulceration; spreading infection; critical limb ischaemia; gangrene; suspicion of acute Charcot neuroarthropathy or an unexplained hot, red, swollen foot with or without pain)\n   - Yes → Algorithm B.\n   - No → 2.\n2. Previous history of ulceration, amputation, or on renal replacement therapy? Yes → HIGH RISK: early referral to podiatrist/surgical department for further care.\n3. Deformity/neuropathy/non-critical limb ischaemia → MODERATE RISK: refer to NCD clinic/podiatrist/surgical department for further review.\n4. Callus alone → LOW RISK: total contact insole; foot care education; yearly screening.\n5. Normal findings → foot care education; yearly screening.\n*Risk categories as in the diabetic foot risk stratification table."}]},{"id":"Q004","area":"HIV prevention: PrEP and PEP","document":"HIV Guidelines Amendment 2024","topic":"PrEP testing","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Can an HIV self-test be used to rule out HIV before starting a client on injectable cabotegravir (CAB-LA) PrEP?","original_reference":"No. HIVST may be used for oral PrEP and the PrEP ring (except pregnant/breastfeeding women), but CAB-LA users must be tested with the National HIV Testing Algorithm.","question":"A client wants to start injectable cabotegravir (CAB-LA) PrEP. Can I use an HIV self-test to rule out HIV first?","change":"Rephrased as a clinician's question; content unchanged.","reference":"No. For CAB-LA (and LEN), a rapid diagnostic test following the National HIV Testing Algorithm is needed before initiation and before every CAB-LA injection. An HIV self-test can be used to rule out HIV only before oral PrEP or the PrEP ring, and not for pregnant or breastfeeding women.","must_include":["No, a self-test is not enough for CAB-LA","Use a rapid diagnostic test / National HIV Testing Algorithm before CAB-LA"],"must_not_include":["An HIV self-test is acceptable before CAB-LA"],"check":"verified in Amendment and PrEP 2025 (2025 adds LEN and testing before every CAB-LA injection)","sources":[{"id":"hiv-amendment-2024-tbl-3-prep-initiation-hivst","label":"Amendment p.12","doc":"HIV Management Amendment 2024","pages":"12","heading":"Chapter 3: HIV Testing Services > 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above > PrEP (re-)initiation","text":"### HIV testing and dispensing at PrEP (re-)initiation: oral PrEP or ring vs CAB-LA\n\n|  | Oral PrEP (daily, ED, or alternating) or PrEP Ring | CAB-LA |\n| --- | --- | --- |\n| HIV test | An HIVST can be used to rule out HIV infection except for PBFW for whom a National HIV Testing Algorithm is recommended. | National HIV Testing Algorithm needs to be used to rule out HIV infection. |\n| Assess PEP eligibility | For any UNPROTECTED sexual exposure in the last 72 hours, clients should be assessed for PEP eligibility, prior to PrEP initiation. | (same as left) |\n| Volume dispensed | 1 month prescription (1 bottle) of TDF/3TC or 1 DPV ring. | Initiation injection 1 is given. |\n| Next appointment | Schedule next visit date after 1 month. | Schedule next visit date for initiation injection 2 after 1 month days (+/- 7 days). |\n| HIVST distribution | Can be provided as an exit test or for ED PrEP users before a new cycle of exposure. | N/A |"},{"id":"prep-2025-tbl-hiv-testing-initiation","label":"PrEP 2025 p.36, Table 9","doc":"PrEP Implementation Guidelines 2025","pages":"36","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 1: HIV Testing and Counseling","text":"### Table 9. HIV testing services at PrEP initiation: HIVST for oral PrEP/ring, RDT for CAB-LA/LEN, positive or inconclusive results, risk assessment, referral\n\n| PrEP initiation steps | Plan of action |\n| --- | --- |\n| Counselling and information | Refer to HIV testing services (HTS) guidelines. |\n| HIV test (HIV testing services [HTS] guidelines) | - An HIV test needs to be performed on the day of PrEP initiation.<br/>- An HIVST is the preferred test for initial screening or prior to oral PrEP or PrEP ring initiation.<br/>- If the HIV test is negative, clients should be linked to HIV prevention services.<br/>- For clients choosing CAB-LA or LEN, a rapid diagnostic test (RDT) is needed prior to PrEP initiation.<br/>- If positive, confirm the HIV-positive result as per the national testing algorithm. Do not initiate the client on PrEP.<br/>- Initiate the client on antiretroviral therapy (ART) as per national guidelines.<br/>- If the test result is inconclusive, defer PrEP and follow the national HIV testing algorithm until a definitive HIV test result has been obtained. |\n| Risk assessment | Assess and discuss risk of acquiring HIV with HIV-negative clients. |\n| Referral and linkages | Provide information on HIV prevention services and link to appropriate prevention services. See the HIV Prevention Referral and Linkages Job Aid for detailed guidance. |"},{"id":"prep-2025-tbl-followup-hiv-testing","label":"PrEP 2025 p.47","doc":"PrEP Implementation Guidelines 2025","pages":"47","heading":"3 PrEP Delivery > 3.3 PrEP Follow-up Visit > Component 1: HIV Testing Services","text":"### HIV testing during PrEP follow-up by product: frequency and test type (HIVST for oral PrEP and ring, RDT before every CAB-LA injection, LEN HIVST at month 1 then RDT)\n\nHIV testing and counselling should be conducted at every follow-up visit to inform decisions on whether to continue or discontinue PrEP. The type of HIV testing depends on the PrEP method.\n\n|  | Oral PrEP | PrEP ring | CAB-LA | LEN |\n| --- | --- | --- | --- | --- |\n| HIV testing frequency | M1 home-based HIVST, then every three months | M1 home-based HIVST, then every three months | Before every injection | At M1 and before every injection |\n| HIV testing type | HIVST | HIVST | Rapid diagnostic test | M1 only HIVST. RDT. |"}]},{"id":"Q037","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"PrEP products","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What PrEP products are available in Eswatini, and how often is each one taken or given?","original_reference":"Oral TDF 300 mg/3TC 300 mg (daily, or event-driven for eligible people assigned male at birth); the dapivirine vaginal ring (25 mg, replaced monthly); CAB-LA 600 mg IM gluteal (two initiation injections 1 month apart, then every 2 months); and lenacapavir 927 mg as two subcutaneous injections every 26 weeks plus a 600 mg oral loading dose on days 1 and 2.","question":"How often are CAB-LA and lenacapavir PrEP injections given?","change":"Kept general; narrowed from all four PrEP products to the two injectables.","reference":"CAB-LA (cabotegravir 600 mg IM): two initiation injections one month apart, then every 2 months. LEN (lenacapavir 927 mg): two 1.5 mL subcutaneous injections every 26 weeks (6 months), plus an oral loading dose of 600 mg (2 × 300 mg tablets) on two consecutive days starting the day of the first injections. LEN needs the fewest visits.","must_include":["CAB-LA: two injections 1 month apart, then every 2 months","LEN: two subcutaneous injections every 26 weeks / 6 months","LEN oral loading 600 mg on days 1 and 2"],"must_not_include":["CAB-LA every 6 months","LEN monthly","LEN without oral loading"],"check":"verified","sources":[{"id":"prep-2025-0013","label":"PrEP 2025 p.9","doc":"PrEP Implementation Guidelines 2025","pages":"9","heading":"1 Introduction to PrEP > 1.1 PrEP Products and Regimens in Eswatini > Dapivirine vaginal ring (PrEP ring or “the ring”)","text":"### Dapivirine vaginal ring (PrEP ring or “the ring”)\n\nThe PrEP ring is a flexible silicone vaginal ring that contains **25 mg dapivirine** slowly released over the course of one month. This long-acting HIV prevention method was developed specifically for clients who are unable or do not want to take oral PrEP or when oral PrEP is not available. The ring has been studied for prevention of HIV only among those assigned female sex at birth (AFAB) during receptive vaginal sex and does not prevent HIV acquisition through any other mode of transmission, e.g., transmission through anal sex.\n\n### Cabotegravir injectable PrEP (CAB-LA)\n\nCAB-LA is a long-acting PrEP method containing **600 mg of cabotegravir extended-release injectable suspension**. The first two injections are given one month apart, thereafter every two months. CAB-LA has been introduced in Eswatini since 2024."},{"id":"prep-2025-0015","label":"PrEP 2025 p.10","doc":"PrEP Implementation Guidelines 2025","pages":"10","heading":"1 Introduction to PrEP > 1.1 PrEP Products and Regimens in Eswatini > Lenacapavir injectable PrEP (LEN)","text":"# Lenacapavir injectable PrEP (LEN)\n\nLEN is a long-acting PrEP method containing **927 mg of lenacapavir** given as two 1.5 ml subcutaneous injections every 26 weeks. People starting LEN also take an oral loading dose of 600 mg (2 x 300 mg tablets) for two consecutive days, beginning on the day of the first injection.\n\n## 1.2 PrEP Priority Populations\n\nPrEP is offered to HIV-negative, eligible individuals who are at substantial risk of acquiring HIV infection. The following populations will be prioritized:\n- **Sexually active adolescent girls and women of childbearing age (10-49)**\n- Pregnant and breastfeeding women (PBFW)\n- Sero-different couples (SDCs)\n- Sex workers (SWs)\n- People with multiple sexual partners\n- Individuals with sexually transmitted infections (STIs)\n- Gay men and other men who have sex with men (MSM)\n- Sexually active adolescent boys and males, aged 16–34\n- Transgender people\n- People who use and inject drugs (PWID)\n\n**Box 1:** PrEP is not limited to the above-mentioned priority populations. Any individual who requests PrEP should be supported to make an informed choice on prevention services including PrEP."},{"id":"prep-2025-0059","label":"PrEP 2025 p.27","doc":"PrEP Implementation Guidelines 2025","pages":"27","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP","text":"## 2.4 LEN injectable PrEP\n\nLEN is a long-acting PrEP method containing 927 mg of lenacapavir given as two subcutaneous injections (1.5 ml each) every 26 weeks (6 months). LEN belongs to a class of ARVs called HIV-1 capsid inhibitors that interfere with the ability of HIV to replicate itself inside a healthy cell. People starting LEN also take an oral loading dose of 600 mg (2 x 300 mg tablets) over two consecutive days. Two tablets are taken on day 1, which is the same day the individual receives the initial two injections. Two more tablets are taken on day 2. This oral LEN loading dose (4 tablets only) is needed to provide immediate protection while the long-acting injection slowly reaches effective levels.\n\nEvidence from two randomized controlled trials show LEN is highly effective at preventing sexual HIV acquisition and may be offered as an additional prevention choice as part of combination prevention approaches. It has not yet been studied for HIV prevention for parenteral exposure<sup>9<\/sup>."}]},{"id":"Q038","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Event-driven PrEP","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Who can use event-driven (2+1+1) oral PrEP, and how is it taken?","original_reference":"Only people assigned male at birth who are not using estradiol-based hormones. It is not for people assigned female at birth or for non-sexual exposures such as injecting drugs. Take 2 tablets 2–24 hours before sex, then 1 tablet daily until 2 days after the last sexual exposure.","question":"27-year-old cisgender woman asks for event-driven (2+1+1) oral PrEP because she has sex only occasionally. Can she use it?","change":"Was 'who can use ED-PrEP and how is it taken'; now a client it does not suit.","reference":"No. Event-driven PrEP is only for people assigned male at birth who are not using estradiol-based hormones; it is not recommended for people assigned female at birth. She should use daily oral PrEP: one tablet daily, starting 7 days before potential exposure and continuing for 7 days after the last potential exposure.","must_include":["No, ED-PrEP is not recommended for her","ED-PrEP is only for people assigned male at birth not on estradiol","Daily oral PrEP instead","7 days before and 7 days after exposure"],"must_not_include":["Yes, 2 tablets 2-24 hours before sex","ED-PrEP is fine for women"],"check":"verified","sources":[{"id":"prep-2025-tbl-oral-prep-start-stop","label":"PrEP 2025 p.14, Table 2","doc":"PrEP Implementation Guidelines 2025","pages":"14","heading":"2 Overview of PrEP Products > 2.1 Oral PrEP > Starting and Stopping Oral PrEP","text":"### Table 2. Starting, using and stopping oral PrEP (daily and event-driven 2+1+1) by population: AMAB not on estradiol, AFAB, AMAB on estradiol hormones, people who inject drugs\n\n| Population(s) | Often includes ᵃ | Starting oral PrEP | Using oral PrEP | Stopping oral PrEP |\n| --- | --- | --- | --- | --- |\n| People assigned male at birth who are NOT using estradiol-based exogenous hormones and are using oral PrEP to prevent HIV acquisition during sex | Cisgender men and transgender women who are not using estradiol-based exogenous hormones; non-binary people assigned male at birth who are not using estradiol-based exogenous hormones | Daily or ED: take a double dose 2 to 24 hours before potential sexual exposure. Ideally, this loading dose should be taken closer to 24 hours before potential exposure. | Take one dose per day. | Daily or ED: after a single dose is taken daily for two days after the last potential exposure, PrEP can be stopped. |\n| People assigned female at birth who are using oral PrEP to prevent HIV acquisition during sex | Cisgender women, transgender men, non-binary people assigned female at birth | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n| People assigned male at birth who are using estradiol-based exogenous hormones who are using oral PrEP to prevent HIV acquisition during sex | Transgender women who are using estradiol-based exogenous hormones; non-binary people assigned male at birth who are using estradiol-based exogenous hormones | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n| People using oral PrEP to prevent HIV acquisition from nonsexual exposures | Anyone who shares injection-related materials ᵇ | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n\nᵃ This list is provided to support interpretation of this guidance and is not inclusive of all gender identities or terms that may be used by people with diverse gender identities to describe themselves and/or their communities. Starting and stopping oral PrEP should be based on the factors in the first column.\nᵇ Injection drug use is mentioned in this guidance; however, first-line prevention strategies for people who inject drugs are needle exchange and/or drug use harm reduction and treatment. Daily oral PrEP has some preventative effects for this population and should be offered as part of a larger prevention package."}]},{"id":"Q039","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Oral PrEP","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How many days of daily oral PrEP does a woman need before it is protective, and how long should she continue after her last exposure?","original_reference":"At least 7 consecutive days of daily dosing before it is considered effective (because of how the drug concentrates in vaginal tissue), and continue for 7 days after the last potential exposure.","question":"Woman starting daily oral PrEP. How many days before she is protected, and how long should she continue after her last exposure?","change":"Kept as a natural two-part question (start and stop); minor rewording.","reference":"She needs 7 days of daily dosing before potential exposure, and should continue one tablet daily for 7 days after the last potential exposure before stopping.","must_include":["7 days of daily dosing before protection","Continue 7 days after the last exposure"],"must_not_include":["Protected after a double dose 2-24 hours before sex","Stop 2 days after the last exposure (that rule is for people assigned male at birth)"],"check":"verified","sources":[{"id":"prep-2025-tbl-oral-prep-start-stop","label":"PrEP 2025 p.14, Table 2","doc":"PrEP Implementation Guidelines 2025","pages":"14","heading":"2 Overview of PrEP Products > 2.1 Oral PrEP > Starting and Stopping Oral PrEP","text":"### Table 2. Starting, using and stopping oral PrEP (daily and event-driven 2+1+1) by population: AMAB not on estradiol, AFAB, AMAB on estradiol hormones, people who inject drugs\n\n| Population(s) | Often includes ᵃ | Starting oral PrEP | Using oral PrEP | Stopping oral PrEP |\n| --- | --- | --- | --- | --- |\n| People assigned male at birth who are NOT using estradiol-based exogenous hormones and are using oral PrEP to prevent HIV acquisition during sex | Cisgender men and transgender women who are not using estradiol-based exogenous hormones; non-binary people assigned male at birth who are not using estradiol-based exogenous hormones | Daily or ED: take a double dose 2 to 24 hours before potential sexual exposure. Ideally, this loading dose should be taken closer to 24 hours before potential exposure. | Take one dose per day. | Daily or ED: after a single dose is taken daily for two days after the last potential exposure, PrEP can be stopped. |\n| People assigned female at birth who are using oral PrEP to prevent HIV acquisition during sex | Cisgender women, transgender men, non-binary people assigned female at birth | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n| People assigned male at birth who are using estradiol-based exogenous hormones who are using oral PrEP to prevent HIV acquisition during sex | Transgender women who are using estradiol-based exogenous hormones; non-binary people assigned male at birth who are using estradiol-based exogenous hormones | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n| People using oral PrEP to prevent HIV acquisition from nonsexual exposures | Anyone who shares injection-related materials ᵇ | Daily: take a single dose daily for seven days before potential exposure.<br/>ED-PrEP is not recommended for these populations. | Take one dose per day. | After a single dose is taken daily for seven days after the last potential exposure, PrEP can be stopped. |\n\nᵃ This list is provided to support interpretation of this guidance and is not inclusive of all gender identities or terms that may be used by people with diverse gender identities to describe themselves and/or their communities. Starting and stopping oral PrEP should be based on the factors in the first column.\nᵇ Injection drug use is mentioned in this guidance; however, first-line prevention strategies for people who inject drugs are needle exchange and/or drug use harm reduction and treatment. Daily oral PrEP has some preventative effects for this population and should be offered as part of a larger prevention package."}]},{"id":"Q040","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"PrEP eligibility","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What are the minimum age and weight requirements for each PrEP product?","original_reference":"Age ≥16 years for all products (oral PrEP may be considered for mature minors aged 12–15 at the provider's discretion). Weight: oral PrEP ≥30 kg, CAB-LA ≥35 kg, LEN ≥35 kg. All products are safe in pregnancy and breastfeeding.","question":"16-year-old weighing 33 kg wants CAB-LA PrEP. Is she eligible?","change":"Was a table question (age and weight limits for every product); now one client near a cut-off.","reference":"Not for CAB-LA. She meets the age criterion (≥16 years) but CAB-LA requires a body weight of at least 35 kg (also for LEN). At 33 kg she can use oral PrEP or the PrEP ring, which require ≥30 kg.","must_include":["Not eligible for CAB-LA","CAB-LA needs ≥35 kg","Age ≥16 is met","Oral PrEP or ring (≥30 kg) are options"],"must_not_include":["She is eligible for CAB-LA","CAB-LA weight cut-off 30 kg"],"check":"verified","sources":[{"id":"prep-2025-tbl-product-eligibility","label":"PrEP 2025 p.39, Table 10","doc":"PrEP Implementation Guidelines 2025","pages":"39","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > Product-specific Eligibility Assessment","text":"### Table 10. Product-specific PrEP eligibility criteria for oral PrEP, PrEP ring, CAB-LA and LEN: follow-up attendance, age ≥16, body weight, pregnancy/breastfeeding, contraindications\n\n| Criterion | Oral PrEP | PrEP ring | CAB-LA | LEN |\n| --- | --- | --- | --- | --- |\n| Able/willing to attend PrEP visits | For all products, clients should be committed to attend scheduled follow-up appointments | (same as left) | (same as left) | (same as left) |\n| Age | ≥16 years\\* | ≥16 years\\* | ≥16 years\\* | ≥16 years\\* |\n| Body weight | ≥30 kg | ≥30 kg | ≥35 kg | ≥35 kg |\n| Pregnancy / breastfeeding | All available PrEP products are safe to use in pregnant or breastfeeding women. | (same as left) | (same as left) | (same as left) |\n| No contraindications for PrEP method | Not using nephrotoxic medication or having known creatinine clearance <60 ml/min | Not using vaginally administered antimicrobial products and no allergies to dapivirine | Not using rifampin, rifapentine, carbamazepine, oxcarbazepine, phenobarbital, phenytoin, and does not have allergy to CAB-LA | No allergy or previous reaction to LEN |\n\n*In case of a mature minor between the age of 12-15 years, oral PrEP can be considered as per the discretion of the healthcare provider."}]},{"id":"Q041","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"PrEP initiation","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A client asks to start PrEP and reports condomless sex with a partner of unknown status 36 hours ago. What should the provider do?","original_reference":"Assess for PEP rather than PrEP, because the exposure was within 72 hours. If eligible, start PEP. After the 28-day PEP course, the client can transition straight to PrEP without a gap if HIV-negative and otherwise eligible.","question":"Client wants to start PrEP; condomless sex with a partner of unknown status 36 hours ago. What do I do?","change":"Shortened; content unchanged.","reference":"Assess for PEP instead of PrEP, because the exposure was within the past 72 hours. If eligible, start PEP. Retest for HIV at the end of the 28-day PEP course; if HIV negative and otherwise eligible, she can move straight to PrEP without a gap.","must_include":["PEP assessment, not PrEP, because exposure <72 hours","Start PEP if eligible","Transition to PrEP after 28 days of PEP if HIV negative, without a gap"],"must_not_include":["Start PrEP today","Too late for PEP"],"check":"verified","sources":[{"id":"prep-2025-0085","label":"PrEP 2025 p.36-37","doc":"PrEP Implementation Guidelines 2025","pages":"36-37","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > PEP Indication Assessment","text":"## **Component 2: PrEP Eligibility Assessment**\n\nIf a client is interested in PrEP, prior to initiation, eligibility for PrEP needs to be assessed/ confirmed.\n\n### *PEP indication assessment*\n\n* If a client report exposure to HIV in the past 72 hours, screen for PEP indication instead of PrEP.\n\n- If a client is eligible for PEP, initiate the client on the PEP regimen [refer to integrated HIV management guidelines].\n- Educate clients on the difference between PEP, PrEP, and ART, and offer HIV exposure reduction counseling.\n- After 28 days of PEP, a client may be transitioned from PEP to PrEP without a gap if they test HIV negative and meet other criteria for PrEP use.\n\n# *Acute HIV infection (AHI) assessment*\n\n- If a client presents with signs and symptoms of acute HIV infection **AND** possible exposure to HIV in the previous 14 days, the client is suspected to have AHI."},{"id":"prep-2025-fig-initiation-exposure-ahi","label":"PrEP 2025 p.38-39, Figure 11","doc":"PrEP Implementation Guidelines 2025","pages":"38-39","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > Acute HIV Infection (AHI) Assessment","text":"### Figure 11. PrEP initiation flowchart: HIV test result, exposure in past 72 hours (PEP), AHI symptoms in past 14 days, start PrEP or delay and retest\n\n1. Is the client's HIV test result negative?\n   - No: refer the client to confirmatory testing and HIV treatment.\n   - Yes: 2.\n2. Was the client potentially exposed to HIV in the past 72 hours? (⁰)\n   - Yes: start PEP standard of care (SOC). If PEP is started, retest for HIV in 28 days; if the client is seronegative upon PEP completion, continue with PrEP SOC.\n   - No: 3.\n3. Does the client have AHI symptoms now, or have they had AHI symptoms in the past 14 days? (¹)\n   - No: start PrEP SOC. (²)\n   - Yes: 4.\n4. Did the client have a potential exposure to HIV in the 14 days before symptom onset?\n   - No: start PrEP SOC. (²)\n   - Yes: the symptoms may be due to AHI (a prevention method was not being used effectively around the time of exposure). Provider and client should weigh the risks and benefits of delaying PrEP initiation and retesting per the national algorithm 28 days from potential exposure, or earlier if HIV testing that can reliably detect HIV is available.\nNotes: ⁰ 'No' means no potential exposure at all, or exposure 72 or more hours ago. ¹ Two-thirds of people have AHI symptoms within two to four weeks of acquiring HIV; symptoms that mimic AHI (sore throat, fever, sweats, swollen glands, mouth ulcers, headache, rash, muscle aches) are commonly due to other illnesses, so use discretion. ² Before starting PrEP the client should know that the HIV test may not detect HIV acquired fewer than 28 days ago (and possibly beyond 28 days), and that without AHI symptoms they could be pre-symptomatic or among the one-third who never develop symptoms."}]},{"id":"Q042","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Acute HIV infection","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A client wanting PrEP has fever, sore throat and rash and reports condomless sex 10 days ago. Their HIV test today is negative. Should PrEP be started?","original_reference":"No. With symptoms of acute HIV infection and an exposure within the previous 14 days, suspect AHI: defer PrEP for 4 weeks, give exposure-reduction counselling and STI screening, and repeat the HIV test after 4 weeks; start PrEP if still negative.","question":"Client wanting PrEP has fever, sore throat and rash; condomless sex 10 days ago; HIV test today negative. Do I start PrEP?","change":"Shortened; content unchanged.","reference":"No. Symptoms of acute HIV infection with a possible exposure in the previous 14 days mean suspected AHI: defer PrEP for 4 weeks, give exposure-reduction counselling and STI screening, and repeat the HIV test after 4 weeks; if still negative and otherwise eligible, start PrEP. (PEP does not apply: the exposure was more than 72 hours ago.)","must_include":["Do not start PrEP now / defer","Suspected acute HIV infection","Repeat HIV test after 4 weeks"],"must_not_include":["Start PrEP today because the test is negative","Give PEP for a 10-day-old exposure"],"check":"verified","sources":[{"id":"prep-2025-box-ahi-signs-suspicion","label":"PrEP 2025 p.37","doc":"PrEP Implementation Guidelines 2025","pages":"37","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > Acute HIV Infection (AHI) Assessment","text":"> **Boxes 11-12. Acute HIV infection (AHI): common signs and symptoms, and when to suspect AHI and defer PrEP**\n>\n> Box 11. Common signs and symptoms of AHI: fever; swollen lymph glands; skin rash; headache; sore throat; aches and pains; mouth sores.\n> Box 12. Suspicion of AHI:\n> - If the client has symptoms of AHI (currently or in the past fourteen days) AND has been exposed to HIV in the 14 days prior to the HIV test, defer PrEP and repeat the HIV test after four weeks to reassess HIV status.\n> - PEP should be provided if exposure is reported within 72 hours."},{"id":"prep-2025-0088","label":"PrEP 2025 p.37-38","doc":"PrEP Implementation Guidelines 2025","pages":"37-38","heading":"3 PrEP Delivery > 3.2 PrEP Initiation Visit > Component 2: PrEP Eligibility Assessment > Acute HIV Infection (AHI) Assessment","text":"- Defer PrEP for four weeks and provide HIV exposure reduction counseling, as well as STI screening, diagnosis, and management, if available.\n- Repeat HIV testing after four weeks; if the client is HIV negative and meets other criteria for PrEP use, the client can start PrEP.\n\nHIV if acquired beyond 28 days ago. The client should also be aware that while they do not have symptoms of AHI, they could be pre-symptomatic or be part of the one-third of individuals who do not develop symptoms of AHI within two to four weeks of acquiring HIV."},{"id":"prep-2025-fig-annex1-rule-out-ahi","label":"PrEP 2025 p.63","doc":"PrEP Implementation Guidelines 2025","pages":"63","heading":"6 Annexes > Annex 1: Job Aid to Rule Out Acute HIV Infection","text":"### Annex 1. Job aid to rule out acute HIV infection (AHI) before PrEP: cold/flu symptoms in past 14 days plus HIV exposure in past 14 days → defer PrEP and retest in 4 weeks\n\n1. In the past 14 days, have you had any of the following 'cold' or 'flu' symptoms? (yes/no for each): sore throat; fever; night sweats; swollen glands; mouth ulcers; headache; rash; generalised body rash; fatigue.\n2. Is there at least one symptom and a recent exposure to HIV?\n   - In the past 14 days, has the client experienced any signs and/or symptoms of AHI? (yes/no)\n   - Has there been a potential exposure to HIV in the previous 14 days? (yes/no)\n3. If YES to both: defer PrEP and make an appointment for repeat HIV testing in four weeks. Document the appointment date on the PrEP client appointment card.\n   If NO to either one: determine if the client meets eligibility criteria for PrEP. If yes, initiate the client's preferred PrEP method."}]},{"id":"Q043","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Drug interactions","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman on rifampicin-based TB treatment wants injectable PrEP. Can she start CAB-LA or lenacapavir?","original_reference":"No to both while on rifampicin: it significantly reduces cabotegravir and lenacapavir levels. CAB-LA can be considered 2 weeks after rifampicin/rifapentine is completed. She should not initiate LEN while on TB treatment. (A client already on LEN who starts rifampicin can continue with supplemental LEN dosing in consultation with a medical officer.) Oral PrEP or the ring are options.","question":"Woman on rifampicin-based TB treatment wants injectable PrEP. Can she start CAB-LA or lenacapavir?","change":"Unchanged.","reference":"Not while on rifampicin. Rifampicin (and rifapentine, rifabutin for LEN) significantly reduces cabotegravir and lenacapavir levels, so they should not be co-administered. CAB-LA can be considered 2 weeks after she completes rifampicin/rifapentine; she should not initiate LEN while on TB treatment. (A client already on LEN who starts rifampicin can continue with supplemental LEN doses.) Oral PrEP or the PrEP ring are options meanwhile.","must_include":["No to CAB-LA now","No to starting LEN now","CAB-LA can be considered 2 weeks after rifampicin is completed","Oral PrEP or ring as alternatives"],"must_not_include":["Start CAB-LA with a dose adjustment","Start LEN with supplemental doses (that applies only to clients already on LEN)"],"check":"verified","sources":[{"id":"prep-2025-tbl-cab-la-drug-interactions","label":"PrEP 2025 p.26, Table 6","doc":"PrEP Implementation Guidelines 2025","pages":"26-27","heading":"2 Overview of PrEP Products > 2.3 CAB-LA Injectable PrEP > CAB-LA and Other Drug Interactions","text":"### Table 6. CAB-LA (cabotegravir) drug interactions: anticonvulsants and rifampicin/rifapentine contraindicated; hormones safe; methadone, rifabutin, high-dose aspirin cautions\n\n**CAB-LA should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Anticonvulsants: carbamazepine<br/>- oxcarbazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| - Antimycobacterial medications: rifampicin<br/>- rifapentine | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy.<br/>- CAB-LA can be considered two weeks after a client completes rifampin or rifapentine. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Contraceptive hormones; gender-affirming hormones | No known interactions |\n\n**Clients may still be eligible for CAB-LA, but additional cautions may be warranted**\n\n| Drug | Interaction |\n| --- | --- |\n| Methadone; rifabutin | Clients could require medication dose adjustments to maintain the effectiveness of these medications while they are using CAB-LA. |\n| High-dose aspirin (>325 mg) | Clients using high-dose aspirin in the past week, other nonsteroidal anti-inflammatory drugs for pain, or anticoagulants or other antiplatelets may have a higher likelihood of bruising or bleeding at the injection site and should be made aware and counselled on mitigation strategies, if relevant. |"},{"id":"prep-2025-tbl-len-drug-interactions","label":"PrEP 2025 p.32-33, Table 7","doc":"PrEP Implementation Guidelines 2025","pages":"32-33","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > LEN and Other Drug Interactions","text":"### Table 7. LEN (lenacapavir) drug interactions: TB rifamycins, anticonvulsants, ketamine contraindicated; supplemental LEN with rifampicin; erectile dysfunction drugs; hormones safe\n\n**LEN should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Drugs used in the treatment of tuberculosis: rifabutin<br/>- rifampicin<br/>- rifapentine | - These drugs cause significant reduction of LEN concentration and therefore decrease its efficacy.<br/>- Clients should not initiate LEN if currently on TB treatment and may need to select a different PrEP or HIV prevention strategy.<br/>- For clients already on LEN and wanting to continue, supplemental LEN can be given to maintain adequate LEN concentrations (see Figure 10). |\n| - Medication used in the treatment of epilepsy: carbamazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of LEN concentration and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| Anaesthetic drugs: ketamine | - Ketamine concentrations may increase and may increase side effects associated with ketamine such as respiratory depression and hallucinations.<br/>- This potential interaction may persist after discontinuation of LEN.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n\n**Drug that might need a dose adjustment**\n\n| Drug | Interaction |\n| --- | --- |\n| Clients already on LEN and newly diagnosed with TB and starting rifampicin | - Clients already using LEN when diagnosed with TB can continue LEN, but a dose adjustment needs to be made in consultation with the MO.<br/>- Supplemental LEN dosing for co-administration with rifampicin-based TB regimens consists of repeating the LEN initiation dosing when rifampicin is started (see Figure 10) and continuing supplemental LEN every 6 months until completing TB treatment. |\n| - Drugs used in treatment of erectile dysfunction: avanafil<br/>- sildenafil<br/>- tadalafil<br/>- vardenafil | - There is a potential interaction which may persist after discontinuation of LEN.<br/>- The concentrations of these drugs may increase; start with a lower than regular dose and work up to higher doses until the desired effect is achieved.<br/>- Dose adjustments should be done by the MO. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Gender-affirming hormones and hormonal contraceptives | No known interactions |"},{"id":"prep-2025-fig-len-rifampicin","label":"PrEP 2025 p.33","doc":"PrEP Implementation Guidelines 2025","pages":"33","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > LEN and Other Drug Interactions","text":"### Figure 10. Maintaining LEN concentrations during rifampicin-based TB treatment: supplemental LEN doses (repeat initiation dosing) every 6 months alongside routine injections\n\nFigure 10 (timeline, January to January): routine LEN use with routine injections every 6 months. When a strong CYP3A inducer (rifampicin) is started (example: March), give supplemental LEN doses – repeat the initiation dosing (first day: injections + 2 tablets; second day: 2 tablets). While the CYP3A inducer continues (>6 months), give supplemental doses every 6 months (example: September) in addition to routine injections (example: June). After the strong CYP3A inducer is stopped (example: November), continue with routine LEN injections only.\nText: rifampicin is a strong CYP3A inducer and can reduce LEN concentrations below therapeutic levels. For the duration of concomitant LEN and rifampicin use, give routine LEN doses (6 months apart) and supplemental LEN doses (6 months apart). Repeating LEN initiation dosing (SC and PO) beginning Day 3 of LEN for PrEP maintains target LEN concentrations when rifampicin is started no sooner than 2 days after starting LEN for PrEP."}]},{"id":"Q044","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Lenacapavir","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A lenacapavir PrEP client returns 30 weeks after their last injection. How should they be managed?","original_reference":"Re-test for HIV and assess for PEP/AHI. Because more than 28 weeks have passed (without correct oral LEN bridging), restart the full initiation regimen: two subcutaneous injections plus 2 oral tablets on day 1 and 2 tablets on day 2, then schedule the next injection in 26 weeks. If ≤28 weeks had passed, they could simply receive the follow-up injection.","question":"Client on lenacapavir PrEP comes back 30 weeks after her last injection, no oral bridging. What do I do?","change":"Shortened; content unchanged.","reference":"Re-test for HIV and clinically reassess (PEP indication, suspected acute HIV infection). Because more than 28 weeks have passed without bridging, restart the initiation regimen: day 1, two subcutaneous injections plus 2 oral LEN tablets (300 mg each); day 2, two more tablets; then schedule the next injection in 26 weeks. (Within 28 weeks she would simply have received the follow-up injection.)","must_include":["Re-test for HIV first","More than 28 weeks: restart the initiation regimen","Day 1: 2 injections + 2 tablets; day 2: 2 tablets","Next injection in 26 weeks"],"must_not_include":["Just give the routine follow-up injection","Stop LEN permanently"],"check":"verified","sources":[{"id":"prep-2025-0070","label":"PrEP 2025 p.30-31","doc":"PrEP Implementation Guidelines 2025","pages":"30-31","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > Missing an Injection","text":"## **Missing an Injection**\n\nAdherence to the injection schedule is important for effective use of LEN. A client who misses an injection and wants to continue LEN, should return to the site as soon as they are able. Before resuming or restarting LEN injections in a client delayed in returning, providers should re-test for HIV and clinically re-assess in case PEP is indicated or there is a suspicion of AHI. The amount of time elapsed since their last injection will determine how to proceed, as follows:\n* If ≤ 28 weeks (6 months plus 14 days) elapsed since prior injection, resume with bi-annual follow up injection today, schedule a subsequent follow-up injection in 6 months.\n* If >28 weeks elapsed since prior injection, restart with LEN loading doses over two days (Day 1: re-initiation injections 1 & 2 and 2 oral LEN loading tablets; Day 2: two oral LEN loading tablets. Schedule a subsequent follow-up injection in 6 months."},{"id":"prep-2025-fig-len-bridging","label":"PrEP 2025 p.31","doc":"PrEP Implementation Guidelines 2025","pages":"31","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > Bridging for an Anticipated Delayed Follow-up Injection","text":"### Figure 9. Maintaining LEN concentrations with oral bridging (LEN 300 mg weekly) when a follow-up injection will be delayed; restart from Day 1 if >28 weeks\n\nFigure 9 (curve of mean LEN plasma concentration over 65 weeks, log scale):\n- LEN for PrEP initiation regimen on Day 1 and Day 2 (injections + oral loading) keeps concentrations above the protective level (IQ4).\n- If the next injection cannot be given within the 24–28-week window: oral bridging with LEN 300 mg PO once weekly, starting around week 26, keeps concentrations up.\n- Resume LEN subcutaneous injections 7 days after the last oral LEN dose (gap must not exceed 7 days).\n- If >28 weeks have elapsed since the last injection and bridging tablets have not been taken, restart LEN for PrEP from Day 1.\nBridging is only for exceptional circumstances, for short periods, not exceeding three months."},{"id":"prep-2025-tbl-annex3-len-missed","label":"PrEP 2025 p.67-68","doc":"PrEP Implementation Guidelines 2025","pages":"67-68","heading":"6 Annexes > Annex 3: Scenarios for Clients Missing LEN Oral Loading Dose or LEN Injection","text":"### Annex 3. Missed LEN day-2 oral loading dose, unplanned missed LEN follow-up injection (<28 or >28 weeks, restart package), planned postponement with weekly oral LEN 300 mg bridging\n\n**Missed oral LEN loading dose on day 2**\n\n| Missed / postponed dose | Time since prior dose | Recommended action for provider |\n| --- | --- | --- |\n| Missed day-2 oral LEN dose (2 × 300 mg) | ≥24 hours since initiation injections | Encourage the client to take the 2 oral LEN tablets as soon as remembered. |\n\n**Unplanned missed injection visits**\n\n| Missed / postponed dose | Time since prior dose | Recommended action for provider |\n| --- | --- | --- |\n| Follow-up injection | <28 weeks since last injection | Proceed with the follow-up injection that day and schedule the subsequent follow-up injection 26 weeks later. |\n| Follow-up injection | >28 weeks since last injection | Rescreen for potential restart and, if clinically eligible:<br/>- Administer initiation injections 1 and 2<br/>- Give oral LEN 300 mg, 2 tablets<br/>- Provide oral LEN 300 mg, 2 tablets for the client to take at home the following day<br/>- Provide an HIVST for the client to use after 4 weeks<br/>- Reschedule the next appointment after 26 weeks (±14 days) |\n\n**Planned postponed injection visits**\n\n| Missed / postponed dose | Time since prior dose | Recommended action for provider |\n| --- | --- | --- |\n| Follow-up injection | <28 weeks since last injection | Prescribe up to 90 days of weekly oral LEN 300 mg to bridge the gap in the follow-up schedule.\\* Continue with the next LEN follow-up injection. |\n| Follow-up injection | >28 weeks since last injection | If oral LEN was taken weekly and the last oral LEN dose was taken <7 days ago, continue with LEN continuation injections and schedule follow-up after 26 weeks.<br/>If oral LEN was not taken weekly during the bridging period and/or the last oral LEN dose was >7 days ago, restart the LEN initiation package (subcutaneous LEN and 2 × 300 mg oral LEN on day 1, and 2 × 300 mg oral LEN on day 2). |\n\n*Clients who wish to remain on LEN and anticipate needing to postpone their follow-up visit by 7 days or more may be given oral LEN as a 'bridge' between follow-up injections. There is no specific maximum duration for oral LEN bridging, but 90 days may be a reasonable limit, given that HIV retesting should occur quarterly. Providers should know in advance how a postponed follow-up injection will be managed to prescribe the correct volume of oral LEN."}]},{"id":"Q045","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Dapivirine ring","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How effective is the dapivirine vaginal ring, and who should not use it?","original_reference":"About 50% reduction in HIV risk during vaginal sex (more with continuous use). It must be in place 24 hours before it is fully effective. Not for people assigned male at birth, for anal-sex or needle-sharing exposure, for those using contraceptive vaginal rings or diaphragms, or for those allergic to dapivirine. Extra pregnancy/postnatal contraindications include active labour, vaginal bleeding, ruptured membranes, cerclage and intrauterine infection.","question":"Woman using a contraceptive vaginal ring wants the dapivirine PrEP ring as well. Can she have it?","change":"Was 'how effective is the ring and who should not use it'; now one client with a contraindication.","reference":"No. Women using contraceptive vaginal rings or a diaphragm should not be given the PrEP ring. Offer another PrEP method (oral PrEP, CAB-LA or LEN, if eligible). Other contraindications: people assigned male at birth, exposure through anal sex or needle sharing, and allergy to dapivirine.","must_include":["No","Contraceptive vaginal ring (or diaphragm) is a contraindication","Offer another PrEP method"],"must_not_include":["She can use both rings"],"check":"verified","sources":[{"id":"prep-2025-0033","label":"PrEP 2025 p.18","doc":"PrEP Implementation Guidelines 2025","pages":"18","heading":"2 Overview of PrEP Products > 2.2 Dapivirine Vaginal Ring (PrEP Ring) > Contraindications for PrEP Ring Use","text":"# Contraindications for PrEP Ring Use\n\nIn addition to the general contraindications for PrEP, the ring should not be provided to:\n- Individuals assigned male at birth\n- Individuals exposed to HIV through anal sex\n- Individuals exposed to HIV through needle sharing\n- Allergy or hypersensitivity to active substances or other substances listed in the product information sheet\n- Women using contraceptive vaginal rings or diaphragm.\n- For PBFW, there are additional contraindications for the ring as shown in table 3:"}]},{"id":"Q046","area":"HIV prevention: PrEP and PEP","document":"PrEP Implementation Guidelines 2025","topic":"Renal monitoring","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A 52-year-old on oral PrEP has an estimated creatinine clearance of 55 mL/min. What should be done?","original_reference":"Stop oral PrEP once the elevation is confirmed (CrCl <60 mL/min), evaluate other causes of raised creatinine with a medical officer, recheck creatinine for 1–3 months, and restart if CrCl returns above 60. The PrEP ring or injectables, which need no kidney monitoring, can be offered.","question":"52-year-old on oral PrEP, estimated creatinine clearance 55 mL/min (confirmed). What do I do?","change":"Added 'confirmed' to match the guideline's stopping rule.","reference":"Stop oral PrEP: it is stopped when a creatinine elevation is confirmed and the estimated CrCl falls below 60 mL/min. Look for other causes with the medical officer, recheck creatinine for another 1-3 months, and restart oral PrEP if CrCl returns above 60 mL/min. Other methods (PrEP ring, CAB-LA, LEN) do not carry this kidney restriction and can be offered.","must_include":["Stop oral PrEP","Threshold: CrCl <60 mL/min","Evaluate other causes with a medical officer","Recheck for 1-3 months; restart if CrCl >60"],"must_not_include":["Continue oral PrEP because 55 is acceptable","Only repeat creatinine in 6 months"],"check":"verified","sources":[{"id":"prep-2025-box-creatinine-clearance-apri","label":"PrEP 2025 p.55","doc":"PrEP Implementation Guidelines 2025","pages":"55","heading":"4 Management of Clients in Specific Situations > 4.1 Management of Clients with Elevated Creatinine Levels","text":"> **Boxes 15-17. Creatinine clearance formula (Cockcroft-Gault, µmol/L: ×1.23 men, ×1.04 women), management of creatinine elevation on oral PrEP, causes of renal insufficiency, APRI score for hepatitis B**\n>\n> Box 15. Calculating creatinine clearance (ml/min):\n> - Male: (140 − age) × weight in kg × 1.23 ÷ serum creatinine (µmol/L)\n> - Female: (140 − age) × weight in kg × 1.04 ÷ serum creatinine (µmol/L)\n> In case of creatinine elevation:\n> - Stop oral PrEP if creatinine elevation is confirmed and estimated creatin
