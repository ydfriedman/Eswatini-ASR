ilable in text.","question":"pregnant lady bleeding down there at 30 weeks, about a cup full, what now","change":"Reference updated: the ANC management table is now in the chunks.","reference":"Recognise antepartum haemorrhage (bleeding from 28 weeks): about a cup (~250 mL) without shock is a major haemorrhage (50-1000 mL). Any bleeding in pregnancy is serious. Shout for help, ABC, vital signs and urgent Hb, 2 large IV lines and fluids, oxygen if available, group and cross-match, and refer to hospital as soon as possible. Do not perform a digital vaginal examination until placenta praevia is ruled out.","must_include":["Antepartum haemorrhage","About a cup (~250 mL) = major haemorrhage (50-1000 mL)","Urgent referral to hospital","IV lines / resuscitation","No digital vaginal examination"],"must_not_include":["Treats it as minor","Do a vaginal examination","Send home"],"check":"corrected: old reference said the ANC management pages were not available in text; they are now","sources":[{"id":"anc-0084","label":"ANC p.37","doc":"Antenatal Care Guidelines","pages":"37","heading":"6.3 Antepartum haemorrhage > 6.3.1 Definition","text":"### *6.3.1 Definition*\n\nAntepartum haemorrhage (APH) is bleeding from or into the genital tract, occurring from 28 weeks of pregnancy until before delivery of the baby. **NOTE: ANY BLEEDING IN A PREGNANT WOMAN SHOULD BE TAKEN SERIOUSLY.**\n\nAPH may be classified as:\n* Spotting—staining, streaking, blood spotting on underwear or sanitary pad.\n* Minor hemorrhage—blood loss less than 50 ml that has settled.\n* Major hemorrhage—blood loss of 50-1000 ml with no signs of clinical shock\n* Massive hemorrhage—blood loss greater than 1000 ml and/or signs of clinical shock."},{"id":"anc-tbl-aph-diagnosis","label":"ANC p.38","doc":"Antenatal Care Guidelines","pages":"38","heading":"6.0 Managing Complications of Pregnancy > 6.3 Antepartum Haemorrhage > 6.3.3 Diagnosis of Antepartum Haemorrhage","text":"### Antepartum haemorrhage: abruptio placentae vs placenta praevia vs ruptured uterus – signs and symptoms; general emergency management (ABC, IV lines, no digital vaginal examination, refer)\n\nAPH is bleeding from or into the genital tract from 28 weeks of pregnancy until before delivery of the baby. Any bleeding in a pregnant woman should be taken seriously. Spotting; minor haemorrhage <50 ml that has settled; major haemorrhage 50–1000 ml with no signs of shock; massive haemorrhage >1000 ml and/or signs of clinical shock.\n\n| Probable diagnosis | Signs and symptoms |\n| --- | --- |\n| Abruptio placentae | - Vaginal bleeding<br/>- Intermittent or constant abdominal pain<br/>- Shock<br/>- Tender, tense uterus<br/>- Decreased or absent fetal movement<br/>- Fetal distress or absent fetal heart sounds |\n| Placenta praevia | - Vaginal bleeding (painless, bright red), may be precipitated by intercourse<br/>- Shock<br/>- Relaxed uterus<br/>- Fetal presentation not in the pelvis; malpresentation; lower uterine pole feels empty<br/>- Normal fetal condition |\n| Ruptured uterus | - Vaginal or intra-abdominal bleeding<br/>- Severe abdominal pain (may decrease after rupture)<br/>- Shock<br/>- Abdominal distension or free fluid<br/>- Abnormal uterine contour<br/>- Tender abdomen<br/>- Easily palpable fetal parts<br/>- Absent fetal movement and fetal heart sounds<br/>- Rapid maternal pulse |\n\n**Management (applies to every row):** General management:<br/>Shout for help! (Inyandzaleyo!)<br/>- Follow A, B, C: airway clear, breathing, circulation.<br/>- Assess the haemodynamic status of the patient.<br/>- Vital signs: pulse, blood pressure; do urgent ward Hb.<br/>- NOTE: tachycardia should be taken seriously even in a stable-looking patient; also confusion and restlessness.<br/>- Resuscitate as appropriate: insert 2 large IV lines; correct hypovolaemia using normal saline or Ringer's lactate; strict fluid balance chart, insert Foley's catheter, monitor input and output; if available give oxygen 4–6 L per minute by face mask; blood grouping and cross-match, FBC.<br/>Refer the patient to hospital as soon as possible.<br/>NOTE: DO NOT PERFORM DIGITAL VAGINAL EXAMINATION UNTIL PLACENTA PRAEVIA IS RULED OUT."}]},{"id":"Q146","area":"Pregnancy and antenatal care","document":"ANC / STI","topic":"Critique of guidelines","type":"edge-case","category":"opinion-judgment","expected":"stay-grounded","safety":"no","original_question":"The ANC and STI guidelines disagree about syphilis retesting. Which one is wrong?","original_reference":"Avoid declaring one 'wrong'; explain both (every 8 weeks vs 3 months), note dates/versions, and suggest following the most recent official guidance or escalating to the program.","question":"The ANC and STI guidelines disagree about syphilis retesting. Which one is wrong?","change":"Unchanged (behaviour test).","reference":"Avoid declaring one 'wrong'; explain both (every 8 weeks vs 3 months), note dates/versions, and suggest following the most recent official guidance or escalating to the program.","must_include":["Does not declare one wrong","States both (every 8 weeks vs after 3 months)","Suggests following the most recent official guidance / escalate"],"must_not_include":["Declares one document wrong","Misattributes which document says what"],"check":"verified","sources":[{"id":"anc-0047","label":"ANC p.24","doc":"Antenatal Care Guidelines","pages":"24","heading":"3.4 Point of care tests","text":"## **3.4 Point of care tests:**\n\nAll point of care tests must be done as stipulated in the contact schedule or in the next contact if it was missed.\n\n### **RPR test for syphilis.**\n\n* Every pregnant woman is tested for syphilis at the first antenatal contact, and retest should be done every 8 weeks. If RPR positive give one (1) dose Benzathine Penicillin 2.4mu IM stat, then weekly x 2 doses. Encourage partner tracing and treatment.\n* If hyper-sensitive to benzathine penicillin, refer to STI guidelines for treatment\n* Take blood for TPHA in the next contact if RPR positive and treated in the previous contact."},{"id":"sti-vh-draft-2026-txt-p78-t0208","label":"STI 2026 draft p.78-79","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"78-79","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1.2 Syphilis in pregnancy","text":"## 7.1.2 Syphilis in pregnancy\n\nThe clinical symptoms of syphilis are not altered by pregnancy. Since asymptomatic adult syphilis infection is common, all pregnant women should be screened for syphilis. This can reduce the complications of congenital syphilis. A rapid plasma reagent (RPR) test should be routinely done on pregnant mothers at first contact with the health care provider and treatment should be instituted if the RPR result is reactive and the partner should be treated as well. If RPR test is negative repeat after 3 months."}]},{"id":"Q172","area":"Pregnancy and antenatal care","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Asthma in pregnancy","type":"clinical","category":"false-premise","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"28 weeks pregnant, asthma well controlled on budesonide. She wants to stop the inhaler to protect the baby. Should she?","change":"New question: tests a common safety concern (pregnancy-area question).","reference":"No. Uncontrolled asthma is more dangerous to the foetus than any asthma medication. Continue the inhaled steroid at the effective dose throughout pregnancy and do not step down; budesonide has the most safety data. Salbutamol is safe as a reliever, and oral steroids can be used for exacerbations.","must_include":["Continue budesonide; do not stop or step down","Uncontrolled asthma is the bigger risk to the baby","Salbutamol is safe as a reliever"],"must_not_include":["Stop or reduce the inhaler in pregnancy"],"check":"verified","sources":[{"id":"ncdimh-0962","label":"NCDIMH p.335","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"335","heading":"Chapter 14: Pulmonology > Bronchial Asthma > Asthma in Pregnancy","text":"## **Asthma In Pregnancy**\n\n* Uncontrolled asthma is more dangerous to foetus than any asthma medication\n* Continue ICS at effective doses throughout pregnancy – do not step down\n* Preferred ICS: budesonide (most safety data); other ICS may continue if well controlled\n* SABA (salbutamol) safe throughout pregnancy as reliever\n* Montelukast may continue if essential for control\n* OCS may be used for exacerbations when needed"}]},{"id":"Q026","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Lactational amenorrhoea method","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What three conditions must all be met for a woman to rely on the lactational amenorrhoea method (LAM)?","original_reference":"Her menses have not returned since delivery; the baby is fully/exclusively breastfed on demand; and the baby is less than 6 months old. LAM is up to 98% effective under these conditions.","question":"Woman 4 months postpartum, exclusively breastfeeding on demand, periods not yet back. Can she rely on LAM for contraception?","change":"Was 'list the three conditions'; now one woman who meets them.","reference":"Yes. LAM can be relied on when all 3 conditions are met: her menses have not returned since delivery, the baby is fully/exclusively breastfed on demand, and the baby is less than 6 months old. She meets all three; LAM is up to 98% effective under these conditions. She will need another method once any condition stops applying (e.g. at 6 months).","must_include":["Yes","All 3 conditions: no menses, exclusive breastfeeding on demand, baby <6 months","Up to 98% effective"],"must_not_include":["LAM is not reliable at 4 months","LAM works with mixed feeding"],"check":"verified","sources":[{"id":"fp-2021-0046","label":"FP p.33-34","doc":"Family Planning Services Guidelines 2021","pages":"33-34","heading":"5 Natural Family Planning Method > 5.4 Lactational Amenorrhea Method","text":"## **5.4 LACTATIONAL AMENORRHEA METHOD**\n\n* A temporary family planning method based on the natural effect of breastfeeding on fertility.\n* LAM requires 3 conditions that should all be met:\n    1. The mother has not resumed menses since delivery\n    2. The baby is fully exclusively breastfed as per demand\n    3. The baby is less than 6 months’ old\n\n### **Mode of action**\n\n* Prevents ovulation\n\n* Hormones released during continuous breastfeeding suppress ovulation which makes pregnancy impossible.\n\n## **Effectiveness**\n\n* LAM is up to 98% effective, if practiced during exclusive breastfeeding period.\n* Effectiveness is reduced when exclusive breastfeeding is not practiced."}]},{"id":"Q027","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Progestin-only pills","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman on progestin-only pills (Microval) missed 2 pills. What should she do?","original_reference":"Take 2 pills as soon as possible, 2 more the next day, then return to her regular schedule on day 3, and use a backup method. (1 missed pill: take it ASAP and use backup for 2 days; 3 missed pills: don't try to replace them, use backup and come to the facility.)","question":"Woman on progestin-only pills (Microval) missed 2 pills. What should she do?","change":"Unchanged.","reference":"Take 2 pills as soon as possible and 2 more the next day, then return to her regular schedule on day 3, and use a backup method. (1 missed pill: take it as soon as possible, backup for 2 days; 3 missed pills: do not try to replace them, use backup and come to the facility.)","must_include":["2 pills as soon as possible","2 more pills the next day","Back to the regular schedule on day 3","Use a backup method"],"must_not_include":["Discard the pack and restart","Take one pill only","No backup needed"],"check":"verified","sources":[{"id":"fp-2021-tbl-p38-0058","label":"FP p.38","doc":"Family Planning Services Guidelines 2021","pages":"38","heading":"6 Hormonal Contraceptives > 6.2 Progesterone-Only Oral Pills (pops) > When a pill or more is missed","text":"### When a pill or more is missed (Number of Missed Pills, Action to be taken)\n\nWhen a pill or more is missed;\n\n| Number of Missed Pills | Action to be taken |\n| --- | --- |\n| 1 pill | She should take the pill as soon as she can then continue at the usual time. Use a backup method for 2 days after the missed pill. |\n| 2 pills | She should take 2 pills as soon as she can and take another 2 pills the next day then return to her regular schedule on the 3rd day. A backup method of contraception should be used. |\n| 3 pills | Do not attempt to replace as above; She should use a backup method of contraception and report to the health facility for professional help as soon as possible. |"}]},{"id":"Q028","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Combined hormonal contraception","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which combined hormonal methods should a 38-year-old woman who smokes 10 cigarettes a day avoid?","original_reference":"Women 35 and older who smoke (any amount) should not use COCs, the patch, or the combined vaginal ring. The monthly combined injectable is restricted for women ≥35 smoking 15 or more cigarettes a day, so it is not excluded at 10/day by this rule. Progestin-only methods are a good alternative.","question":"38-year-old woman, smokes 10 cigarettes a day, wants a combined hormonal method. Which can't she use?","change":"Rephrased in clinician wording; content unchanged.","reference":"Women aged 35 or older who smoke, regardless of how much, should not use combined oral contraceptives, the patch or the combined vaginal ring. The restriction on monthly combined injectables applies to women ≥35 who smoke 15 or more cigarettes a day, so at 10/day that rule does not exclude them. Progestin-only methods (pills, injectables, implants) are a good alternative; they can be used by smokers of any age.","must_include":["No COCs","No patch","No combined vaginal ring","Monthly injectable restriction is for ≥15 cigarettes/day","Progestin-only methods are an option"],"must_not_include":["COCs are acceptable because she smokes fewer than 15 a day","Progestin-only methods are contraindicated in smokers"],"check":"verified","sources":[{"id":"fp-2021-0025","label":"FP p.21","doc":"Family Planning Services Guidelines 2021","pages":"21","heading":"2 Serving Diverse Population > 2.2 Women Near Menopause","text":"## **2.2 WOMEN NEAR MENOPAUSE**\n\nMenopause is reached when a woman ceases to ovulate, usually between the ages of 45 and 55. To be sure to avoid pregnancy, a woman should use contraception until she has had no menses for 12 months in a row.\n\n### *Special considerations about method choice*\n\n* Progestin-only methods (progestin-only pills, progestin-only injectables, implants) are a good choice for women who cannot use methods with estrogen.\n* Combined hormonal method\n    - Women age 35 and older who smoke regardless of how much should not use Combined Oral Contraceptives (COCs), the patch, or the combined vaginal ring.\n    - Women age 35 and older who smoke 15 or more cigarettes a day should not use monthly injectables.\n    - Women age 35 or older should not use COCs, monthly injectables, the patch, or the combined vaginal ring if they have migraine headaches (whether with migraine aura or not)."},{"id":"fp-2021-0077","label":"FP p.47","doc":"Family Planning Services Guidelines 2021","pages":"47","heading":"6 Hormonal Contraceptives > 6.3 PROGESTON-ONLY INJECTABLE CONTRACEPTIVES (POIs) > Who can use POIs: MEC > MEC Category 1","text":"### **MEC Category 1**\n\nNearly all women can use progestin-only injectables safely and effectively, including women who:\n* Are of all parity\n* Are of any age, including adolescents and women over 40-year-old\n* Have just had an abortion or miscarriage\n* Smoke cigarettes, regardless of woman’s age or number of cigarettes smoked\n* Are breastfeeding, starting as soon as 6 weeks after childbirth\n* Are living with HIV, whether or not on antiretroviral therapy"},{"id":"fp-2021-0117","label":"FP p.64","doc":"Family Planning Services Guidelines 2021","pages":"64","heading":"6 Hormonal Contraceptives > 6.6 IMPLANTS > Who can use","text":"## **Who can use**\n\nNearly all women can use implants safely and effectively\n\nMEC Category 1\n\n* Parous and nulliparas\n* Woman of any age, including adolescents and women over 40 years old\n* Women who have just had an abortion, miscarriage, or ectopic pregnancy\n* Women who smoke cigarettes, regardless of woman’s age or number of cigarettes smoked\n* Breastfeeding women\n* Those with anemia or had history of anaemia\n* Those with varicose veins\n* Women living with HIV, whether or not on antiretroviral therapy"}]},{"id":"Q029","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Combined injectables","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Can a woman who is exclusively breastfeeding a 2-month-old start a monthly combined injectable (e.g. Mesigyna)?","original_reference":"No. Delay the first CIC injection until 6 months after birth or until breast milk is no longer the baby's main food, whichever comes first; CICs affect milk quality and quantity. Progestin-only methods can be used instead.","question":"Exclusively breastfeeding mother, baby 2 months old, asks for the monthly injectable (Mesigyna). Can she start?","change":"Shortened; content unchanged.","reference":"No, not yet. For an exclusively breastfeeding woman less than 6 months after birth, delay the first combined injectable until 6 months after giving birth or until breast milk is no longer the baby's main food, whichever comes first. Offer a progestin-only method instead.","must_include":["No / delay","Until 6 months after birth or breast milk no longer the main food, whichever comes first","Progestin-only method as an alternative"],"must_not_include":["She can start now","She can start at 6 weeks postpartum"],"check":"verified","sources":[{"id":"fp-2021-0105","label":"FP p.59-60","doc":"Family Planning Services Guidelines 2021","pages":"59-60","heading":"6 Hormonal Contraceptives > 6.5 COMBINED INJECTABLES CONTRACEPTIVES (CICs) > When to start CICs > Exclusive breastfeeding","text":"## <u>Exclusive breastfeeding<\/u> (CICs)\n\n#### *Less than 6 months after giving birth*\n\n* Delay first injection until 6 months after giving birth or when breast milk is no longer the baby’s main food, whichever comes first.\n\n#### *More than 6 months after giving birth*\n\n* If monthly bleeding has not returned, start injectables any time if it is reasonably certain woman is not pregnant.\n* She will need a backup method for the first 7 days after the injection.\n\n* If her menses have returned, she can start injectables as advised for women having menstrual cycles"}]},{"id":"Q030","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Implants","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"Which contraceptive implants are described in the guidelines and how long does each last?","original_reference":"Jadelle: 2 levonorgestrel rods, effective for 5 years. Implanon NXT (Nexplanon): 1 etonogestrel rod, labelled for up to 3 years. Heavier women using levonorgestrel implants may want earlier replacement.","question":"How long does a Jadelle implant last compared with Implanon NXT?","change":"Kept general; removed 'described in the guidelines'.","reference":"Jadelle (2 levonorgestrel rods) is effective for 5 years; Implanon NXT/Nexplanon (1 etonogestrel rod) is labelled for up to 3 years. In heavier women, the effectiveness of levonorgestrel implants (Jadelle, Levoplant) may fall near the end of the labelled duration, so they may want earlier replacement.","must_include":["Jadelle: 5 years","Implanon NXT: up to 3 years"],"must_not_include":["Implanon lasts 5 years","Jadelle lasts 3 years"],"check":"verified","sources":[{"id":"fp-2021-0111","label":"FP p.61-62","doc":"Family Planning Services Guidelines 2021","pages":"61-62","heading":"6 Hormonal Contraceptives > 6.6 Implants","text":"## **6.6 IMPLANTS**\n\n* Implants are small plastic rods, each about the size of a matchstick, that release a progestin like the natural hormone progesterone in a woman’s body.\n* Do not contain oestrogen, and so can be used throughout breastfeeding and by women who cannot use methods with estrogen.\n\n## **Types of implants**\n\n* Jadelle: 2 rods containing levonorgestrel, effective for 5 years\n* Implanon NXT (Nexplanon): 1 rod containing etonogestrel, labelled for up to 3 years of use.\n\n## **Mode of action**\n\n* Prevents ovulation\n* Thickens cervical mucus on the cervix, which blocks sperm from reaching an egg)\n\n## **Effectiveness**\n\n* Most effective and long lasting reversible method\n* About 99% effective\n* For heavier women, the effectiveness of Jadelle and Levoplant may decrease near the end of the duration of use stated on the label. These users may want to replace their implants sooner."}]},{"id":"Q031","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"IUCD","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman wants a copper IUCD after delivery but it is now day 4 postpartum. When can it be inserted?","original_reference":"Postpartum IUCD can be inserted within 48 hours of birth (including caesarean). After 48 hours, delay insertion until 4 weeks or more after birth.","question":"Woman wants a copper IUCD; she delivered 4 days ago. When can it go in?","change":"Shortened; content unchanged.","reference":"Not now. A postpartum IUCD can be inserted within 48 hours of birth (including caesarean delivery); after 48 hours, delay insertion until 4 weeks or more after birth. At day 4 she should come back from 4 weeks postpartum (if her menses have not returned, any time between 4 weeks and 6 months, reasonably certain she is not pregnant).","must_include":["Not now","Within 48 hours of birth, otherwise wait","From 4 weeks after birth"],"must_not_include":["Insert now at day 4","Wait until 6 weeks / 6 months as the rule"],"check":"verified","sources":[{"id":"fp-2021-0133","label":"FP p.70","doc":"Family Planning Services Guidelines 2021","pages":"70","heading":"7 Intrauterine Contraception Device > When to start IUCDs > Switching from another method","text":"### <u>Switching from another method<\/u>\n\n* Immediately, if she has been using the method consistently and correctly or if it is otherwise reasonably certain she is not pregnant.\n* If she is switching from an injectable, she can have the IUCD inserted when the next injection would have been given.\n* No need to wait for her next menstrual period.\n* No need for a backup method.\n\n### <u>Soon after childbirth (regardless of breastfeeding status)<\/u>\n\n* Any time within 48 hours after giving birth, including by caesarean delivery\n* If it is more than 48 hours after giving birth, delay until 4 weeks or more after giving birth."},{"id":"fp-2021-0135","label":"FP p.71","doc":"Family Planning Services Guidelines 2021","pages":"71","heading":"7 Intrauterine Contraception Device > When to start IUCDs","text":"## <u>Exclusive breastfeeding<\/u> (IUCD)\n\n### *Less than 6 months after giving birth*\n\n* If the IUCD is not inserted within the first 48 hours and her menses have not returned, she can have the IUCD inserted any time between 4 weeks and 6 months after giving birth.\n* If her menses have returned, she can have the IUCD inserted as advised for women having menstrual cycles.\n* No need for a backup method.\n\n### *More than 6 months after giving birth*\n\n* If her menses have not returned, she can have the IUCD inserted any time it is reasonably certain she is not pregnant.\n* If her menses have returned, she can have the IUCD inserted as advised for women having menstrual cycles\n* No need for a backup method.\n\n## <u>Mixed feeding or not breastfeeding<\/u> (IUCD)\n\n### *More than 4 weeks after giving birth*\n\n* If her menses have not returned, she can have the IUCD inserted if it can be determined that she is not pregnant\n* No need for a backup method.\n* If her menses have returned, she can have the IUCD inserted as advised for women having menstrual cycles.\n\n## <u>Amenorrhea (not related to childbirth or breastfeeding)<\/u>\n\n* Any time if it can be determined that she is not pregnant\n* No need for a backup method."}]},{"id":"Q032","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Emergency contraception","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What emergency contraception options are available, and within what time window should they be used?","original_reference":"ECPs should be taken within 72 hours of unprotected sex (sooner is more effective): levonorgestrel (Postinor 0.75 mg, 2 tablets stat), ulipristal acetate, Microval/Microlut 50 pills stat, or a combined (Yuzpe) regimen of Lofemenal 4 pills or Ovral 2 pills repeated after 12 hours. A copper IUCD can be inserted within 5 days of unprotected sex. For women over 70 kg, a copper IUCD is recommended because ECP effectiveness is reduced.","question":"Woman had unprotected sex 4 days ago (about 96 hours). Is it too late for emergency contraception?","change":"Was a list question (all EC options and windows); now one case that forces the right choice.","reference":"Too late for emergency contraceptive pills: the guideline gives ECPs within 72 hours of unprotected sex (the sooner, the more effective). A copper IUCD can still be inserted, as it can be used within 5 days of unprotected sex (prescribed and inserted by a doctor after pregnancy and STI are ruled out).","must_include":["ECPs: within 72 hours, so outside the window","Copper IUCD within 5 days is still an option"],"must_not_include":["ECPs work up to 5 days","Too late for any emergency contraception"],"check":"verified; the guideline gives 72 hours for all ECPs including ulipristal (no 120-hour window stated)","sources":[{"id":"fp-2021-0148","label":"FP p.76-77","doc":"Family Planning Services Guidelines 2021","pages":"76-77","heading":"8 Emergency Contraception > When to use","text":"## **When to use**\n\nAnytime within 72 hours of unprotected sex, the sooner after unprotected sex that ECPs are taken, the more effective they are. ECPs can be used any time a woman is worried that she might become pregnant, for example:\n* After sexual assault\n* Within 72 hours of unprotected sex\n* When a condom was used incorrectly, slipped, or broke; partners incorrectly used a fertility awareness method e.g. failed to abstain or to use another method during the fertile days; Man failed to withdraw, as intended, before he ejaculated\n* Woman has had unprotected sex after she has missed 3 or more combined oral contraceptive pills or has started a new pack 3 or more days late; IUCD has come out of place\n* Woman has had unprotected sex when she is more than 4 weeks late for her repeat injection of DMPA, more than 2 weeks late for her repeat injection of NET-EN, or more than 7 days late for her repeat monthly injection."},{"id":"fp-2021-0143","label":"FP p.73","doc":"Family Planning Services Guidelines 2021","pages":"73","heading":"8 Emergency Contraception","text":"## 8. **EMERGENCY CONTRACEPTION**\n\nEmergency contraceptive pills (ECPs) help a woman avoid pregnancy after she has sex without contraception (unprotected sexual intercourse). It is not a routine contraceptive but only used in cases of unprotected sex, torn condom or sexual assault.\n\n### **Types of emergency contraceptives**\n\n* Progestogen only pills; these should be given as a single dose regimen. Examples:\n    - Postinor or Pregnon (0.75mg Levonorgestrel) given as 2 pill stat.\n    - Ulipristal acetate, give 2 pills stat.\n    - Microval (0.03mg Levonorgestrel) – 50 pills stat\n    - Microlut (0.03mg Levonorgestrel) – 50 pills stat\n* Combined hormonal contraceptive pills; these should be given as a two dose regimen 12hrs apart.\n    - Lofemenal (0.3 mg norgestrel + 0.03mg ethinyl estradiol) – 4 pills stat then repeat after 12 hours\n    - Ovral (norgestrel 500µg + 50 µg of ethinyl estradiol) – 2 pills stat then repeat after 12 hours\n* IUCD:\n    - The Copper IUCD can be inserted within 5 days of unprotected sex.\n    - However, it can only be prescribed and given by a medical doctor after conclusive rule out of potential pregnancy and STI presence."}]},{"id":"Q033","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Emergency contraception / starting methods","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"After a client takes ulipristal acetate (UPA) emergency contraception, when can she start combined oral contraceptives?","original_reference":"On the 6th day after taking UPA, because COCs and UPA interact. She should use a backup method from when she takes UPA until she has taken COCs for 7 days.","question":"Client took ulipristal (UPA) emergency contraception yesterday and wants to start combined pills. When can she start?","change":"Turned into a case; content unchanged.","reference":"On the 6th day after taking UPA, because COCs and UPA interact (if both are present, one or both may be less effective). Give her the pills and tell her to start on day 6. She should use a backup method from when she took UPA until she has taken COCs for 7 days.","must_include":["Start on the 6th day after UPA","Interaction between UPA and COCs","Backup method until 7 days of COCs"],"must_not_include":["Start COCs immediately (that applies to levonorgestrel/combined ECPs, not UPA)","No backup method needed"],"check":"verified","sources":[{"id":"fp-2021-0095","label":"FP p.55","doc":"Family Planning Services Guidelines 2021","pages":"55","heading":"6 Hormonal Contraceptives > 6.4 COMBINED ORAL CONTRACEPTIVES (COCs) > After taking emergency contraceptive pills (ECPs) > After taking Postinor or ulipristal acetate (UPA) ECPs","text":"### *After taking Postinor or ulipristal acetate (UPA) ECPs:*\n\n* She can start or restart COCs on the 6th day after taking UPA-ECPs. No need to wait for her next monthly period.\n* COCs and UPA interact.\n    - If COCs are started sooner, and thus both are present in the body, one or both may be less effective.\n* Give her a supply of pills and tell her to start them on the 6th day after taking the UPA-ECPs.\n* She will need to use a backup method from the time she takes the UPA-ECPs until she has been taking COCs for 7 days.\n* If she does not start on the 6th day but returns later for COCs, she may start at any time if it is reasonably certain she is not pregnant."}]},{"id":"Q034","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Adolescents","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"Do adolescents need parental consent to receive contraception, and are any methods unsafe for them?","original_reference":"All contraceptives are safe for adolescents and youth, and contraceptive services should be available without requiring authorization from a parent or guardian.","question":"A 15-year-old comes alone asking for an implant. Do I need a parent's consent?","change":"Was 'do adolescents need consent and are any methods unsafe'; now one adolescent.","reference":"No. Contraceptive services should be available to adolescents without requiring authorization from a parent or guardian, and all contraceptives, including implants, are safe for adolescents and youth. The HIV guideline also notes that anyone aged 12 or older can give informed consent for family planning under the Child Welfare Act.","must_include":["No parental consent needed","All contraceptives (including implants) are safe for adolescents","Age 12+ can consent to family planning"],"must_not_include":["Parental or guardian consent is required","Implants are not suitable for adolescents"],"check":"verified; the HIV 2022 key message on the same page says consent 'should be given by parents, guardians...' in the best interest of the child, which an answer could misapply","sources":[{"id":"fp-2021-0024","label":"FP p.20-21","doc":"Family Planning Services Guidelines 2021","pages":"20-21","heading":"2 Serving Diverse Population > 2.1 Adolescents and Youth","text":"### **2.1 ADOLESCENTS AND YOUTH**\n\nAll contraceptives are safe for adolescents and youth. Unmarried and married youth may have different sexual and reproductive health needs. Appropriate sexual and reproductive health services, including contraception, should be <u>available<\/u> and <u>accessible<\/u> to all adolescents without requiring authorization from a parent or guardian by law, policy, or practice.\n\nMoreover, social and behavioural issues should be key considerations in the choice of contraceptive methods by adolescents. Method choice can also be influenced by factors such as irregular patterns of intercourse and the need to conceal sexual activity and contraceptive use. Therefore, proper education and counselling, prior to and at the time of method selection can help adolescents meet their specific contraceptive needs, make informed and voluntary decisions.\n\n*Youth Friendly services:*\n\n* Ensure confidentiality and privacy (however, explain that shared confidentiality may arise if an adolescent is referred for other services to other health care workers or other institutions).\n* Respect views and beliefs of adolescent if they are non-detrimental.\n* Have enough time to interact with adolescents.\n* Have the ability to communicate correct information with adolescents and keep the message simple. Use open communication and allow reflection on issues.\n* Be able to use interactive approaches.\n* Welcoming partners and include them in counselling, if the client desires\n* Speaking without expressing judgment (for example, say “You can” rather than “You should”).\n* Being aware of young people’s norms about gender and gently encourage positive, healthful norms.\n\n* Regularly train service providers on emerging issues"},{"id":"hiv-2022-txt-p228-t0438","label":"HIV 2022 p.228","doc":"Integrated HIV Management Guidelines 2022","pages":"228","heading":"Chapter 9: ART for Children and Adolescents > 9.13 Special Considerations for Adolescents > Health Care Consent and Assent for Children and Adolescents","text":"## Health Care Consent and Assent for Children and Adolescents\n\nAnyone 12 years or older can give informed consent for medical care such as HIV testing services (HTS), PrEP, PEP, family planning, or medical male circumcision according to the 2012 Swaziland Child Welfare Act, but not for HIV treatment.\nChildren younger than 12 years can provide informed consent for treatment if they are considered an emancipated minor or mature adult (i.e., they are the head of a household, a parent, or if pregnant, they are being treated for a sexually transmitted infection (STI), are accessing family planning services, and/or are sexually active).\nAlthough children and young adolescents less than 12 years may not give informed consent for HIV testing, their agreement should be sought via age-appropriate counselling.\nKey message: Consent for health services, including HIV care, should be given by parents, guardians, caregivers, health care workers or social workers in the best interest of the child. See consent considerations in Chapter 3."}]},{"id":"Q035","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Drug interactions with hormonal contraception","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman starting rifampicin-based TB treatment uses combined oral contraceptives. What should she be advised about her contraception?","original_reference":"Rifampicin (and rifabutin) may lower the effectiveness of COCs, so she needs a backup method (e.g. condoms) or should change method. The same applies to progestin-only pills and combined injectables, and to anti-epileptic drugs and some ARVs. Emergency contraceptive pills can still be used by clients on rifampicin (MEC category 1).","question":"Woman on combined pills is starting rifampicin-based TB treatment. What do I tell her about her contraception?","change":"Shortened; content unchanged.","reference":"Rifampicin (and rifabutin) may lower the effectiveness of COCs, so she needs a backup method (e.g. condoms) or a change of method. The same applies to progestin-only pills and monthly combined injectables. Emergency contraceptive pills can still be used by clients on rifampicin.","must_include":["Rifampicin may reduce COC effectiveness","Use a backup method or change method"],"must_not_include":["No interaction / no change needed","Stop TB treatment"],"check":"verified","sources":[{"id":"fp-2021-tbl-p50-0085","label":"FP p.50","doc":"Family Planning Services Guidelines 2021","pages":"50","heading":"6 Hormonal Contraceptives > 6.4 Combined Oral Contraceptives (COCs) > Advantages and disadvantages of using COCs","text":"### Combined Oral Contraceptives (COCs): Advantages and disadvantages of using COCs (Advantages, Disadvantages)\n\nAdvantages and disadvantages of using COCs\n\n| Advantages | Disadvantages |\n| --- | --- |\n| • Easy to use<br/>• Can be used from adolescence to menopause; by nulliparous and multiparous women; provided that no risk factors exist.<br/>Help protect against:<br/>• Risks of pregnancy<br/>• Cancer of the lining of the uterus (endometrial cancer)<br/>• Cancer of the ovary<br/>• Symptomatic pelvic inflammatory disease<br/>• Ovarian cysts<br/>• Iron-deficiency anaemia<br/>• Reduce menstrual cramps<br/>• Supresses menstrual bleeding problems<br/>• Reduce ovulation pain<br/>• Reduce excess hair on face or body<br/>• Minimises symptoms of polycystic ovarian syndrome (irregular period, acne, excess hair on face or body)<br/>• Reduce symptoms of endometriosis (pelvic pain, irregular bleeding) | • Does not protect against STIs and HIV infection.<br/>• Must be taken daily and at the same time<br/>• Require an individual to obtain regular supplies.<br/>• Effectiveness may be lowered if client is on anti-TB drugs (Rifampicin or Rifabutin therapy), anti-epilepsy treatment and some ARVs indicating a need for a backup method.<br/>• Effectiveness may also be lowered in the presence of diarrhoea and vomiting<br/>• Reduce milk production in breastfeeding women.<br/>• May cause mood changes and low libido to some women<br/>• Can increase the risk of Myocardial Infarction (MI) in women with existing risk factors such as smoking, Diabetes or hypertension. |"},{"id":"fp-2021-tbl-p51-0086","label":"FP p.51","doc":"Family Planning Services Guidelines 2021","pages":"51-52","heading":"6 Hormonal Contraceptives > 6.4 Combined Oral Contraceptives (COCs) > Who can use COCs","text":"### Combined Oral Contraceptives (COCs): Who can use COCs (MEC Category 1, MEC Category 2, MEC Category 3, MEC Category 4)\n\nWho can use COCs:\n\n| MEC Category 1 | MEC Category 2 | MEC Category 3 | MEC Category 4 |\n| --- | --- | --- | --- |\n| Nearly all women can use COCs safely and effectively, including women who:<br/>• Have or have not had children<br/>• Are of any age, including adolescents and women over 40 years old<br/>• After childbirth and during breastfeeding, after a period of time<br/>• Have just had an abortion, miscarriage, or ectopic pregnancy<br/>• Smoke cigarettes, if under 35 years old<br/>• Have anemia now or had in the past<br/>• Have varicose veins<br/>• Are living with HIV, whether or not on antiretroviral therapy | • Age above 40 years<br/>• Breastfeeding more than 6 months after delivery<br/>• Non-breastfeeding women 21 – 42 days with no risk of venous thromboembolism<br/>• Smoking and age less than 35 years<br/>• Obesity<br/>• History of p high blood pressure during pregnancy<br/>• Family history of DVT/PE<br/>• Major surgery without prolonged immobilization<br/>• Superficial thrombophlebitis<br/>• Uncomplicated Valvular heart disease<br/>• Systemic lupus erythematous (associated with severe thrombocytopenia or are on Immunosuppressive treatment)<br/>• Non-migraine headache (mild or severe) in continuing clients<br/>• Migraine headache without aura at age less than 35 years for Initiating clients<br/>• Unexplained vaginal bleeding before evaluation<br/>• Cervical intraepithelial neoplasia or cervical cancer awaiting treatment<br/>• Undiagnosed breast mass<br/>• Insulin dependent Diabetes Mellitus<br/>• Asymptomatic gall bladder disease<br/>• HIV treatment with NNRTIs and PIs | • Breastfeeding 6 weeks to 6 months after delivery<br/>• Acute Viral hepatitis<br/>• TB patients on Rifampicin or Rifabutin therapy<br/>• Anticonvulsant therapy (phenytoin, carbamazepine, barbiturates) | • Breastfeeding less than 6 weeks postpartum<br/>• Smoking and age more than 35 year (smoking more than 15 cigarettes/day)<br/>• Non-breastfeeding less than 21 days after delivery with or without risk of venous thromboembolism<br/>• Symptomatic gall bladder disease (medically treated and current)<br/>• Severe hypertension (systolic >160 or diastolic >100 mm Hg) and hypertension with vascular complications<br/>• Hypertension (history of hypertension, hypertension controlled on treatment, moderate hypertension)<br/>• History of DVT/PE or current DVT/PE or DVT/PE on anticoagulant therapy<br/>• Major surgery with prolonged immobilization<br/>• History of stroke<br/>• History of or current ischaemic heart disease<br/>• Complicated Valvular heart disease<br/>• Systemic Lupus Erythematosus with positive antiphospholipid antibodies<br/>• Migraine headache with aura at any age<br/>• Severe liver cirrhosis (decompensated)<br/>• Current breast cancer<br/>• Liver Cancer<br/>• Known thrombogenic mutation<br/>• Benign liver tumours |\n\nPrinted rotated across pp.40-41 of the guide (PDF pp.51-52); each column continues on the second page."},{"id":"fp-2021-tbl-p40-0060","label":"FP p.40","doc":"Family Planning Services Guidelines 2021","pages":"40-41","heading":"6 Hormonal Contraceptives > 6.2 Progesterone-Only Oral Pills (pops) > Who can use POPs: MEC","text":"### Who can use POPs: MEC (MEC Category 1, MEC Category 2, MEC Category 3, MEC Category 4)\n\nWho can use POPs: MEC Nearly all women can use POPs safely and effectively, including women who:\n\n| MEC Category 1 | MEC Category 2 | MEC Category 3 | MEC Category 4 |\n| --- | --- | --- | --- |\n| • Are breastfeeding (she can start immediately after childbirth)<br/>• Have or have not had children (Parous and nulliparous)<br/>• Are married or are not married<br/>• Are of any age, including adolescents and women over 40 years old<br/>• Have just had an abortion, miscarriage, or ectopic pregnancy<br/>• Smoke cigarettes, regardless of woman’s age or number of cigarettes smoked<br/>• Have anaemia presently or in the past • Have varicose veins<br/>• Are living with HIV, whether or not on antiretroviral therapy | • Elevated blood pressure (systolic >/= 160, diastolic >/= 100)<br/>• History of stroke for initiating clients<br/>• History of or current ischaemic heart disease for initiating clients<br/>• History of DVT or current DVT on anticoagulant therapy<br/>• Major surgery with prolonged immobilization<br/>• Systemic lupus erythematous (associated with severe thrombocytopenia or are on Immunosuppressive treatment) • Irregular, heavy or prolonged vaginal bleeding<br/>• Unexplained vaginal bleeding before evaluation<br/>• Undiagnosed breast mass | • Acute DVT or pulmonary embolism<br/>• History of or current Ischemic heart disease for continuing clients<br/>• History of stroke for continuing clients<br/>• Systemic Lupus Erythematosus with positive antiphospholipid antibodies<br/>• Epilepsy on certain anticonvulsants (phenytoin, carbamazepine, barbiturates etc).<br/>• TB patients on Rifampicin or Rifabutin therapy • ARV therapy with Ritonavir-boosted protease inhibitors<br/>• Headaches with aura at any age<br/>• Severe cirrhosis decompensated. | • Current breast cancer |\n\nPrinted rotated across pp.29-30 of the guide (PDF pp.40-41); the four category columns continue on the second page."},{"id":"fp-2021-tbl-p56-0099","label":"FP p.56","doc":"Family Planning Services Guidelines 2021","pages":"56","heading":"6 Hormonal Contraceptives > 6.5 Combined Injectable Contraceptives (CICs) > Advantages and disadvantages","text":"### Combined Injectable Contraceptives (CICs): Advantages and disadvantages (Advantages, Disadvantages)\n\nAdvantages and disadvantages\n\n| Advantages | Disadvantages |\n| --- | --- |\n| • Do not require daily action<br/>• Are private:<br/>No one else can tell that a woman is using contraception<br/>• Can be stopped at any time<br/>• Are good for spacing births | • Does not protect against STIs and HIV infection.<br/>• Requires injection monthly<br/>• Must be administered by a trained health service provider.<br/>• Effectiveness may be lowered if client is on anti-TB drugs (Rifampicin or Rifabutin therapy), anti-epilepsy treatment and some ARVs etc., indicating a need for a backup method.<br/>• Cannot be given to breastfeeding women with babies less than six months. It affects the quality and quantity of the milk production among breastfeeding women.<br/>• May affect the menstrual cycle |"},{"id":"fp-2021-tbl-p76-0147","label":"FP p.76","doc":"Family Planning Services Guidelines 2021","pages":"76","heading":"8 Emergency Contraception > Who can use ECPs","text":"### Emergency Contraception: Who can use ECPs (MEC Category 1, MEC Category 2)\n\nWho can use ECPs\n\n| MEC Category 1 | MEC Category 2 |\n| --- | --- |\n| Emergency contraceptives are safe and suited for use by all women, including:<br/>• Breastfeeding women<br/>• Past ectopic pregnancy<br/>• Rape cases<br/>• Obesity (effectiveness is reduced for women who weigh more than 70kg, a copper IUCD is recommended if a woman decides to use ECP)<br/>• Clients on anti TB treatment e.g. Rifampicin<br/>• Clients on anti-Psychotic treatment e.g. phenytoin, phenobarbital, carbamazepine<br/>• Clients on ARV treatment e.g. Efavirenz, nevirapine | • History of severe cardiovascular complications<br/>• Angina Pectoris<br/>• Migraine<br/>• Severe liver disease<br/>• Jaundice |"}]},{"id":"Q036","area":"Family planning","document":"National FP Services Guidelines 2021","topic":"Contraception and ARVs","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman living with HIV on an efavirenz-based regimen wants a hormonal contraceptive. Which methods are least affected by her ART?","original_reference":"DMPA levels do not appear to be reduced by ARVs including efavirenz, and the levonorgestrel IUD is unlikely to be affected. Efavirenz reduces progestin levels with COCs and may decrease the efficacy of levonorgestrel (Jadelle) and etonogestrel (Implanon) implants, and LNG emergency pill levels are significantly reduced. Copper IUCD and condoms are unaffected.","question":"Woman living with HIV on an efavirenz-based regimen wants hormonal contraception. Which methods are least affected by her ART?","change":"Unchanged.","reference":"DMPA: levels do not appear to be reduced by ARVs, including efavirenz. The levonorgestrel IUD is unlikely to be affected by ART. Efavirenz reduces progestin levels with COCs and may decrease the efficacy of levonorgestrel (Jadelle) and etonogestrel (Implanon) implants; levonorgestrel emergency pill levels are significantly reduced. Non-hormonal options (copper IUCD, condoms) are not affected.","must_include":["DMPA not reduced by efavirenz","Levonorgestrel IUD unlikely to be affected","Efavirenz may reduce implant efficacy (Jadelle, Implanon)","Efavirenz reduces COC progestin levels"],"must_not_include":["Implants are the best choice with efavirenz","Efavirenz does not affect any hormonal method"],"check":"verified; the copper IUCD/condom sentence is general knowledge, not in Appendix 6 (which covers hormonal methods)","sources":[{"id":"fp-2021-tbl-p116-0210","label":"FP p.116-118, Appendix 6","doc":"Family Planning Services Guidelines 2021","pages":"116-118","heading":"14 Appendices > 14.6 Appendix 6: Effect of Specific Arvs on the Effectiveness of Hormonal Contraceptive Methods","text":"### 14.6 Appendix 6: Effect of Specific Arvs on the Effectiveness of Hormonal Contraceptive Methods (Hormonal contraceptive method, Evidence)\n\n14.6 APPENDIX 6: EFFECT OF SPECIFIC ARVS ON THE EFFECTIVENESS OF HORMONAL CONTRACEPTIVE METHODS\n\n| Hormonal contraceptive method | Evidence |\n| --- | --- |\n| Combined oral contraceptives (COCs) | Efavirenz reduces blood progestin levels of COCs, but no efficacy data are available, while other NNRTIs (e.g., nevirapine, etravirine, rilpivirine) do not appear to affect levels or efficacy.<br/>Some PIs, particularly ritonavir boosted -PIs, also decrease progestin levels (which could potentially increase pregnancy risk) in COC users. Conversely, cobicistat boosted elvitegravir lowered ethinyl estradiol levels but increased norelgestromin levels (thus contraceptive efficacy is likely maintained). |\n| Progestin-only pills (POPs) | Based on limited data, progestin levels with POPs do not appear to be reduced by some PIs; but no efficacy data are available; and data on POP levels when used with other ARVs (such as efavirenz or nevirapine) are not available. |\n| Progestin-only injectables (e.g., DMPA or Net En) | Levels of DMPA do not appear to be reduced by ARVs (including efavirenz, zidovudine, lamivudine, nevirapine, and nelfinavir). Studies on Net-En when used with ART are not available. |\n| Contraceptive implants | A retrospective chart review suggests that efavirenz may decrease the efficacy of Levonorgestrel implants (e.g., Jadelle), compared to use by women living with HIV not using efavirenz, though additional data are needed. For the 16 women who became pregnant in this study, the mean time elapsed between implant insertion and pregnancy was 16.4 months.<br/><br/>Several case reports and a pharmacokinetic study suggest that efavirenz (but not ritonavir -boosted lopinavir) may decrease the efficacy of Etonogestrel implants (e.g., Implanon), though additional data are needed. In a Brazilian study, 79 women living with HIV received Etonogestrel implants and were followed every 6 months for 3 years. Over the course of the study, between 60 percent and 71 percent of women were receiving various ART regimens; no pregnancies were reported. |\n| Levonorgestrel releasing intrauterine devices (IUDs) (e.g., Mirena) | Limited evidence suggests that efficacy of the Levonorgestrel releasing IUD is unlikely to be affected by ART. |\n| Emergency contraceptive pills (ECPs) | Limited evidence suggests that Levonorgestrel levels are significantly reduced among women using LNG ECPs and efavirenz, but no efficacy data are available. Data for other types of ECPs (UPA ECPs or Yuzpe regimen) or other ARVs are not available. |"}]},{"id":"Q134","area":"Family planning","document":"FP / PrEP 2025","topic":"Multi-part","type":"edge-case","category":"multi-part","expected":"answer-all-parts","safety":"yes","original_question":"An 18-year-old wants both contraception and HIV prevention and is on rifampicin for TB. What are her options for each?","original_reference":"Contraception: rifampicin reduces effectiveness of COCs, POPs, CICs (and implants) — prefer DMPA, copper IUCD or LNG-IUD, plus condoms. HIV prevention: CAB-LA and LEN not initiated on rifampicin; oral PrEP (daily) or the ring are options.","question":"An 18-year-old wants both contraception and HIV prevention and is on rifampicin for TB. What are her options for each?","change":"Kept as a deliberate multi-part question; reference corrected.","reference":"Contraception: rifampicin may lower the effectiveness of COCs, POPs and combined injectables, so she needs a backup method or a method the FP guideline does not flag (e.g. copper IUCD), plus condoms. HIV prevention: CAB-LA and LEN should not be started while on rifampicin (CAB-LA can be considered 2 weeks after rifampicin ends); daily oral PrEP or the PrEP ring are options.","must_include":["Contraception: rifampicin lowers effectiveness of COCs, POPs and monthly injectables","Backup / non-affected method (condoms, copper IUCD)","PrEP: CAB-LA and LEN not started on rifampicin","Oral PrEP or ring are options"],"must_not_include":["Answers 'HIV prevention' with TB preventive therapy","Recommends CAB-LA or LEN now"],"check":"corrected: removed implants and DMPA claims — the FP guideline does not state rifampicin interactions for implants or DMPA","sources":[{"id":"fp-2021-tbl-p50-0085","label":"FP p.50","doc":"Family Planning Services Guidelines 2021","pages":"50","heading":"6 Hormonal Contraceptives > 6.4 Combined Oral Contraceptives (COCs) > Advantages and disadvantages of using COCs","text":"### Combined Oral Contraceptives (COCs): Advantages and disadvantages of using COCs (Advantages, Disadvantages)\n\nAdvantages and disadvantages of using COCs\n\n| Advantages | Disadvantages |\n| --- | --- |\n| • Easy to use<br/>• Can be used from adolescence to menopause; by nulliparous and multiparous women; provided that no risk factors exist.<br/>Help protect against:<br/>• Risks of pregnancy<br/>• Cancer of the lining of the uterus (endometrial cancer)<br/>• Cancer of the ovary<br/>• Symptomatic pelvic inflammatory disease<br/>• Ovarian cysts<br/>• Iron-deficiency anaemia<br/>• Reduce menstrual cramps<br/>• Supresses menstrual bleeding problems<br/>• Reduce ovulation pain<br/>• Reduce excess hair on face or body<br/>• Minimises symptoms of polycystic ovarian syndrome (irregular period, acne, excess hair on face or body)<br/>• Reduce symptoms of endometriosis (pelvic pain, irregular bleeding) | • Does not protect against STIs and HIV infection.<br/>• Must be taken daily and at the same time<br/>• Require an individual to obtain regular supplies.<br/>• Effectiveness may be lowered if client is on anti-TB drugs (Rifampicin or Rifabutin therapy), anti-epilepsy treatment and some ARVs indicating a need for a backup method.<br/>• Effectiveness may also be lowered in the presence of diarrhoea and vomiting<br/>• Reduce milk production in breastfeeding women.<br/>• May cause mood changes and low libido to some women<br/>• Can increase the risk of Myocardial Infarction (MI) in women with existing risk factors such as smoking, Diabetes or hypertension. |"},{"id":"fp-2021-tbl-p40-0060","label":"FP p.40","doc":"Family Planning Services Guidelines 2021","pages":"40-41","heading":"6 Hormonal Contraceptives > 6.2 Progesterone-Only Oral Pills (pops) > Who can use POPs: MEC","text":"### Who can use POPs: MEC (MEC Category 1, MEC Category 2, MEC Category 3, MEC Category 4)\n\nWho can use POPs: MEC Nearly all women can use POPs safely and effectively, including women who:\n\n| MEC Category 1 | MEC Category 2 | MEC Category 3 | MEC Category 4 |\n| --- | --- | --- | --- |\n| • Are breastfeeding (she can start immediately after childbirth)<br/>• Have or have not had children (Parous and nulliparous)<br/>• Are married or are not married<br/>• Are of any age, including adolescents and women over 40 years old<br/>• Have just had an abortion, miscarriage, or ectopic pregnancy<br/>• Smoke cigarettes, regardless of woman’s age or number of cigarettes smoked<br/>• Have anaemia presently or in the past • Have varicose veins<br/>• Are living with HIV, whether or not on antiretroviral therapy | • Elevated blood pressure (systolic >/= 160, diastolic >/= 100)<br/>• History of stroke for initiating clients<br/>• History of or current ischaemic heart disease for initiating clients<br/>• History of DVT or current DVT on anticoagulant therapy<br/>• Major surgery with prolonged immobilization<br/>• Systemic lupus erythematous (associated with severe thrombocytopenia or are on Immunosuppressive treatment) • Irregular, heavy or prolonged vaginal bleeding<br/>• Unexplained vaginal bleeding before evaluation<br/>• Undiagnosed breast mass | • Acute DVT or pulmonary embolism<br/>• History of or current Ischemic heart disease for continuing clients<br/>• History of stroke for continuing clients<br/>• Systemic Lupus Erythematosus with positive antiphospholipid antibodies<br/>• Epilepsy on certain anticonvulsants (phenytoin, carbamazepine, barbiturates etc).<br/>• TB patients on Rifampicin or Rifabutin therapy • ARV therapy with Ritonavir-boosted protease inhibitors<br/>• Headaches with aura at any age<br/>• Severe cirrhosis decompensated. | • Current breast cancer |\n\nPrinted rotated across pp.29-30 of the guide (PDF pp.40-41); the four category columns continue on the second page."},{"id":"fp-2021-tbl-p56-0099","label":"FP p.56","doc":"Family Planning Services Guidelines 2021","pages":"56","heading":"6 Hormonal Contraceptives > 6.5 Combined Injectable Contraceptives (CICs) > Advantages and disadvantages","text":"### Combined Injectable Contraceptives (CICs): Advantages and disadvantages (Advantages, Disadvantages)\n\nAdvantages and disadvantages\n\n| Advantages | Disadvantages |\n| --- | --- |\n| • Do not require daily action<br/>• Are private:<br/>No one else can tell that a woman is using contraception<br/>• Can be stopped at any time<br/>• Are good for spacing births | • Does not protect against STIs and HIV infection.<br/>• Requires injection monthly<br/>• Must be administered by a trained health service provider.<br/>• Effectiveness may be lowered if client is on anti-TB drugs (Rifampicin or Rifabutin therapy), anti-epilepsy treatment and some ARVs etc., indicating a need for a backup method.<br/>• Cannot be given to breastfeeding women with babies less than six months. It affects the quality and quantity of the milk production among breastfeeding women.<br/>• May affect the menstrual cycle |"},{"id":"prep-2025-tbl-cab-la-drug-interactions","label":"PrEP 2025 p.26","doc":"PrEP Implementation Guidelines 2025","pages":"26-27","heading":"2 Overview of PrEP Products > 2.3 CAB-LA Injectable PrEP > CAB-LA and Other Drug Interactions","text":"### Table 6. CAB-LA (cabotegravir) drug interactions: anticonvulsants and rifampicin/rifapentine contraindicated; hormones safe; methadone, rifabutin, high-dose aspirin cautions\n\n**CAB-LA should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Anticonvulsants: carbamazepine<br/>- oxcarbazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| - Antimycobacterial medications: rifampicin<br/>- rifapentine | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy.<br/>- CAB-LA can be considered two weeks after a client completes rifampin or rifapentine. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Contraceptive hormones; gender-affirming hormones | No known interactions |\n\n**Clients may still be eligible for CAB-LA, but additional cautions may be warranted**\n\n| Drug | Interaction |\n| --- | --- |\n| Methadone; rifabutin | Clients could require medication dose adjustments to maintain the effectiveness of these medications while they are using CAB-LA. |\n| High-dose aspirin (>325 mg) | Clients using high-dose aspirin in the past week, other nonsteroidal anti-inflammatory drugs for pain, or anticoagulants or other antiplatelets may have a higher likelihood of bruising or bleeding at the injection site and should be made aware and counselled on mitigation strategies, if relevant. |"},{"id":"prep-2025-tbl-len-drug-interactions","label":"PrEP 2025 p.32-33","doc":"PrEP Implementation Guidelines 2025","pages":"32-33","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > LEN and Other Drug Interactions","text":"### Table 7. LEN (lenacapavir) drug interactions: TB rifamycins, anticonvulsants, ketamine contraindicated; supplemental LEN with rifampicin; erectile dysfunction drugs; hormones safe\n\n**LEN should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Drugs used in the treatment of tuberculosis: rifabutin<br/>- rifampicin<br/>- rifapentine | - These drugs cause significant reduction of LEN concentration and therefore decrease its efficacy.<br/>- Clients should not initiate LEN if currently on TB treatment and may need to select a different PrEP or HIV prevention strategy.<br/>- For clients already on LEN and wanting to continue, supplemental LEN can be given to maintain adequate LEN concentrations (see Figure 10). |\n| - Medication used in the treatment of epilepsy: carbamazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of LEN concentration and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| Anaesthetic drugs: ketamine | - Ketamine concentrations may increase and may increase side effects associated with ketamine such as respiratory depression and hallucinations.<br/>- This potential interaction may persist after discontinuation of LEN.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n\n**Drug that might need a dose adjustment**\n\n| Drug | Interaction |\n| --- | --- |\n| Clients already on LEN and newly diagnosed with TB and starting rifampicin | - Clients already using LEN when diagnosed with TB can continue LEN, but a dose adjustment needs to be made in consultation with the MO.<br/>- Supplemental LEN dosing for co-administration with rifampicin-based TB regimens consists of repeating the LEN initiation dosing when rifampicin is started (see Figure 10) and continuing supplemental LEN every 6 months until completing TB treatment. |\n| - Drugs used in treatment of erectile dysfunction: avanafil<br/>- sildenafil<br/>- tadalafil<br/>- vardenafil | - There is a potential interaction which may persist after discontinuation of LEN.<br/>- The concentrations of these drugs may increase; start with a lower than regular dose and work up to higher doses until the desired effect is achieved.<br/>- Dose adjustments should be done by the MO. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Gender-affirming hormones and hormonal contraceptives | No known interactions |"}]},{"id":"Q021","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Hyperkalaemia in AKI","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"An adult with acute kidney injury has a potassium of 6.8 mmol/L. What emergency treatment and doses do the NCD guidelines recommend?","original_reference":"Hyperkalaemia ≥6 mmol/L: put the patient on a cardiac monitor. (1) Stabilise the myocardium with IV calcium gluconate 10%, 10 mL over 2 minutes (maximum 20 mL), not at the same time or in the same drip as sodium bicarbonate. (2) Shift potassium with ONLY 5 units of short-acting insulin (Actrapid) in 50 mL of 50% dextrose over 30 minutes (larger insulin doses accumulate in kidney failure and cause dangerous hypoglycaemia), and/or salbutamol nebuliser 10–20 mg every 1–2 hours, monitoring for tachycardia and arrhythmias. (3) A potassium binder such as sodium polystyrene sulfonate (Kayexalate) 15 g in 100 mL water once daily, unless there is bowel pathology. (4) If fluid-overloaded, IV furosemide 40–80 mg. (5) Urgent referral for dialysis (or acute peritoneal dialysis locally per protocol).","question":"Adult with AKI, potassium 6.8 mmol/L. What emergency treatment and doses?","change":"Removed 'do the NCD guidelines recommend'; content unchanged.","reference":"Hyperkalaemia ≥6 mmol/L: put the patient on a cardiac monitor. (1) Stabilise the myocardium with IV calcium gluconate 10%, 10 mL over 2 minutes (maximum 20 mL), not at the same time or in the same drip as sodium bicarbonate. (2) Shift potassium with ONLY 5 units of short-acting insulin (Actrapid) in 50 mL of 50% dextrose over 30 minutes (larger insulin doses accumulate in kidney failure and cause dangerous hypoglycaemia), and/or salbutamol nebuliser 10–20 mg every 1–2 hours, monitoring for tachycardia and arrhythmias. (3) A potassium binder such as sodium polystyrene sulfonate (Kayexalate) 15 g in 100 mL water once daily, unless there is bowel pathology. (4) If fluid-overloaded, IV furosemide 40–80 mg. (5) Urgent referral for dialysis (or acute peritoneal dialysis locally per protocol).","must_include":["Cardiac monitor","Calcium gluconate 10% 10 mL IV over 2 min (max 20 mL)","Only 5 units Actrapid in 50 mL 50% dextrose over 30 min","Salbutamol nebuliser 10-20 mg every 1-2 h","Urgent referral for dialysis"],"must_not_include":["10 units (or more) of insulin","Calcium gluconate in the same drip as sodium bicarbonate","Paediatric doses (0.5 mL/kg, 0.1 units/kg) for this adult"],"check":"verified","sources":[{"id":"ncdimh-tbl-aki-hyperkalaemia","label":"NCDIMH p.207","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"207","heading":"Chapter 7: Nephrology > Acute Kidney Injury in Adults and Children > Pharmacological Management of Acute Kidney Injury > Hyperkalaemia in AKI","text":"### Hyperkalaemia (K ≥6 mmol/l) in AKI: adults vs children: calcium gluconate, insulin-dextrose, bicarbonate, salbutamol, potassium binder, furosemide, dialysis\n\nIf hyperkalemia (≥6 mmol/l): cardiac monitor (risk of bradycardia, asystole, and ventricular arrhythmias). Fluid overload in kidney failure: IV furosemide at high doses (at least 120 mg, maximum 500 mg in 24 hours in adults); oxygen; isordil 5 mg sublingually; IV nitrate; morphine 2.5 mg IV titrated, maximum 10 mg, monitoring BP; urgent dialysis (referral to a centre with haemodialysis).\n\n| Adults | Children |\n| --- | --- |\n| - Stabilize myocardium with bolus IV calcium gluconate 10% at 10 ml over 2 minutes (maximum 20 ml). DO NOT GIVE AT THE SAME TIME/SAME DRIP AS SODIUM BICARBONATE.<br/>- Shift potassium with ONLY 5 units (five units) short acting insulin (Actrapid) in 50 ml of dextrose 50% over 30 minutes (higher insulin amounts can accumulate in kidney failure and cause dangerous hypoglycaemia).<br/>- Shift with salbutamol nebulizer at 10-20 mg every 1-2 hours (MONITOR FOR TACHYCARDIA AND ARRHYTHMIAS).<br/>- Potassium binder such as sodium polystyrene sulfonate (Kayexalate) 15 g mixed in 100 ml water once daily (CAUTION – DO NOT GIVE IF BOWEL PATHOLOGY).<br/>- If overloaded, give furosemide IV 40-80 mg to aid urinary potassium loss.<br/>- Urgent referral for dialysis, or acute peritoneal dialysis locally per protocol. | - Stabilize myocardium with bolus IV calcium gluconate 0.5 ml/kg over 2-5 minutes.<br/>- Shift potassium with dextrose 10% at 5 ml/kg IV bolus; if severe hyperkalemia, dextrose 10% 5 ml/kg IV bolus + Actrapid (short acting insulin) 0.1 units/kg (ESSENTIAL TO CHECK GLUCOSE EVERY 15-30 MINUTES AND CORRECT IF LOWER THAN 4 MMOL/L).<br/>- Shift potassium with sodium bicarbonate (8.4%) 1-2 mmol/kg IV over 5 minutes.<br/>- Shift potassium with salbutamol nebulizer – 2.5 mg if <25 kg and 5 mg if >25 kg, given 1-2 hourly (MONITOR FOR TACHYCARDIA AND ARRHYTHMIAS).<br/>- DO NOT GIVE KAYEXALATE TO CHILDREN, AS IT CAN CAUSE NECROTISING ENTEROCOLITIS.<br/>- If fluid overloaded, give furosemide IV 1-2 mg/kg; can repeat after 6 hours (individual dose not to exceed 6 mg/kg).<br/>- Urgent referral for dialysis, or acute peritoneal dialysis locally per protocol while awaiting transfer or specialist review. |"}]},{"id":"Q022","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Acute asthma","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"An adult with a severe asthma exacerbation has an SpO2 of 90%. What immediate treatment and doses do the NCD guidelines recommend?","original_reference":"Oxygen to an SpO2 of 94–98%. Salbutamol: 4–10 puffs by MDI with spacer every 20 minutes ×3 in the first hour; for severe attacks, nebulised salbutamol 5 mg every 20 minutes. Add ipratropium bromide 0.5 mg to the nebuliser (moderate–severe). Systemic corticosteroid: prednisolone 40–50 mg/day for 5–7 days. Because the attack is severe with SpO2 <92%, give IV magnesium sulfate 2 g over 20 minutes.","question":"Adult with a severe asthma attack, talking in words, SpO2 90% on air. Immediate treatment and doses?","change":"Removed 'do the NCD guidelines recommend'; added the severity features clinicians would give.","reference":"Oxygen to SpO2 94-98%. Salbutamol: nebulised 5 mg every 20 minutes for a severe attack (or 4-10 puffs by MDI + spacer every 20 minutes ×3 in the first hour). Add ipratropium bromide 0.5 mg to the nebuliser. Prednisolone 40-50 mg/day for 5-7 days. Because the attack is severe with SpO2 <92%, give IV magnesium sulfate 2 g over 20 minutes. Severe features mean admission/referral.","must_include":["Oxygen to SpO2 94-98%","Salbutamol nebulised 5 mg every 20 min (or 4-10 puffs MDI + spacer every 20 min ×3)","Ipratropium 0.5 mg","Prednisolone 40-50 mg/day for 5-7 days","IV magnesium sulfate 2 g over 20 min","Admit / refer"],"must_not_include":["Paediatric doses (2.5 mg salbutamol, 0.25 mg ipratropium, 25-75 mg/kg magnesium)","Discharge home after nebulisers","Sedation"],"check":"verified","sources":[{"id":"ncdimh-box-acute-asthma-immediate","label":"NCDIMH p.337","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"337","heading":"Chapter 14: Pulmonology > Management of Acute Asthma Exacerbations > All Age Groups – Immediate Actions and Admission Criteria","text":"> **Acute asthma exacerbation: immediate actions for all ages (oxygen, salbutamol, ipratropium, steroids, magnesium) and admission criteria**\n>\n> All age groups – immediate actions:\n> - Oxygen to achieve SpO2 94–98% (adults/adolescents) or 94–98% (children).\n> - SABA: salbutamol 4–10 puffs via MDI + spacer every 20 min × 3 (first hour).\n> - Severe: nebulised salbutamol 2.5 mg (children) / 5 mg (adults) every 20 min.\n> - Ipratropium bromide: add 0.5 mg (adults) / 0.25 mg (children) to the nebuliser for moderate–severe exacerbations.\n> - Systemic corticosteroids: prednisolone 1 mg/kg/day (max 40 mg, children) OR 40–50 mg/day (adults) × 5–7 days.\n> - IV magnesium sulfate: 2 g IV over 20 min (adults/adolescents) or 25–75 mg/kg (children) for severe exacerbations, SpO2 <92%.\n> \n> Admission criteria – refer/admit if ANY: severe or life-threatening features; SpO2 <92% after initial treatment; no improvement after 1 hour of treatment; PEF remains <40% after initial treatment; unable to maintain oral intake (children); concern about home environment/adherence."},{"id":"ncdimh-fig-acute-asthma-primary-care","label":"NCDIMH p.338","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"338","heading":"Chapter 14: Pulmonology > Management of Acute Asthma Exacerbations > Management of acute asthma in primary care","text":"### Acute or sub-acute asthma exacerbation in primary care (flowchart): assessment, severity (mild/moderate, severe, life-threatening), treatment, transfer, discharge and follow-up\n\n1. Patient presents with an acute or sub-acute asthma exacerbation. Assess: is it asthma? Risk factors for asthma-related death? Severity of the exacerbation?\n2. Severity:\n   - Mild or moderate: talks in phrases; prefers sitting to lying; not agitated; respiratory rate increased; accessory muscles used; pulse 100-120 bpm; O2 saturation (on air) 90-95%; PEF >50% predicted or best (printed '50%').\n   - Severe: talks in words; sits hunched; agitated; respiratory rate >30/min; accessory muscles used; pulse >120/min; O2 saturation (on air) <90%; PEF <50% predicted or best.\n   - Life-threatening: drowsy; confused; silent chest.\n3. Mild/moderate: start treatment: SABA 4-10 puffs by pMDI + spacer, repeat every 20 min for 1 hour; prednisolone adults 40-50 mg, children 1-2 mg/kg (max 40 mg); controlled oxygen (if available), target saturation 93-95% (children 94-98%).\n   - Worsening → transfer to an acute care facility.\n   - Improving → continue SABA as needed; assess response at 1 hour (or earlier).\n4. Severe or life-threatening → transfer to an acute care facility; while waiting give SABA, ipratropium bromide, oxygen, systemic corticosteroids.\n5. Assess for discharge: symptoms improved, SABA not needed; PEF improving and >60-80% of personal best or predicted; oxygen saturation >94% on room air; adequate resources at home.\n6. Follow-up: review symptoms and signs (is the exacerbation resolving? should prednisolone be continued?). Reliever: reduce to as needed. Controller: continue a higher dose short term (1-2 weeks) or long term (3 months) depending on the background to the exacerbation. Risk factors: check and correct modifiable risk factors, including inhaler technique and adherence; refer if >1-2 exacerbations."}]},{"id":"Q025","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Palliative morphine","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A palliative care patient has good pain control on oral morphine 10 mg every 4 hours. How do you convert this to a twice-daily dose, what must be co-prescribed, and how is respiratory depression treated?","original_reference":"Add up the morphine given in 24 hours: 10 mg × 6 = 60 mg/24 h, then divide by 2: 30 mg every 12 hours (the guideline calls this \"morphine PR\", 30 mg twice daily). Always co-prescribe a laxative (\"the hand that writes opioids should also write laxatives\"), e.g. a stimulant such as bisacodyl, since constipation is the most common side effect; give an antiemetic if nausea occurs. Reduce the dose only slowly when stopping. Respiratory depression is very rare with correct titration; if it occurs, give naloxone: dilute 400 micrograms (1 ampoule) in 9 mL normal saline and give 2.5 mL (100 micrograms) IV every 1–2 minutes, titrated to response.","question":"Palliative patient, pain well controlled on oral morphine 10 mg every 4 hours. I want to switch to twice-daily dosing. What dose, and what must I co-prescribe?","change":"Was three-part; kept the conversion and co-prescription (natural pair), dropped the naloxone part.","reference":"Add up the 24-hour total: 10 mg × 6 = 60 mg in 24 hours, then divide by 2: 30 mg every 12 hours (the guideline calls this 'morphine PR', 30 mg twice daily). Always co-prescribe a laxative, e.g. a stimulant such as bisacodyl ('the hand that writes opioids should also write laxatives'); constipation is the most common side effect. Give an antiemetic if nausea occurs.","must_include":["60 mg per 24 hours","30 mg every 12 hours","Co-prescribe a laxative (e.g. bisacodyl)"],"must_not_include":["60 mg twice daily","Laxative only if constipation develops"],"check":"verified; 'morphine PR' as printed (likely prolonged release) — clinician to confirm the wording","sources":[{"id":"ncdimh-0843","label":"NCDIMH p.292","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"292","heading":"Chapter 11: Palliation > Pain Management > Morphine: dose calculation, paediatric dose, side effects, naloxone","text":"## **How to calculate the dose of morphine PR:**\n\nAdd up all the morphine given in the past 24 hours. That gives the total dose required in 24 hours. Then divide by 2 to give the 12 hourly doses. E.g. morphine 10mg given every 4 hours = 6x10mg in 24 hours = 60mg in 24 hours = 30mg every 12 hours. The dose of morphine PR is 30mg twice daily.\n\nPediatric dose: 0.2 to 0.3 mg /kg (10-15mg) initial dose, 4hrly PO/SL and IV/SC 0.1mg/kg.\nSide effects of morphine include are constipation, nausea, and vomiting, sedation, dry mouth, sweating, hallucinations, myoclonus, urinary retention, pruritus, hyperalgesia etc.\n\n**Constipation is the most common side effect. The hand that writes opioids should also write laxatives.**\nMorphine reduces gastrointestinal motility and secretion leading to constipation. A stimulant laxative like Bisacodyl, reduces the ring contraction and facilitate propulsive activity.\n\nSedation and nausea usually resolve after a few days. A patient will need to be reassured and given an antiemetic if they experience nausea.\n\nPhysical dependence may develop but drug addiction to morphine in patients with palliative care is very rare. Withdrawal symptoms when morphine is stopped or the dose is reduced are due to physical dependence.\n\nTherefore the morphine dose should only be reduced slowly whilst the patient adjusts to coming off morphine.\n\n**Respiratory depression is a very rare side effect in pain management when morphine is correctly titrated in palliative care. Naloxone is an antidote if respiratory depression develops. Dilute 400 micrograms (1amp) in 9ml normal saline and give 2.5ml (100 micrograms) IV every 1-2 minutes for titrating response**"}]},{"id":"Q092","area":"NCDs and emergencies","document":"Consolidated NCD, Injuries & Mental Health Guidelines","topic":"Diabetes diagnosis","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What glucose and HbA1c thresholds confirm a diagnosis of diabetes, and how does confirmation differ for an asymptomatic person?","original_reference":"Fasting plasma glucose ≥7.0 mmol/L, random glucose ≥11.1 mmol/L, 2-hour OGTT ≥11.1 mmol/L, or HbA1c ≥6.5%. With symptoms (polyuria, polydipsia, weight loss) or DKA/HHS, one test is enough. If asymptomatic, the test must be repeated on a separate day within 2 weeks; if not confirmed, lifestyle modification and retest in 3–6 months. Pre-diabetes: FPG 6.1–6.9, HbA1c 5.7–6.4%.","question":"Asymptomatic 45-year-old, fasting glucose 7.4 mmol/L at a screening visit. Does he have diabetes?","change":"Was two-part (thresholds + asymptomatic confirmation); now one asymptomatic patient.","reference":"Not yet confirmed. In an asymptomatic person the test must be repeated on a separate day within 2 weeks; a second fasting glucose ≥7.0 mmol/L (or OGTT 2-hour ≥11.1 mmol/L, or HbA1c ≥6.5%) confirms diabetes. If the repeat does not confirm it, start lifestyle modification and retest in 3-6 months. (With symptoms, a single test would be enough.)","must_include":["Not confirmed on a single test (asymptomatic)","Repeat on a separate day within 2 weeks","FPG ≥7.0 mmol/L confirms","If not confirmed: lifestyle modification, retest in 3-6 months"],"must_not_include":["Diagnose diabetes on this single result","Start metformin today"],"check":"verified","sources":[{"id":"ncdimh-0075","label":"NCDIMH p.32","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"32","heading":"Chapter 2: Endocrinology > Diagnosis of Diabetes is Confirmed When","text":"## **Diagnosi
