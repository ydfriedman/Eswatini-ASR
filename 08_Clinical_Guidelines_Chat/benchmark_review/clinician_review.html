 between 1 to less than 3 days after the appointment.\n- Missed appointment: 3-7 days after appointment. Facility follow-up: contact clients telephonically; at least 3 attempts must be made; daily and strategic contacts if phone not available or not picking; if not successful, contact treatment supporter; client is contacted using this method until defaulter or a conclusive outcome is ascertained; clients with unique challenges can be escalated as per escalation plan.\n- Defaulter: 7-28 days. Community follow-up: commences at defaulter stage; in-person community follow-up is conducted at community level; attempts depend on follow-up and are escalated based on the need of the client using the escalation plan; the client may be followed multiple times depending on follow-up outcome; frequency of follow-up may be reduced until a conclusive outcome is achieved; file may be closed after a home visit in resource-limited settings or if a conclusive outcome is attained and the escalation plan exhausted.\n- IIT (interruption in treatment): more than 28 days.\nFor clients returning to care after being classified as having interrupted treatment, document reasons for interrupting treatment as outlined in the eLCM SOP."}]},{"id":"Q084","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"HIV testing algorithm","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"Which rapid tests make up Eswatini's HIV testing algorithm, and how are infants under 18 months diagnosed?","original_reference":"A two-test strategy with Determine HIV-1/2 then Uni-Gold HIV-1/2 (a three-test strategy should be considered if positivity falls below 5%). DNA PCR is the tie-breaker for inconclusive results and is used to diagnose children under 18 months. All positives are retested for verification before ART, ideally by a different tester.","question":"9-month-old HIV-exposed infant, still breastfeeding. Which test do I use to check HIV status?","change":"Was two-part (adult algorithm + infant diagnosis); kept the infant part as a case.","reference":"A virological test, NAT (DNA and/or RNA PCR). Rapid antibody tests (Determine, then Uni-Gold) can only definitively diagnose people aged 18 months or older; under 18 months, diagnosis is by NAT. Because she is still breastfeeding, she also needs retesting after breastfeeding stops.","must_include":["NAT / DNA PCR","Antibody rapid tests only from 18 months","Retest after breastfeeding ends"],"must_not_include":["A rapid antibody test is diagnostic at 9 months","An HIV self-test"],"check":"verified","sources":[{"id":"hiv-2022-tbl-3.6-hiv-test-types","label":"HIV 2022 p.63","doc":"Integrated HIV Management Guidelines 2022","pages":"63","heading":"Chapter 3: HIV Testing Services > 3.8 HIV testing devices and procedure > Table 3.6 Types of laboratory tests for HIV screening and diagnosis","text":"### Table 3.6 Types of laboratory tests for HIV screening and diagnosis\n\n| Test name | Antibody Test Rapid test: Determine HIV 1/2; Uni-gold HIV 1/2; Asante HIV-1 | Antibody Test HIVST: Oraquick HIV self-test | Virological Test NAT (RNA and/or DNA PCR) |\n| --- | --- | --- | --- |\n| Sample type | Capillary/venous whole blood, plasma | Saliva | Capillary/venous whole blood |\n| Collection site | Finger | Mouth | Heel/Toe/finger |\n| Window period | 8 weeks | 12 weeks | 2-6 weeks |\n| Indication | -Diagnosis for clients 18 months and older<br/>-\\*Surveillance | Self-Screening | -Diagnosis for clients under 18 months<br/>-Diagnosis of clients with inconclusive HIV rapid test results |\n| Turnaround time (TAT) | 20mins | 20 mins | 2-6 weeks |\n\n* The Eswatini HIV-1 recent infection surveillance (EHRIS) program tracks recent HIV infections by providing continuous epidemiological surveillance data on person, place, and time of HIV recent infections amongst adults 15 years and older to inform HIV prevention and epidemic control strategies\nFrom section 3.8.1: Eswatini has adopted the two-test strategy for the diagnosis of HIV with Determine HIV1/2 and UniGold HIV1/2; a three-test strategy should be considered if HIV positivity in HIV testing services falls below 5%. In ANC settings, the dual HIV/Syphilis rapid diagnostic tests may be considered the first test. The Asante HIV-1 Rapid Recency assay detects recent infection (within the past 12 months) among newly diagnosed individuals 15 years and above. The Ora-Quick HIV self-test is a triage test and does not provide a definitive HIV-positive diagnosis."},{"id":"hiv-2022-txt-p63-58","label":"HIV 2022 p.63","doc":"Integrated HIV Management Guidelines 2022","pages":"63","heading":"Chapter 3: HIV Testing Services > 3.8.1 Antibody testing","text":"## 3.8.1 Antibody testing\n\nHIV Rapid diagnostic tests detect antibodies to HIV and can be used to definitively diagnose adults and children 18 months of age or older. Eswatini has adopted the two-test strategy for the diagnosis of HIV. The two rapid tests approved for use are - Determine HIV1/2 and UniGold HIV1/2. However, a three-test strategy should be considered if HIV positivity in HIV testing services falls below 5%. Also in ANC settings, the dual HIV/Syphilis rapid diagnostic tests may be considered the first test in the HIV testing strategy and algorithms. The Asante HIV-1 Rapid Recency assay is used to detect recent infection (an infection that was acquired within the past 12 months ) among all newly diagnosed individuals 15 years and above. The Ora-Quick HIV self-test is a triage test and does not provide a definitive HIV-positive diagnosis. A reactive (positive) HIV self-testing result needs to be followed by further testing from a trained provider to confirm HIV status, following the national testing algorithm."},{"id":"hiv-2022-tbl-8.13-infant-testing-timing","label":"HIV 2022 p.192-193","doc":"Integrated HIV Management Guidelines 2022","pages":"192-193","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.10 Infant Diagnosis > Table 8.13","text":"### Table 8.13 Timing of HIV testing among exposed Infants and Young Children less than 18 months\n\n| Age of Infant | Eligible for Testing | Which Test to Use | Child status | Management |\n| --- | --- | --- | --- | --- |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed | Inform mother that child is HIV-negative; start eIP; check and enforce ART adherence for mother; test child again at 6-8 weeks. |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, breastfeeding | Start eIP; check and enforce ART adherence for mother; re-test child at 6-8 weeks or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Take blood for confirmatory NAT test; initiate child on ART (do not await results of second NAT); check and enforce ART adherence for mother and baby |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed | Inform the mother that child is HIV-negative; continue eIP and stop at 14 weeks. Conduct an 18 months exit rapid test. |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, still breastfeeding | Continue eIP; start Co-trimoxazole preventive therapy (CPT); check and enforce ART adherence for the mother; re-test the child at 9 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Stop eIP; take blood for confirmatory testing; initiate child on ART (do not await results of second NAT); start the child on Co-trimoxazole preventive therapy (CPT); check and enforce ART adherence for mother, continue breastfeeding. Breastfeeding is very important for an HIV-positive infant! |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed or stopped breastfeeding at least 2 months before the current test | Inform the mother that child is HIV-negative; check and enforce ART adherence for the mother; conduct an exit rapid test at 18 months |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, stopped breastfeeding within 2 months of the current test | Check and enforce ART adherence for the mother; re-test the child 2 months after cessation of breastfeeding (if positive - take blood for confirmatory testing and initiate ART; if negative - inform the mother that child is HIV-negative) |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, still breastfeeding | Check and enforce ART adherence for mother; assure recent VL and re-test child at 12 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Take blood for confirmatory testing; initiate child on ART (do not await results of second NAT); start the child on CTX; check and enforce ART adherence for mother, continue breastfeeding |\n| 12 months | HIV-exposed infants who tested HIV-negative at 9 months or missed test at 9 months (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | All results | Manage as above, however, if the child tests HIV-negative and is still breastfeeding re-testing should be done at 18 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 18 months | HIV-exposed infants who tested HIV-negative at 12 months or missed the 12 months test (If exposure status not known - test mother, if mother not available, test child using Antibody test) | HIV Antibody Test (follow national algorithm) | All results | Manage as above, however; if child tests HIV-positive, re-testing before ART initiation should be done using an antibody test instead of DNA PCR. If the child tests HIV-negative and is still breastfeeding re-testing should be done 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |"}]},{"id":"Q085","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"Retesting in pregnancy","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How often should HIV-negative pregnant and breastfeeding women who are not on PrEP be retested?","original_reference":"Pregnant: every 2 months aligned with ANC visits, with the most important retest at 34 weeks. Lactating: at 6 weeks, 14 weeks, 6, 9, 12, 15 and 18 months, aligned with the mother-baby pair schedule. Women on PrEP follow the PrEP retesting schedule.","question":"How often should HIV-negative pregnant women who are not on PrEP be retested for HIV?","change":"Kept general (schedule question); content unchanged.","reference":"Every 2 months, aligned with her scheduled ANC visits, with the most important retest in the third trimester at 34 weeks. Keep offering PrEP at each visit (opt-out). After delivery, retest while breastfeeding at 6 weeks, 14 weeks, 6, 9, 12, 15 and 18 months, aligned with the mother-baby pair schedule.","must_include":["Every 2 months aligned with ANC","Key retest at 34 weeks","Offer PrEP again at each visit"],"must_not_include":["Retest only once in the third trimester","Annually"],"check":"verified","sources":[{"id":"hiv-2022-tbl-3.4-retesting-frequencies","label":"HIV 2022 p.60","doc":"Integrated HIV Management Guidelines 2022","pages":"60","heading":"Chapter 3: HIV Testing Services > 3.5 HIV retesting > Table 3.4 Optimal retesting frequencies for various population groups","text":"### Table 3.4 Optimal retesting frequencies for various population groups\n\n| Population | When to Retest |\n| --- | --- |\n| General population | Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: Based on the ongoing risk of exposure |\n| Couples and Partners | Sero-different couple: retest every 2 months until/unless partner has evidence of undetectable Viral Load<br/>Once partner maintains undetectable V/L, retest based on HIV exposure or annually |\n| Pregnant and Lactating Women | All HIV-negative pregnant women should be re-tested every 2 months (aligned with the ANC scheduled visits) with the most optimal time for retesting being during the third trimester visit (34 weeks gestation).<br/>At delivery: Test every woman with unknown HIV status; test all women who have not tested in the third trimester<br/>All HIV-negative lactating women should be re-tested at 6 weeks, 14 weeks, 6 months, 9 months, 12 months, 15 months and 18 months aligned with the MBP follow-up schedule.<br/>See Table 8.5 |\n| Key Populations | Retest every 8 weeks |\n| General population | Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: Based on HIV testing and screening tool |\n| Couples and Partners | Sero-different couple: retest every 2 months until/unless partner has evidence of undetectable Viral Load<br/>Once partner maintains undetectable V/L, retest based on HIV exposure or annually |"},{"id":"hiv-2022-box-1.2-summary-ch8","label":"HIV 2022 p.27-28","doc":"Integrated HIV Management Guidelines 2022","pages":"27-28","heading":"Chapter 1: Introduction > 1.2 Summary of Major Changes > Chapter 8: Prevention of Mother to Child Transmission of HIV (PMTCT)","text":"> **Summary of major changes: Chapter 8 (Prevention of Mother to Child Transmission of HIV (PMTCT))**\n>\n> Chapter 8: Prevention of Mother to Child Transmission of HIV (PMTCT) – major changes in the 2022 guidelines:\n> - As part of efforts to achieve the elimination of MTCT (eMTCT), all HIV-negative pregnant and lactating women should be offered PrEP using the OPT OUT approach\n> - Pregnant and lactating women on PrEP should be retested according to the PrEP retesting schedule.\n> - All HIV-negative pregnant women not on PrEP should be re-tested every 2 months (aligned with the ANC scheduled visits) with the most optimal time point for retesting during the third trimester visit (34 weeks Gestation).\n> - All HIV-negative lactating women should be re-tested at 6 weeks, 14 weeks, 6 months, 9 months, 12 months, 15 months and 18 months aligned with the mother-baby pair (MBP) schedule.\n> - For pregnant women with inconclusive results after HTS; conduct Nucleic Acid Amplification Tests (NAAT) and initiate ART immediately while waiting for NAAT results\n> - Virally suppressed mothers enrolled in a DSD model may continue to do so provided that all VLs are done on time (First ANC and 34 weeks).\n> - Viral load monitoring schedules specific for pregnant and lactating women are:\n>    - All newly initiated ART clients should receive the first viral load test 3 months after starting ART and thereafter align with the ANC VL schedule. If the next VL test date falls after delivery, then align with PNC/MBP VL schedule.\n>    - Women on ART enrolling for ANC should receive a viral load test on their first ANC contact. A subsequent viral load test should be conducted at 34 weeks of gestation.\n>    - VL testing is compulsory for all women on ART at 6 weeks post-delivery regardless of the previous viral load date. Subsequent VL tests during lactation are done every 6 months until the cessation of breastfeeding.\n> - Early infant diagnosis:\n>    - All HIV-exposed infants must be tested using DNA PCR at birth (0-3 days post-delivery)\n>    - For all HIV exposed infants whose mothers are on a 2nd and 3rd line regimen, Baylor should be consulted to guide appropriate infant prophylaxis. This should be planned during the antenatal period\n> - Any HIV positive pregnant and breastfeeding women with a detectable viral load at contact requires URGENT intervention:\n>    - 1st line with a high VL while on a non-DTG-based regimen should have an expedited switch to 2nd line DTG-based regimen on the same day\n>    - 2nd line clients with a high VL should have a genotype sent on the same day and then be placed on a 3rd line holding regimen while awaiting further guidance from the HIVDR committee: snapthirdline@mohcoag.org\n> - Adherence assessment, identification of barriers and necessary support should be provided within a case management framework"},{"id":"hiv-2022-tbl-8.5-retesting-pregnant","label":"HIV 2022 p.180","doc":"Integrated HIV Management Guidelines 2022","pages":"180","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.3 Antenatal Care for Pregnant Women to Prevent Mother to Child Transmission > Table 8.5","text":"### Table 8.5 Retesting schedule for Pregnant Women in Antenatal Care\n\nThe first antenatal care (ANC) visit should occur as soon as the woman realizes she is pregnant, preferably within the first trimester (0-12 weeks of gestation).\n\n| Population | Retesting and prevention |\n| --- | --- |\n| HIV-negative Women | • As part of efforts to achieve the elimination of MTCT, all HIV-negative pregnant and lactating women should be offered PrEP using the OPT OUT approach. If a woman deems herself low risk after complete discussion regarding PrEP benefits, clearly document refusal and offer PrEP again at the next visit.<br/>• Pregnant and lactating women on PrEP should be retested one month after initiation. PrEP refills and testing will align with the ANC or CWF/ MBP visits.<br/>• All HIV-negative pregnant women not on PrEP should be re-tested every 2 months (aligned with the ANC scheduled visits) with the most optimal time for retesting being during the third trimester visit (34 weeks gestation).<br/>• All HIV-negative lactating women should be re-tested at 6 weeks, 14 weeks, 6 months, 9 months, 12 months, 15 months and 18 months aligned with the MBP follow-up schedule.<br/>• For pregnant and lactating women with inconclusive results after HTS; conduct Nucleic Acid Amplification Tests (NAAT) – DNA PCR, and initiate ART immediately while waiting for NAAT results |"}]},{"id":"Q086","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"PMTCT viral load","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the viral load monitoring schedule for a pregnant woman already on ART?","original_reference":"VL at the first ANC contact, again at 34 weeks, compulsory VL at 6 weeks after delivery, then every 6 months until breastfeeding stops. Newly initiated women get their first VL 3 months after starting ART and then align with the ANC schedule.","question":"What is the viral load schedule for a pregnant woman already on ART, through breastfeeding?","change":"Kept general (schedule question); content unchanged.","reference":"VL at the first ANC visit (regardless of when the last one was done), again at 34 weeks, a compulsory VL at 6 weeks after delivery, then every 6 months until breastfeeding stops. (Women newly starting ART get their first VL 3 months after initiation.)","must_include":["First ANC visit","34 weeks","6 weeks after delivery (compulsory)","Every 6 months while breastfeeding"],"must_not_include":["Annual VL during pregnancy","Skip the first-ANC VL because her last one was suppressed"],"check":"verified","sources":[{"id":"hiv-2022-fig-8.1-vl-cd4-pregnant-lactating","label":"HIV 2022 p.187","doc":"Integrated HIV Management Guidelines 2022","pages":"187","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.4.4 Viral load and CD4 testing schedule in pregnant and breastfeeding women > Figure 8.1","text":"### Figure 8.1 Timing of viral load and CD4 monitoring for pregnant and lactating women\n\nPregnant women:\n- Women already on ART: VL at 1st ANC irrespective of when prior VL was done; repeat VL at 34 weeks gestation.\n- Women newly initiating ART: baseline CD4 at ART initiation (first ANC); VL 3 months after ART initiation*.\n  *If viral load testing is expected to be undertaken in close proximity to the planned viral load at 34 weeks of gestation, the first viral load test can be delayed until week 34 of gestation.\nLactating women:\n- Women already on ART: VL testing at 6 weeks post-delivery is mandatory regardless of when the last VL test was done; VL 6 months after delivery; continue VL testing every 6 months until cessation of breastfeeding (12 months after delivery, etc.).\n- Women newly initiating ART (e.g. at 1st PNC, 7 days after delivery, or at 6 weeks): CD4 testing on ART initiation; VL testing 3 months post ART initiation; VL 6 months after delivery and every 6 months until cessation of breastfeeding, aligned with the MBP schedule.\nIf viral load >1000 copies/ml, follow the treatment monitoring algorithm and conduct infant HIV testing using POC infant diagnosis, where available, to expedite the return of results (see Table 8.10).\nA detectable viral load in a pregnant or breastfeeding woman should be treated as an emergency due to increased risk of MTCT: seek expert advice from the mother facility doctor or regional implementing partner focal doctors and/or Baylor HIV/TB hotline. Where available, prioritise pregnant and lactating women for point-of-care VL testing."},{"id":"hiv-2022-tbl-8.8-follow-up-pregnant-lactating","label":"HIV 2022 p.185-186","doc":"Integrated HIV Management Guidelines 2022","pages":"185-186","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.4.3 Follow-Up and Monitoring for HIV-Positive Pregnant Women > Table 8.8","text":"### Table 8.8 Follow-up and Monitoring of HIV-positive Pregnant and Lactating Women Summary\n\n**Services to be provided during ANC (pregnant women)**\n\n| Time | Women already on ART at entry | Women newly identified as HIV-positive or known HIV-positive, but not yet on ART at entry |\n| --- | --- | --- |\n| First ANC Visit | • Routine ANC including laboratory investigations<br/>• Check and reinforce adherence to ART<br/>• Viral load (VL) testing at 1st ANC irrespective of when prior VL was done<br/>• Provide enhanced infant prophylaxis (eIP) package (AZT/NVP syrups)<br/>• TB Screening: including Xpert TB-RIF Ultra and TB-LAM if symptomatic<br/>• Syphilis and viral hepatitis screening | • Routine ANC including laboratory investigations<br/>• Baseline tests (CD4, AST/ALT, syphilis screening, hepatitis B and C, renal function tests and calculate creatinine clearance)<br/>• Initiate ART, preferably on the same day if the woman is ready<br/>• Provide eIP package (AZT/NVP syrups)<br/>• TB Screening: including Xpert TB-RIF Ultra and TB-LAM if symptomatic |\n| 2 weeks after the first ANC | Not applicable | • Review baseline results and manage any abnormalities as needed<br/>• Check for side effects and manage accordingly<br/>• Check and reinforce adherence to ART |\n| Each monthly visit before delivery | • Routine ANC<br/>• Check and reinforce adherence to ART<br/>• Check for any side effects and manage accordingly | (same as left) |\n| 34 weeks gestation at ANC | • Conduct VL testing and manage appropriately if detectable<br/>• Routine ANC<br/>• Check and reinforce adherence to ART<br/>• Check for any side effects and manage accordingly | (same as left) |\n\n**Services to be provided during PNC (lactating women)**\n\n| Time | Women already on ART at entry | Women newly identified as HIV-positive or known HIV-positive, but not yet on ART at entry |\n| --- | --- | --- |\n| 6 weeks after delivery | • VL testing is compulsory for all women on ART irrespective of when prior VL was done and manage appropriately if detectable. Refer to Figure 8.1<br/>• Offer mother family planning services | • For women starting ART during PNC the first viral load should be done 3 months after ART initiation\\*\\* and the subsequent tests should be done every 6 months until the cessation of breastfeeding and aligned with the MBP schedule. Refer to Figure 8.1<br/>• Offer mother family planning services<br/>• For women starting ART during PNC, the first viral load should be done 3months after ART initiation and the subsequent tests should be done every 6months until the cessation of breastfeeding and aligned with the MBP schedule |\n\n**Note: The 6-week VL is essential to decide EIP duration and to intervene early in women with a DVL while breastfeeding. Therefore, ALL women on ART should have a VL at 6 weeks post-partum. The only women excluded from this are those starting ART during the 6 weeks post-partum visit.\nEnsure that all pregnant women have a viral load in the 3rd trimester preferably by 34 weeks of gestation, and all lactating women have a VL by 6 weeks post-partum and every 6 months thereafter. All pregnant and lactating women on ART should have a VL at their first visit; all VLs should be marked urgent and actively traced."},{"id":"hiv-amendment-2024-fig-7.2-vl-monitoring-schedule","label":"Amendment p.29","doc":"HIV Management Amendment 2024","pages":"29","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Updated viral load monitoring schedule","text":"### Figure 7.2 Updated viral load monitoring schedule\n\nAll clients initiating or reinitiating ART should receive their first routine VL three months after (re)initiating ART and at 9 months thereafter. After two consecutive undetectable VL results, routine VL testing is done as below.\n\nSchedule: pre-treatment VL, then VL at 3 months post ART initiation, then VL at 9 months post ART, then routine VL testing.\n\nRoutine VL testing frequency:\n- Children and adolescents (0-19 years): every 6 months\n- Pregnant and breastfeeding women: every 6 months\n- 3rd line clients: every 6 months\n- Adults >19 years: annually"}]},{"id":"Q087","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"Early infant diagnosis","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"When should an HIV-exposed infant first be tested for HIV?","original_reference":"DNA PCR at birth (0–3 days after delivery). For infants whose mothers are on second- or third-line ART, consult Baylor during the antenatal period to plan infant prophylaxis.","question":"When is an HIV-exposed newborn first tested for HIV, and with which test?","change":"Kept general; content unchanged.","reference":"At birth (0-3 days), with a NAT (DNA and/or RNA PCR). If negative, start enhanced infant prophylaxis (NVP and AZT syrups), reinforce the mother's adherence, and retest at 6-8 weeks (and after breastfeeding stops).","must_include":["NAT / DNA PCR","At birth, 0-3 days","Start eIP (NVP + AZT)","Retest at 6-8 weeks"],"must_not_include":["First test at 6 weeks","Rapid antibody test at birth"],"check":"verified","sources":[{"id":"hiv-2022-tbl-8.13-infant-testing-timing","label":"HIV 2022 p.192-193","doc":"Integrated HIV Management Guidelines 2022","pages":"192-193","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.10 Infant Diagnosis > Table 8.13","text":"### Table 8.13 Timing of HIV testing among exposed Infants and Young Children less than 18 months\n\n| Age of Infant | Eligible for Testing | Which Test to Use | Child status | Management |\n| --- | --- | --- | --- | --- |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed | Inform mother that child is HIV-negative; start eIP; check and enforce ART adherence for mother; test child again at 6-8 weeks. |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, breastfeeding | Start eIP; check and enforce ART adherence for mother; re-test child at 6-8 weeks or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| Birth (0-3 days) | HIV-exposed infants (If exposure status is not known - test mother, if mother not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Take blood for confirmatory NAT test; initiate child on ART (do not await results of second NAT); check and enforce ART adherence for mother and baby |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed | Inform the mother that child is HIV-negative; continue eIP and stop at 14 weeks. Conduct an 18 months exit rapid test. |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, still breastfeeding | Continue eIP; start Co-trimoxazole preventive therapy (CPT); check and enforce ART adherence for the mother; re-test the child at 9 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 6-8 weeks | HIV-exposed infants who tested HIV-negative at birth or missed birth testing (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Stop eIP; take blood for confirmatory testing; initiate child on ART (do not await results of second NAT); start the child on Co-trimoxazole preventive therapy (CPT); check and enforce ART adherence for mother, continue breastfeeding. Breastfeeding is very important for an HIV-positive infant! |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, never breastfed or stopped breastfeeding at least 2 months before the current test | Inform the mother that child is HIV-negative; check and enforce ART adherence for the mother; conduct an exit rapid test at 18 months |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, stopped breastfeeding within 2 months of the current test | Check and enforce ART adherence for the mother; re-test the child 2 months after cessation of breastfeeding (if positive - take blood for confirmatory testing and initiate ART; if negative - inform the mother that child is HIV-negative) |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-negative, still breastfeeding | Check and enforce ART adherence for mother; assure recent VL and re-test child at 12 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 9 months | HIV-exposed infants who tested HIV-negative at 6-8 weeks or missed 6-8 week test (if exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | HIV-positive | Take blood for confirmatory testing; initiate child on ART (do not await results of second NAT); start the child on CTX; check and enforce ART adherence for mother, continue breastfeeding |\n| 12 months | HIV-exposed infants who tested HIV-negative at 9 months or missed test at 9 months (If exposure status is not known - test mother, if the mother is not available, test child using NAT) | NAT (RNA and/or DNA PCR) | All results | Manage as above, however, if the child tests HIV-negative and is still breastfeeding re-testing should be done at 18 months or 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |\n| 18 months | HIV-exposed infants who tested HIV-negative at 12 months or missed the 12 months test (If exposure status not known - test mother, if mother not available, test child using Antibody test) | HIV Antibody Test (follow national algorithm) | All results | Manage as above, however; if child tests HIV-positive, re-testing before ART initiation should be done using an antibody test instead of DNA PCR. If the child tests HIV-negative and is still breastfeeding re-testing should be done 2 months after stopping breastfeeding or if they present with symptoms suggestive of HIV (whichever comes first) |"},{"id":"hiv-2022-tbl-8.15-eip-special-cases","label":"HIV 2022 p.196","doc":"Integrated HIV Management Guidelines 2022","pages":"196","heading":"Chapter 8: Prevention of Mother to Child Transmission of HIV > 8.11 Enhanced Infant Prophylaxis (eIP) > Table 8.15","text":"### Table 8.15 Special Considerations for Enhanced Infant Prophylaxis in Exposed Infants\n\nAll HIV-exposed infants should be given eIP (NVP and AZT syrup) from the time of birth. The duration of AZT is 6 weeks post-partum. The minimum duration of NVP is 14 weeks post-delivery; NVP should be continued beyond 14 weeks if the mother is breastfeeding and has a detectable viral load, and only stopped once the mother is undetectable. Prompt consultation is advised for women viraemic on 2nd or 3rd line ART while pregnant or breastfeeding.\n\n| Situation | Action (\\*provide dosing clips and syringe) |\n| --- | --- |\n| Mother diagnosed as HIV- positive during breastfeeding (acute seroconversion) | • The infant is at extreme risk of HIV transmission. Consult MD, mother facility, or Baylor for considerations of presumptive ART for the infant. Lacking specific same-day advice, test infant same day and start routine EIP. If < 6 weeks, start AZT/NVP. If > 14 weeks, start only NVP.<br/>• Start ART on the mother immediately.<br/>• Test infant on the same day |\n| Mother diagnosed as HIV- positive during breastfeeding and refuses to be initiated on ART | • The infant is at extreme risk of HIV transmission. Consult MD, mother facility or Baylor for considerations of presumptive ART for the infant. Lacking specific same-day advice, test infant same day and start routine EIP. If < 6 weeks start AZT/NVP. If > 14 weeks, start only NVP.<br/>• Test the infant on the same day.<br/>• Continue counselling the mother on the benefits of ART for her health, the baby’s and partner’s health |\n| The child defaulted from eIP before they are 14 weeks old | • Counsel on the importance of ongoing prophylaxis and restart AZT up until 6 weeks postpartum and NVP until 14 weeks of age or until the mother has undetectable VL |\n| Mother is on 2nd or 3rd line | • Consult Baylor for guidance on appropriate Infant Prophylaxis. If lacking specific guidance start routine EIP with AZT/NVP |\n\nNote: Give AZT only up until 6 weeks post-partum regardless of the start date. Give NVP until at least 14 weeks of age but may continue for longer until the mother has a detectable VL."}]},{"id":"Q088","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"Virological failure","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How is virological failure defined, and when should HIV drug resistance testing be requested?","original_reference":"Two consecutive VL results ≥1000 copies/mL taken 3 months apart with adequate adherence support. Genotype is requested for anyone with 2 consecutive VLs >1000 on a DTG-based first- or second-line regimen, on a 2nd-line regimen, or while on DS-TB treatment. Contact the HIVDR committee at snapthirdline@mohcoag.org.","question":"Adult on TLD for 18 months: VLs of 2,500 and then 3,100 copies/mL, 3 months apart, after adherence support. What next?","change":"Was a definition question (failure + genotype criteria); now one patient who meets both.","reference":"This is virological failure: two consecutive VLs ≥1000 copies/mL 3 months apart despite adequate adherence support. Because he is on a DTG-based first-line regimen (for less than two years), request an HIV drug resistance test (genotype) through the HIVDR committee (snapthirdline@mohcoag.org) and review the result with the committee before deciding on a regimen change; continue adherence support meanwhile.","must_include":["Virological failure","Two consecutive VLs ≥1000 three months apart","Request a genotype (DTG-based regimen)","Decide the switch with the HIVDR committee"],"must_not_include":["Switch to second line without a genotype","Repeat SUAC only and keep monitoring"],"check":"verified; 2024 Amendment changes LLV thresholds but says management of high VL is unchanged","sources":[{"id":"hiv-2022-txt-p173-t0350","label":"HIV 2022 p.173","doc":"Integrated HIV Management Guidelines 2022","pages":"173","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.12.2 Third-Line ART for Adults and Adolescents > Who should receive Genotype testing?","text":"## Who should receive Genotype testing?\n\nHIV drug resistance testing (genotype) should be requested for all clients who after adequate adherence support have two consecutive viral load results above 1000copies/ml:\n   - while on drug-sensitive TB treatment during second-line treatment\n   - while taking a 2nd line regimen\n   - while taking a DTG-based ART first- or second-line regimen for less than two years Paediatric clients <5yrs old failing on a PI-based (1st or 2nd line regimen) should be referred to the HIVDR committee for genotype without delay. Initiate third-line regimen treatment only after reviewing results of resistance tests with the third-line committee and after satisfactory SUAC.\n•\nKey message: Initiate third-line regimen treatment only after reviewing results of resistance tests with the third-line committee and after satisfactory SUAC.\n•\nKey message: HIV drug resistance testing (genotyping) is accessible through the HIV drug resistance expert committee (third-line committee) at Eswatini National AIDS Program (SNAP), which reviews requests for genotyping. Email snapthirdline@mohcoag.org for guidance\n•\nKey message: The National Molecular Reference Laboratory (NMRL) provides the necessary logistics to facilitate outsourced sample testing while the program facilitates requisitions from health facilities for such services.\n•\nKey message: The turnaround time for lab results is 20days, call the lab focal person on +268 2404 2190 to make a follow-up. Always share results with the HIVDR committee on the email above even when no evidence of resistance mutations has been found"},{"id":"hiv-2022-fig-7.4-high-vl-management","label":"HIV 2022 p.164","doc":"Integrated HIV Management Guidelines 2022","pages":"164","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.10.3 Management of a high viral load (VL >1000 copies/mL) > Figure 7.4","text":"### Figure 7.4 Management of Clients with VL >1000 copies/mL\n\nHigh viral load (≥1000 copies/mL) test received at the facility: call client on receipt of results to arrange a clinical review within 7 days.\n1. 1 month after VL taken: review of high VL and first SUAC* - conduct the first SUAC, address barriers to adherence, explain results to the client; provide 1 month's ART refill.\n2. 2 months: 1 month after first SUAC - conduct the 2nd SUAC, address barriers to adherence; provide 1-month refill.\n3. 3 months: 1 month after second SUAC - conduct the third SUAC, address barriers to adherence; provide 1-month ART refill.\n4. 4 months: 1 month after 3rd SUAC - repeat adherence, address barriers to adherence; provide 1-month refill. Assess adherence:\n   - Adherence not good for 3 consecutive months: repeat SUAC sessions for 3 consecutive months until good adherence is achieved.\n   - Good adherence for 3 consecutive months: repeat VL; schedule review for 1 month later; review results of repeat VL:\n       - NOT SUPPRESSED** (VL ≥1000 copies/mL): explain the results to the client; check opportunistic infections and CD4; review adherence; refer to MDT for further evaluation***; provide DOTS where possible; offer PrEP to partners of clients with HVL. Then treatment failure evaluation (multidisciplinary team): discuss the case and record treatment decisions and plan in the client file; if the client is fully adherent, prepare the client to switch to a second- or third-line regimen; repeat VL after 3 months; refer to facility escalation plan.\n       - Low level viraemia (VL 50-1000 copies/mL): reinforce adherence and praise the client for their efforts; schedule follow-up visits according to the client's needs; repeat VL after 6 months; provide a 3-month ART refill; target undetectable VL if VL is detectable.\n       - Undetectable VL (VL <50): offer DSD and the client is on ART for more than 1 year.\nAt each session: provide one month ART refill; monitor and document pill counts and adherence percentage at each session; conduct and document SUAC session; screen for clinical failure; screen and treat for opportunistic infections; call client/caregiver for any missed appointments.\n* For clients on an NNRTI-based regimen, consider switching regimens after a single elevated VL (see Figure 7.3).\n** For clients with VL ≥1000 copies/mL provide index HIV testing to their partners with negative or unknown HIV status. Consult the doctor at the mother facilities or Baylor HIV/TB Hotline 7848 5571.\n*** Clients who despite adherence support have two consecutive high VL results while taking a DTG/PI-based regimen should be referred to the HIVDR clinical expert committee for consideration for genotype."},{"id":"hiv-2022-box-1.2-summary-ch7","label":"HIV 2022 p.23-27","doc":"Integrated HIV Management Guidelines 2022","pages":"23-27","heading":"Chapter 1: Introduction > 1.2 Summary of Major Changes > Chapter 7: Adult Antiretroviral Therapy","text":"> **Summary of major changes: Chapter 7 (Adult Antiretroviral Therapy)**\n>\n> Chapter 7: Adult Antiretroviral Therapy – major changes in the 2022 guidelines:\n> - ART may be initiated in the community for clinically well clients who are willing to follow up at a health facility of their choice.\n> - ART should be (re)initiated from the entry point where the patient tests positive followed by referral to the ART clinic for ongoing management follow-up\n> - Baseline Random blood sugar, Height, Weight, BMI, and screening for NCD family history are required for all patients initiating ART\n> - Delay ART initiation for PLHIV with TB meningitis, Cryptococcal meningitis\n> - Clients initiating ART and at high risk of metabolic complications should be routinely monitored for metabolic adverse drug reactions\n> - For patients on haemodialysis, the ART prescribed should be taken after a dialysis session.\n> - Due to high pre-treatment NNRTI resistance in Eswatini, ART initiation on NNRTI-based regimens should be used as a last resort, particularly in treatment-experienced patients\n> - Clients on an NNRTI-based regimen should be transitioned to a DTG-based regimen. Transition can occur regardless of VL, however, take note of viremia for future reference and to ensure adherence issues are addressed while switching\n> - Point of care(POC) viral load testing may be done for ART patients who need expedited decision-making. See section 7.10.2 for priority clients for POC Viral Load testing.\n> - VL should be measured by 6 months after ART initiation to confirm virologic response to ART. After 2 consecutive suppressed VL results 6 months apart, VL monitoring can be done annually and patient-guided into a DSD model of their choice.\n> - Receipt of a high VL test result in a patient on an NNRTI-based regimen should trigger an immediate regimen switch while undergoing SUAC. Clients should be called to come to the facility within the next 7 days to begin SUAC. See Figure 7.4 for the management protocol.\n> - Two consecutive viral load test results above ≥1000 copies/mL taken three months apart with adequate adherence support should be used to determine virological failure when using plasma or dried blood spot specimens.\n> - Do not keep patients on a failing regimen for a long time without appropriate action\n> - Regimen switch to the second or third line should be done through a multidisciplinary approach\n> - Use of DBS VL for clients presenting outside of normal phlebotomy hours and in children\n> - Remnant blood samples of all clients with high viral load may be stored to be used for surveillance purposes to guide program and policy changes.\n> - Engagement of social workers, psychologists and psychiatry nurses for clients with identified poor adherence\n> - HIV drug resistance testing (genotype) should be requested for all clients with two consecutive viral load results above 1000copies/ml:\n>    - while on drug-sensitive TB treatment during second-line treatment\n>    - while taking a 2nd line regimen\n>    - while taking a DTG-based ART first- or second-line regimen\n> - Contact email for HIVDR support changed to:snapthirdline@mohcoag.org.\n> - Patients with renal insufficiency, active viral hepatitis and on a third-line regimen should be managed at a doctor managed ART clinic"}]},{"id":"Q089","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"NNRTI transition","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What should be done for a stable client still on an efavirenz (NNRTI)-based regimen?","original_reference":"Transition to a DTG-based regimen regardless of viral load (note any viraemia and address adherence). Because of high pre-treatment NNRTI resistance, NNRTI-based initiation is a last resort. A high VL on an NNRTI regimen triggers an immediate switch while doing SUAC (client called in within 7 days).","question":"Stable client on TDF/3TC/EFV, last VL undetectable 4 months ago. What should I do about her regimen?","change":"Turned into a case; content unchanged.","reference":"Transition her to a DTG-based first-line regimen (TDF/3TC/DTG). Moving from NNRTI- to DTG-based regimens is a priority because of high pre-treatment NNRTI resistance; with a VL <200 copies/mL in the last 3-6 months, transition directly to DTG first line. (A transition can be done even without a recent VL; if VL is >200, enrol in SUAC and switch to DTG as second line, reviewing VL 3 months later.)","must_include":["Transition to a DTG-based regimen","Reason: high NNRTI resistance","VL <200 in last 3-6 months: DTG first line"],"must_not_include":["Keep her on EFV because she is suppressed","Refer for third-line / genotype first"],"check":"verified","sources":[{"id":"hiv-2022-txt-p154-t0326","label":"HIV 2022 p.154","doc":"Integrated HIV Management Guidelines 2022","pages":"154","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.8 Guidance on Regimen Optimization for adults and adolescents","text":"## 7.8 Guidance on Regimen Optimization for adults and adolescents\n\nThis guidance applies to all adults and adolescents ≥30 kg, including pregnant and breastfeeding women, on an NNRTI -based regimen. Transition to DTG in these clients is a priority due to high pre-treatment NNRTI resistance mutations in Eswatini.\nKey message: Clients can be transitioned from an NNRTI based ART regimen to a DTG based regimen without a recent viral load, however, take note of clients with viraemia for future reference and to ensure adherence addressed while switching\nWhere clients have a recent viral load Figure 7.1 below guides how to use viral load results (VL done in the past 3-6 months) to inform the transition to optimal ART regimens for adult clients. Transition all clients with undetectable or VL less than 200 copies/mL within the last 3-6 months to a DTG-containing 1 line regimen."},{"id":"hiv-2022-fig-7.1-regimen-optimisation","label":"HIV 2022 p.155","doc":"Integrated HIV Management Guidelines 2022","pages":"155","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.8 Guidance on Regimen Optimization for adults and adolescents > Figure 7.1","text":"### Figure 7.1 Adult Viral load consideration for Treatment Optimization\n\n1. Review client's first line regimen to identify those eligible for transition from NNRTI based regimen: client on NNRTI based regimen.\n2. Review client's records for viral load in the past 3-6 months:\n   - VL <200 copies/ml: transition to DTG based 1st line.\n   - VL >200 copies/ml: enrol client on SUAC; immediately switch to DTG (2nd line regimen); review VL 3 months after transitioning.\nApplies to all adults and adolescents ≥30 kg, including pregnant and breastfeeding women, on an NNRTI-based regimen. Clients can be transitioned from an NNRTI-based regimen to a DTG-based regimen without a recent viral load; take note of clients with viraemia for future reference and ensure adherence is addressed while switching."}]},{"id":"Q090","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"Paediatric ART","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What is the preferred first-line ART regimen for adolescents, and how fast should children with advanced disease start ART?","original_reference":"TDF + 3TC + DTG (TLD) for all adolescents weighing at least 40 kg. All children and adolescents are eligible for rapid ART regardless of CD4 or stage; those with advanced immunodeficiency should start as soon as possible, within 7 days of diagnosis.","question":"15-year-old girl, 45 kg, newly diagnosed with HIV. Which first-line regimen, and how soon should she start?","change":"Was two unrelated parts (adolescent regimen + children with AHD); kept the adolescent regimen and added timing.","reference":"TDF + 3TC + DTG (TLD), the preferred first-line regimen for adolescents weighing at least 40 kg. Start rapidly, preferably the same day if she is ready and within 7 days of diagnosis, regardless of CD4 or WHO stage (as soon as possible if she has advanced disease), after preparing her and her caregiver for adherence.","must_include":["TDF + 3TC + DTG (TLD)","Adolescents ≥40 kg","Rapid start, within 7 days (same day if ready)"],"must_not_include":["ABC/3TC/DTG as the preferred regimen at 45 kg","Wait for CD4 before starting"],"check":"verified","sources":[{"id":"hiv-2022-box-1.2-summary-ch9","label":"HIV 2022 p.28-29","doc":"Integrated HIV Management Guidelines 2022","pages":"28-29","heading":"Chapter 1: Introduction > 1.2 Summary of Major Changes > Chapter 9: ART for Children and Adolescents","text":"> **Summary of major changes: Chapter 9 (ART for Children and Adolescents)**\n>\n> Chapter 9: ART for Children and Adolescents – major changes in the 2022 guidelines:\n> - All HIV-infected children and adolescents are eligible for rapid ART initiation regardless of CD4 count or WHO clinical stage.\n> - All children, adolescents and caregivers should be well-prepared for ART to ensure good adherence and treatment success.\n> - TDF+3TC+DTG (TLD) is the preferred first-line regimen for all adolescents weighing at least 40 kg. Alternative first-line regimens are outlined in Table 7.4.\n> - Prioritize assessment and rapid ART initiation in children and adolescents with advanced immunodeficiency as soon as possible (within 7 days) from the day of HIV diagnosis.\n> - Paediatric >10 years of age and adolescent clients with advanced immune deficiency should be screened for cryptococcal meningitis using a serum Cryptococcal antigen (CrAg) test and TB presumptive adolescents and children should receive an LF TB-LAM test.\n> - To expedite the decision-making in CALHIV, the first viral load test should be done 3 months after initiating ART then 6monthly thereafter\n> - Children and adolescents with a VL > 50 copies/mL should be referred for stepped–up adherence counselling.\n> - A viral load threshold of ≥1000 copies/mL should be used to determine virological failure when using plasma or dried blood spot specimens.\n> - For second-line ART regimens, Atazanavir (ATV/r) is preferred over LPV/r due to its reduced pill burden. Clients can be switched from LPV/r regimens if they meet the requirements outlined in Chapter 9 Section 9.6\n> - Third-line ART: Each child or adolescent should receive individualized treatment regimens based on ART history, and previous episodes of viraemia/HIV resistance testing/ genotyping results if second-line ART failure is confirmed.\n> - Adolescents aged 17 to 19 years of age should be successfully transitioned to adult care. A detailed care package and checklist for a successful transition are provided in Table 9.17 To promote long-term adherence and viral suppression, all facilities must have Teen Clubs. Facilities should also have dedicated days for children, especially those that are failing treatment"},{"id":"hiv-2022-txt-p145-t0302","label":"HIV 2022 p.145-146","doc":"Integrated HIV Management Guidelines 2022","pages":"145-146","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.2 When to start ART","text":"## 7.2 When to start ART\n\nAll PLHIV — children, adolescents, and adults — are eligible to immediately start ART regardless of CD4 count or WHO clinical stage. Health-care workers (HCWs) should promote early initiation of ART by all PLHIV, even when feeling healthy. ART should be started on the same day of HIV diagnosis except for clients with TB or cryptococcal meningitis or cryptococcal infection.\nKey message: Test and start means all people living with( PLHIV) are eligible to initiate antiretroviral therapy(ART)-preferably within 7 days of HIV diagnosis to improve clinical outcomes and reduce the risk of HIV transmission.Same day initiation is encouraged for clients who are assessed as ready to start ART\nIndividuals who test positive for HIV and belong to any of the special populations listed below should be urgently assessed for rapid ART initiation:\n- Clients with advanced immunodeficiency (advanced disease) (CD4 ≤ 200 cells/mm3 or WHO clinical stage 3 or 4)\n- Pregnant and lactating women\n- Clients coinfected with TB\n- The HIV-positive partner in a sero-different relationship i.e., individuals who identify themselves as sexual partners.\n- Clients with Hepatitis B coinfection (If laboratory tests for hepatitis B surface antigen are positive.)\n- Clients with HIV-associated nephropathy"}]},{"id":"Q091","area":"HIV testing, treatment and PMTCT","document":"Integrated HIV Management Guidelines 2022","topic":"HIV and NCDs","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What precautions apply when treating hypertension in a person on ART?","original_reference":"Same protocols as HIV-negative patients, but use calcium channel blockers cautiously with protease inhibitors (raised CCB levels, titrate and monitor ECG), and monitor renal function when combining diuretics with TDF. BP should be checked at every visit; low-dose aspirin only via doctor-led services.","question":"Man on TDF/3TC/LPV/r (second line), BP 160/100. I'm planning amlodipine plus hydrochlorothiazide. Any precautions?","change":"Was a general question; now a patient on a protease inhibitor so both cautions apply.","reference":"Yes, two. Amlodipine (a calcium channel blocker) interacts with protease inhibitors such as LPV/r, raising CCB levels, and both can prolong the PR interval: titrate the dose carefully and monitor the ECG. Combining a diuretic with TDF needs renal function monitoring. Otherwise hypertension is managed with the same protocols as in HIV-negative patients, with BP checked at every visit.","must_include":["CCB + protease inhibitor interaction (raised CCB levels)","Dose titration and ECG monitoring","Monitor renal function with diuretic + TDF"],"must_not_include":["Amlodipine is contraindicated with LPV/r","No interactions to consider"],"check":"verified","sources":[{"id":"hiv-2022-txt-p244-t0461","label":"HIV 2022 p.244","doc":"Integrated HIV Management Guidelines 2022","pages":"244","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.2 Care and Management of Hypertension and HIV for patients 18 years and older > Interactions between antihypertensives and ARVs","text":"## Interactions between antihypertensives and ARVs\n\n- Calcium channel blockers like nifedipine and amlodipine may interact with protease inhibitors, producing increased serum levels of CCBs; hence, dose titration and electrocardiogram (ECG) monitoring are required.\n- Several protease inhibitors can cause ECG changes, especially PR interval prolongation » Drugs used for hypertension with similar effects (e.g., beta blockers and calcium channel blockers) should be used with caution in clients receiving protease inhibitors, » ECG monitoring is recommended."},{"id":"hiv-2022-tbl-10.4-antihypertensive-arv-interactions","label":"HIV 2022 p.244","doc":"Integrated HIV Management Guidelines 2022","pages":"244","heading":"Chapter 10: Management of Non-Communicable Diseases > 10.2 Care and Management of Hypertension and HIV for patients 18 years and older > Interactions between antihypertensives and ARVs > Table 10.4","text":"### Table 10.4 Drug Interaction. Source: University of Liverpool, HIV-druginteractions.org\n\nCalcium channel blockers like nifedipine and amlodipine may interact with protease inhibitors, producing increased serum levels of CCBs; dose titration and ECG monitoring are required. Several protease inhibitors can cause ECG changes, especially PR interval prolongation: drugs for hypertension with similar effects (beta blockers, calcium channel blockers) should be used with caution with PIs, and ECG monitoring is recommended. Caution should also be exercised when combining diuretics with TDF; renal function could be impaired due to added risk for interstitial nephritis.\n\n| Antihypertensive | TDF/TAF | AZT | 3TC | FTC | EFV | NVP | DTG | LPV/r | ATV/r | DRV/r |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Hydrochlorothiazide |  |  |  |  |  |  |  |  |  |  |\n| Amlodipine |  |  |  |  | ↓ (yellow) | ↓ (yellow) |  | ↑ (yellow) | ↑ (yellow) | ↑ (yellow) |\n| Enalapril |  |  |  |  |  |  |  |  |  |  |\n| Bisoprolol\\* |  |  |  |  | ↓ (yellow) | ↓ (yellow) |  | ↑ (orange) | ↑ (orange) | ↑ (orange) |\n\n* WHO Essential Medicines list includes atenolol, metoprolol, and carvedilol as alternatives.\nLegend: green = no interaction; yellow = potential interaction with increased or decreased levels of antihypertensives which may require dose adjustment (drug levels of ARVs are not affected by calcium channel blockers or beta-blockers and no dose adjustment is required); orange = caution should also be exercised when administering B blockers and PIs due to the risk of QT prolongation — ECG monitoring is recommended. ↑ = increase in antihypertensive drug level; ↓ = decrease in antihypertensive drug level.\nBlank cells are uncoloured in the source (the green 'no interaction' colour is not used in any cell); read blank as no interaction listed."},{"id":"hiv-2022-box-1.2-summary-ch10","label":"HIV 2022 p.29","doc":"Integrated HIV Management Guidelines 2022","pages":"29","heading":"Chapter 1: Introduction > 1.2 Summary of Major Changes > Chapter 10: Management of HIV and Noncommunicable Diseases","text":"> **Summary of major changes: Chapter 10 (Management of HIV and Noncommunicable Diseases)**\n>\n> Chapter 10: Management of HIV and Noncommunicable Diseases – major changes in the 2022 guidelines:\n> - All clients infected with HIV should be routinely screened for cardiovascular risk factors, non-communicable diseases and mental health at enrolment and in subsequent visits.\n> - Blood pressure should be monitored at every clinical visit.\n> - Management of Hypertension in a client with HIV follows similar treatment protocols as for HIV-negative clients. However:\n>    - Calcium channel inhibitors should be used with caution as they may interact with PIs producing increased serum levels of the former. Therefore, dose titration and ECG monitoring are required.\n>    - Caution should also be exercised when combining diuretics with TDF by monitoring renal function that could be impaired due to added risk for interstitial nephritis.\n> - A low-dose, enteric-coated aspirin 100 mg/day may be prescribed to reduce the risk of cardiovascular morbidity and mortality. Aspirin initiation should only be initiated by a doctor led service, following careful assessment of risk.\n> - Annual symptom screening for diabetes mellitus and random blood sugar testing is recommended for establishing diagnosis of diabetes among PLHIV. Care and management of clients with Diabetes and HIV is described in Section 10.3\n> - A high prevalence of depression is reported among PLHIV compared to the general population. Clients should be screened for depression using the PHQ9 assessment tool at initiation and every 6 months thereafter. Clients should be managed appropriately as described in Section 10.6\n> - All clients should be evaluated for pain at every visit using a validated pain scale.\n> - For methods and reporting on pharmacovigilance, refer to Chapter 5, Section 5.12"}]},{"id":"Q100","area":"HIV testing, treatment and PMTCT","document":"Cross-document","topic":"Guideline version conflicts","type":"conflict","category":"version-conflict","expected":"answer + flag conflict","safety":"no","original_question":"Is the age of consent for HIV self-testing 16 or 12?","original_reference":"12 years. The 2022 HIV guidelines said 16, but the 2024 Amendment lowered it to 12. The chat should cite the Amendment as current and note the older figure was superseded.","question":"Is the age of consent for HIV self-testing 16 or 12 now?","change":"Added 'now' to sound like a real query; still a version-conflict test.","reference":"12 years. The 2022 HIV guidelines said 16, but the 2024 Amendment lowered it to 12. The chat should cite the Amendment as current and note the older figure was superseded.","must_include":["12 years","2024 Amendment changed it from 16"],"must_not_include":["16 years as current"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-3-summary-of-changes","label":"Amendment p.8-9","doc":"HIV Management Amendment 2024","pages":"8-9","heading":"Chapter 3: HIV Testing Services > Summary of Changes","text":"### Chapter 3 HIV testing services: summary of changes, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| Training of HTS counsellors to be conducted by PSI and TASC | Any accredited institution recognized by SNAP and EHLS may train HTS Counsellors. Entry requirements for HTS training is completion of Form V. |\n| The HIV testing screening tool will be used to determine eligibility for HTS. | HIVST replaces the risk based HTS screening tool in all individuals 12 years and above (excluding clients eligible for routine testing). Routine testing following the National HIV Testing Algorithm should be offered to malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts and inpatient, pregnant and lactating women and KPs. |\n| Use the HIV screening tool for children and adolescents (6-15yrs) to determine eligibility for HTS. | All children 2-11 years utilize the paediatric HIV screening tool in all entry points unless they qualify for routine testing. |\n| HIV Self-test kits/Oraquick can be distributed at the health facility level and performed privately in the client's home or facilitated by a healthcare worker in a private setting at a health facility. | The age of consent for HIVST has been reduced from 16 years to 12 years. |\n| Frequency of rescreening for HIV undefined | For children 2-11 years rescreen at every encounter using the risk assessment tool. For all individuals 12 years and above rescreen at every facility encounter using HIVST. For ANC and PMTCT, retesting guidelines remain unchanged (refer to Eswatini Integrated HIV Management Guidelines 2022, Chapter 3). For all clients eligible for routine testing, retesting guidelines remain unchanged (refer to the 2022 Guidelines, Chapter 3). PrEP retesting guidelines remain unchanged (refer to the 2022 Guidelines, Chapter 3). |"},{"id":"hiv-2022-txt-p52-46","label":"HIV 2022 p.52","doc":"Integrated HIV Management Guidelines 2022","pages":"52","heading":"Chapter 3: HIV Testing Services > 3.2.2 HIV Self testing","text":"## 3.2.2 HIV Self testing\n\nHIV self-testing (HIVST) is a process in which the client collects his or her specimen and then performs an HIV test and interprets the result by him/herself, either alone or with someone he or she trusts. HIV self-testing does not provide a definitive HIV-positive diagnosis. Any positive HIV result must be confirmed by a HCW following national testing algorithms. HIVST can be initiated by an individual or delivered by a provider in a community or facility-based setting. HIVST can be client-initiated or provider-initiated. The age of consent for HIVST in Eswatini is 16 years. Offering choice in HIV self-testing service delivery options and types of test kits (such as between kits using oral fluid or blood) can help to reach more people."}]},{"id":"Q101","area":"HIV testing, treatment and PMTCT","document":"Cross-document","topic":"Guideline version conflicts","type":"conflict","category":"version-conflict","expected":"answer + flag conflict","safety":"yes","original_question":"At what CD4 count should a person with advanced HIV disease be screened for cryptococcal antigen?","original_reference":"CD4 ≤200 cells/mm³ under the 2024 Amendment (the 2022 HIV guidelines said <100). The chat should give the current threshold and flag the change.","question":"PLHIV with CD4 of 150. Should I send a serum CrAg?","change":"Turned into a case with a CD4 between the old (≤100) and new (≤200) thresholds.","reference":"Yes. Under the 2024 HIV Amendment, CrAg screening is done at CD4 ≤200 cells/mm³ (the 2022 HIV guideline used ≤100). Note that the TB 2025 guideline's AHD table lists CrAg as routine at ≤100 and 'may be considered' at ≤200.","must_include":["Yes, CrAg","2024 Amendment threshold ≤200","Mentions the change from ≤100"],"must_not_include":["Not indicated because CD4 is above 100"],"check":"CONFLICT: Amendment 2024 ≤200; TB 2025 (newer document) ≤100 routine, ≤200 'may be considered'. Clinician to confirm expected answer","sources":[{"id":"hiv-amendment-2024-tbl-6.2-ahd-package","label":"Amendment p.25-26","doc":"HIV Management Amendment 2024","pages":"25-26","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.2 Advanced HIV Disease > Advanced HIV package","text":"### Advanced HIV disease (AHD) package: interventions, CD4 criteria and eligibility for adults/adolescents and children under 10\n\n| Area of package | Intervention | CD4 count | Adults & adolescents | Children < 10 years |\n| --- | --- | --- | --- | --- |\n| Screening and diagnosis | Sputum for Xpert/Xpert ultra MTB/RIF as first test for TB diagnosis in symptomatic patients | Any | Yes | Yes |\n| Screening and diagnosis | Urine LF-LAM for TB diagnosis in symptomatic patients or those with low CD4 count | Symptomatic patients: all patients regardless of CD4 count with TB signs and symptoms. Seriously ill patients\\*: all patients regardless of CD4 count or TB signs and symptoms. Inpatients and outpatients: CD4 ≤ 200 cells/ml regardless of TB signs and symptoms. | Yes | Yes |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | Yes | No |\n| Screening and diagnosis | Histoplasma antigen test | All PLHIV | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Cotrimoxazole prophylaxis (CPT) | CD4 ≤350 cells/ml or WHO stage 3 or 4 | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | TB preventive treatment (TPT) | Any | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg positive patients without evidence of meningitis | CD4 ≤200 cells/ml | Yes | No |\n|  | Itraconazole prophylaxis for histoplasma antigen positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes |\n| Adapted adherence support | Tailored counselling to support adherence to AHD package, including home visits where feasible | CD4 ≤200 cells/ml | Yes | Yes |"},{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"},{"id":"hiv-2022-tbl-6.17-ahd-package","label":"HIV 2022 p.132","doc":"Integrated HIV Management Guidelines 2022","pages":"132-133","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.2.1 Management of Clients with Advanced Immunodeficiency > Table 6.17","text":"### Table 6.17 Package of Care for Clients with Advanced Immunodeficiency (Table 6.18 continued)\n\n| Area of package | Intervention | CD4 Count | Adults and Adolescents | Children < 10 years |\n| --- | --- | --- | --- | --- |\n| Screening and diagnosis | Sputum for Xpert/Xpert ultra MBT/RIF as the first test for TB diagnosis in symptomatic patients | Any | Yes | Yes |\n| Screening and diagnosis | Urine LF-LAM for TB diagnosis in symptomatic patients or those with low CD4 count | Symptomatic patients: All patients regardless of CD4 count with TB signs and symptoms<br/>Seriously ill patients\\*: All patients regardless of CD4 count or TB signs and symptoms<br/>Inpatient setting: CD4<200 cells/ml regardless of TB signs and symptoms<br/>Outpatients setting: CD4<100 cells/ml regardless of TB signs and symptoms | Yes | Yes |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 100 cells/ml | Yes | No |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | May be considered\\*\\* | No |\n| Screening and diagnosis | Histoplasma antigen test | All PLHIV | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Cotrimoxazole prophylaxis (CPT) | CD4 ≤350cells/mm³ or WHO stage 3 or 4 | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | TB preventive treatment (TPT) | Any | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg-positive patients without evidence of meningitis | CD4 ≤100 cells/ml | Yes | No |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg-positive patients without evidence of meningitis | ≤200cells/ml | May be considered as above | No |\n| Prophylaxis and pre-emptive treatment | Itraconazole prophylaxis for Histoplasma antigen-positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes |\n| Adapted adherence support | Tailored counselling to support adherence to the AHD package, including home visits where feasible | ≤200 cells/ml | Yes | Yes |\n\n*Seriously ill patients (adults): any one of the following: respiratory rate >30 per minute, temperature > 39°C, heart rate >120 beats per minute, or unable to walk unaided. This excludes danger signs that can be explained or are a result of other diagnosed conditions e.g., cardiac failure, other bacterial infections, malaria etc.\n**May be considered in high cryptococcal antigenemia settings with adequate testing capacity\nRapid ART initiation (within 7 days) is recommended. ART may be deferred for 6 weeks in patients diagnosed with cryptococcal meningitis and starting antifungal treatment. In TB-diagnosed clients, ART should be started within 2 weeks of starting TB treatment. After ART initiation monitor for adverse events, clinical response, development of IRIS and non-adherence."},{"id":"tb-2025-tbl-p205-0528","label":"TB 2025 p.205","doc":"Integrated TB Management Guidelines 2025","pages":"205","heading":"10.8.4 Histoplasmosis > Table 52: Components of the package of care for people with advanced HIV disease","text":"### Table 52: Components of the package of care for people with advanced HIV disease\n\nTable 52: Components of the package of care for people with advanced HIV disease\n\n|  | Intervention | CD4 Cell Count | Adults | Adolescents | Children <10 years |\n| --- | --- | --- | --- | --- | --- |\n| Diagnosis | Xpert MTB/Rif Ultra as the first test for TB diagnosis among symptomatic patients | Any | Yes | Yes | Yes |\n| Diagnosis | Urine LF-LAM for TB diagnosis among people who are seriously ill or have symptoms and signs of TB | Symptomatic patients: All patients regardless of CD4 count with TB signs and symptoms<br/>Seriously ill patients\\*: All patients regardless of CD4 count or of TB signs and symptoms<br/>Inpatient setting: CD4 | Yes | Yes | Yes |\n| Diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 100 cells/ml | Yes | Yes | No |\n| Diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | May be considered\\*\\* | May be considered\\*\\* | No |\n| Diagnosis | Histoplasma antigen test | ALL PLHIV | Yes | Yes | Yes |\n| Prophylaxis | Cotrimoxazole prophylaxis | CD4 ≤350 cells/mm³ or WHO clinical stage 3 or 4 | Yes | Yes | Yes |\n| Prophylaxis | TB-preventive treatment | Any | Yes | Yes | Yes |\n| Prophylaxis | Fluconazole pre-emptive therapy for cryptococcal antigen-positive people without evidence of meningitis | <100 cells/mm³ | Yes | Yes | No |\n| Prophylaxis | Fluconazole pre-emptive therapy for cryptococcal antigen-positive people without evidence of meningitis | ≤200cells/ml | May be considered as above | May be considered as above | No |\n| Prophylaxis | Itraconazole prophylaxis for Histoplasma antigen-positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes | Yes |\n| Adapted adherence support | Tailored counselling to ensure optimal adherence to the advanced disease package, including home visits, if feasible | ≤200 cells/ml | Yes | Yes | Yes |\n\nSource: WHO guidelines for the management of advanced HIV disease, 2022.\n*Seriously ill patients (adults): any one of the following: respiratory rate >30 per minute, temperature > 39°C, heart rate >120 beats per minute, or unable to walk unaided. This excludes danger signs that can be explained or are a result of other diagnosed conditions e.g., cardiac failure, other bacterial infections, malaria etc.\n**May be considered in high cryptococcal antigenemia settings with adequate testing capacity."}]},{"id":"Q118","area":"HIV testing, treatment and PMTCT","document":"HIV Amendment 2024 / HIV 2022","topic":"Ambiguous - viral load","type":"edge-case","category":"ambiguous","expected":"ask-clarifying","safety":"yes","original_question":"My patient's viral load came back high, what do I do?","original_reference":"Ask for the actual VL value, current regimen (DTG/NNRTI/PI), duration on ART, and whether pregnant/breastfeeding or a child, because management differs (LLV 200–999 vs ≥1000 SUAC; immediate switch if on NNRTI; same-day management for pregnant women; genotype for DTG/PI failure). May outline the branches while asking.","question":"My patient's viral load came back high, what do I do?","change":"Unchanged (behaviour test).","reference":"Ask for the actual VL value, current regimen (DTG/NNRTI/PI), duration on ART, and whether pregnant/breastfeeding or a child, because management differs (LLV 200–999 vs ≥1000 SUAC; immediate switch if on NNRTI; same-day management for pregnant women; genotype for DTG/PI failure). May outline the branches while asking.","must_include":["Asks for the VL value","Asks regimen, time on ART, pregnancy/breastfeeding or child","May outline the branches (LLV 200-999 vs ≥1000)"],"must_not_include":["Assumes VL >1000 and gives one plan only"],"check":"verified","sources":[{"id":"hiv-amendment-2024-0061","label":"Amendment p.29-30","doc":"HIV Management Amendment 2024","pages":"29-30","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Management of Low-Level Viremia","text":"## **MANAGEMENT OF LOW-LEVEL VIREMIA**\n\nPeople living with HIV and receiving antiretroviral therapy (ART) have a goal of achieving and maintaining optimal viral suppression
