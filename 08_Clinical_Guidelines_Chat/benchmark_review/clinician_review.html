<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benchmark Answer Review</title>
<style>
/* Layout: question list on the left, one question at a time on the right; list collapses to a dropdown on phones */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eef1ee; --fg:#1c2421; --muted:#5d6863; --rule:#d8ddd9;
  --accent:#1f6b57; --accent-soft:#e1efe9; --warn:#93570f; --warn-soft:#f7ecd9; --bad:#a3322a; --bad-soft:#f7e3e0;
  --ok:#2c7a3f; --ok-soft:#e2f1e5;
  --font:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a201d; --surface-2:#222a26; --fg:#e3eae6; --muted:#a0aca6; --rule:#2f3934;
  --accent:#6cc3a6; --accent-soft:#1d332c; --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ef8a80; --bad-soft:#3b1f1c;
  --ok:#7ccf8d; --ok-soft:#1d3322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a201d; --surface-2:#222a26; --fg:#e3eae6; --muted:#a0aca6; --rule:#2f3934;
  --accent:#6cc3a6; --accent-soft:#1d332c; --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ef8a80; --bad-soft:#3b1f1c;
  --ok:#7ccf8d; --ok-soft:#1d3322; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit; color:inherit}
header.top{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--rule);
  padding:10px max(16px, env(safe-area-inset-left,0px)) 10px max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
header.top h1{font-size:17px; margin:0; margin-right:auto}
.field{display:flex; gap:6px; align-items:center}
.field label{font-size:13px; color:var(--muted)}
input[type=text], select{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:6px 8px; min-width:0}
textarea{width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:8px; resize:vertical; min-height:70px}
.btn{border:1px solid var(--rule); background:var(--surface-2); border-radius:6px; padding:6px 12px; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.btn.small{padding:2px 8px; font-size:13px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.progress{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.wrap{display:grid; grid-template-columns:230px minmax(0,1fr); gap:0; min-height:calc(100vh - 60px)}
nav.list{border-right:1px solid var(--rule); background:var(--surface); overflow-y:auto; max-height:calc(100vh - 60px); position:sticky; top:60px}
nav.list .tools{padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--rule)}
nav.list ul{list-style:none; margin:0; padding:0 0 4px}
nav.list details.group{border-bottom:1px solid var(--rule)}
nav.list details.group > summary{list-style:none; cursor:pointer; padding:9px 12px; display:flex; gap:8px; align-items:baseline; font-size:14px; font-weight:600; color:var(--fg)}
nav.list details.group > summary::-webkit-details-marker{display:none}
nav.list details.group > summary::before{content:"▸"; color:var(--muted); width:10px; flex:none}
nav.list details.group[open] > summary::before{content:"▾"}
nav.list details.group > summary:hover{background:var(--surface-2)}
nav.list .gname{flex:1; min-width:0}
nav.list .gcount{font-size:12px; font-weight:400; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
nav.list .gcount.all{color:var(--ok)}
nav.list .empty{padding:12px; font-size:13px; color:var(--muted)}
nav.list li button{width:100%; text-align:left; border:0; background:none; padding:6px 12px 6px 22px; cursor:pointer; display:flex; gap:8px; align-items:baseline}
nav.list li button:hover{background:var(--surface-2)}
nav.list li button[aria-current=true]{background:var(--accent-soft)}
nav.list .qid{font-family:var(--mono); font-size:13px; flex:none}
nav.list .qtxt{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{width:9px; height:9px; border-radius:50%; flex:none; border:1.5px solid var(--muted); align-self:center}
.dot.done{background:var(--ok); border-color:var(--ok)}
.dot.part{background:var(--warn); border-color:var(--warn)}
.row.mobile-pick{display:none}
main{padding:20px max(16px, env(safe-area-inset-right,0px)) 60px 24px; min-width:0}
.card{max-width:900px; display:flex; flex-direction:column; gap:18px}
.head{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.head .id{font-family:var(--mono); font-size:15px; font-weight:600}
.badge{font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.badge.safety{background:var(--bad-soft); color:var(--bad)}
.badge.new{background:var(--accent-soft); color:var(--accent)}
.badge.flag{background:var(--warn-soft); color:var(--warn)}
section.block{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
section.block h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; font-weight:600}
.question{font-size:18px; font-weight:600; line-height:1.4}
.note{font-size:13px; color:var(--muted)}
.check{font-size:13px; padding:8px 10px; border-radius:6px; background:var(--surface-2)}
.check.flag{background:var(--warn-soft); color:var(--fg); border-left:3px solid var(--warn)}
.reference{white-space:pre-wrap}
.choices{display:flex; flex-wrap:wrap; gap:6px 18px}
.choices label{display:flex; gap:6px; align-items:center; cursor:pointer}
details summary{cursor:pointer; color:var(--muted); font-size:13px}
.items{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.items li{display:flex; gap:6px; align-items:center}
.items input{flex:1}
.items.must li::before{content:"✓"; color:var(--ok); font-weight:700; width:14px}
.items.mustnot li::before{content:"✕"; color:var(--bad); font-weight:700; width:14px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.source{border-top:1px solid var(--rule); padding-top:8px}
.source .meta{font-size:13px}
.source .meta b{font-weight:600}
.srctext{font-size:13.5px; background:var(--surface-2); border-radius:6px; padding:10px 12px; margin-top:6px; overflow-x:auto}
.srctext table{border-collapse:collapse; margin:6px 0; font-size:13px}
.srctext th,.srctext td{border:1px solid var(--rule); padding:4px 6px; vertical-align:top; text-align:left}
.srctext h3,.srctext h4,.srctext h5{font-size:14px; margin:8px 0 4px}
.srctext p{margin:4px 0}
.nav-buttons{display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap}
.toast{position:fixed; bottom:max(16px, env(safe-area-inset-bottom,0px)); right:16px; background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:6px; font-size:14px; opacity:0; transition:opacity .2s}
.toast.show{opacity:1}
.help{font-size:14px}
.help ol{margin:4px 0; padding-left:20px}
@media (max-width: 760px){
  .wrap{grid-template-columns:1fr}
  nav.list{display:none}
  .row.mobile-pick{display:flex}
  main{padding-left:max(16px, env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Benchmark answer review</h1>
  <div class="field"><label for="reviewer">Your name</label><input type="text" id="reviewer" placeholder="Name and role" size="18"></div>
  <span class="progress" id="progress"></span>
  <button class="btn" id="helpBtn" type="button">How to review</button>
  <button class="btn" id="importBtn" type="button">Load saved CSV</button>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  <button class="btn primary" id="downloadBtn" type="button">Download CSV</button>
</header>
<div class="wrap">
  <nav class="list" aria-label="Questions">
    <div class="tools">
      <select id="filter" aria-label="Filter questions">
        <option value="all">All questions</option>
        <option value="todo">Not yet reviewed</option>
        <option value="done">Reviewed</option>
        <option value="safety">Safety-critical</option>
        <option value="flag">Flagged by source check</option>
        <option value="edge">Edge cases</option>
        <option value="new">New questions</option>
      </select>
      <select id="areaFilter" aria-label="Disease area"><option value="">All disease areas</option></select>
      <input type="text" id="search" placeholder="Search questions" aria-label="Search questions">
    </div>
    <div id="qlist"></div>
  </nav>
  <main>
    <div class="row mobile-pick" style="margin-bottom:12px">
      <select id="mobilePick" aria-label="Go to question" style="flex:1"></select>
    </div>
    <div class="card" id="card"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = [{"id":"Q001","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"HIV testing / HIVST","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the minimum age of consent for HIV self-testing in Eswatini under the 2024 amendment?","original_reference":"12 years (reduced from 16 years in the 2022 guidelines).","question":"A 13-year-old girl asks for an HIV self-test kit at OPD without a parent. Can she consent on her own?","change":"Removed 'under the 2024 amendment'; added a patient so the answer must apply the current age of consent unprompted.","reference":"Yes. The age of consent for HIV self-testing is 12 years (2024 Amendment), reduced from 16 years in the 2022 guidelines, so a 13-year-old can consent herself.","must_include":["Age of consent for HIVST is 12 years","She can consent on her own","This is the 2024 Amendment rule (changed from 16 years in 2022)"],"must_not_include":["16 years as the current age of consent","Parental or guardian consent is required"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-3-summary-of-changes","label":"Amendment p.8-9","doc":"HIV Management Amendment 2024","pages":"8-9","heading":"Chapter 3: HIV Testing Services > Summary of Changes","text":"### Chapter 3 HIV testing services: summary of changes, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| Training of HTS counsellors to be conducted by PSI and TASC | Any accredited institution recognized by SNAP and EHLS may train HTS Counsellors. Entry requirements for HTS training is completion of Form V. |\n| The HIV testing screening tool will be used to determine eligibility for HTS. | HIVST replaces the risk based HTS screening tool in all individuals 12 years and above (excluding clients eligible for routine testing). Routine testing following the National HIV Testing Algorithm should be offered to malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts and inpatient, pregnant and lactating women and KPs. |\n| Use the HIV screening tool for children and adolescents (6-15yrs) to determine eligibility for HTS. | All children 2-11 years utilize the paediatric HIV screening tool in all entry points unless they qualify for routine testing. |\n| HIV Self-test kits/Oraquick can be distributed at the health facility level and performed privately in the client's home or facilitated by a healthcare worker in a private setting at a health facility. | The age of consent for HIVST has been reduced from 16 years to 12 years. |\n| Frequency of rescreening for HIV undefined | For children 2-11 years rescreen at every encounter using the risk assessment tool. For all individuals 12 years and above rescreen at every facility encounter using HIVST. For ANC and PMTCT, retesting guidelines remain unchanged (refer to Eswatini Integrated HIV Management Guidelines 2022, Chapter 3). For all clients eligible for routine testing, retesting guidelines remain unchanged (refer to the 2022 Guidelines, Chapter 3). PrEP retesting guidelines remain unchanged (refer to the 2022 Guidelines, Chapter 3). |"},{"id":"hiv-2022-txt-p52-46","label":"HIV 2022 p.52, old rule: 16 years","doc":"Integrated HIV Management Guidelines 2022","pages":"52","heading":"Chapter 3: HIV Testing Services > 3.2.2 HIV Self testing","text":"## 3.2.2 HIV Self testing\n\nHIV self-testing (HIVST) is a process in which the client collects his or her specimen and then performs an HIV test and interprets the result by him/herself, either alone or with someone he or she trusts. HIV self-testing does not provide a definitive HIV-positive diagnosis. Any positive HIV result must be confirmed by a HCW following national testing algorithms. HIVST can be initiated by an individual or delivered by a provider in a community or facility-based setting. HIVST can be client-initiated or provider-initiated. The age of consent for HIVST in Eswatini is 16 years. Offering choice in HIV self-testing service delivery options and types of test kits (such as between kits using oral fluid or blood) can help to reach more people."}]},{"id":"Q002","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"HIV testing / HIVST","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which clients should NOT be screened with an HIV self-test and should instead receive routine testing with the National HIV Testing Algorithm?","original_reference":"Priority groups: malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB, STI clients, index contacts, inpatients, pregnant and lactating women, and key populations. HIVST also must not be used for clients already known HIV-positive or on treatment.","question":"Which clients skip the HIVST screen and go straight to routine HIV testing with the national algorithm?","change":"Rephrased in clinician shorthand; content unchanged.","reference":"The priority groups get routine testing with the National HIV Testing Algorithm instead of the HIVST screen: malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB, STI clients, index contacts, inpatients, pregnant and lactating women, and key populations. HIVST must also not be used for clients already known HIV-positive or on treatment.","must_include":["Malnourished and sick children","HIV-exposed children","Confirmed or presumptive TB","STI clients","Index contacts","Inpatients","Pregnant and lactating women","Key populations","Not for clients already HIV-positive or on ART"],"must_not_include":["Pregnant women may use HIVST as their screen","Only a partial list presented as complete"],"check":"verified; note p.11 section 3.2.2 omits KPs while 3.2.2.1 and p.10 include them","sources":[{"id":"hiv-amendment-2024-0024","label":"Amendment p.11","doc":"HIV Management Amendment 2024","pages":"11","heading":"Chapter 3: HIV Testing Services > 3.2 HIV Screening Tools > 3.2.2 HIVST As a Screening Tool > 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above","text":"# 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above\n\nScreen all individuals 12 years and above eligible for HTS with HIVST, unless among priority groups who qualify for routine testing (i.e. malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts, pregnant and lactating mothers, inpatient and key populations (KPs)). If they test HIV negative, actively link them to prevention services. If the test results are HIV positive, offer partner notification services and link to treatment services.\n\nRe-screen at every facility encounter (initial visit and every 2 months thereafter) at every entry point."},{"id":"hiv-amendment-2024-0022","label":"Amendment p.11","doc":"HIV Management Amendment 2024","pages":"11","heading":"Chapter 3: HIV Testing Services > 3.2 HIV Screening Tools > 3.2.2 HIVST As a Screening Tool","text":"# 3.2.2 HIVST AS A SCREENING TOOL\n\nEswatini has adopted HIVST as a screening tool because of its higher specificity and sensitivity compared to the HIV risk assessment tools for children above 12 years, adolescents and adults. However, the priority groups (i.e. malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts and inpatient, pregnant and lactating women) should continue with routine testing."},{"id":"hiv-amendment-2024-0017","label":"Amendment p.10","doc":"HIV Management Amendment 2024","pages":"10","heading":"Chapter 3: HIV Testing Services > 3.1 HIV Testing Service Delivery Approaches > 3.1.1 HIV Self Testing (HIVST) > Quality Assurance in HIVST","text":"## **QUALITY ASSURANCE IN HIVST**\n\n1. HIVST must be conducted using the nationally approved oral or blood-based HIV rapid self-test kits\n2. Quality assurance practices must be taken into consideration during HIV self-testing to ensure quality results. For detailed information refer to the SOP\n3. HIVST must not be used for clients who are HIV positive and /or on treatment\n4. Even though HIVST results may be highly sensitive and specific, a single reactive HIVST result is insufficient to provide a definitive HIV-positive diagnosis. Individuals with a reactive test result must receive further testing from a trained tester using the National HIV <u>Testing Algorithm<\/u>. Confirmatory testing may NOT be done through HIVST.\n5. Non-reactive HIV self-testing results should be considered HIV-negative, with no need for immediate further testing.\n6. Invalid HIV self-testing results need to be repeated using another HIV self-testing kit or client should alternatively seek testing from a trained provider"}]},{"id":"Q003","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"HIV testing / HIVST","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A 28-year-old man has a reactive HIV self-test result at the facility. Can he be started on ART based on this result alone?","original_reference":"No. A single reactive HIVST is insufficient for a definitive diagnosis; he must be tested by a trained tester using the National HIV Testing Algorithm. Confirmatory testing may not be done with HIVST. Once confirmed, offer partner notification and link to treatment.","question":"28-year-old man, reactive HIV self-test at OPD. Can I start ART on that result?","change":"Shortened to clinician phrasing; content unchanged.","reference":"No. A single reactive HIV self-test is not a definitive diagnosis. He must be retested by a trained tester using the National HIV Testing Algorithm; confirmation cannot be done with another self-test. If confirmed positive, offer partner notification and link to treatment.","must_include":["Do not start ART on a self-test result alone","Retest by a trained tester using the National HIV Testing Algorithm","Confirmation cannot be done with HIVST"],"must_not_include":["ART can be started on the self-test result","Confirm with a second self-test"],"check":"verified","sources":[{"id":"hiv-amendment-2024-0017","label":"Amendment p.10","doc":"HIV Management Amendment 2024","pages":"10","heading":"Chapter 3: HIV Testing Services > 3.1 HIV Testing Service Delivery Approaches > 3.1.1 HIV Self Testing (HIVST) > Quality Assurance in HIVST","text":"## **QUALITY ASSURANCE IN HIVST**\n\n1. HIVST must be conducted using the nationally approved oral or blood-based HIV rapid self-test kits\n2. Quality assurance practices must be taken into consideration during HIV self-testing to ensure quality results. For detailed information refer to the SOP\n3. HIVST must not be used for clients who are HIV positive and /or on treatment\n4. Even though HIVST results may be highly sensitive and specific, a single reactive HIVST result is insufficient to provide a definitive HIV-positive diagnosis. Individuals with a reactive test result must receive further testing from a trained tester using the National HIV <u>Testing Algorithm<\/u>. Confirmatory testing may NOT be done through HIVST.\n5. Non-reactive HIV self-testing results should be considered HIV-negative, with no need for immediate further testing.\n6. Invalid HIV self-testing results need to be repeated using another HIV self-testing kit or client should alternatively seek testing from a trained provider"},{"id":"hiv-amendment-2024-0024","label":"Amendment p.11","doc":"HIV Management Amendment 2024","pages":"11","heading":"Chapter 3: HIV Testing Services > 3.2 HIV Screening Tools > 3.2.2 HIVST As a Screening Tool > 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above","text":"# 3.2.2.1 Use of HIV-ST Among All Individuals 12 Years & Above\n\nScreen all individuals 12 years and above eligible for HTS with HIVST, unless among priority groups who qualify for routine testing (i.e. malnourished and sick children, HIV-exposed children, clients with confirmed or presumptive TB disease, STI clients, index contacts, pregnant and lactating mothers, inpatient and key populations (KPs)). If they test HIV negative, actively link them to prevention services. If the test results are HIV positive, offer partner notification services and link to treatment services.\n\nRe-screen at every facility encounter (initial visit and every 2 months thereafter) at every entry point."}]},{"id":"Q005","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"Advanced HIV disease","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"At what CD4 count should PLHIV be screened with serum CrAg and urine TB-LAM according to the 2024 amendment?","original_reference":"CD4 ≤200 cells/mm³ for both, in inpatients and outpatients (previously CrAg at ≤100, and TB-LAM at ≤200 for inpatients / ≤100 for outpatients).","question":"Adult outpatient newly diagnosed with HIV, CD4 is 180. Should I send serum CrAg and urine TB-LAM?","change":"Removed 'according to the 2024 amendment'; turned into a patient case so the current threshold must be applied.","reference":"Yes, both. Under the 2024 Amendment, CrAg screening and urine LF-LAM are done for PLHIV with CD4 ≤200 cells/mm³, for outpatients as well as inpatients. (In 2022 CrAg was at ≤100 and LF-LAM for outpatients at <100.) LF-LAM is also done regardless of CD4 if the patient has TB symptoms or is seriously ill.","must_include":["Yes to both CrAg and urine LF-LAM","Threshold is CD4 ≤200 for both","Applies to outpatients as well as inpatients"],"must_not_include":["CrAg only if CD4 ≤100","Outpatient LF-LAM only if CD4 <100"],"check":"verified against the Amendment; NOTE the TB 2025 guideline (Table 52, p.205) lists CrAg at CD4 ≤100 'Yes' and ≤200 'may be considered' — clinician to confirm which threshold the benchmark expects","sources":[{"id":"hiv-amendment-2024-tbl-6.2-ahd-package","label":"Amendment p.25-26","doc":"HIV Management Amendment 2024","pages":"25-26","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.2 Advanced HIV Disease > Advanced HIV package","text":"### Advanced HIV disease (AHD) package: interventions, CD4 criteria and eligibility for adults/adolescents and children under 10\n\n| Area of package | Intervention | CD4 count | Adults & adolescents | Children < 10 years |\n| --- | --- | --- | --- | --- |\n| Screening and diagnosis | Sputum for Xpert/Xpert ultra MTB/RIF as first test for TB diagnosis in symptomatic patients | Any | Yes | Yes |\n| Screening and diagnosis | Urine LF-LAM for TB diagnosis in symptomatic patients or those with low CD4 count | Symptomatic patients: all patients regardless of CD4 count with TB signs and symptoms. Seriously ill patients\\*: all patients regardless of CD4 count or TB signs and symptoms. Inpatients and outpatients: CD4 ≤ 200 cells/ml regardless of TB signs and symptoms. | Yes | Yes |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | Yes | No |\n| Screening and diagnosis | Histoplasma antigen test | All PLHIV | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Cotrimoxazole prophylaxis (CPT) | CD4 ≤350 cells/ml or WHO stage 3 or 4 | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | TB preventive treatment (TPT) | Any | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg positive patients without evidence of meningitis | CD4 ≤200 cells/ml | Yes | No |\n|  | Itraconazole prophylaxis for histoplasma antigen positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes |\n| Adapted adherence support | Tailored counselling to support adherence to AHD package, including home visits where feasible | CD4 ≤200 cells/ml | Yes | Yes |"},{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"},{"id":"hiv-2022-tbl-6.17-ahd-package","label":"HIV 2022 p.132, old thresholds","doc":"Integrated HIV Management Guidelines 2022","pages":"132-133","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.2.1 Management of Clients with Advanced Immunodeficiency > Table 6.17","text":"### Table 6.17 Package of Care for Clients with Advanced Immunodeficiency (Table 6.18 continued)\n\n| Area of package | Intervention | CD4 Count | Adults and Adolescents | Children < 10 years |\n| --- | --- | --- | --- | --- |\n| Screening and diagnosis | Sputum for Xpert/Xpert ultra MBT/RIF as the first test for TB diagnosis in symptomatic patients | Any | Yes | Yes |\n| Screening and diagnosis | Urine LF-LAM for TB diagnosis in symptomatic patients or those with low CD4 count | Symptomatic patients: All patients regardless of CD4 count with TB signs and symptoms<br/>Seriously ill patients\\*: All patients regardless of CD4 count or TB signs and symptoms<br/>Inpatient setting: CD4<200 cells/ml regardless of TB signs and symptoms<br/>Outpatients setting: CD4<100 cells/ml regardless of TB signs and symptoms | Yes | Yes |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 100 cells/ml | Yes | No |\n| Screening and diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | May be considered\\*\\* | No |\n| Screening and diagnosis | Histoplasma antigen test | All PLHIV | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Cotrimoxazole prophylaxis (CPT) | CD4 ≤350cells/mm³ or WHO stage 3 or 4 | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | TB preventive treatment (TPT) | Any | Yes | Yes |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg-positive patients without evidence of meningitis | CD4 ≤100 cells/ml | Yes | No |\n| Prophylaxis and pre-emptive treatment | Fluconazole pre-emptive treatment for CrAg-positive patients without evidence of meningitis | ≤200cells/ml | May be considered as above | No |\n| Prophylaxis and pre-emptive treatment | Itraconazole prophylaxis for Histoplasma antigen-positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes |\n| Adapted adherence support | Tailored counselling to support adherence to the AHD package, including home visits where feasible | ≤200 cells/ml | Yes | Yes |\n\n*Seriously ill patients (adults): any one of the following: respiratory rate >30 per minute, temperature > 39°C, heart rate >120 beats per minute, or unable to walk unaided. This excludes danger signs that can be explained or are a result of other diagnosed conditions e.g., cardiac failure, other bacterial infections, malaria etc.\n**May be considered in high cryptococcal antigenemia settings with adequate testing capacity\nRapid ART initiation (within 7 days) is recommended. ART may be deferred for 6 weeks in patients diagnosed with cryptococcal meningitis and starting antifungal treatment. In TB-diagnosed clients, ART should be started within 2 weeks of starting TB treatment. After ART initiation monitor for adverse events, clinical response, development of IRIS and non-adherence."},{"id":"tb-2025-tbl-p205-0528","label":"TB 2025 p.205, Table 52","doc":"Integrated TB Management Guidelines 2025","pages":"205","heading":"10.8.4 Histoplasmosis > Table 52: Components of the package of care for people with advanced HIV disease","text":"### Table 52: Components of the package of care for people with advanced HIV disease\n\nTable 52: Components of the package of care for people with advanced HIV disease\n\n|  | Intervention | CD4 Cell Count | Adults | Adolescents | Children <10 years |\n| --- | --- | --- | --- | --- | --- |\n| Diagnosis | Xpert MTB/Rif Ultra as the first test for TB diagnosis among symptomatic patients | Any | Yes | Yes | Yes |\n| Diagnosis | Urine LF-LAM for TB diagnosis among people who are seriously ill or have symptoms and signs of TB | Symptomatic patients: All patients regardless of CD4 count with TB signs and symptoms<br/>Seriously ill patients\\*: All patients regardless of CD4 count or of TB signs and symptoms<br/>Inpatient setting: CD4 | Yes | Yes | Yes |\n| Diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 100 cells/ml | Yes | Yes | No |\n| Diagnosis | Cryptococcal antigen CrAg screening | CD4 ≤ 200 cells/ml | May be considered\\*\\* | May be considered\\*\\* | No |\n| Diagnosis | Histoplasma antigen test | ALL PLHIV | Yes | Yes | Yes |\n| Prophylaxis | Cotrimoxazole prophylaxis | CD4 ≤350 cells/mm³ or WHO clinical stage 3 or 4 | Yes | Yes | Yes |\n| Prophylaxis | TB-preventive treatment | Any | Yes | Yes | Yes |\n| Prophylaxis | Fluconazole pre-emptive therapy for cryptococcal antigen-positive people without evidence of meningitis | <100 cells/mm³ | Yes | Yes | No |\n| Prophylaxis | Fluconazole pre-emptive therapy for cryptococcal antigen-positive people without evidence of meningitis | ≤200cells/ml | May be considered as above | May be considered as above | No |\n| Prophylaxis | Itraconazole prophylaxis for Histoplasma antigen-positive patients | Any CD4 count until 12 months or stable on ART and virally suppressed | Yes | Yes | Yes |\n| ART initiation | Rapid ART initiation | Any | Yes | Yes | Yes |\n| ART initiation | Defer ART initiation if signs and symptoms of TB, CCM or CNS histoplasmosis | Any | Yes | Yes | Yes |\n| Adapted adherence support | Tailored counselling to ensure optimal adherence to the advanced disease package, including home visits, if feasible | ≤200 cells/ml | Yes | Yes | Yes |\n\nSource: WHO guidelines for the management of advanced HIV disease, 2022.\n*Seriously ill patients (adults): any one of the following: respiratory rate >30 per minute, temperature > 39°C, heart rate >120 beats per minute, or unable to walk unaided. This excludes danger signs that can be explained or are a result of other diagnosed conditions e.g., cardiac failure, other bacterial infections, malaria etc.\n**May be considered in high cryptococcal antigenemia settings with adequate testing capacity."}]},{"id":"Q007","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"Viral load monitoring","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"An adult on TLD for two years has a viral load of 450 copies/mL. How should this be managed?","original_reference":"This is low-level viraemia (200–999 copies/mL). Assess adherence, tolerability and toxicity; provide adherence counselling; do not change the regimen unless there is toxicity or intolerance; repeat VL in 3 months. Genotyping is not recommended unless VL ≥1000 copies/mL; consult the HIVDR clinical advisor for persistent LLV.","question":"Adult on TLD for two years, viral load 450 copies/mL. How do I manage?","change":"Shortened to clinician phrasing; content unchanged.","reference":"This is low-level viraemia (200-999 copies/mL under the 2024 Amendment). Give adherence counselling and assess adherence, tolerability and toxicity. Do not change the regimen unless there is toxicity or intolerance. Repeat the VL in 3 months. Genotyping is not recommended unless VL is ≥1000 copies/mL; consult the HIVDR clinical advisor if low-level viraemia persists.","must_include":["Low-level viraemia (200-999)","Adherence counselling / assess adherence, tolerability, toxicity","No regimen change unless toxicity or intolerance","Repeat VL in 3 months","No genotyping unless VL ≥1000"],"must_not_include":["Switch to a second-line regimen now","Send a genotype now","Treat as suppressed and do nothing (2022 threshold <1000)"],"check":"verified","sources":[{"id":"hiv-amendment-2024-0061","label":"Amendment p.29-30","doc":"HIV Management Amendment 2024","pages":"29-30","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Management of Low-Level Viremia","text":"## **MANAGEMENT OF LOW-LEVEL VIREMIA**\n\nPeople living with HIV and receiving antiretroviral therapy (ART) have a goal of achieving and maintaining optimal viral suppression to undetectable levels of <50 copies/mL. However, in certain individuals, there is persistence of low-level viraemia (LLV), defined as viral load levels of 51–999 copies/mL, despite consistent medication adherence, lack of drug interactions and no genotypic resistance. LLV has been associated with adverse virological and clinical outcomes. LLV should not be confused with blips, defined as a single VL between 50 and 200 copies/mL occurring after an initial period of virological suppression, and followed by a return to an undetectable result.\n\n**<u>Blips:<\/u>** A single VL 50–200 copies/mL preceded and followed by an undetectable VL is usually not a cause for clinical concern but does not require any change in regimen. However, it should trigger clinical vigilance, adherence reinforcement, check for possible interactions, and repeat VL in 3 months.\n\n**<u>Low-level Viremia:<\/u>** A VL result of 200 - 999 copies/mL may be indicative or predictive of virological failure. In this context:\n* Assess the patient for treatment adherence, tolerability, and toxicity.\n* Changing ART regimens is not recommended unless ART toxicity or intolerability is identified.\n* Repeat VL testing in 3 months.\n* Genotyping is not recommended unless the VL result is ≥1000 copies/mL.\n\n> **EFV single formulations are not currently in the market so clients should be optimised according to 2019 addendum guidelines.**"},{"id":"hiv-amendment-2024-tbl-7-summary-of-changes","label":"Amendment p.28","doc":"HIV Management Amendment 2024","pages":"28","heading":"Chapter 7: Adult Antiretroviral Therapy > Summary of Changes","text":"### Chapter 7 adult ART: summary of changes in viral load thresholds and testing, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| (no 2022 guidance) | All clients on 3rd line ART should have routine VL testing done every 6 months. |\n| Suppressed VL: VL <1000 copies/mL. Low level viraemia: VL 50 – 999 copies/mL. | Suppressed VL: VL <200 copies/mL. Low-level viraemia: VL 200 – 999 copies/mL. |\n| SUAC for all clients with a VL >1000 copies/mL. | Adherence Counselling for all clients with a VL > 200 copies/mL. |"},{"id":"hiv-amendment-2024-fig-7.3-vl-testing-algorithm","label":"Amendment p.29","doc":"HIV Management Amendment 2024","pages":"29","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Viral load testing algorithm","text":"### Figure 7.3 The viral load testing algorithm (ART-naive vs treatment-experienced)\n\nThe management of HVL remains the same.\n\nStart: client presents for HTS. Verify if they are a true new positive.\n\nPath A - ART naive: baseline laboratory tests INCLUDING PTVL; ART initiation.\n  At 3 months post ART initiation:\n  - VL <200 copies/ml: eligible for up to 3MMD. At 9 months post ART initiation, VL <200 copies/ml: eligible for MMD & DSD enrolment; routine VL monitoring thereafter.\n  - VL >200 copies/ml: SUAC. Then: VL >200 copies/ml*: see management of LLV*; VL <200 copies/ml*: eligible for MMD.\n\nPath B - treatment experienced: baseline laboratory tests EXCLUDING PTVL; re-initiate on previous regimen.\n  At 3 months:\n  - VL <200 copies/ml: continue current ART regimen; eligible for up to 3MMD. At 9 months, VL <200 copies/ml: eligible for up to 6MMD & DSD enrolment; routine VL monitoring thereafter.\n  - VL >200 copies/ml: SUAC. Then: VL <200 copies/ml: eligible for up to 6MMD & DSD enrolment, routine VL monitoring thereafter; VL >200 copies/ml*: see management of LLV*.\n\nNotes printed under the figure:\n(a) If VL 200-999 copies/ml, follow management of LLV.\n(b) If VL > 1000 copies/ml, start SUAC.\n(c) Repeat VL after 3 months and consult the clinical advisor of HIVDR for persistent low-level viraemia.\nAll clients with a detectable viral load should be closely monitored with adherence support until they are undetectable."}]},{"id":"Q008","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"Viral load monitoring","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How often should routine viral load testing be done for children, pregnant and breastfeeding women, third-line clients, and adults over 19?","original_reference":"Every 6 months for children and adolescents 0–19 years, pregnant and breastfeeding women, and third-line clients; annually for adults over 19. After (re)initiation, VL is done at 3 months and 9 months (plus a pretreatment VL for newly diagnosed clients).","question":"Breastfeeding woman on TLD, two undetectable viral loads since starting ART. How often should her routine VL be done now?","change":"Was a four-group list question; now one patient, so the answer must pick the right group.","reference":"Every 6 months while she is breastfeeding. After the 3- and 9-month VLs and two consecutive undetectable results, routine VL is every 6 months for pregnant and breastfeeding women (also for children and adolescents 0-19 years and third-line clients); annual VL applies to other adults over 19.","must_include":["Every 6 months","Because she is breastfeeding (pregnant/breastfeeding group)"],"must_not_include":["Annually / every 12 months for her"],"check":"verified","sources":[{"id":"hiv-amendment-2024-fig-7.2-vl-monitoring-schedule","label":"Amendment p.29","doc":"HIV Management Amendment 2024","pages":"29","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.1 Routine VL Monitoring > Updated viral load monitoring schedule","text":"### Figure 7.2 Updated viral load monitoring schedule\n\nAll clients initiating or reinitiating ART should receive their first routine VL three months after (re)initiating ART and at 9 months thereafter. After two consecutive undetectable VL results, routine VL testing is done as below.\n\nSchedule: pre-treatment VL, then VL at 3 months post ART initiation, then VL at 9 months post ART, then routine VL testing.\n\nRoutine VL testing frequency:\n- Children and adolescents (0-19 years): every 6 months\n- Pregnant and breastfeeding women: every 6 months\n- 3rd line clients: every 6 months\n- Adults >19 years: annually"},{"id":"hiv-amendment-2024-tbl-5-summary-of-changes","label":"Amendment p.19","doc":"HIV Management Amendment 2024","pages":"19","heading":"Chapter 5: Basic Care Package for HIV-Positive Individuals > Summary of Changes","text":"### Chapter 5 basic care package: summary of changes in viral load testing, MMD and HIVDR, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| (no 2022 guidance) | Pretreatment VL for all newly diagnosed clients initiating ART. Clients returning to care should not receive PTVL. |\n| The first routine VL test is to be done by 6 months post-ART initiation. | The first routine VL test is to be done 3 months post-ART initiation. Ensure that all clients have a VL test done BY 6 months of starting ART. |\n| The 2nd routine VL test should be done 6 months after an initial suppressed VL test result. | The 2nd routine VL test should be done 6 months after an initial suppressed VL test result and then annually thereafter. For children, pregnant and breastfeeding women, it should be done every 6 months. |\n| 3MMD can be started after a suppressed VL done 6 months following ART initiation. | Up to 3MMD of ARVs can be started after an initial suppressed VL test result done at 3 months. Up to 6MMD can be given following 2 consecutive suppressed VL test results. |\n| (no 2022 guidance) | Remnant blood samples of all infants who test HIV positive may be stored and used for surveillance purposes (plasma or DBS) for HIVDR survey activities. |\n| (no 2022 guidance) | Routine HIVDR testing for all PrEP breakthrough infections. |"}]},{"id":"Q009","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"Paediatric ART","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"Which children can use the paediatric ABC/3TC/DTG 60/30/5 mg (pALD) dispersible tablet, and which must still use separate formulations?","original_reference":"pALD is for children weighing 6 kg up to 24.9 kg. Separate ABC/3TC + pDTG products are still needed for children 3–5.9 kg, children on rifampicin-based TB treatment, and children on second/third line who have not previously been on DTG.","question":"Child living with HIV, 5 kg, starting first-line ART. Can I use the pALD (ABC/3TC/DTG 60/30/5 mg) dispersible tablet?","change":"Was a two-part eligibility question; now one child at a weight band where pALD is not allowed.","reference":"No. pALD is for children weighing 6 kg up to 24.9 kg. A child of 3-5.9 kg must still use separate products: ABC/3TC 120/60 mg dispersible (1 tablet once daily at 3-5.9 kg) plus paediatric DTG. Separate products are also needed for children on rifampicin-based TB treatment and children on second/third line not previously on DTG.","must_include":["No, pALD is not used below 6 kg","pALD weight range is 6 to 24.9 kg","Use separate ABC/3TC + paediatric DTG products"],"must_not_include":["Give pALD at this weight","Any pALD tablet count for a 5 kg child"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-9.2-pald-dosing","label":"Amendment p.37","doc":"HIV Management Amendment 2024","pages":"37","heading":"Chapter 9: ART for Children & Adolescents > 9.2 Treatment Optimization (annex 11.17) > Paediatric ARV dosing chart including pALD","text":"### Paediatric ARV dosing chart including pALD (tablets per dose, by weight in kg)\n\nCLHIV who must still use separate ABC+3TC plus pDTG products (not pALD): children 3-5.9 kg; children on rifampicin-based TB treatment; children on second- or third-line treatment not previously on DTG.\n\n| Paediatric ARV Formulation | Weight in KG 3 - 5.9 | Weight in KG 6 - 9.9 | Weight in KG 10 - 13.9 | Weight in KG 14 - 19.9 | Weight in KG 20 - 24.9 | Weight in KG 25 - 29.9 | Weight in KG 30 - 39.9 | Weight in KG >40 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| pABC/3TC/DTG 60/30/5mg pALD Tablet (dispersible) | Use separate products | 3 OD | 4 OD | 5 OD | 6 OD |  |  |  |\n| ABC/3TC 120mg/60mg Tablet (dispersible) | 1 OD | 1.5 OD | 2 OD | 2.5 OD | 3 OD |  |  |  |\n| ABC/3TC 600mg/300mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | 1 OD | 1 OD | 1 OD |\n| AZT/3TC 60mg/30mg Tablet (dispersible) | 1 BD | 1.5 BD | 2 BD | 2.5 BD | 3 BD |  |  |  |\n| AZT/3TC 300mg/150mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | 1 BD | 1 BD | 1 BD |\n| DTG 10mg Tablet (scored/dispersible) | 0.5 OD | 1.5 OD | 2 OD | 2.5 OD | Change to Adults DTG 50mg tab OD | Change to Adults DTG 50mg tab OD | Change to Adults DTG 50mg tab OD | Change to Adults DTG 50mg tab OD |\n| DTG 50mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | 1 OD | 1 OD | 1 OD | 1 OD |\n| TDF+3TC+DTG 300mg/300mg/50mg TLD Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | 1 OD | 1 OD |\n| LPV/r 100mg/25mg Tablet | Not recommended | Not recommended | Not recommended | 2 BD | 2 BD | 3 BD | 3 BD |  |\n| LPV/r 200mg/50mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | 1 BD | 2 AM + 1 PM | 2 AM + 1 PM | 2 BD |\n| ATV/r 300mg/100mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | 1 OD |\n| TDF+3TC+EFV 300mg/300mg/400mg Tablet (Adult) | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | Not recommended | 1 OD |"},{"id":"hiv-amendment-2024-0073","label":"Amendment p.36-37","doc":"HIV Management Amendment 2024","pages":"36-37","heading":"Chapter 9: ART for Children & Adolescents > 9.2 Treatment Optimization (annex 11.17) > Paediatric pALD (ABC-3TC-DTG) dispersible tablet (DT)","text":"#### **Paediatric pALD (ABC-3TC-DTG) dispersible tablet (DT)**\n\nThe country will soon introduce a new FDC (fixed-dose-combination). This is the first triple fixed-dose combination (FDC) dispersible unscored tablet of paediatric ABC/3TC/DTG 60/30/5 mg (pALD), providing the 1st line recommended ART regimen in one convenient tablet for CLHIV who weigh at least 6 kg and up to 24.9 kg. This dispersible tablet (DT) can be swallowed whole but is meant to be dissolved in water for younger children. This complete 3-drug pALD regimen is a simplified formulation, dispersed into a small amount of water and easily administered to children, rather than having to take different pills or formulations. This has simplified prescriptions for providers and administration by caregivers as only one bottle of medication is required and the pill does not have to be split in half (unlike pDTG 10mg). Given that ABC+3TC 60/30mg plus pDTG 10mg have the same components as the FDC pALD 60/30/5mg, the potential adverse events are the same and are rare.\n\nCLHIV who are still required to use separate products/formulations of ABC+3TC plus pDTG as per the dosing table include:\n1. Children who weigh 3-5.9 kg. This is because the ratio of the component medications of ABC/3TC and DTG does not allow for the recommended dosing for children in this weight range.\n2. Receiving Rifampicin-based treatment for Tuberculosis (TB) co-infection\n3. On second-line and third-line treatment who have not previously been on DTG\n\nPlease see the updated paediatric dosing chart below which includes pALD."}]},{"id":"Q010","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"PMTCT","type":"factual","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What is recommended for a breastfeeding infant whose mother is found to have newly seroconverted to HIV?","original_reference":"Three-drug PEP for the infant after appropriate testing.","question":"Breastfeeding mother of a 5-month-old has just tested HIV positive (new seroconversion). What do I do for the baby?","change":"Turned into a case; reference expanded from the Amendment flowchart.","reference":"Test the infant immediately. If the infant is reactive, start ART as soon as possible. If negative, give the infant 3-drug PEP (2024 Amendment: 3-drug PEP after appropriate testing for breastfeeding infants of mothers found to have seroconverted), continuing until the mother is virally suppressed (undetectable). Start the mother on ART.","must_include":["Test the infant immediately","Start infant ART if positive","3-drug PEP for the infant if negative","Continue until the mother is undetectable"],"must_not_include":["No infant prophylaxis needed","Single-drug NVP prophylaxis as the full plan","Stop breastfeeding as a mandatory rule"],"check":"verified; 'start the mother on ART' is general HIV care, not in these chunks — clinician to confirm wording","sources":[{"id":"hiv-amendment-2024-tbl-8-summary-of-changes","label":"Amendment p.32","doc":"HIV Management Amendment 2024","pages":"32","heading":"Chapter 8: Prevention of Mother-to-Child Transmission of HIV > Summary of Changes","text":"### Chapter 8 PMTCT: summary of changes (viraemia in pregnant/breastfeeding women, infant PEP, DR committee), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| Genotypes were recommended for pregnant or breastfeeding women failing a DTG or PI based ART regimen. | Updated guidance provides more details for same day clinical care decisions and consideration of empiric therapy for women deemed highest risk while awaiting genotype results. Emphasis is placed on intensive adherence interventions for all women with a DVL >50. |\n| No specific recommendations for breastfeeding infants of mothers found to have seroconverted. | 3 drug PEP after appropriate testing is recommended for breastfeeding infants of mothers found to have seroconverted. |\n| Repeat VL 1 month after SUAC | Specific recommendation to consult the DR committee for all women who remain with VL > 50 despite 1 month of intensive adherence support. |"},{"id":"hiv-amendment-2024-fig-8.2-viraemia-breastfeeding","label":"Amendment p.33","doc":"HIV Management Amendment 2024","pages":"33","heading":"Chapter 8: Prevention of Mother-to-Child Transmission of HIV > Same Day Management of Viraemia in Breastfeeding Women","text":"### Figure 8.2 Same day management of viraemia in breastfeeding women (flowchart)\n\nFirst: test the infant immediately. If reactive, initiate ART as soon as possible. If non-reactive, follow the algorithm below. Consider presumptive ART in all HIV-exposed infants (HEI) who appear ill/FTT while awaiting test results.\n\nStarting point: breastfeeding woman with viraemia.\n\nPath A - VL 50-1000 c/mL AND on DTG for less than 18 months (printed: 'TLD1 and TLD2 DTG <18/12'):\nIntensive adherence interventions:\n  1. DOT\n  2. Mentor mother/EC involvement\n  3. Follow-up VL after 1 month (F/U VL 1/12)\n  4. If VL remains >1000, or VL remains 50-1000, consult the DR committee\n\nPath B - on DTG for more than 18 months, or duration unknown (printed: 'TLD1 and TLD2 on DTG > 18/12 or unknown'):\nStep 1. Genotype if VL > 1000*. Send genotypes the same day (unless known default or very poor adherence in the first trimester). Complete and submit a genotype motivation to snapthirdline@mohcoag.org.\nStep 2. Then:\n  - 1st DVL: intensive adherence interventions as in Path A.\n  - 2nd DVL: discuss AFASS; if breastfeeding is ongoing, proceed to Empiric therapy, chosen by prior PI use:\n  - No prior PI: TLD 1 tab OD PLUS EITHER DRV/r (400/50) 2 tabs OD* OR ATV/r (300/50) 1 tab OD (*if available)\n  - Prior PI: TLD 1 tab OD PLUS DRV/r (600/100) BD\n  Provide the same intensive adherence interventions as in Path A.\n\nCaring for the breastfeeding child:\n  - If child is <6 weeks (<6/52): continue EIP (AZT/NVP; printed 'AT/NVP').\n  - If child is >6 weeks (>6/52): continue or restart NVP until the mother is undetectable.\n  - If AFASS criteria are met and the mother prefers to wean after clear discussion of risks and benefits, advise weaning.\n  - Follow a weaned infant monthly for weight check.\n  - If the mother acutely seroconverted, test the infant. If negative, consider PEP in the baby until the mother is undetectable."}]},{"id":"Q011","area":"HIV testing, treatment and PMTCT","document":"HIV Guidelines Amendment 2024","topic":"Re-engagement","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"A client returning to care at a new facility after interrupting ART has no transfer letter. What should staff do?","original_reference":"Do not decline services. Continue re-engagement and contact the transferring facility to complete the transfer; do not document them as a new client; identify why treatment was interrupted and make an action plan. A pretreatment VL should not be done for re-engaging clients.","question":"Client walks into my clinic after 8 months off ART; was on treatment at another facility and has no transfer letter. Do I register her as a new client?","change":"Turned into a concrete case; content unchanged.","reference":"No. Do not decline services for lack of a transfer letter: continue re-engagement and contact the transferring facility to complete the transfer. A client verified as having interrupted treatment is not documented as new; re-link her to care under the re-engagement strategy, identify why she stopped and make an action plan. Do not do a pretreatment VL for clients returning to care. Having interrupted for 6 months or more, she should also be screened for advanced HIV disease.","must_include":["Do not register as a new client","Do not refuse care without a transfer letter","Contact the transferring facility","Identify reasons for interruption / action plan","No pretreatment VL for re-engaging clients"],"must_not_include":["Register as a new client","Send her back for a transfer letter before treating","Do a pretreatment VL"],"check":"verified","sources":[{"id":"hiv-amendment-2024-0037","label":"Amendment p.16-17","doc":"HIV Management Amendment 2024","pages":"16-17","heading":"Chapter 4: Referral & Linkages > 4.2 Re-Engagement","text":"It is important to identify the reason why the client interrupted treatment and develop and action plan based on the reasons for treatment interruption.\n\n* Clients should not be dismissed/declined services health facilities for failing to present a transfer letter, instead contact the transferring facility to complete the transfer process.\n* Clients who present as new clients and were verified as having interrupted treatment should not be documented as new but be re-linked back to care and managed according to the guidance in the reengagement strategy."},{"id":"hiv-amendment-2024-tbl-4.2-re-engagement","label":"Amendment p.16","doc":"HIV Management Amendment 2024","pages":"16","heading":"Chapter 4: Referral & Linkages > 4.2 Re-Engagement","text":"### Re-engagement in care: transfer letters, 2022 vs 2024 guidance\n\nClients disengage and re-engage into care for various reasons throughout the continuity of care. Additionally, clients may move between health facilities.\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| It is recommended that the client present transfer letters from the transferring facility. | Should a client fail to present a transfer letter, healthcare workers should continue the re-engagement and contact the transferring facility to complete the transfer process. |\n\n**Note:** It is important to identify the reason why the client interrupted treatment and develop an action plan based on the reasons for treatment interruption."},{"id":"hiv-amendment-2024-tbl-5-summary-of-changes","label":"Amendment p.19","doc":"HIV Management Amendment 2024","pages":"19","heading":"Chapter 5: Basic Care Package for HIV-Positive Individuals > Summary of Changes","text":"### Chapter 5 basic care package: summary of changes in viral load testing, MMD and HIVDR, 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| (no 2022 guidance) | Pretreatment VL for all newly diagnosed clients initiating ART. Clients returning to care should not receive PTVL. |\n| The first routine VL test is to be done by 6 months post-ART initiation. | The first routine VL test is to be done 3 months post-ART initiation. Ensure that all clients have a VL test done BY 6 months of starting ART. |\n| The 2nd routine VL test should be done 6 months after an initial suppressed VL test result. | The 2nd routine VL test should be done 6 months after an initial suppressed VL test result and then annually thereafter. For children, pregnant and breastfeeding women, it should be done every 6 months. |\n| 3MMD can be started after a suppressed VL done 6 months following ART initiation. | Up to 3MMD of ARVs can be started after an initial suppressed VL test result done at 3 months. Up to 6MMD can be given following 2 consecutive suppressed VL test results. |\n| (no 2022 guidance) | Remnant blood samples of all infants who test HIV positive may be stored and used for surveillance purposes (plasma or DBS) for HIVDR survey activities. |\n| (no 2022 guidance) | Routine HIVDR testing for all PrEP breakthrough infections. |"},{"id":"hiv-amendment-2024-0051","label":"Amendment p.24, AHD screening","doc":"HIV Management Amendment 2024","pages":"24-25","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.2 Advanced HIV Disease","text":"## **6.2 ADVANCED HIV DISEASE**\n\n* VISITECT CD4 for advanced HIV Disease point of care test if available should be used for AHD screening among the following populations;\n* New HIV positive in care\n* Treatment interrupters returning to care after at least 6 months\n* Clients with VL > 1000 copies/ml\n\nphoto: VISITECT CD4 Advanced Disease Test kit\n\nIn the absence of VISITECT POC test, the conventional quantitative CD4 test should be used to screen for AHD in these populations.\n\n**NB:** VISITECT CD4 test should not be used for follow-up testing. A quantitative CD4 test should be used (e.g PIMA)\n* Blood CrAg and TB LAM should be performed among all PLHIV with CD4 ≤ 200 cell/ml"}]},{"id":"Q019","area":"HIV testing, treatment and PMTCT","document":"Enhanced Linkages Case Management SOP 2021","topic":"LCM eligibility","type":"eligibility","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"Who is eligible for enrolment in Linkage Case Management (LCM)?","original_reference":"All HIV-positive clients diagnosed in the facility or community who are newly diagnosed; have defaulted/disengaged and are returning to care as new patients; were initiated on ART in the community and referred to a facility; or were previously diagnosed but have not received HIV care in the past 90 days. Special attention to infants and children <15, adolescents and young women, men, pregnant and lactating women, advanced disease, and key populations.","question":"Man diagnosed HIV positive two years ago, never started care, last seen 5 months ago. Is he eligible for Linkage Case Management?","change":"Was a general eligibility list; now one client who meets one criterion.","reference":"Yes. LCM covers HIV-positive clients diagnosed in the facility or community who are newly diagnosed, who defaulted or disengaged and are returning as new patients, who were initiated in the community and referred to a facility, or who were previously diagnosed but have not received HIV care in the past 90 days. He meets the last criterion, and men are one of the groups given special attention.","must_include":["Yes, eligible","Previously diagnosed with no HIV care in the past 90 days"],"must_not_include":["Not eligible because he is not newly diagnosed"],"check":"verified","sources":[{"id":"unaids-linkages-sop-0026","label":"Linkages SOP p.23","doc":"Enhanced Linkages Case Management SOP 2021","pages":"23","heading":"6 Eligibility Criteria for LCM","text":"# 6 **Eligibility Criteria for LCM**\n\nClients who are eligible for LCM are;\nAll HIV-positive clients diagnosed in the facility or community, and they are:\n- Newly HIV diagnosed\n- have defaulted or disengaged from ART and are returning to care as new patients\n- Clients initiated on ART from community then referred to facility\n- Previously HIV diagnosed but have not received HIV care in the past 90 days.\n\nSpecial attention paid to infants, children below 15 years since they depend on caregivers, adolescents and young women, men, pregnant and lactating women, **Patients with advanced disease** and key populations."}]},{"id":"Q020","area":"HIV testing, treatment and PMTCT","document":"Enhanced Linkages Case Management SOP 2021","topic":"LCM duration and discharge","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"How long does Linkage Case Management last, and what criteria must be met before a client is discharged?","original_reference":"180 days (6 months). Discharge when the client has been initiated and retained on ART to 6 months, has disclosed to at least one person (for children, the caregiver has gone through paediatric disclosure), is adherent, and has had at least two eligible contacts (partner, child or associate) tested for HIV, all documented in the CCF/CMIS.","question":"Client enrolled in LCM 6 months ago: on ART, adherent, disclosed to her sister, but only one contact has been tested. Can I discharge her from LCM?","change":"Was a two-part question (duration + discharge criteria); now one client who fails one criterion.","reference":"Not yet. LCM runs to 180 days, and discharge requires all of: initiated and retained on ART to 6 months; disclosed to at least one person; adherent to the treatment plan; and at least two eligible contacts (partner, child or associate) tested for HIV, all documented in the CCF/CMIS. She has only one contact tested, so she does not yet meet the criteria.","must_include":["Not yet / cannot discharge","At least two eligible contacts must be tested","Other criteria: retained on ART to 6 months, disclosed to at least one person, adherent","Documented in CCF/CMIS"],"must_not_include":["Discharge her now","One tested contact is enough"],"check":"verified","sources":[{"id":"unaids-linkages-sop-0028","label":"Linkages SOP p.24","doc":"Enhanced Linkages Case Management SOP 2021","pages":"24","heading":"8 Criteria for Discharging Clients from Linkage Case Management","text":"# 8 Criteria for Discharging Clients from Linkage Case Management\n\nClients will be discharged if the following have been completed and documented in the chronic care file (CCF)/Client management information system (CMIS)/CMIS.\n\n- Client has been initiated on ART and retained on ART until 6 months.\n- Client has disclosed status to at least one person (partner, family member, or associate)\n- For clients who are children, the caregiver should be taken through the disclosure process in the pediatric disclosure guidelines.\n- Client is adherent to treatment plan Client had at least two eligible contacts (partner, child, or associate) tested for HIV.\n\n> Clients tested and initiated on ART in the community should be discharged from the community as soon as they are linked at the facility for further LCM implementation."},{"id":"unaids-linkages-sop-0043","label":"Linkages SOP p.30, discharge at day 180","doc":"Enhanced Linkages Case Management SOP 2021","pages":"30","heading":"9 Intra-Facility Linkage Case Management > 12 Facility Based Linkage’s Case Management Model. > Facility – based LCM","text":"Figure: Facility-based Linkage Case Management (LCM) model (timeline from HIV diagnosis to discharge at day 180)\n\n- Entry: facility-based HTS, OPD and referrals from other HTS points -> the LCM client is paired with an LCM facilitator.\n- ART initiation (Day 0): focused on the importance of early ART initiation, accessing and resolving enrolment barriers; counselling on disclosure and testing partners, family members and associates (PFAs).\n- Escort to VCT/ART the same or a subsequent day if needed.\n- Treatment navigation: facilitate VCT/ART initiation; provide psychological support during the entire clinic visit; informational counselling on the content, sequence and location of HIV clinical services.\n- Follow-up phone calls: Day 3-5 and Day 10-12.\n- 1st clinical visit (day 14): preview disclosure progress; assess barriers to ART initiation; follow up on progress on testing of contacts (index); address concerns raised by clients.\n- Follow-up phone call: Day 21-30.\n- 2nd clinical visit (day 30-45): focused on disclosure and ART adherence counselling, HTS for PFAs, and assessing and resolving barriers to care; assess barriers to ART adherence; address concerns raised by the client.\n- Follow-up phone call: Day 44-60.\n- 3rd clinical visit (day 45-60): provide HTS for PFAs and additional information and motivational counselling; explore barriers to treatment; graduate the client and confirm availability to assist if they have challenges in future.\n- Follow-up phone calls: Day 120-125 and Day 170-175.\n- 4th clinical visit (day 180): provide ART service; discuss available ART DSD options; discharge client."}]},{"id":"Q023","area":"HIV testing, treatment and PMTCT","document":"Enhanced Linkages Case Management SOP 2021","topic":"Community linkage","type":"numeric","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"Within what time frame must a client who tests HIV positive at a community outreach be seen at a health facility?","original_reference":"Same day or within 7 days of diagnosis, whether or not initiated on ART. Community-initiated clients must reach the facility by day 14, and client files from community initiation must be transferred to the facility within 7 days.","question":"Outreach team tests a client HIV positive and starts ART in the community. By when must she be seen at a health facility?","change":"Turned into a case; content unchanged.","reference":"Within 7 days. Clients testing HIV positive must be linked the same day or within 7 days of diagnosis, and seen at a health facility within 7 days whether or not they were initiated on ART; files from community initiation are transferred to the facility within 7 days. (Another section of the SOP says community-initiated clients must reach the facility 'within day 14'.)","must_include":["Same day or within 7 days of diagnosis","Applies whether or not she was initiated in the community"],"must_not_include":["Within 28 days","No time limit once on ART"],"check":"verified; the SOP is internally inconsistent (7 days on p.63-64, day 14 on p.61) — clinician to decide which the benchmark expects","sources":[{"id":"unaids-linkages-sop-0102","label":"Linkages SOP p.63","doc":"Enhanced Linkages Case Management SOP 2021","pages":"63","heading":"12.27 Day Zero; Referral of HIV Positive Client","text":"# 12.27 DAY ZERO; REFERRAL OF HIV POSITIVE CLIENT\n\n**Personnel:** HTS provider, *Nurse*, *Peer Navigators*, *Community Expert* client (Linkage's facilitator).\n\n**Location:** *HTS service point, consultation points*\n\n**When:** *During HTS posttest session, Same day referral for clients who have initiated or referred for initiation or during outreach clinic at ART consultation point*\n\n**Tools:** *Referral and linkages logbook, Index testing logbook, Chronic Care Files/ CMIS, National Referral book, Cell phone, Call logs, Index Invitation forms, Case management logbook, appointment book, Case management monthly summary sheet, Quarterly outcome report*\n\n**Objective:** *Ensure that clients referred to facility are linked to the facility*\n\n> The outreach team works in collaboration with a health facility which is not physically on site at the time of testing. The outreach clinic or community testing partner will offer HIV testing and refer both reactive and non-reactive clients to a health facility of client's choice for HIV prevention, care, and treatment services.\n\n**Clients testing HIV positive must be linked on the same day or within 7 days of diagnosis.** Clients whether *initiated or not initiated* should be seen at a health facility within 7 days of testing HIV positive. Clients initiated in an outreach **must be referred to their preferred facility.** Clients testing **negative must be linked** for HIV prevention services, e.g., condom, **PrEP/PEP** and **VMMC if male.**"},{"id":"unaids-linkages-sop-tbl-p64-0103","label":"Linkages SOP p.64","doc":"Enhanced Linkages Case Management SOP 2021","pages":"64-65","heading":"12.27 Day Zero; Referral of HIV Positive Client > Responsibilities at community Linkages","text":"### Responsibilities at community Linkages\n\nResponsibilities at community Linkages\n\n| Community Linkages facilitator / health care worker | Client | Receiving health facility |\n| --- | --- | --- |\n| ○ Conduct ART readiness assessment and highlight identified gaps in the CCF and in the referral form<br/>○ Must be aware of available referral services (both clinical services and community resources) at the preferred facility.<br/>○ Must understand the services needed by the client.<br/>○ Initiate client on ART, give client two weeks supply<br/>○ Document referral form which include detailed physical address date client tested and HIV status or the services the client is being referred for.<br/>○ Agree on the appointment date and the client's preferred facility.<br/>○ Call the facility the client is being referred to make an appointment.<br/>- Complete the referral form comprehensively and ensure the client is booked at the referred facility - Escort or meet clients at facilities and provide treatment navigation services for at least the first facility visit as per the need of the client. - Do follow up with receiving facility to confirm linkage of referred client. - Conduct at least one follow-up support calls before ART initiation (if not on the day of diagnosis), and two follow-up support call. - For Community partners implementing Community ART, clients must be initiated before being referred out. - Discuss with the client the importance of index testing and disclosure. | ○ Client to link to care on the same day or within 7 days if same day initiation is not possible.<br/>○ Provide the list for all sexual/ injecting partners, biological children below 15 years and associates.<br/>○ Client should disclose to significant others, family, and partner when appropriate.<br/>○ Client to honor appointments and adhere to treatment if initiated on ART | ○ Health care worker who receives the client and verifies information in CMIS if the facility is on CMIS.<br/>○ If not already on ART conduct retesting for verification.<br/>○ The facility must call the community health care worker (if client was not escorted) to update on client referral.<br/>○ Document update in the referral form and file the referral slip.<br/>○ Complete and return bottom referral slip to client to give to community health care workers. |\n\nPrinted rotated over two pages; each column is an independent list (items side by side are not paired)."},{"id":"unaids-linkages-sop-0109","label":"Linkages SOP p.68","doc":"Enhanced Linkages Case Management SOP 2021","pages":"68","heading":"12.28 Strategy 1: Community outreach HIV testing (not ART initiation) > Responsibilities for HIV testing and not initiating ART at Community level","text":"In this strategy, the outreach clinic/community testing partner will offer HIV testing and initiate ART for HIV Positive clients and refer to clients preferred health facilities for continuity of care. Files and ART numbers will be obtained from the health facility that is linked to the catchment area in which services will be provided. Those willing to be initiated on ART will be initiated and issued an ART number (issued prior by the health facility) and all relevant files will be transferred to the health facility within seven days of service provision. If mobile outreach occurs outside of MoH clinic hours all files will be stored at a partner's safe storage M&E lockable filing cabinet awaiting delivery to the health facilities within seven days. For those who opt to initiate ART outside the health facility geographical catchment area, a national referral form/transfer out to the mother clinic/facility of choice is written. The Outreach team should follow up if the client has reached the facility. if not, they should track the client.\n\nThose clients who decline and choose to initiate ART elsewhere will be linked to the client preferred health facility of their choice (following procedures outlined in Strategy 1). Tracking of client's adherence to treatment, or linkage to treatment, will be conducted through health facilities where the client was referred using call log tracking systems to link clients to ART and navigating positive living through trained peer navigator's/expert clients."},{"id":"unaids-linkages-sop-0098","label":"Linkages SOP p.61, 'within day 14'","doc":"Enhanced Linkages Case Management SOP 2021","pages":"61","heading":"12.25 Community LCM Model","text":"# 12.25 **Community LCM Model**\n\nThis is a referral of a client testing HIV positive at community level by a Community Health care worker (HTS counsellor/CEC/peer navigator/CMM/ RHM) or outreach service to the nearest health facility (clinic, health center, hospital). Where possible PLHIV are paired/assigned with a community peer expert client (EC) or counselor (Linkage facilitator) from HIV diagnosis until the client reaches 6 months (180 days) clinical visit. The length of LCM and package of linkage services for community clients are the same as that for facility clients. Linkage facilitators must inform the client that if they miss the visit, they will be called on their mobile phone or call next of kin/treatment supporter however if not available, home visit will be done by the community health care worker. Clients initiated on ART at community level must reach the facility within day 14. Clients testing HIV negative should be actively referred to HIV prevention services. Once client has been linked to the facility, the community partner should stop following the client, the facility will now provide the expected follow up according to LCM. In a situation where the community wants the outcome of the client they should communicate with the facility."}]},{"id":"Q024","area":"HIV testing, treatment and PMTCT","document":"Enhanced Linkages Case Management SOP 2021","topic":"Lost to follow-up tracing","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"A client has missed their ART appointment by more than 28 days and does not answer the phone. What are the tracing steps?","original_reference":"Verify LTFU using patient charts, CMIS/APMR and pharmacy records; attempt phone contact; if unable to reach the client after 3 phone attempts on different days or times, refer to community expert clients for a home visit; if still not traced, use community partners for follow-up home visits.","question":"What are the tracing steps for a client on ART who is more than 28 days late and can't be reached by phone?","change":"Kept general (procedure question); shortened.","reference":"Verify the LTFU using the patient chart, CMIS/APMR and pharmacy records; contact the client by phone; if she cannot be reached after 3 phone attempts on different days (or times), refer to community expert clients for a home visit; if she still cannot be traced, use community partners for follow-up home visits.","must_include":["Verify LTFU (chart, CMIS/APMR, pharmacy records)","3 phone attempts on different days or times","Refer to community expert clients for home visit","Community partners if still not traced"],"must_not_include":["Close the file as lost to follow-up without tracing","Home visit before any phone attempts"],"check":"verified","sources":[{"id":"unaids-linkages-sop-0126","label":"Linkages SOP p.78-79","doc":"Enhanced Linkages Case Management SOP 2021","pages":"78-79","heading":"13 Clients Who Interrupted Treatment (Lost to Follow-up) > Identifying Clients Who Have Disengaged from Care","text":"(Process to identify clients that have disengaged from care, continued)\n\nc) Document demographic information (name, surname, CMIS number, date reported LTFU etc.) of clients that missed scheduled visits from the appointment register\n\nd) Verify LTFU using patient charts, CMIS /APMR, pharmacy records\n\ne) Contact confirmed LTFU using phone contacts\n\nf) If unable to contact the client on 3 different phone attempts on different days (or times) refer clients to community ECs\n\ng) If unable to track the client through home visits or Community partners for follow up home visits"},{"id":"hiv-2022-fig-7.6-defaulter-tracing","label":"HIV 2022 p.175","doc":"Integrated HIV Management Guidelines 2022","pages":"175","heading":"Chapter 7: Adult Antiretroviral Therapy > 7.15 Adherence to care and treatment > Figure 7.6 Defaulter tracing","text":"### Figure 7.6 Defaulter tracing (timeline classifications)\n\nTimeline classifications (the probability of retention decreases with each day that passes after the appointment):\n- On time: came between 7 days before and less than 3 days after the appointment. Reminder system: pre-appointment reminders for clients particularly those at risk of missing appointment; post-appointment reminders for all clients as a proactive measure.\n- Honored appointment: client who came on the exact date of the appointment.\n- Pre-appointment reminder: efforts made to ensure clients come on time before the appointment.\n- Post-appointment reminder: efforts
