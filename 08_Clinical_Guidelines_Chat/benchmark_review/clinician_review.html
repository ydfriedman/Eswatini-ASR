en < 25kg | ≥ 13 years | Adults and adolescents; no child-friendly formulations available | All ages: child-friendly (dispersible) formulation available |\n| Pregnant women | Safe for use(c) | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available for this population | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available specifically in this population |\n| Interactions with ART | No restriction | Contraindicated: All protease inhibitors (PIs), nevirapine (NVP), doravirine and etravirine, tenofovir alafenamide (TAF)<br/>Use: tenofovir disoproxil fumarate (TDF), EFV, DTG, RAL | Contraindicated: All PIs, NVP, doravirine and etravirine<br/>Use with caution: TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Use: TDF, EFV, DTG, RAL | No restriction | No restriction (may interfere with lamivudine clearance) |\n| Toxicity | Hepatotoxicity (more), peripheral neuropathy, rash, gastrointestinal upset | Flu-like syndrome, hypersensitivity reactions, gastrointestinal upset, orange discolouration of body fluids, rash, hepatotoxicity (less) | Hypersensitivity reactions, hepatotoxicity (less), rash, gastrointestinal upset, hypoprothrombinaemia, orange discolouration of body fluids | Rash, gastrointestinal upset, hepatotoxicity (less), hypoprothrombinaemia, Orange discolouration of body Fluids | Hepatotoxicity (more), hypersensitivity reaction, rash, gastrointestinal upset, orange discolouration of body fluid | Hepatotoxicity, rash, gastro-intestinal upset | Diarrhoea, nausea and bloating, arthralgia, inflamed or torn tendons, muscle pain or weakness, prolonged QTc interval, mood or behaviour changes, insomnia |\n| Absorption | Best absorbed on an empty stomach; up to 50% reduction in peak concentration with a fatty meal | Oral rifapentine bioavailability is 70%; peak concentration increased if given with a meal | Rifampicin absorption is rapid but may be delayed or decreased by high-fat meals. |  | Same as 3HP | Same as 6H | Absorption is not influenced by food. Concomitant steroid use may increase risk of tendon rupture. Multivalent cation containing products including antacids (may contain aluminium), mineral supplements (e.g. iron or magnesium) or multivitamins may decrease absorption. Effect of warfarin may be enhanced |\n\n1HP, 1 month of daily rifapentine plus isoniazid; 3HP, 3 months of weekly rifapentine plus isoniazid; 3HR, 3 months of daily rifampicin plus isoniazid; 4R, 4 months of daily rifampicin monotherapy; 6H, 6 months of daily isoniazid monotherapy; 6Lfx, 6 months of daily levofloxacin monotherapy; B6, pyridoxine; CPT, cotrimoxazole; DTG, dolutegravir; EFV, efavirenz; FDC, fixed-dose combination; H, isoniazid; LPV/r, lopinavir–ritonavir; NVP, nevirapine; P, rifapentine; PI, protease inhibitor; H + CPT + B6 (Q-TIB), isoniazid-cotrimoxazole-pyridoxine combination; R, rifampicin; RAL, raltegravir; TAF, tenofovir alafenamide; TDF, tenofovir disoproxil fumarate.\n(a) H-300 mg; P-300 mg; H-300 mg/P-300 mg FDC; R-150 mg/H-75 mg FDC; R-300 mg/150 mg; Lfx-500 mg.\nThe Absorption row is printed on p.191 under a repeated header; the 4R absorption cell is blank in the source."},{"id":"tb-2025-tbl-tpt-plhiv","label":"TB p.217, Table 58","doc":"Integrated TB Management Guidelines 2025","pages":"217","heading":"Chapter 11: Tuberculosis Preventive Treatment > 11.8 TPT Regimens and Dosing > Table 58: TPT Regimens and Dosing for PLHIV","text":"### Table 58: TPT regimens and dosing for people living with HIV: 3HP (preferred, ≥12 years and ≥25 kg), 1HP alternative, 6H for children <14 years or <30 kg and pregnant women, isoniazid mg/kg by age, vitamin B6\n\n| Population group | Preferred regimen | Alternative regimen |\n| --- | --- | --- |\n| Individuals ≥12 years and ≥25 kg | 3HP\\*: weekly isoniazid plus rifapentine for 3 months (rifapentine 300 mg/isoniazid 300 mg per tablet, 12 doses) – 3 tablets weekly plus 25 or 50 mg [as printed] plus vitamin B6 weekly | 1HP (when available): daily isoniazid plus rifapentine for 1 month. Dosage: 300 mg isoniazid and 600 mg rifapentine daily plus 25 mg vitamin B6 daily |\n| Children <14 years or weight <30 kg | 6H: 6 months of daily isoniazid plus vitamin B6 25 mg daily. Isoniazid dosing: <10 years 10 mg/kg/day; >10 years 5 mg/kg/day | 3HP/1HP may be used for ≥2 years old when a child-friendly formula is available. |\n| Pregnant women | 6H: 6 months of daily isoniazid plus vitamin B6 25 mg daily (dosing 5 mg/kg/day, maximum 300 mg/day). PNP prophylaxis for INH-containing regimen: vitamin B6 10-25 mg/day | — |\n\n**Note:** 3HP is not recommended for PLHIV taking antiretrovirals with clinically significant or unknown drug interactions with rifapentine, or for people presumed infected with isoniazid- or rifampicin-resistant M. tuberculosis. In infants receiving NVP for prevention of mother-to-child transmission, 6H should be the preferred regimen; caregivers of exposed infants who complete PMTCT should be told that if the infant becomes HIV positive, TPT may need to change from 3HR to avoid drug interactions."}]},{"id":"Q117","area":"TB and TB/HIV","document":"TB 2025 / HIV Amendment 2024","topic":"Ambiguous - missing weight/age","type":"edge-case","category":"ambiguous","expected":"ask-clarifying","safety":"yes","original_question":"What TB preventive therapy should I give this child?","original_reference":"Ask for the child's age, weight, HIV status/ART regimen, and the index case's drug susceptibility (DS vs MDR), since the regimen depends on these (e.g. 3HP only >14 years and ≥30 kg; 6H for CLHIV <14 y/<30 kg; levofloxacin for MDR contacts).","question":"What TB preventive therapy should I give this child?","change":"Unchanged (behaviour test).","reference":"Ask for the child's age, weight, HIV status/ART regimen, and the ind , gastrointestinal upset | Flu-like syndrome, hypersensitivity reactions, gastrointestinal upset, orange discolouration of body fluids, rash, hepatotoxicity (less) | Hypersensitivity reactions, hepatotoxicity (less), rash, gastrointestinal upset, hypoprothrombinaemia, orange discolouration of body fluids | Rash, gastrointestinal upset, hepatotoxicity (less), hypoprothrombinaemia, Orange discolouration of body Fluids | Hepatotoxicity (more), hypersensitivity reaction, rash, gastrointestinal upset, orange discolouration of body fluid | Hepatotoxicity, rash, gastro-intestinal upset | Diarrhoea, nausea and bloating, arthralgia, inflamed or torn tendons, muscle pain or weakness, prolonged QTc interval, mood or behaviour changes, insomnia |\n| Absorption | Best absorbed on an empty stomach; up to 50% reduction in peak concentration with a fatty meal | Oral rifapentine bioavailability is 70%; peak concentration increased if given with a meal | Rifampicin absorption is rapid but may be delayed or decreased by high-fat meals. |  | Same as 3HP | Same as 6H | Absorption is not influenced by food. Concomitant steroid use may increase risk of tendon rupture. Multivalent cation containing products including antacids (may contain aluminium), mineral supplements (e.g. iron or magnesium) or multivitamins may decrease absorption. Effect of warfarin may be enhanced |\n\n1HP, 1 month of daily rifapentine plus isoniazid; 3HP, 3 months of weekly rifapentine plus isoniazid; 3HR, 3 months of daily rifampicin plus isoniazid; 4R, 4 months of daily rifampicin monotherapy; 6H, 6 months of daily isoniazid monotherapy; 6Lfx, 6 months of daily levofloxacin monotherapy; B6, pyridoxine; CPT, cotrimoxazole; DTG, dolutegravir; EFV, efavirenz; FDC, fixed-dose combination; H, isoniazid; LPV/r, lopinavir–ritonavir; NVP, nevirapine; P, rifapentine; PI, protease inhibitor; H + CPT + B6 (Q-TIB), isoniazid-cotrimoxazole-pyridoxine combination; R, rifampicin; RAL, raltegravir; TAF, tenofovir alafenamide; TDF, tenofovir disoproxil fumarate.\n(a) H-300 mg; P-300 mg; H-300 mg/P-300 mg FDC; R-150 mg/H-75 mg FDC; R-300 mg/150 mg; Lfx-500 mg.\nThe Absorption row is printed on p.191 under a repeated header; the 4R absorption cell is blank in the source."}]},{"id":"Q123","area":"TB and TB/HIV","document":"TB 2025","topic":"Abbreviations/shorthand","type":"edge-case","category":"typos-lay-language","expected":"answer-robustly","safety":"yes","original_question":"pt on RHZE, wt 48kg, how many tabs?","original_reference":"35–54.9 kg band: 3 tablets RHZE (150/75/400/275) daily in the 2-month intensive phase, then 3 tablets RH in continuation; plus pyridoxine.","question":"pt on RHZE, wt 48kg, how many tabs?","change":"Unchanged (behaviour test).","reference":"35–54.9 kg band: 3 tablets RHZE (150/75/400/275) daily in the 2-month intensive phase, then 3 tablets RH in continuation; plus pyridoxine.","must_include":["35-54.9 kg band","3 tablets RHZE daily (intensive phase)","3 tablets RH daily (continuation)"],"must_not_include":["4 tablets"],"check":"verified","sources":[{"id":"tb-2025-tbl-p99-0236","label":"TB p.99, Table 14","doc":"Integrated TB Management Guidelines 2025","pages":"99","heading":"6.4 Standard TB treatment regimens for adults > Table 14: Recommended treatment regimen and dosages for adult cases of new and re-registered cases","text":"### Table 14: Recommended treatment regimen and dosages for adult cases of new and re-registered cases (Phase of treatment, Drugs, Weight in Kg<br/>25-34.9, Weight in Kg<br/>35-54.9, Weight in Kg<br/>55-70, Weight in Kg<br/>>70)\n\n| Phase of treatment | Drugs | Weight in kg 25-34.9 | Weight in kg 35-54.9 | Weight in kg 55-70 | Weight in kg >70 |\n| --- | --- | --- | --- | --- | --- |\n| Intensive phase of 2 months | (RHZE) 150 mg/75 mg/400 mg/275 mg | 2 tabs | 3 tabs | 4 tabs | 5 tabs |\n| Continuation phase of 4 months | (RH) 150 mg/75 mg | 2 tabs | 3 tabs | 4 tabs | 5 tabs |\n| For severe extrapulmonary TB (TB meningitis and bone & joint TB): total treatment duration is 9-12 months, with 2 months of RHZE and 7-10 months of RH depending on the response to treatment. For TB meningitis, refer to section 6.7 for further details. | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |\n| Vitamin B6 for peripheral neuropathy prophylaxis: 25-50 mg (25 mg tablets) | (same as left) | (same as left) | (same as left) | (same as left) | (same as left) |"}]},{"id":"Q125","area":"TB and TB/HIV","document":"HIV Amendment 2024","topic":"False premise","type":"edge-case","category":"false-premise","expected":"correct-premise","safety":"yes","original_question":"Why do we still use INH/cotrimoxazole/B6 as the preferred TPT for adults with HIV?","original_reference":"Correct: INH/CTX/B6 has been phased out as a TPT option; 3HP is preferred for TPT-naive PLHIV >14 y and ≥30 kg.","question":"Why do we still use INH/cotrimoxazole/B6 as the preferred TPT for adults with HIV?","change":"Unchanged (behaviour test).","reference":"Correct: INH/CTX/B6 has been phased out as a TPT option; 3HP is preferred for TPT-naive PLHIV >14 y and ≥30 kg.","must_include":["Corrects the premise: INH/CTX/B6 has been phased out","3HP is preferred (PLHIV >14 years and 30 kg)"],"must_not_include":["Affirms INH/CTX/B6 as preferred"],"check":"verified","sources":[{"id":"hiv-amendment-2024-tbl-6-summary-of-changes","label":"Amendment p.23","doc":"HIV Management Amendment 2024","pages":"23","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > Summary of Changes","text":"### Chapter 6 TB/HIV and advanced HIV disease: summary of changes (TPT, TB LAM, CD4, CrAg), 2022 vs 2024 guidance\n\n| 2022 Guidance | 2024 Guidance |\n| --- | --- |\n| INH/CTX/VitB6 is an option for TPT for PLHIV. | INH/CTX/VitB6 is phased out as a TPT option. |\n| TB LAM diagnosed patients are classified as clinically diagnosed patients. | TB LAM diagnosed patients are classified as bacteriologically confirmed TB patients. |\n| 3HP (900mg/900mg) recommended for children and adolescents > 12 years and 25kgs. | 3HP (900mg/900mg) recommended for children and adolescents > 14 years and 30kgs. |\n| Levofloxacin + Ethambutol recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. | Levofloxacin recommended for TPT for high-risk contact of a MDR, INH mono and PDR patients. |\n| PIMA is the platform of choice for baseline CD4 count test. | VISITECT CD4 for Advanced HIV disease is the platform of choice for baseline CD4 test where available. |\n| CrAg screening recommended for PLHIV with CD4 ≤ 100 cell/ml. | CrAg screening recommended for PLHIV with CD4 ≤ 200 cell/ml. |\n| TB LAM test recommended for inpatients with CD4 ≤ 200 cell/ml, outpatients with CD4 ≤ 100 cell/ml. | TB LAM test recommended for inpatients and outpatients with CD4 ≤ 200 cell/ml. |"},{"id":"hiv-amendment-2024-tbl-6.1.2-tpt-options","label":"Amendment p.24","doc":"HIV Management Amendment 2024","pages":"24","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.1 Tuberculosis > 6.1.2 TB Prevention","text":"### Recommended TPT options by population group (preferred and alternative regimens)\n\nRecommended TPT options are as follows:\n\n| Population group | Preferred regimen | Alternative regimen |\n| --- | --- | --- |\n| All TPT naïve PLHIV including children and adolescents above 14 years and 30kg; PLHIV on completion of DSTB or DRTB treatment despite previous TPT; PLHIV who are household contacts to bacteriologically confirmed TB, despite previous TPT | 3 months of Rifapentine/Isoniazid (3HP) 900mg/900mg; 1 month of INH/Rifapentine (1HP), once available | 6 months of INH monotherapy (6H) |\n| CLHIV (<14 years or <30kgs) | 6H | (none: cell greyed out) |\n| HIV-negative (household contact, other at-risk groups) | 3 months of Rifapentine/Isoniazid (3HP) 900mg/900mg; 3 months of Rifampicin/Isoniazid (3RH); 4 months of Rifampicin (4R) | 6 months of INH (6H) |\n| DR-TB contacts | MDR-TB/RR-TB/Rif mono-resistance: Levofloxacin. INH mono and PDR: Levofloxacin. Pre-XDR and XDR: for DRTB expert review. | (same as left) |"}]},{"id":"Q133","area":"TB and TB/HIV","document":"TB 2025 / HIV 2022","topic":"Multi-part","type":"edge-case","category":"multi-part","expected":"answer-all-parts","safety":"yes","original_question":"Newly diagnosed HIV patient with TB meningitis — when do I start ART, which regimen, and does the DTG dose change?","original_reference":"All three parts: delay ART until 4 weeks after starting TB treatment (TB meningitis); TDF/3TC + DTG; DTG increased to 50 mg twice daily while on rifampicin (continue for 2 weeks after TB treatment per paediatric guidance).","question":"Newly diagnosed HIV patient with TB meningitis — when do I start ART, which regimen, and does the DTG dose change?","change":"Kept as a deliberate multi-part question; reference wording fixed (adult source).","reference":"All three parts: delay ART until 4 weeks after starting TB treatment (TB meningitis); TDF/3TC + DTG; DTG increased to 50 mg twice daily while on rifampicin, returning to once daily two weeks after TB treatment is completed.","must_include":["Delay ART to 4 weeks after starting TB treatment","TDF/3TC + DTG","DTG 50 mg twice daily with rifampicin"],"must_not_include":["Start ART within 2 weeks (that is for non-meningitis TB)","DTG 50 mg once daily"],"check":"verified","sources":[{"id":"tb-2025-tbl-p194-0492","label":"TB p.194, Table 45","doc":"Integrated TB Management Guidelines 2025","pages":"194","heading":"10.1 TB/HIV interaction and the comprehensive package of care > 10.1.5 When to start ART? > Table 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB","text":"### Table 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB (Patient Category, When to start ART)\n\nTable 45: Recommended periods to start ART in PLHIV with presumptive TB and confirmed TB\n\n| Patient Category | When to start ART |\n| --- | --- |\n| Among PLHIV who are presumptive for TB | Initiate ART while rapidly investigating for TB, with close follow-up within seven days to initiate TB treatment if TB is confirmed |\n| Among PLHIV on ART and diagnosed with TB | Continue ART and initiate anti-TB treatment as soon as diagnosed, may need to adjust ART regimen/dosage if required |\n| For newly diagnosed PLHIV/returnees who also have been diagnosed with TB | Initiate ART as soon as possible preferably within 2 weeks of initiating tuberculosis treatment (including same-day anti-TB and ART treatment if clinically stable) regardless of immune status |\n| Patients with TB meningitis | Delay ART to 4 weeks post-initiation of anti-TB treatment |"},{"id":"tb-2025-tbl-p194-0493","label":"TB p.194-195, Table 46","doc":"Integrated TB Management Guidelines 2025","pages":"194-195","heading":"10.1 TB/HIV interaction and the comprehensive package of care > 10.1.6 What ART regimen to start on? > Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients","text":"### Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients (Client Category, Recommended ART regimen, Comments)\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| Clients already on TB treatment presenting for ART initiation | TDF (300 mg)/3TC (300 mg) once daily + DTG (50 mg twice daily) | - Start ART as soon as possible with increased DTG dosing of 50 mg twice daily<br/>- Return to standard DTG dosing 50 mg once daily two weeks after the completion of TB treatment |\n| Clients developing TB while on a DTG-based ART regimen | Increase DTG dose to 50 mg twice daily | Clients must return to DTG 50 mg once daily 2 weeks after completing TB treatment. |\n| Developing DS-TB while on an EFV-based ART regimen | TDF/3TC+EFV 400 mg (once daily) | - Check VL at the end of treatment. If VL is undetectable, the client can be transitioned to a once-daily FDC of TDF+3TC+DTG two weeks after completion of TB treatment<br/>- If VL is detectable, immediately switch to second line and continue adherence support (refer to the ART section) |\n| Developing DS-TB while on a protease inhibitor (PI)-based ART regimen | Consult an experienced HIV clinician or snapthirdline@mohcoag.org before choosing these options:<br/>TB patient on LPV/r:<br/>- Super-boost LPV/r to 400 mg/400 mg by adding 300 mg ritonavir, and continue until 2 weeks after completion of TB treatment<br/>- Double-dose LPV/r to 800 mg/200 mg twice daily (double dosing is only for clients >10 years of age) and continue until 2 weeks after completion of TB treatment<br/>- If evidence of VL suppression in the past 3-6 months, switch to a DTG-based second-line regimen and continue twice-daily DTG until 2 weeks after completion of TB treatment<br/>TB patient on ATV/r or DRV/r:<br/>- Do not combine with rifampicin<br/>- Change to DTG twice daily if DTG-naive, or LPV/r with adjustments as above if DTG-experienced<br/>Patients who may be failing ART:<br/>- Follow guidance on managing treatment failure | (same as left) |\n\n**For clients with multidrug-resistant TB**\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| EFV and bedaquiline (BDQ) | - EFV should not be used with BDQ.<br/>- EFV induces CYP3A activity and co-administration with BDQ may result in reduced BDQ exposure and loss of BDQ activity.<br/>- DTG is the preferred INSTI for clients receiving BDQ. | (same as left) |\n| Delamanid (DLM) and ARVs | - DLM is generally considered safe to administer with ART.<br/>- Evidence shows safety with EFV, TDF and LPV/r.<br/>- No LPV/r dose adjustment is needed for TB patients on DLM. No long-term studies have been done on drug-drug interactions between DLM and ARVs. DTG is the preferred INSTI for clients receiving DLM. | (same as left) |\n\n**Note:** For all clients, maintain the same NRTI backbone provided no dose adjustment is necessary and the client is virally suppressed."}]},{"id":"Q135","area":"TB and TB/HIV","document":"Multiple","topic":"Cross-corpus aggregation","type":"edge-case","category":"aggregation","expected":"answer-comprehensive","safety":"yes","original_question":"List every medicine in these guidelines that interacts with rifampicin.","original_reference":"Should gather across documents: DTG (double dose), LPV/r (super-boosting), CAB-LA and LEN (avoid), hormonal contraceptives (COCs/POPs/CICs reduced efficacy), 3HP/rifamycin TPT vs PIs/NVP, etc. Should acknowledge the list may not be exhaustive given missing chapters.","question":"List every medicine in these guidelines that interacts with rifampicin.","change":"Unchanged (behaviour test).","reference":"Should gather across documents: DTG (double dose), LPV/r (super-boosting), CAB-LA and LEN (avoid), hormonal contraceptives (COCs/POPs/CICs reduced efficacy), 3HP/rifamycin TPT vs PIs/NVP, etc. Should acknowledge the list may not be exhaustive given missing chapters.","must_include":["DTG (double dose)","LPV/r (super-boost or double dose)","CAB-LA and LEN","Hormonal contraceptives (COCs, POPs, CICs)","Rifamycin TPT vs PIs/NVP","Says the list may not be complete"],"must_not_include":["Lists only one drug","Claims completeness"],"check":"verified","sources":[{"id":"tb-2025-tbl-p194-0493","label":"TB p.194-195","doc":"Integrated TB Management Guidelines 2025","pages":"194-195","heading":"10.1 TB/HIV interaction and the comprehensive package of care > 10.1.6 What ART regimen to start on? > Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients","text":"### Table 46: Recommended Adult ART Regimens for TB/HIV Co-infected patients (Client Category, Recommended ART regimen, Comments)\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| Clients already on TB treatment presenting for ART initiation | TDF (300 mg)/3TC (300 mg) once daily + DTG (50 mg twice daily) | - Start ART as soon as possible with increased DTG dosing of 50 mg twice daily<br/>- Return to standard DTG dosing 50 mg once daily two weeks after the completion of TB treatment |\n| Clients developing TB while on a DTG-based ART regimen | Increase DTG dose to 50 mg twice daily | Clients must return to DTG 50 mg once daily 2 weeks after completing TB treatment. |\n| Developing DS-TB while on an EFV-based ART regimen | TDF/3TC+EFV 400 mg (once daily) | - Check VL at the end of treatment. If VL is undetectable, the client can be transitioned to a once-daily FDC of TDF+3TC+DTG two weeks after completion of TB treatment<br/>- If VL is detectable, immediately switch to second line and continue adherence support (refer to the ART section) |\n| Developing DS-TB while on a protease inhibitor (PI)-based ART regimen | Consult an experienced HIV clinician or snapthirdline@mohcoag.org before choosing these options:<br/>TB patient on LPV/r:<br/>- Super-boost LPV/r to 400 mg/400 mg by adding 300 mg ritonavir, and continue until 2 weeks after completion of TB treatment<br/>- Double-dose LPV/r to 800 mg/200 mg twice daily (double dosing is only for clients >10 years of age) and continue until 2 weeks after completion of TB treatment<br/>- If evidence of VL suppression in the past 3-6 months, switch to a DTG-based second-line regimen and continue twice-daily DTG until 2 weeks after completion of TB treatment<br/>TB patient on ATV/r or DRV/r:<br/>- Do not combine with rifampicin<br/>- Change to DTG twice daily if DTG-naive, or LPV/r with adjustments as above if DTG-experienced<br/>Patients who may be failing ART:<br/>- Follow guidance on managing treatment failure | (same as left) |\n\n**For clients with multidrug-resistant TB**\n\n| Client category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| EFV and bedaquiline (BDQ) | - EFV should not be used with BDQ.<br/>- EFV induces CYP3A activity and co-administration with BDQ may result in reduced BDQ exposure and loss of BDQ activity.<br/>- DTG is the preferred INSTI for clients receiving BDQ. | (same as left) |\n| Delamanid (DLM) and ARVs | - DLM is generally considered safe to administer with ART.<br/>- Evidence shows safety with EFV, TDF and LPV/r.<br/>- No LPV/r dose adjustment is needed for TB patients on DLM. No long-term studies have been done on drug-drug interactions between DLM and ARVs. DTG is the preferred INSTI for clients receiving DLM. | (same as left) |\n\n**Note:** For all clients, maintain the same NRTI backbone provided no dose adjustment is necessary and the client is virally suppressed."},{"id":"hiv-2022-tbl-6.15-art-for-tb-hiv","label":"HIV 2022 p.130","doc":"Integrated HIV Management Guidelines 2022","pages":"130","heading":"Chapter 6: TB/HIV Collaborative Activities & Advanced HIV Disease > 6.1.5 > ART for TB patients > Table 6.15","text":"### Table 6.15 Recommended Adult ART Regimens for TB/HIV Coinfected patients\n\n| Client Category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| Clients already on TB treatment presenting for ART initiation | TDF/3TC/DTG Qam + DTG 50mg Qpm | • Start ART as soon as possible with increased DTG dosing of 50mg twice daily<br/>• Return to standard DTG dosing 50mg once daily two weeks after the completion of TB treatment |\n| Clients developing TB while on a DTG-based ART regimen | TDF/3TC/DTG Qam + DTG 50mg Qpm | Clients must return to DTG 50mg once daily 2 weeks after completing TB treatment. |\n| Developing DS-TB while on an EFV-based ART regimen | Continue with EFV based regimen | Check VL at the end of treatment. If VL is undetectable, the client can be transitioned to a once-daily FDC of TDF+3TC+DTG two weeks after completion of TB treatment<br/>If VL is detectable immediately switch to the second line and continue adherence support refer to the ART section |\n| Developing DS-TB while on a Protease inhibitor (PI) based ART regimen | Consult an experienced HIV clinician or snapthirdline@mohcoag.org before choosing these options:<br/>TB patient on LPV/r:<br/>• Super boost LPV/r to 400 mg/400 mg by adding 300 mg Ritonavir and continue until 2 weeks after completion of TB treatment<br/>• Double dose of LPV/r to 800 mg/200 mg twice daily. Double dosing is only for clients >10yrs of age and continues until 2 weeks after completion of TB treatment<br/>• If evidence of VL suppression in the past 3-6months, switch to a DTG-based second-line regimen and continue twice daily DTG until 2weeks after completion of TB treatment<br/>TB patient on ATV/r or DRV/r:<br/>• Do not combine with RIF<br/>• Change to DTG twice daily if DTG naïve or LPV/r with adjustments as stated above if DTG experienced<br/>Patients who may be failing ART:<br/>• Follow the guidance on managing treatment failure | (same as left) |\n\n**For Clients with Multidrug-Resistant TB**\n\n| Client Category | Recommended ART regimen | Comments |\n| --- | --- | --- |\n| EFV and Bedaquiline (BDQ) | EFV should not be used with BDQ. EFV induces CYP3A activity and co-administration with BDQ may result in reduced BDQ exposure and loss of BDQ activity.<br/>DTG is the preferred INSTI for clients receiving BDQ. | (same as left) |\n| Delamanid (DLM) and ARVs | DLM is generally considered safe to administer with ART. Evidence shows safety with EFV, TDF and LPV/r. No LPV/r dose adjustment is needed for TB patients on DLM<br/>No long-term studies have been done on potential drug-to-drug interactions with DLM and ARVs<br/>DTG is the preferred INSTI for clients receiving DLM | (same as left) |\n\nFor all clients, maintain the same NRTI backbone provided there is no dose adjustment necessary, and the client is virally suppressed"},{"id":"prep-2025-tbl-cab-la-drug-interactions","label":"PrEP 2025 p.26","doc":"PrEP Implementation Guidelines 2025","pages":"26-27","heading":"2 Overview of PrEP Products > 2.3 CAB-LA Injectable PrEP > CAB-LA and Other Drug Interactions","text":"### Table 6. CAB-LA (cabotegravir) drug interactions: anticonvulsants and rifampicin/rifapentine contraindicated; hormones safe; methadone, rifabutin, high-dose aspirin cautions\n\n**CAB-LA should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Anticonvulsants: carbamazepine<br/>- oxcarbazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| - Antimycobacterial medications: rifampicin<br/>- rifapentine | - Significant reduction of cabotegravir concentrations in blood plasma and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with CAB-LA; clients using them may need to select a different PrEP method or HIV prevention strategy.<br/>- CAB-LA can be considered two weeks after a client completes rifampin or rifapentine. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Contraceptive hormones; gender-affirming hormones | No known interactions |\n\n**Clients may still be eligible for CAB-LA, but additional cautions may be warranted**\n\n| Drug | Interaction |\n| --- | --- |\n| Methadone; rifabutin | Clients could require medication dose adjustments to maintain the effectiveness of these medications while they are using CAB-LA. |\n| High-dose aspirin (>325 mg) | Clients using high-dose aspirin in the past week, other nonsteroidal anti-inflammatory drugs for pain, or anticoagulants or other antiplatelets may have a higher likelihood of bruising or bleeding at the injection site and should be made aware and counselled on mitigation strategies, if relevant. |"},{"id":"prep-2025-tbl-len-drug-interactions","label":"PrEP 2025 p.32-33","doc":"PrEP Implementation Guidelines 2025","pages":"32-33","heading":"2 Overview of PrEP Products > 2.4 LEN Injectable PrEP > LEN and Other Drug Interactions","text":"### Table 7. LEN (lenacapavir) drug interactions: TB rifamycins, anticonvulsants, ketamine contraindicated; supplemental LEN with rifampicin; erectile dysfunction drugs; hormones safe\n\n**LEN should not be co-administered**\n\n| Drug | Interaction |\n| --- | --- |\n| - Drugs used in the treatment of tuberculosis: rifabutin<br/>- rifampicin<br/>- rifapentine | - These drugs cause significant reduction of LEN concentration and therefore decrease its efficacy.<br/>- Clients should not initiate LEN if currently on TB treatment and may need to select a different PrEP or HIV prevention strategy.<br/>- For clients already on LEN and wanting to continue, supplemental LEN can be given to maintain adequate LEN concentrations (see Figure 10). |\n| - Medication used in the treatment of epilepsy: carbamazepine<br/>- phenobarbital<br/>- phenytoin | - Significant reduction of LEN concentration and therefore decreasing its efficacy.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n| Anaesthetic drugs: ketamine | - Ketamine concentrations may increase and may increase side effects associated with ketamine such as respiratory depression and hallucinations.<br/>- This potential interaction may persist after discontinuation of LEN.<br/>- These drugs should not be co-administered with LEN; clients using them may need to select a different PrEP method or HIV prevention strategy. |\n\n**Drug that might need a dose adjustment**\n\n| Drug | Interaction |\n| --- | --- |\n| Clients already on LEN and newly diagnosed with TB and starting rifampicin | - Clients already using LEN when diagnosed with TB can continue LEN, but a dose adjustment needs to be made in consultation with the MO.<br/>- Supplemental LEN dosing for co-administration with rifampicin-based TB regimens consists of repeating the LEN initiation dosing when rifampicin is started (see Figure 10) and continuing supplemental LEN every 6 months until completing TB treatment. |\n| - Drugs used in treatment of erectile dysfunction: avanafil<br/>- sildenafil<br/>- tadalafil<br/>- vardenafil | - There is a potential interaction which may persist after discontinuation of LEN.<br/>- The concentrations of these drugs may increase; start with a lower than regular dose and work up to higher doses until the desired effect is achieved.<br/>- Dose adjustments should be done by the MO. |\n\n**Safe to co-administer**\n\n| Drug | Interaction |\n| --- | --- |\n| Gender-affirming hormones and hormonal contraceptives | No known interactions |"},{"id":"fp-2021-tbl-p50-0085","label":"FP p.50","doc":"Family Planning Services Guidelines 2021","pages":"50","heading":"6 Hormonal Contraceptives > 6.4 Combined Oral Contraceptives (COCs) > Advantages and disadvantages of using COCs","text":"### Combined Oral Contraceptives (COCs): Advantages and disadvantages of using COCs (Advantages, Disadvantages)\n\nAdvantages and disadvantages of using COCs\n\n| Advantages | Disadvantages |\n| --- | --- |\n| • Easy to use<br/>• Can be used from adolescence to menopause; by nulliparous and multiparous women; provided that no risk factors exist.<br/>Help protect against:<br/>• Risks of pregnancy<br/>• Cancer of the lining of the uterus (endometrial cancer)<br/>• Cancer of the ovary<br/>• Symptomatic pelvic inflammatory disease<br/>• Ovarian cysts<br/>• Iron-deficiency anaemia<br/>• Reduce menstrual cramps<br/>• Supresses menstrual bleeding problems<br/>• Reduce ovulation pain<br/>• Reduce excess hair on face or body<br/>• Minimises symptoms of polycystic ovarian syndrome (irregular period, acne, excess hair on face or body)<br/>• Reduce symptoms of endometriosis (pelvic pain, irregular bleeding) | • Does not protect against STIs and HIV infection.<br/>• Must be taken daily and at the same time<br/>• Require an individual to obtain regular supplies.<br/>• Effectiveness may be lowered if client is on anti-TB drugs (Rifampicin or Rifabutin therapy), anti-epilepsy treatment and some ARVs indicating a need for a backup method.<br/>• Effectiveness may also be lowered in the presence of diarrhoea and vomiting<br/>• Reduce milk production in breastfeeding women.<br/>• May cause mood changes and low libido to some women<br/>• Can increase the risk of Myocardial Infarction (MI) in women with existing risk factors such as smoking, Diabetes or hypertension. |"},{"id":"tb-2025-tbl-p212-0549","label":"TB p.212","doc":"Integrated TB Management Guidelines 2025","pages":"212-213","heading":"11.8 TPT Regimens and Dosing","text":"### Table 54: Key characteristics of TPT regimens\n\n| Characteristics | 6H | 3HP | 3HR | 4R | 1HP | 6H(+CPT+B6) | 6Lfx |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Drug (s) | Isoniazid | Isoniazid + Rifapentine | Isoniazid + Rifampicin | Rifampicin | Isoniazid + Rifapentine | Isoniazid + Cotrimoxazole + Pyridoxine | Levofloxacin |\n| Duration (mths) | 6 | 3 | 3 | 4 | 1 | 6 | 6 |\n| Frequency | Daily | Weekly | Daily | Daily | Daily | Daily | Daily |\n| Total No. of doses | 182 | 12 | 84 | 120 | 28 | 182 | 182 |\n| Pill burden per dose (total per regimen), person weighing 50kg using adult formulations(a) | 1(182) | 6 singles (72) or 3 with FDC (36) | 3(252) | 3(360) | 3(84) | 1(182) | 1(182) |\n| Children | All ages: child-friendly (dispersible) formulation available preferred for children with HIV on LPV/r or NVP | All ages: child-friendly (dispersible) formulation available | All ages: child-friendly (dispersible) formulation available | All ages: no child-friendly formulation available, not generally feasible for children < 25kg | ≥ 13 years | Adults and adolescents; no child-friendly formulations available | All ages: child-friendly (dispersible) formulation available |\n| Pregnant women | Safe for use(c) | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available for this population | Not known | Safe for use(c) | May be safe, although no safety or efficacy data available specifically in this population |\n| Interactions with ART | No restriction | Contraindicated: All protease inhibitors (PIs), nevirapine (NVP), doravirine and etravirine, tenofovir alafenamide (TAF)<br/>Use: tenofovir disoproxil fumarate (TDF), EFV, DTG, RAL | Contraindicated: All PIs, NVP, doravirine and etravirine<br/>Use with caution: TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Adjust dose: DTG, RAL<br/>Use: TDF, EFV | Contraindicated: All PIs, NVP, doravirine and etravirine, TAF<br/>Use: TDF, EFV, DTG, RAL | No restriction | No restriction (may interfere with lamivudine clearance) |\n| Toxicity | Hepatotoxicity (more), peripheral neuropathy, rash, gastrointestinal upset | Flu-like syndrome, hypersensitivity reactions, gastrointestinal upset, orange discolouration of body fluids, rash, hepatotoxicity (less) | Hypersensitivity reactions, hepatotoxicity (less), rash, gastrointestinal upset, hypoprothrombinaemia, orange discolouration of body fluids | Rash, gastrointestinal upset, hepatotoxicity (less), hypoprothrombinaemia, Orange discolouration of body Fluids | Hepatotoxicity (more), hypersensitivity reaction, rash, gastrointestinal upset, orange discolouration of body fluid | Hepatotoxicity, rash, gastro-intestinal upset | Diarrhoea, nausea and bloating, arthralgia, inflamed or torn tendons, muscle pain or weakness, prolonged QTc interval, mood or behaviour changes, insomnia |\n| Absorption | Best absorbed on an empty stomach; up to 50% reduction in peak concentration with a fatty meal | Oral rifapentine bioavailability is 70%; peak concentration increased if given with a meal | Rifampicin absorption is rapid but may be delayed or decreased by high-fat meals. |  | Same as 3HP | Same as 6H | Absorption is not influenced by food. Concomitant steroid use may increase risk of tendon rupture. Multivalent cation containing products including antacids (may contain aluminium), mineral supplements (e.g. iron or magnesium) or multivitamins may decrease absorption. Effect of warfarin may be enhanced |\n\n1HP, 1 month of daily rifapentine plus isoniazid; 3HP, 3 months of weekly rifapentine plus isoniazid; 3HR, 3 months of daily rifampicin plus isoniazid; 4R, 4 months of daily rifampicin monotherapy; 6H, 6 months of daily isoniazid monotherapy; 6Lfx, 6 months of daily levofloxacin monotherapy; B6, pyridoxine; CPT, cotrimoxazole; DTG, dolutegravir; EFV, efavirenz; FDC, fixed-dose combination; H, isoniazid; LPV/r, lopinavir–ritonavir; NVP, nevirapine; P, rifapentine; PI, protease inhibitor; H + CPT + B6 (Q-TIB), isoniazid-cotrimoxazole-pyridoxine combination; R, rifampicin; RAL, raltegravir; TAF, tenofovir alafenamide; TDF, tenofovir disoproxil fumarate.\n(a) H-300 mg; P-300 mg; H-300 mg/P-300 mg FDC; R-150 mg/H-75 mg FDC; R-300 mg/150 mg; Lfx-500 mg.\nThe Absorption row is printed on p.191 under a repeated header; the 4R absorption cell is blank in the source."}]},{"id":"Q148","area":"TB and TB/HIV","document":"TB 2025","topic":"Multi-turn","type":"edge-case","category":"follow-up-context","expected":"use-conversation-context","safety":"yes","original_question":"(Previous turn: 'Child, 4 years old, non-severe pulmonary TB, no past treatment.') And how long is the treatment?","original_reference":"Use prior context: 4 months — 2HRZ(E)/2HR (non-severe, 3 months–<16 years, no TB treatment in past 2 years).","question":"(Previous turn: 'Child, 4 years old, non-severe pulmonary TB, no past treatment.') And how long is the treatment?","change":"Unchanged (behaviour test).","reference":"Use prior context: 4 months — 2HRZ(E)/2HR (non-severe, 3 months–<16 years, no TB treatment in past 2 years).","must_include":["4 months","2HRZ(E)/2HR","Uses the previous turn's context"],"must_not_include":["6 months"],"check":"verified","sources":[{"id":"tb-2025-0367","label":"TB p.147","doc":"Integrated TB Management Guidelines 2025","pages":"147","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.4 Treatment of TB disease in children > 8.4.1 Treatment of drug-susceptible TB in children > 8.4.1.1 Recommended anti-TB Treatment Regimens for Children","text":"## 8.4.1.1 **Recommended anti-TB Treatment Regimens for Children**\n\n- All children with a severe form of TB should receive a 6-month treatment course of TB treatment; four-drug regimens (RHZE) in the initial phase for 2 months followed by two (HR) drug regimens for the continuation phase for 4 months (2RHZE/4RH). Children with malnutrition (i.e. MUAC <11.5 cm or weight for height Z score -3 are to be treated with a 6-month regimen.\n- Children (3 months- less than 16 years) with a non-severe form of TB should receive a 4-month TB treatment course: 2 months of (RHZE) followed by 2 months of RH drug regimen (2RHZ(E)/2RH) if they have no TB treatment history in the past two years.\n- For severe forms of extrapulmonary TB such as TB meningitis and osteo-articular TB treatment duration is 9-12 months. See Table 26 for the summary of the TB treatment regimen for children and adolescents.\n- The treatment duration and dosing for new episodes and re-registered TB treatment are the same.\n- Treatment of TB in CALHIV is the same as for non-CALHIV.\n- For DR-TB treatment, refer to the DR-TB treatment Chapter 7."},{"id":"tb-2025-tbl-p148-0368","label":"TB p.148","doc":"Integrated TB Management Guidelines 2025","pages":"148","heading":"Chapter 8: Childhood TB Screening, Diagnosis and Treatment > 8.4 Treatment of TB disease in children > Table 34: DS-TB treatment algorithm in Children and Adolescents (0-19 years old)","text":"### Table 34: DS-TB treatment algorithm in Children and Adolescents (0-19 years old)\n\nAssess the site of TB disease*.\nA. Pulmonary TB (PTB), both new and re-registered – what is the child's age?\n   - <3 months: 2HRZE/4HR\n   - 3 months to <16 years: assess severity\n       - Non-severe: 2HRZE/2HR\n       - Severe: 2HRZE/4HR\n   - 16-19 years: 2HRZE/4HR\nB. Extra-pulmonary TB (EP-TB), both new and re-registered – what is the child's age?\n   - <3 months: 2HRZE/4HR\n   - 3 months to 19 years: assess severity\n       - Non-severe (isolated peripheral lymphadenopathy): 2HRZE/2HR\n       - Severe, bone & joint TB (incl. spine): 2HRZE/10HR\n       - Severe, TB meningitis: 6HRZ+Eto or 2HRZE/10HR\n       - Severe, all other forms of EP-TB: 2HRZE/4HR\n\n*If a child has both PTB and EP-TB severe form, treat with the regimen for the EP-TB severe form. Adjuvant steroid therapy: administer steroids for TB Meningitis, also for pericardial, spinal (sometimes), airway obstruction and TB-IRIS."}]},{"id":"Q174","area":"TB and TB/HIV","document":"Cross-document","topic":"TB with diabetes and alcohol","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"New TB patient, 55, with type 2 diabetes; drinks most weekends. Anything extra beyond the standard TB regimen?","change":"New question: needs the TB and NCD guidelines together.","reference":"Give pyridoxine 10 mg daily with the TB drugs, because diabetes and alcohol use both raise the risk of isoniazid neuropathy. Check random blood sugar (or HbA1c) at baseline and at months 2, 5 and 6. Do baseline liver and renal function tests. Advise complete abstinence from alcohol during TB treatment: alcohol raises the risk of liver toxicity and treatment failure and reduces adherence.","must_include":["Pyridoxine 10 mg daily","Blood sugar or HbA1c at baseline and months 2, 5 and 6","Complete abstinence from alcohol during TB treatment"],"must_not_include":["Moderate drinking is fine on TB treatment","Pyridoxine not needed"],"check":"verified","sources":[{"id":"tb-2025-0405","label":"TB 2025 p.160","doc":"Integrated TB Management Guidelines 2025","pages":"160","heading":"9.4 Monitoring of TB Patients for Adverse Effects of Anti-TB Drugs > Prevention of adverse effects of drugs","text":"#### Prevention of adverse effects of drugs\n\nHealthcare providers can prevent some drug-related adverse events by providing prophylaxis, such as Pyridoxine supplements for Isoniazid (INH)-induced peripheral neuropathy (PN). IND-induced PN occurs more commonly in pregnant women and people with the following conditions: HIV infection, alcohol abuse, malnutrition, diabetes, and chronic liver disease. These patients should receive preventive treatment with pyridoxine, 10 mg daily, along with their anti-tuberculosis drugs."},{"id":"tb-2025-0227","label":"TB 2025 p.96","doc":"Integrated TB Management Guidelines 2025","pages":"96","heading":"Chapter 6: Treatment of Drug-Susceptible Tuberculosis > 6.2 Treatment Initiation > (b) History Taking and Baseline Examination","text":"Random blood sugar or (HBA1C if available) is to be performed at baseline and months 2, 5 and 6 for those identified as having diabetes mellitus. Liver function tests (AST, ALT, Bilirubin) and renal function tests (urea, creatinine) are also recommended to conduct at baseline and follow-up tests if clinically indicated (e.g. those with chronic liver disease, chronic renal disease)."},{"id":"ncdimh-0048","label":"NCDIMH p.22","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"22","heading":"Chapter 1: Prevention, Health Education and Routine Health Examinations > Alcohol Use > Special Populations > Patients on TB Treatment","text":"## Patients on TB Treatment\n\n- Alcohol interferes with TB medication effectiveness\n- Increases risk of liver toxicity from TB drugs\n- Reduces treatment adherence and increases treatment failure\n- **RECOMMENDATION**: Complete abstinence during TB treatment\n\n## Adolescents and Young Adults\n\n- Brain continues developing until age 25; alcohol impairs brain development\n- Early alcohol use increases lifetime risk of alcohol use disorder\n- Associated with risky behaviours, injuries, poor school performance\n- **RECOMMENDATION**: Delay alcohol initiation as long as possible; abstinence is safest"}]},{"id":"Q178","area":"TB and TB/HIV","document":"Cross-document","topic":"Chronic cough in a smoker","type":"synthesis","category":"multi-source","expected":"Answer from the guideline","safety":"yes","original_question":"","original_reference":"","question":"62-year-old smoker, cough and breathlessness for over a year, slowly getting worse. Our clinic has no spirometry. How do I work him up?","change":"New question: needs the TB and NCD guidelines together.","reference":"Investigate for TB first: cough of any duration needs investigation, chronic cough can be TB as well as COPD, asthma, heart failure or lung cancer, and smokers and people with COPD are priority groups for chest X-ray screening. Without spirometry, grade breathlessness with the MRC dyspnoea scale and refer for spirometry where possible (post-bronchodilator FEV1/FVC below 0.7 confirms airflow limitation). Start smoking cessation (with nicotine replacement if needed) and a short-acting bronchodilator as needed for breathlessness.","must_include":["Investigate for TB (CXR screening; smokers/COPD are priority groups)","MRC dyspnoea scale when no spirometry","Spirometry to confirm (FEV1/FVC below 0.7)","Smoking cessation"],"must_not_include":["Diagnose COPD without excluding TB","Inhaled steroid on its own"],"check":"verified","sources":[{"id":"tb-2025-0107","label":"TB 2025 p.52","doc":"Integrated TB Management Guidelines 2025","pages":"52-53","heading":"3.3 TB Case Finding in Special Circumstances > 3.3.6 Syndromic referral approach to cough and other signs of TB/CLC","text":"## 3.3.6 Syndromic referral approach to cough and other signs of TB/CLC\n\nThe entry point for the integration of TB with CLC is chronic cough as a key symptom of underlying problems. For standardisation, cough of any duration needs to be investigated. If tests for TB are negative but the cough persists, further tests for CLC need to be undertaken.\n\nChronic cough may be present due to several factors including:\n- Asthma\n- Bronchiectasis\n- COPD\n- Left Heart Failure\n- Lung Cancer\n- Tuberculosis\n- Other Conditions\n\nCHWs should normally screen and refer those with signs and symptoms to the Primary Health Care (PHC) clinic as the first step. The PHC should determine whether patients need further diagnosis for conditions that cannot be managed at the PHC and, if so, refer them further to the nearest hospital or specialist facility. Referral and feedback tools should be used at each stage of referral (i.e. CHW to PHC, PHC to hospital/specialist facility)."},{"id":"tb-2025-0088","label":"TB 2025 p.44","doc":"Integrated TB Management Guidelines 2025","pages":"44-45","heading":"3.2 Screening tools for systematic TB screening > 3.2.5 Intensified case finding in health facilities","text":"### **3.2.5 Intensified case finding in health facilities**\n\nIntensified TB Case Finding (ICF) interventions aim to identify individuals with presumptive TB, through systematic screening of TB regardless of their primary medical concern.\n\nAll people attending health facilities regardless of their medical concern, except those on TB treatment, should be screened with the standard TB symptom screening tool at every service delivery point. In facilities where CXR and CAD/AI are available, complementary screening with these tools annually should be performed for targeted high-risk TB when they are screened negative by initial symptom screening. CXR screening is recommended only once a year to avoid unnecessary radiation exposure. See screening algorithms in Section 3.7 for systematic TB screening with CXR and CAD for non-PLHIV, PLHIV and screening with CRP for PLHIV respectively in Section 3.7). (For details, refer to the SOP for integrated CXR and CAD/AI use in Systematic TB case finding)\n\nThe following are targeted high-risk groups for CXR screening.\n- PLHIV\n- People with diabetes mellitus\n- Household contact with TB\n- Miners/ex-miners attending health facilities.\n- People with Chronic Obstructive Pulmonary Disease (COPD)\n- People with substance use disorders (e.g. alcohol, tobacco etc.).\n- Undernourished/malnourished people (MAUC < 24.5 cm or BMI < 18.5 in adults)\n- Person with immunosuppressive medical conditions or taking immunosuppressant drugs (e.g. cancer, chronic renal dialysis, prolonged steroid therapy, those having organ and bone marrow transplant, anti-TNF therapy, etc.)\n- Correctional inmates visiting a health facility.\n\n**NB: All persons presenting to a health facility must be screened for TB at every service delivery point.**"},{"id":"ncdimh-tbl-copd-severity","label":"NCDIMH p.343","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"343","heading":"Chapter 14: Pulmonology > Chronic Obstructive Pulmonary Disease > Diagnosis and Investigation > Severity classification","text":"### COPD severity: by FEV1 % predicted (spirometry-capable facilities) or MRC dyspnoea scale (facilities without spirometry)\n\nSpirometry is the gold standard for diagnosis, assessment and management of COPD. A post-bronchodilator FEV1/FVC ratio below 0.7 confirms persistent airflow limitation, suggesting COPD with relevant symptoms; FEV1 <80% predicted indicates the severity of obstruction. Measure after a bronchodilator to help distinguish from asthma. Other tests: CXR, high-resolution CT.\n\n**By FEV1 (for spirometry-capable health facilities)**\n\n| Grade / severity | Criterion |\n| --- | --- |\n| Mild COPD | FEV1 60-80% predicted |\n| Moderate COPD | FEV1 40-59% predicted |\n| Severe COPD | FEV1 <40% predicted |\n\n**MRC dyspnoea scale (for facilities unable to provide spirometry): degree of breathlessness related to physical activity**\n\n| Grade / severity | Criterion |\n| --- | --- |\n| 0 | Not troubled by breathlessness except on strenuous exercise |\n| 1 | Short of breath when hurrying or walking up a slight hill |\n| 2 | Walks slower than contemporaries on level ground because of breathlessness, or has to stop for breath when walking at own pace |\n| 3 | Stops for breath after walking about 100 m or after a few minutes on level ground |\n| 4 | Too breathless to leave the house, or breathless on dressing/undressing |"},{"id":"ncdimh-fig-copd-stepwise","label":"NCDIMH p.344","doc":"NCDs, Injuries and Mental Health Guidelines 2025","pages":"344","heading":"Chapter 14: Pulmonology > Chronic Obstructive Pulmonary Disease > Step-Wise Management for COPD: Pharmacological Interventions","text":"### Stepwise pharmacological management of COPD: short-acting bronchodilators, combinations, long-acting bronchodilator, ICS, theophylline; asthma-COPD overlap\n\nNon-pharmacological: smoking cessation and/or nicotine replacement therapy.\n1. Start a short-acting bronchodilator for relief of breathlessness: beta2 agonist, e.g. salbutamol 100-200 mcg (1-2 puffs) as needed, OR anticholinergic, e.g. ipratropium 20-40 mcg 3-4 times a day.\n2. Poor symptom control → combine short-acting bronchodilators from different groups, e.g. salbutamol and ipratropium (as above).\n3. Poor symptom control → consider adding a long-acting bronchodilator (beta2 agonist or anticholinergic), e.g. salmeterol 50 mcg BD, with short-acting bronchodilator(s) as above.\n4. Poor symptom control → consider combining a long-acting bronchodilator and an inhaled corticosteroid, e.g. beclomethasone 200 mcg, with a short-acting bronchodilator. Discontinue corticosteroids after 4 weeks if no benefit.\n5. Poor symptom control → consider adding SR theophylline 250-500 mg BD; monitor plasma levels and interactions.\n\nAsthma-COPD overlap, initial treatment: predominant asthma features → inhaled corticosteroids (long-acting bronchodilators should not be used as monotherapy). Predominant COPD features → appropriate long-acting bronchodilators; consider ICS + long-acting bronchodilator combination; ICS should not be used as monotherapy for COPD."}]},{"id":"Q058","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Male urethral syndrome","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"What is the syndromic treatment for a man with urethral discharge?","original_reference":"Ceftriaxone 1 g IM stat plus azithromycin 1 g orally stat (covers gonorrhoea and chlamydia). Second-line for gonorrhoea: spectinomycin 2 g IM or gentamicin 240 mg IM; chlamydia alternatives: doxycycline 100 mg BD for 7 days, erythromycin or ofloxacin. Trichomonas: metronidazole 2 g stat.","question":"What's the syndromic treatment for male urethral discharge?","change":"Kept general (standard regimen question); reference corrected to include metronidazole from Chart 3.","reference":"Ceftriaxone 1 g IM stat (or cefixime 400 mg orally stat) plus azithromycin 1 g orally stat, to cover gonorrhoea and chlamydia; the syndromic chart (Chart 3) and the summary table also add metronidazole 2 g orally stat for trichomonas. Give the health promotion package (condoms, partner notification slips, HIV testing), and follow up after 7 days. Second-line options: spectinomycin 2 g IM or gentamicin 240 mg IM for gonorrhoea; doxycycline 100 mg BD for 7 days for chlamydia.","must_include":["Ceftriaxone 1 g IM stat (or cefixime 400 mg)","Azithromycin 1 g orally stat","Metronidazole 2 g orally stat (chart/table)","Partner notification","Follow-up at 7 days"],"must_not_include":["Ceftriaxone 250 mg or 500 mg as the dose for urethral discharge","Ciprofloxacin as first-line"],"check":"corrected: original reference omitted metronidazole, which Chart 3 and Table 17 include (section 5.2 text lists only ceftriaxone + azithromycin)","sources":[{"id":"sti-vh-draft-2026-fig-1-chart-3-male-urethral-syndrome","label":"STI 2026 draft p.42","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"42","heading":"5.0 Management of STIs Associated Syndromes > 5.2 Male Urethral Syndrome (MUS) > 5.2.1 Chart 3 (Figure 1)","text":"### Figure 1 syndromic treatment chart for male urethral syndrome (chart 3)\n\nPatient complains of urethral discharge or burning on urination\n→ Take history and examine. Provide HIV testing and counselling (opt-out).\n→ Discharge seen or dysuria confirmed by clinical history?\n   - NO → Any other STIs syndrome or illness present?\n      - NO → Reassure, counsel and educate; condom promoted and provided.\n      - YES → Treat according to appropriate flow chart.\n   - YES → Ceftriaxone, 1 g I.M stat PLUS Azithromycin, 1 g orally stat PLUS Metronidazole, 2 g orally stat. Health promotion package and follow up after 7 days.\n      → Follow up at 7 days: discharge or dysuria present?\n         - NO → Reinforce health promotion package.\n         - YES → Re-infection? Or poor compliance?\n            - YES → Repeat treatment; reinforce health promotion package.\n            - NO → Reassure, condom promoted and provided. Refer for further management.\n\nHealth promotion package:\n- Educate, ensure compliance, and counsel on treatment.\n- Promote abstinence or condom use during treatment.\n- Promote and demonstrate consistence condom use and provide condoms.\n- Issue one notification slip for each sexual partner and emphasize the importance of partner treatment.\n- Offer HIV counselling and testing, as per Integrated HIV Guidelines.\n- Offer male circumcision to the uncircumcised.\n- Offer pre exposure prophylaxis as per Guideline.\n- Provide cervical cancer screening during follow-up visit."},{"id":"sti-vh-draft-2026-txt-p40-t0141","label":"STI p.40","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"40","heading":"5.0 Management of STIs Associated Syndromes > 5.2 Male Urethral Syndrome (MUS) > Description","text":"## Description\n\nMale patients complaining of urethral discharge and/or dysuria should be examined for evidence of. Origin of the discharge needs to be identified: urethritis causes discharge from the meatus.\n\n## Etiology\n\nThe major pathogens causing urethral discharge is N gonorrhoeae, C trachomatis and sometimes T vaginalis\n\n## Clinical features\n\n- Abnormal urethral discharge with or without dysuria(pain on urination), - Itching at the tip of the urethra\n\n## Syndromic treatment for male urethritis syndrome\n\n- Ceftriaxone, 1g I.M STAT PLUS\n- Azithromycin, 1 g orally STAT"},{"id":"sti-vh-draft-2026-txt-p40-t0145","label":"STI p.40-41","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"40-41","heading":"5.0 Management of STIs Associated Syndromes > 5.2 Male Urethral Syndrome (MUS) > Treatment Options for Urethral Discharge Syndrome","text":"## Treatment Options for Urethral Discharge Syndrome\n\nRecommended treatment regimens for gonococcal infections\nFirst-line:\n- Ceftriaxone, 1 g IM STAT. OR Cefixime, 400 mg orally STAT,\nSecond-line:\n- Spectinomycin, 2 g IM STAT, OR Gentamicin, 240 mg IM STAT.\nRecommended treatment regimens for chlamydial infections\nFirst-line:\n- Azithromycin 1 g orally as a STAT dose\nSecond-line:\n- Doxycycline 100 mg orally BD for 7 days\n- Erythromycin 500 mg orally QID for 7 days\n- Ofloxacin 400 mg orally BD for 7 days.\nNB: For ano-rectal infection: Doxycline is preferred over Azithromycin\nRecommended treatment regimens for trichomonas infection\n- Metronidazole 2g orally STAT"},{"id":"sti-vh-draft-2026-tbl-17-syndrome-summary","label":"STI p.140","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"140-142","heading":"Annexes > Annex 4: Summary table of common STI syndromes, their causes and treatment recommended in Eswatini > Table 17","text":"### Table 17: Summary of common STI syndromes, their causes and treatment recommended in Eswatini\n\n| STI Syndrome | Causal pathogen | Drugs |\n| --- | --- | --- |\n| Urethral discharge | Neisseria Gonorrhoeae<br/>Chlamydia Trachomatis<br/>Trichomonas Vaginalis | Ceftriaxone, 1 g I.M STAT or Cefixime, 400 mg orally STAT (to treat gonococcal infection) PLUS Azithromycin, 1 g orally STAT (to treat chlamydial infections) PLUS Metronidazole, 2 g orally STAT (to treat trichomonal infections) |\n| Genital ulcer | T. pallidum<br/>H. Duccei Chancroid<br/>HSV-2<br/>(Klebsiella granulomatis low prevalence in Eswatini) | Benzathine Penicillin\\*, 2.4 million units I.M STAT, PLUS<br/>- Azithromycin, 1g orally STAT; OR Ceftriaxone 1g I.M STAT; OR Ciprofloxacin, 500mg orally BID for 3 days; OR Erythromycin, 500 mg orally QID for 7 days (to treat chancroid) PLUS<br/>- Acyclovir, 400mg orally TDS for 7 days (to treat genital herpes).<br/>NB: Penicillin-allergic patients treat with: Erythromycin 500mg 6 hourly for 14 days |\n| Vaginal discharge | N. Gonorrhoeae<br/>Chamydia Trachomatis<br/>T. Vaginalis | Ceftriaxone 1g IM STAT. Second-line: Spectinomycin 2g IM STAT, OR Gentamicin 240mg IM STAT. PLUS<br/>- Azithromycin, 1g orally STAT PLUS<br/>- Metronidazole, 2g orally STAT<br/>If candida is evident give six days course on clotrimazole pessaries<br/>Doxycycline 100mg 12 hourly for 7 days<br/>Metronidazole 2g STAT\\*<br/>In pregnancy/during breast feeding: Spectinomycin 2g STAT; Erythromycine 500mg 6 hourly for 7 days; Metronidazole 2g STAT\\*\\*, \\*\\*\\*<br/>If vulval oedema/curd-like discharge, erythema, excoriations present, add: Cotrimazole vaginal pessary 500mg STAT inserted or 100mg 12 hourly for 3 days inserted or 200mg at night for 3 days |\n| Lower Abdominal pain | Neisseria Gonorrhoeae<br/>Chlamidia trachomatis<br/>T. Vaginalis | - Ceftriaxone 1g IM STAT PLUS<br/>- Azithromycin, 1g orally weekly for 2 weeks PLUS<br/>- Metronidazole, 400mg orally BID for 7 to 14 days |\n| Scrotal Swelling Syndrome | Neisseria Gonorrhoeae<br/>Chlamidia trachomatis | Ceftriaxone 1g IM STAT or Spectinomycin 250mg IM STAT<br/>And<br/>Doxycycline 100 mg 12 hourly for 7 days or Erythromycin 500mg 6 hourly for 7 days |\n| Inguinal bubo | Haemophylus ducreyi<br/>Chlamidia trachomatis | Ciprofloxacin, 500 mg orally BID for 3 days OR Ceftriaxone 1g IM STAT (to treat chancroid) PLUS Azithromycin, 1g orally STAT and then 1g orally per week for 2 weeks (to treat both chancroid and LGV) OR Doxycycline, 100mg orally BID for 14 days (to treat LGV) |\n| Neonatal conjunctivitis | Neisseria Gonorrhoeae<br/>Chlamidia trachomatis | Neonate: irrigate eyes. Spectinomycin 25mg/kg body weight (up to a maximum of 75mg) Plus Erythromycin syrup 6 hourly (50mg/kg/day) for 14 days.<br/>Mother: offer the health education and promotion package. Ceftriaxone 1g IM STAT or Spectinomycin 2g IM STAT Plus Erythromycin 500mg 6 hourly for 7 days.<br/>Father: offer the health education and promotion package. Ceftriaxone 1g IM STAT or Spectinomycin 2g IM STAT Plus Doxycycline 100 mg 12 hourly for 7 days. |\n\n'LGV)' at the end of the inguinal bubo cell is cut off by the page break and taken from the text layer. The asterisks in the vaginal discharge cell have no footnotes in the source."}]},{"id":"Q059","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Genital ulcer syndrome","type":"dosing","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"How is genital ulcer syndrome treated syndromically, and what is given to a pregnant woman allergic to penicillin?","original_reference":"Benzathine penicillin 2.4 MU IM stat (syphilis) plus azithromycin 1 g orally stat (chancroid) plus acyclovir 400 mg TDS for 7 days (herpes). Pregnant and penicillin-allergic: erythromycin 500 mg QID for 14 days.","question":"Pregnant woman with a genital ulcer who is allergic to penicillin. How do I treat?","change":"Was two-part (standard GUS regimen + pregnant/allergic); kept the higher-risk case.","reference":"Replace benzathine penicillin with erythromycin (base/stearate) 500 mg orally QID for 14 days. The rest of the genital ulcer regimen covers chancroid and herpes (the standard regimen is benzathine penicillin 2.4 MU IM stat + azithromycin 1 g stat + acyclovir 400 mg TDS for 7 days). Because erythromycin does not adequately treat the foetus, the newborn must be treated soon after delivery.","must_include":["Erythromycin 500 mg QID for 14 days","Newborn needs treatment after delivery","Herpes covered with acyclovir 400 mg TDS for 7 days"],"must_not_include":["Doxycycline in pregnancy","Give benzathine penicillin despite the allergy without comment"],"check":"verified; whether azithromycin and acyclovir are still given alongside erythromycin is implied, not stated — clinician to confirm","sources":[{"id":"sti-vh-draft-2026-txt-p35-t0137","label":"STI 2026 draft p.35-36","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"35-36","heading":"5.0 Management of STIs Associated Syndromes > 5.1 Genital ulcer syndrome (GUS), including anorectal ulcer > Syndromic treatment for genital ulcer syndrome:","text":"## Syndromic treatment for genital ulcer syndrome:\n\n- Benzathine Penicillin, 2.4 million units I.M STAT PLUS\n- Azithromycin, 1g, orally STAT PLUS\n- Acyclovir, 400mg orally TDS for 7 days\nIn pregnant women who are allergic to penicillin: Give Erythromycin base/ stearate 500 mg orally QID for 14 days."},{"id":"sti-vh-draft-2026-txt-p36-t0138","label":"STI p.36","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"36","heading":"5.0 Management of STIs Associated Syndromes > 5.1 Genital ulcer syndrome (GUS), including anorectal ulcer > Recommended treatment regimens","text":"## Recommended treatment regimens\n\nIf ulcer(s) alone or ulcer(s) along with herpetic vesicles are visible* Treat for syphilis, chancroid and herpes. Regimen should include:\n- Benzathine Penicillin*, 2.4 million units I.M STAT, PLUS\n- Azithromycin, 1g orally STAT; OR Ceftriaxone 1g I.M STAT; OR Ciprofloxacin, 500mg orally BID for 3 days; OR Erythromycin, 500 mg orally QID for 7 days (to treat chancroid) PLUS\n- Acyclovir, 400mg orally TDS for 7 days (to treat genital herpes).\nNB: Penicillin-allergic patients treat with: Erythromycin 500mg 6 hourly for 14 days"},{"id":"anc-0102","label":"ANC p.43-44","doc":"Antenatal Care Guidelines","pages":"43-44","heading":"7.3 Syphilis","text":"## **7.3 Syphilis**\n\n* At first contact with pregnant woman, conduct a rapid blood test for syphilis(RPR)\n* Give benzathine penicillin G 2.4 million units intramuscularly once weekly for three consecutive weeks .\n* Once pregnant women have been diagnosed with syphilis ensure that partner get treated.\n\n**Note: Although erythromycin and azithromycin treat the pregnant women they do not cross the placental barrier completely and as a result the foetus is not treated. It is therefore**\n\n**necessary to treat the new born infant soon after delivery . ( Refer to neonatal clinical care guidelines)Syphilis during pregnancy can lead to severe adverse compli cations to the foetus or newborn.**"}]},{"id":"Q060","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Vaginal discharge syndrome","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"A woman presents with vaginal discharge and a negative STI risk assessment. How should she be treated compared with a woman with a positive risk assessment?","original_reference":"Negative risk assessment (likely vaginitis): metronidazole 2 g stat plus clotrimazole 500 mg pessary (bacterial vaginosis and candida). Positive risk assessment or no speculum exam possible: ceftriaxone 1 g IM (or cefixime 400 mg) plus azithromycin 1 g plus metronidazole 2 g stat, adding clotrimazole if curd-like discharge, itching or vulval oedema. Warn about alcohol for 24–48 h after metronidazole.","question":"Non-pregnant woman with vaginal discharge; STI risk assessment is negative. How do I treat?","change":"Was a comparison of two groups; now the risk-negative case only.","reference":"A negative risk assessment points to vaginitis, so treat bacterial vaginosis and candidiasis: metronidazole 2 g orally stat plus clotrimazole 500 mg pessary intravaginally at night. Advise her to avoid alcohol while taking metronidazole and for 24-48 hours after the last dose. (A positive risk assessment would add ceftriaxone 1 g IM + azithromycin 1 g to cover cervical infection.)","must_include":["Metronidazole 2 g orally stat","Clotrimazole 500 mg pessary","Avoid alcohol for 24-48 hours after metronidazole"],"must_not_include":["Ceftriaxone + azithromycin for this risk-negative woman"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p48-t0152","label":"STI 2026 draft p.48","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"48","heading":"5.0 Management of STIs Associated Syndromes > 5.3. Vaginal Discharge Syndrome (VDS) > Syndromic treatment of vaginal discharge syndrome (VDS)","text":"## Syndromic treatment of vaginal discharge syndrome (VDS)\n\n- Ceftriaxone 1g IM STAT PLUS\n- Azithromycin, 1 g orally STAT PLUS\n- Metronidazole 2g orally STAT. NB : In case VDS is due to vaginitis, conduct risk assessment, if negative the treatment regimen should cover organisms causing bacterial vaginosis and candidiasis infections:\n- Metronidazole** 2 g orally, STAT dose PLUS\n- Clotrimazole pessary 500mg intra-vaginally once nocte Patients taking Metronidazole should be cautioned to avoid taking alcohol while on these drugs and up to 24-48 hours after the last dose."}]},{"id":"Q061","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Lower abdominal pain / PID","type":"scenario","category":"standard","expected":"answer from guidelines","safety":"yes","original_question":"When should a woman with suspected pelvic inflammatory disease be hospitalised or referred?","original_reference":"Consider hospitalisation if the diagnosis is uncertain, surgical emergencies (appendicitis, ectopic pregnancy) can't be excluded, a pelvic abscess is suspected, or she is pregnant (pregnant women go to an obstetrician). Refer if no response within 3 days, if worsening, or with fever, tachycardia, bleeding, hypotension or peritonitis. Outpatient syndromic treatment: ceftriaxone 1 g IM stat plus azithromycin 1 g weekly for 2 weeks plus metronidazole 400 mg BD for 7–14 days.","question":"Woman 10 weeks pregnant with lower abdominal pain and cervical motion tenderness, suspected PID. Can I treat her as an outpatient?","change":"Was 'when should she be hospitalised'; now one case that meets a criterion.","reference":"No. Suspected PID in a pregnant woman should be referred for hospitalisation and further management, because of the high risk of maternal morbidity, fetal wastage and preterm delivery. Hospitalisation should also be considered when the diagnosis is uncertain, surgical emergencies (appendicitis, ectopic pregnancy) cannot be excluded, or a pelvic abscess is suspected. Any PID patient who has not responded within 3 days, or worsens, must be referred.","must_include":["Refer / hospitalise","Pregnancy is an indication","Other indications: uncertain diagnosis, possible ectopic/appendicitis, pelvic abscess","Refer if no response in 3 days"],"must_not_include":["Outpatient treatment is fine","Doxycycline in pregnancy as her treatment"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p55-t0160","label":"STI 2026 draft p.55","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"55-56","heading":"5.0 Management of STIs Associated Syndromes > Cervical Infections > Oral STIs:","text":"## Oral STIs:\n\nOral and peri-oral symptoms can result because of oro-genital sexual activity. Oral STIs are usually asymptomatic.\n\n## Description\n\nLower abdominal pain is one of the major signs of Pelvic inflammatory disease (PID) which may be accompanied by cervical motion tenderness on bimanual examination, a complaint of back pain, lower tenderness with or without guarding on abdominal examination.\nAll sexually active women presenting with a history of lower abdominal pain should be carefully evaluated for the presence of salphingitis and/or endometritis - elements of pelvic inflammatory disease (PID). In addition, routine bimanual and abdominal examination should be carried out on all women with presumptive STI since some women with PID will not complain of lower abdominal pain. Hospitalization of patients with acute PID should be seriously considered when:\n- The diagnosis is uncertain\n- Surgical emergencies such as appendicitis and ectopic pregnancy cannot be excluded\n- A pelvic abscess is suspected\n- The patient is pregnant Risk factors: women with IUD have a higher risk of PID, particularly if the IUD had been inserted recently.\n\n## Etiology\n\nN. gonorrhea, C. Trachomatis and bacteria associated with bacterial vaginosis are most frequently responsible of this syndrome."},{"id":"sti-vh-draft-2026-txt-p57-t0165","label":"STI p.57","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"57","heading":"5.0 Management of STIs Associated Syndromes > 5.4 Lower abdominal pain (LAP) > Treatment options for lower abdominal pain","text":"## Treatment options for lower abdominal pain\n\n- Ceftriaxone, 1g I.M STAT, Gentamycin 240mg IM Stat and Spectinmycin 2 grams IM PLUS\n- Azithromycin, 1g orally per week for 2 weeks, OR Doxycycline 100 mg orally BID for 14 days OR Erythromycin, 500 mg orally QID for 14 days PLUS\n- Metronidazole, 400mg orally BID for 7 to 14 days\nNB: Patients taking Metronidazole should be cautioned against taking alcohol while on these drugs and up to 24 - 48 hours after the last dose.\nCaution: PID can be a serious condition. The patient must be referred: if she does not respond to treatment within 3 days and even earlier in case there is worsening of her condition. Because of the high risk for maternal morbidity, fetal wastage, and preterm delivery. Pregnant women who have suspected PID should be referred for hospitalization further management by an obstetrician."},{"id":"sti-vh-draft-2026-fig-5-chart-5-lower-abdominal-pain","label":"STI p.58","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"58","heading":"5.0 Management of STIs Associated Syndromes > 5.4 Lower abdominal pain (LAP) > 5.4.1 Chart 5 (Figure 5)","text":"### Figure 5 syndromic treatment for lower abdominal pain (chart 5)\n\nWoman complains of LAP with or without vaginal discharge\n→ Take history including (gynaecological) and physical examination (abdominal and vaginal).\n→ Any of the following present? Missed/overdue period or recent delivery/abortion/miscarriage? Abdominal guarding and/or rebound tenderness? Or abnormal vaginal bleeding?\n   - YES → Do pregnancy test; set up an IV line; do resuscitation measures if necessary; refer for emergency medical care.\n   - NO → Pain on moving the cervix? Or lower abdominal tenderness with or without vaginal discharge?\n      - NO → Any other STI syndrome or illness present? (NO → Provide health promotion package and refer accordingly; YES → Treat according to appropriate flowchart.)\n      - YES → Ceftriaxone 1 g i.M. stat PLUS Azithromycin 1 g PO/week x 2 weeks PLUS Metronidazole 400 mg PO bid x 7-14 days and advise to come early within 3 days, or earlier if worsening.\n         → Follow up at 3 days: improved? (YES → Finalize treatment; re-inforce health promotion package. NO → Refer for further management.)\n\nHealth promotion package:\n- Educate, ensure compliance, and counsel on treatment.\n- Promote abstinence or condom use during treatment.\n- Promote correct and consistent condom use also provide condoms and lubricants.\n- Issue one notification slip for each sexual partner and emphasize the importance of partner treatment.\n- Offer HIV counselling and testing, as per Integrated HIV Guidelines.\n- Offer voluntary medical male circumcision.\n- Offer pre exposure prophylaxis as per guideline.\n- Provide cervical cancer screening during follow-up visit."}]},{"id":"Q062","area":"STIs and viral hepatitis","document":"National STI & Viral Hepatitis Guidelines 2026 (draft V2)","topic":"Syphilis","type":"factual","category":"standard","expected":"answer from guidelines","safety":"no","original_question":"What is the difference between non-treponemal (RPR/VDRL) and treponemal (TPHA, RDT) syphilis tests, and which can be used to monitor treatment?","original_reference":"Non-treponemal tests (RPR/VDRL) detect anti-cardiolipin antibody: sensitive but not specific, quantifiable (titre ≥1:8 suggests active or recent infection), and usable for monitoring response. Treponemal tests (RDT/Tp, TPHA, TPPA, FTA) are specific and stay positive for life after treatment, so they cannot be used to monitor treatment.","question":"Patient treated for syphilis 6 months ago still has a positive TPHA. Is that treatment failure, and which test should I use to monitor her?","change":"Was a test-comparison question; now a case where confusing the tests causes harm. Kept as a natural two-part question.","reference":"No, not by itself. Treponemal tests (TPHA, RDT/Tp, TPPA, FTA) stay positive for life after successful treatment, so they cannot be used to monitor treatment. Monitor with a non-treponemal test (RPR/VDRL), which can be quantified: record the baseline titre and repeat at 3, 6 and 12 months; a fourfold decline in titre means adequate response.","must_include":["A positive TPHA alone is not treatment failure","Treponemal tests remain positive for life","Monitor with RPR/VDRL titres","Fourfold decline = adequate response"],"must_not_include":["Use TPHA or RDT to monitor treatment","Retreat because TPHA is positive"],"check":"verified","sources":[{"id":"sti-vh-draft-2026-txt-p74-t0205","label":"STI 2026 draft p.74","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"74","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > Treponemal tests","text":"## Treponemal tests\n\nTreponemal rapid diagnostic test (RDT/Tp), Fluorescent Treponemal Antibody test (FTA), the Treponema pallidum Haemagglutination Assay (TPHA) and the Treponema pallidum particle agglutination (TPPA) assay are specific tests which, if positive, indicate true infection. Once they are positive, they remain positive for life even after successful treatment. Therefore, they cannot be used for monitoring the patient’s response to treatment."},{"id":"sti-vh-draft-2026-txt-p73-t0204","label":"STI p.73-74","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"73-74","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > Non-treponemal tests","text":"## Non-treponemal tests\n\nThe Rapid Plasma Reagin (RPR) and the Venereal Disease Research Laboratory (VDRL) tests detect the antibody to cardiolipin, a component of normal mammalian cell membrane. Therefore, these tests are sensitive but not specific for syphilis.\nThe advantage of these tests is that the results can be quantified and used for monitoring the treatment over time. Usually, these tests are positive 4-5 weeks after the occurrence of infection. A titre of 1:8 and above indicates probable active disease or recent infection (treated or untreated), although the RPR/VDRL can be negative in up to 30% of primary GUS cases."},{"id":"sti-vh-draft-2026-fig-9-syphilis-option-3","label":"STI p.78","doc":"STI and Viral Hepatitis Guidelines 2026 (draft)","pages":"78","heading":"7.0 Management of Other STI’s And Related Clinical Conditions > 7.1 Management of reactive syphilis test cases > 7.1.1 Syphilis testing and treatment algorithm > Figure 9","text":"### Figure 9: Syphilis testing and treatment algorithm — Option 3: where RDT/Tp and non-treponemal testing are available\n\nPatient with suspected syphilis → Step 1: Perform treponemal RDT → RDT result?\n- Non-reactive → Syphilis unlikely; if clinical suspicion, repeat.\n- Reactive → Step 2: Perform RPR/VDRL → RPR/VDRL result?\n   - Reactive → Active syphilis: stage and treat → Record baseline titre; monitor at 3, 6, 12 months → Fourfold dec
