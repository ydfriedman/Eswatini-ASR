<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guideline Answer Review</title>
<style>
/* Layout: question list on the left, one question at a time on the right; list collapses to a dropdown on phones */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eef1ee; --fg:#1c2421; --muted:#5d6863; --rule:#d8ddd9;
  --accent:#1f6b57; --accent-soft:#e1efe9; --warn:#93570f; --warn-soft:#f7ecd9; --bad:#a3322a; --bad-soft:#f7e3e0;
  --ok:#2c7a3f; --ok-soft:#e2f1e5;
  --font:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a201d; --surface-2:#222a26; --fg:#e3eae6; --muted:#a0aca6; --rule:#2f3934;
  --accent:#6cc3a6; --accent-soft:#1d332c; --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ef8a80; --bad-soft:#3b1f1c;
  --ok:#7ccf8d; --ok-soft:#1d3322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a201d; --surface-2:#222a26; --fg:#e3eae6; --muted:#a0aca6; --rule:#2f3934;
  --accent:#6cc3a6; --accent-soft:#1d332c; --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ef8a80; --bad-soft:#3b1f1c;
  --ok:#7ccf8d; --ok-soft:#1d3322; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit; color:inherit}
header.top{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--rule);
  padding:10px max(16px, env(safe-area-inset-left,0px)) 10px max(16px, env(safe-area-inset-right,0px));
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
header.top h1{font-size:17px; margin:0; margin-right:auto}
.field{display:flex; gap:6px; align-items:center}
.field label{font-size:13px; color:var(--muted)}
input[type=text], select{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:6px 8px; min-width:0}
textarea{width:100%; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:8px; resize:vertical; min-height:70px}
.btn{border:1px solid var(--rule); background:var(--surface-2); border-radius:6px; padding:6px 12px; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.btn.small{padding:2px 8px; font-size:13px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.progress{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.field[hidden]{display:none}
.sync{font-size:13px; color:var(--muted)}
.sync.ok{color:var(--ok)}
.sync.warn{color:var(--warn)}
.wrap{display:grid; grid-template-columns:230px minmax(0,1fr); gap:0; min-height:calc(100vh - 60px)}
nav.list{border-right:1px solid var(--rule); background:var(--surface); overflow-y:auto; max-height:calc(100vh - 60px); position:sticky; top:60px}
nav.list .tools{padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--rule)}
nav.list ul{list-style:none; margin:0; padding:0 0 4px}
nav.list details.group{border-bottom:1px solid var(--rule)}
nav.list details.group > summary{list-style:none; cursor:pointer; padding:9px 12px; display:flex; gap:8px; align-items:baseline; font-size:14px; font-weight:600; color:var(--fg)}
nav.list details.group > summary::-webkit-details-marker{display:none}
nav.list details.group > summary::before{content:"▸"; color:var(--muted); width:10px; flex:none}
nav.list details.group[open] > summary::before{content:"▾"}
nav.list details.group > summary:hover{background:var(--surface-2)}
nav.list .gname{flex:1; min-width:0}
nav.list .gcount{font-size:12px; font-weight:400; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
nav.list .gcount.all{color:var(--ok)}
nav.list .empty{padding:12px; font-size:13px; color:var(--muted)}
nav.list li button{width:100%; text-align:left; border:0; background:none; padding:6px 12px 6px 22px; cursor:pointer; display:flex; gap:8px; align-items:baseline}
nav.list li button:hover{background:var(--surface-2)}
nav.list li button[aria-current=true]{background:var(--accent-soft)}
nav.list .qid{font-family:var(--mono); font-size:13px; flex:none}
nav.list .qtxt{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{width:9px; height:9px; border-radius:50%; flex:none; border:1.5px solid var(--muted); align-self:center}
.dot.done{background:var(--ok); border-color:var(--ok)}
.dot.part{background:var(--warn); border-color:var(--warn)}
.row.mobile-pick{display:none}
main{padding:20px max(16px, env(safe-area-inset-right,0px)) 60px 24px; min-width:0}
.card{max-width:900px; display:flex; flex-direction:column; gap:18px}
.head{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.head .id{font-family:var(--mono); font-size:15px; font-weight:600}
.badge{font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.badge.safety{background:var(--bad-soft); color:var(--bad)}
.badge.flag{background:var(--warn-soft); color:var(--warn)}
section.block{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
section.block h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0; font-weight:600}
.question{font-size:18px; font-weight:600; line-height:1.4}
.note{font-size:13px; color:var(--muted)}
.check{font-size:13px; padding:8px 10px; border-radius:6px; background:var(--surface-2)}
.check.flag{background:var(--warn-soft); color:var(--fg); border-left:3px solid var(--warn)}
.reference{white-space:pre-wrap}
.howto{font-size:14px; padding:8px 10px; border-radius:6px; background:var(--accent-soft); border-left:3px solid var(--accent)}
.choices{display:flex; flex-wrap:wrap; gap:6px 18px}
.choices label{display:flex; gap:6px; align-items:center; cursor:pointer}
details summary{cursor:pointer; color:var(--muted); font-size:13px}
.items{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.items li{display:flex; gap:6px; align-items:center}
.items input{flex:1}
.items.must li::before{content:"✓"; color:var(--ok); font-weight:700; width:14px}
.items.mustnot li::before{content:"✕"; color:var(--bad); font-weight:700; width:14px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.source{border-top:1px solid var(--rule); padding-top:8px}
.source .meta{font-size:13px}
.source .meta b{font-weight:600}
.srctext{font-size:13.5px; background:var(--surface-2); border-radius:6px; padding:10px 12px; margin-top:6px; overflow-x:auto}
.srctext table{border-collapse:collapse; margin:6px 0; font-size:13px}
.srctext th,.srctext td{border:1px solid var(--rule); padding:4px 6px; vertical-align:top; text-align:left}
.srctext h3,.srctext h4,.srctext h5{font-size:14px; margin:8px 0 4px}
.srctext p{margin:4px 0}
.nav-buttons{display:flex; gap:8px; justify-content:space-between; flex-wrap:wrap}
.toast{position:fixed; bottom:max(16px, env(safe-area-inset-bottom,0px)); right:16px; background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:6px; font-size:14px; opacity:0; transition:opacity .2s}
.toast.show{opacity:1}
.help{font-size:14px}
.help ol{margin:4px 0; padding-left:20px}
@media (max-width: 760px){
  .wrap{grid-template-columns:1fr}
  nav.list{display:none}
  .row.mobile-pick{display:flex}
  main{padding-left:max(16px, env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Guideline answer review</h1>
  <div class="field"><label for="reviewer">Your name</label><input type="text" id="reviewer" placeholder="Name and role" size="18"></div>
  <div class="field" id="codeField" hidden><label for="code">Access code</label><input type="password" id="code" size="10" autocomplete="off"></div>
  <span class="progress" id="progress"></span>
  <span class="sync" id="sync" role="status" aria-live="polite"></span>
  <button class="btn" id="helpBtn" type="button">How to review</button>
  <button class="btn" id="importBtn" type="button">Load saved CSV</button>
  <input type="file" id="importFile" accept=".csv,text/csv" hidden>
  <button class="btn primary" id="downloadBtn" type="button">Download CSV</button>
</header>
<div class="wrap">
  <nav class="list" aria-label="Questions">
    <div class="tools">
      <select id="filter" aria-label="Filter questions">
        <option value="all">All questions</option>
        <option value="todo">Not yet reviewed</option>
        <option value="done">Reviewed</option>
        <option value="safety">Safety-critical</option>
        <option value="flag">Needs a clinical decision</option>
        <option value="edge">Unusual questions (vague, misleading, emergencies...)</option>
      </select>
      <select id="areaFilter" aria-label="Disease area"><option value="">All disease areas</option></select>
      <input type="text" id="search" placeholder="Search questions and answers" aria-label="Search questions and answers">
    </div>
    <div id="qlist"></div>
  </nav>
  <main>
    <div class="row mobile-pick" style="margin-bottom:12px">
      <select id="mobilePick" aria-label="Go to question" style="flex:1"></select>
    </div>
    <div class="card" id="card"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = /*__DATA__*/[];
const KEY = 'eswatini-benchmark-review-v1';
const SERVER = /*__SERVER__*/false;  // true in the hosted (Hugging Face Space) build
const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
let state = {reviewer: '', answers: {}};
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.answers) state = s; } catch (e) {}
let current = DATA[0].id;
try { const c = localStorage.getItem(KEY + '-current'); if (c && byId[c]) current = c; } catch (e) {}

function ans(id) {
  if (!state.answers[id]) {
    const q = byId[id];
    state.answers[id] = {question_decision: '', question_suggestion: '', reference_decision: '', reference_edit: q.reference,
      must_include: q.must_include.slice(), must_not_include: q.must_not_include.slice(), comments: '', reviewed_at: ''};
  }
  return state.answers[id];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY + '-current', current); } catch (e) {}
  renderProgress(); renderList();
}
function status(id) {
  const a = state.answers[id];
  if (!a) return '';
  if (a.question_decision && a.reference_decision) return 'done';
  if (a.question_decision || a.reference_decision || a.comments) return 'part';
  return '';
}
const flagged = q => q.needs_decision;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Minimal markdown for source text: tables, headings, bold, lists, and a few inline tags.
function md(text) {
  let s = esc(text);
  s = s.replace(/&lt;(\/?)(br\/?|u|mark|sup|sub|b|i|em|strong)&gt;/g, '<$1$2>').replace(/<br\/?>/g, '<br>');
  const lines = s.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let html = '<table>'; let headerDone = false;
      rows.forEach((r, k) => {
        if (/^[\s|:-]+$/.test(r) && /-{3,}/.test(r)) { headerDone = true; return; }
        const tag = (!headerDone && k === 0) ? 'th' : 'td';
        html += '<tr>' + cells(r).map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
      });
      out.push(html + '</table>'); continue;
    }
    let m;
    if ((m = l.match(/^\s*(#{1,6})\s*(.*)$/))) out.push(`<h4>${m[2]}</h4>`);
    else if (/^\s*$/.test(l)) out.push('');
    else out.push('<p>' + l.replace(/^(\s*)[-*]\s+/, '$1• ').replace(/^&gt;\s?/, '') + '</p>');
    i++;
  }
  return out.join('\n').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\\\*/g, '*');
}

function renderProgress() {
  const n = DATA.filter(q => status(q.id) === 'done').length;
  document.getElementById('progress').textContent = `${n} of ${DATA.length} reviewed`;
}
function visible() {
  const f = document.getElementById('filter').value, t = document.getElementById('search').value.toLowerCase(), area = document.getElementById('areaFilter').value;
  return DATA.filter(q => {
    if (f === 'todo' && status(q.id) === 'done') return false;
    if (f === 'done' && status(q.id) !== 'done') return false;
    if (f === 'safety' && q.safety !== 'yes') return false;
    if (f === 'flag' && !flagged(q)) return false;
    if (f === 'edge' && q.category === 'standard') return false;
    if (area && q.area !== area) return false;
    if (t && !(q.id.toLowerCase().includes(t) || q.question.toLowerCase().includes(t) || q.reference.toLowerCase().includes(t))) return false;
    return true;
  });
}
const AREAS = [...new Set(DATA.map(q => q.area))];
// While a filter or search is active every matching group is shown open; that should not change which groups stay open afterwards.
const isNarrowed = () => document.getElementById('filter').value !== 'all' || !!document.getElementById('search').value || !!document.getElementById('areaFilter').value;
const openAreas = new Set([byId[current].area]);
function renderList() {
  const v = visible();
  const narrowed = isNarrowed();
  const groups = AREAS.map(a => [a, v.filter(q => q.area === a)]).filter(([, qs]) => qs.length);
  document.getElementById('qlist').innerHTML = groups.map(([a, qs]) => {
    const all = DATA.filter(q => q.area === a), done = all.filter(q => status(q.id) === 'done').length;
    const open = narrowed || openAreas.has(a);
    return `<details class="group" data-area="${esc(a)}" ${open ? 'open' : ''}><summary><span class="gname">${esc(a)}</span>` +
      `<span class="gcount ${done === all.length ? 'all' : ''}">${done}/${all.length}</span></summary><ul>` +
      qs.map(q => `<li><button type="button" data-id="${q.id}" aria-current="${q.id === current}"><span class="dot ${status(q.id)}"></span><span class="qid">${q.id}</span><span class="qtxt">${esc(q.question)}</span></button></li>`).join('') +
      '</ul></details>';
  }).join('') || '<div class="empty">No questions match.</div>';
  document.getElementById('mobilePick').innerHTML = groups.map(([a, qs]) => `<optgroup label="${esc(a)}">` + qs.map(q =>
    `<option value="${q.id}" ${q.id === current ? 'selected' : ''}>${q.id} ${status(q.id) === 'done' ? '✓' : ''} — ${esc(q.question.slice(0, 60))}</option>`).join('') + '</optgroup>').join('');
}
function itemList(kind, items) {
  return `<ul class="items ${kind === 'must_include' ? 'must' : 'mustnot'}">` + items.map((x, k) =>
    `<li><input type="text" id="${kind}-${k}" data-kind="${kind}" data-k="${k}" value="${esc(x)}" aria-label="Item ${k + 1}"><button class="btn small" type="button" data-remove="${kind}" data-k="${k}" aria-label="Remove item">Remove</button></li>`).join('') +
    `</ul><div class="row"><button class="btn small" type="button" data-add="${kind}">+ Add item</button><button class="btn small" type="button" data-reset="${kind}">Reset to proposed</button></div>`;
}
function renderCard() {
  const q = byId[current], a = ans(current);
  const idx = DATA.findIndex(x => x.id === current);
  const badges = [`<span class="badge">${esc(q.area)}</span>`];
  if (q.safety === 'yes') badges.push('<span class="badge safety">Safety-critical</span>');
  if (flagged(q)) badges.push('<span class="badge flag">Needs a clinical decision</span>');
  document.getElementById('card').innerHTML = `
    <div class="head"><span class="id">${q.id}</span>${badges.join('')}</div>

    <section class="block">
      <h2>1. Question</h2>
      <div class="question">${esc(q.question)}</div>
      ${q.how_to_read ? `<div class="howto">${esc(q.how_to_read)}</div>` : ''}
      <div class="choices" role="radiogroup" aria-label="Question decision">
        <label><input type="radio" name="qd" id="qd-ok" value="keep" ${a.question_decision === 'keep' ? 'checked' : ''}> Question is fine</label>
        <label><input type="radio" name="qd" id="qd-rw" value="rewrite" ${a.question_decision === 'rewrite' ? 'checked' : ''}> Suggest a rewrite</label>
      </div>
      <div id="qsWrap" ${a.question_decision === 'rewrite' ? '' : 'hidden'}>
        <textarea id="qs" placeholder="Write the question the way a clinician would ask it">${esc(a.question_suggestion || q.question)}</textarea>
        <div class="note">If the rewrite changes the answer, edit the reference answer below to match.</div>
      </div>
    </section>

    <section class="block">
      <h2>2. Reference answer</h2>
      <div class="reference">${esc(q.reference)}</div>
      ${checkNote(q)}
      <div class="choices" role="radiogroup" aria-label="Reference decision">
        <label><input type="radio" name="rd" id="rd-ok" value="approve" ${a.reference_decision === 'approve' ? 'checked' : ''}> Approve</label>
        <label><input type="radio" name="rd" id="rd-ed" value="edit" ${a.reference_decision === 'edit' ? 'checked' : ''}> Edit and approve</label>
        <label><input type="radio" name="rd" id="rd-no" value="reject" ${a.reference_decision === 'reject' ? 'checked' : ''}> Cannot approve (explain in comments)</label>
      </div>
      <div id="reWrap" ${a.reference_decision === 'edit' ? '' : 'hidden'}>
        <textarea id="re" rows="6">${esc(a.reference_edit)}</textarea>
      </div>
    </section>

    <section class="block">
      <h2>3. The answer must include</h2>
      <div class="note">Facts a correct answer has to contain. Edit, remove or add items.</div>
      ${itemList('must_include', a.must_include)}
    </section>

    <section class="block">
      <h2>4. The answer must not include</h2>
      <div class="note">Statements that would make an answer wrong or unsafe.</div>
      ${itemList('must_not_include', a.must_not_include)}
    </section>

    <section class="block">
      <h2>Guideline text (${q.sources.length})</h2>
      ${q.sources.map((s, k) => `<div class="source"><div class="meta"><b>${esc(s.doc)}</b>, page ${esc(s.pages)} · ${esc(s.heading.split(' > ').slice(-2).join(' › '))}</div>
        <details ${k === 0 ? 'open' : ''}><summary>Show source text</summary><div class="srctext">${md(s.text)}</div></details></div>`).join('') || '<div class="note">None: not a clinical question.</div>'}
    </section>

    <section class="block">
      <h2>Comments</h2>
      <textarea id="cm" placeholder="Anything else: wrong source, missing context, disagreement with the guideline">${esc(a.comments)}</textarea>
    </section>

    <div class="nav-buttons">
      <button class="btn" type="button" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="btn primary" type="button" id="nextBtn">${idx === DATA.length - 1 ? 'Save' : 'Save and next →'}</button>
    </div>`;
}
function checkNote(q) {
  if (!q.sources.length) return '<div class="check">No guideline source: this question checks how the assistant responds, not a clinical fact.</div>';
  const where = q.documents.length ? ' (' + q.documents.map(esc).join('; ') + ')' : '';
  if (q.needs_decision) return `<div class="check flag"><b>Please decide:</b> ${esc(q.check)}</div>`;
  return `<div class="check"><b>Checked against the guideline text below${where}.</b>${q.check ? ' ' + esc(q.check) : ''}</div>`;
}
function go(id) { current = id; openAreas.add(byId[id].area); renderCard(); renderList(); save(); window.scrollTo(0, 0); }
function touch() { ans(current).reviewed_at = new Date().toISOString(); save(); queueSync(current); }

document.getElementById('card').addEventListener('change', e => {
  const a = ans(current), t = e.target;
  if (t.name === 'qd') { a.question_decision = t.value; document.getElementById('qsWrap').hidden = t.value !== 'rewrite'; if (t.value === 'rewrite' && !a.question_suggestion) a.question_suggestion = byId[current].question; }
  if (t.name === 'rd') { a.reference_decision = t.value; document.getElementById('reWrap').hidden = t.value !== 'edit'; }
  touch();
});
document.getElementById('card').addEventListener('input', e => {
  const a = ans(current), t = e.target;
  if (t.id === 'qs') a.question_suggestion = t.value;
  if (t.id === 're') a.reference_edit = t.value;
  if (t.id === 'cm') a.comments = t.value;
  if (t.dataset.kind) a[t.dataset.kind][+t.dataset.k] = t.value;
  touch();
});
document.getElementById('card').addEventListener('click', e => {
  const a = ans(current), t = e.target.closest('button'); if (!t) return;
  if (t.dataset.add) { a[t.dataset.add].push(''); touch(); renderCard(); const l = a[t.dataset.add].length - 1; document.getElementById(`${t.dataset.add}-${l}`).focus(); }
  if (t.dataset.remove) { a[t.dataset.remove].splice(+t.dataset.k, 1); touch(); renderCard(); }
  if (t.dataset.reset) { a[t.dataset.reset] = byId[current][t.dataset.reset].slice(); touch(); renderCard(); }
  if (t.id === 'prevBtn') { const i = DATA.findIndex(x => x.id === current); if (i > 0) go(DATA[i - 1].id); }
  if (t.id === 'nextBtn') {
    const st = status(current);
    if (st !== 'done') toast('Saved. Choose a question decision and a reference decision to mark this one reviewed.');
    else toast('Saved');
    const i = DATA.findIndex(x => x.id === current); if (i < DATA.length - 1) go(DATA[i + 1].id); else save();
  }
});
document.getElementById('qlist').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.id); });
document.getElementById('qlist').addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.area && !isNarrowed()) { d.open ? openAreas.add(d.dataset.area) : openAreas.delete(d.dataset.area); } }, true);
document.getElementById('areaFilter').innerHTML += AREAS.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
document.getElementById('areaFilter').addEventListener('change', renderList);
document.getElementById('mobilePick').addEventListener('change', e => go(e.target.value));
document.getElementById('filter').addEventListener('change', renderList);
document.getElementById('search').addEventListener('input', renderList);
const rv = document.getElementById('reviewer'); rv.value = state.reviewer || '';
rv.addEventListener('input', () => { state.reviewer = rv.value; save(); });
rv.addEventListener('change', () => { pull(); });

// ---- Saving to the review server (hosted build only). The browser copy above stays as a backup. ----
let accessCode = '';
try { accessCode = localStorage.getItem(KEY + '-code') || ''; } catch (e) {}
const pending = new Set();
let syncTimer = null;
const who = () => (state.reviewer || '').trim();
function setSync(msg, cls) { const el = document.getElementById('sync'); el.textContent = msg; el.className = 'sync ' + (cls || ''); }
function queueSync(id) {
  if (!SERVER) return;
  pending.add(id);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flush, 1000);
  setSync('Saving…');
}
async function flush() {
  if (!SERVER || !pending.size) return;
  if (!who()) { setSync('Enter your name to save your review', 'warn'); return; }
  const ids = [...pending]; pending.clear();
  try {
    const r = await fetch('api/responses', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reviewer: who(), code: accessCode, answers: Object.fromEntries(ids.map(i => [i, state.answers[i]]))})});
    if (r.status === 401) { ids.forEach(i => pending.add(i)); needCode(); return; }
    if (!r.ok) throw new Error(r.status);
    setSync('Saved ✓', 'ok');
  } catch (e) {
    ids.forEach(i => pending.add(i));
    setSync('Not saved to the server yet (kept in this browser); retrying', 'warn');
    clearTimeout(syncTimer); syncTimer = setTimeout(flush, 15000);
  }
}
async function pull() {
  if (!SERVER || !who()) return;
  try {
    const r = await fetch('api/responses?' + new URLSearchParams({reviewer: who(), code: accessCode}));
    if (r.status === 401) { needCode(); return; }
    if (!r.ok) throw new Error(r.status);
    const saved = (await r.json()).answers || {};
    let n = 0;
    for (const [id, a] of Object.entries(saved)) {
      const mine = state.answers[id];
      if (byId[id] && (!mine || (a.reviewed_at || '') > (mine.reviewed_at || ''))) { state.answers[id] = a; n++; }
    }
    for (const [id, a] of Object.entries(state.answers)) {   // answers made in this browser but not on the server
      if (a.reviewed_at && (!saved[id] || a.reviewed_at > (saved[id].reviewed_at || ''))) pending.add(id);
    }
    document.getElementById('codeField').hidden = true;   // code accepted (or none needed)
    save(); renderCard();
    if (n) toast(`Loaded ${n} saved answer${n === 1 ? '' : 's'}`);
    setSync(pending.size ? 'Saving…' : 'Saved ✓', pending.size ? '' : 'ok');
    flush();
  } catch (e) { setSync('Server not reachable; your work is kept in this browser', 'warn'); }
}
function needCode() {
  document.getElementById('codeField').hidden = false;
  setSync('Enter the access code you were given', 'warn');
  document.getElementById('code').focus();
}
document.getElementById('code').addEventListener('change', e => {
  accessCode = e.target.value.trim();
  try { localStorage.setItem(KEY + '-code', accessCode); } catch (err) {}
  pull();
});
if (SERVER) {
  fetch('api/config').then(r => r.json()).then(c => {
    if (c.code_required && !accessCode) needCode();
    else if (who()) pull();
    else setSync('Enter your name to start', 'warn');
  }).catch(() => setSync('Server not reachable; your work is kept in this browser', 'warn'));
}

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

// CSV export / import
const COLS = ['id', 'area', 'reviewer', 'safety_critical', 'needs_decision', 'question', 'question_decision', 'suggested_question',
  'reference_answer', 'reference_decision', 'final_reference_answer', 'must_include', 'must_not_include', 'comments', 'reviewed_at'];
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function toCsv() {
  const rows = [COLS.join(',')];
  DATA.forEach(q => {
    const a = state.answers[q.id] || {};
    const finalRef = a.reference_decision === 'edit' ? a.reference_edit : (a.reference_decision === 'approve' ? q.reference : '');
    const inc = (a.must_include || q.must_include).filter(x => x.trim()), exc = (a.must_not_include || q.must_not_include).filter(x => x.trim());
    rows.push([q.id, q.area, state.reviewer, q.safety, q.needs_decision ? 'yes' : 'no', q.question, a.question_decision || '',
      a.question_decision === 'rewrite' ? a.question_suggestion : '', q.reference, a.reference_decision || '', finalRef,
      inc.join(' ; '), exc.join(' ; '), a.comments || '', a.reviewed_at || ''].map(csvCell).join(','));
  });
  return '﻿' + rows.join('\r\n');
}
document.getElementById('downloadBtn').addEventListener('click', () => {
  const name = (state.reviewer || 'reviewer').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'reviewer';
  const blob = new Blob([toCsv()], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `guideline_answer_review_${name}_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('CSV downloaded');
});
function parseCsv(text) {
  text = text.replace(/^﻿/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const rows = parseCsv(r.result); const head = rows.shift(); const ix = n => head.indexOf(n);
      if (ix('id') < 0 || ix('reference_decision') < 0) throw new Error('not a review CSV');
      let n = 0;
      rows.forEach(c => {
        const id = c[ix('id')]; if (!byId[id]) return; const q = byId[id];
        state.answers[id] = {question_decision: c[ix('question_decision')] || '', question_suggestion: c[ix('suggested_question')] || '',
          reference_decision: c[ix('reference_decision')] || '', reference_edit: c[ix('final_reference_answer')] || q.reference,
          must_include: (c[ix('must_include')] || '').split(' ; ').filter(Boolean), must_not_include: (c[ix('must_not_include')] || '').split(' ; ').filter(Boolean),
          comments: c[ix('comments')] || '', reviewed_at: c[ix('reviewed_at')] || ''};
        if (!state.answers[id].must_include.length) state.answers[id].must_include = q.must_include.slice();
        if (!state.answers[id].must_not_include.length) state.answers[id].must_not_include = q.must_not_include.slice();
        n++;
      });
      const rcol = ix('reviewer'); if (rcol >= 0 && rows[0] && rows[0][rcol]) { state.reviewer = rows[0][rcol]; rv.value = state.reviewer; }
      save(); renderCard(); toast(`Loaded ${n} questions from the CSV`);
      Object.keys(state.answers).forEach(id => { if (state.answers[id].reviewed_at) queueSync(id); });
    } catch (err) { toast('Could not read that file. Choose a CSV downloaded from this page.'); }
    e.target.value = '';
  };
  r.readAsText(f, 'utf-8');
});

document.getElementById('helpBtn').addEventListener('click', () => {
  document.getElementById('card').innerHTML = `<section class="block help"><h2>How to review</h2>
    <p>These questions will be used to test a chat assistant that answers health workers' questions from the Eswatini national guidelines. Each reference answer is what a correct reply should say <b>according to the guidelines</b>, and the guideline text it was checked against is shown under it. If your practice differs from the guideline, please say so in the comments rather than changing the answer.</p>
    <ol>
      <li>Enter your name at the top.</li>
      <li>For each question: say whether it reads like something a health worker would ask, or suggest a rewrite. Some questions are vague, misspelled or contain a wrong assumption on purpose; a green note under the question says so. Please keep those as they are.</li>
      <li>Check the reference answer against the source text shown below it. Approve it, edit it and approve, or mark it as not approvable and say why in the comments.</li>
      <li>Check the two lists: what a correct answer must include, and what it must not include. Edit, add or remove items.</li>
      <li>Questions marked <b>Needs a clinical decision</b> are where the guidelines disagree with each other, are unclear, or the answer goes beyond what they state. The <b>Please decide</b> note explains what to decide; record your decision by editing the answer or in the comments.</li>
    </ol>
    ${SERVER ? `<p>Your answers are saved to the review server as you go (the status next to the progress count shows <b>Saved ✓</b>). To continue on another computer or phone, open the same link and enter <b>exactly the same name</b>. <b>Download CSV</b> gives you your own copy.</p>`
      : `<p>Your work is saved in this browser as you go. Use <b>Download CSV</b> to send your review back, and to keep a copy: the browser copy can be lost if the browser's data is cleared. To continue on another computer, use <b>Load saved CSV</b>.</p>`}
    <div class="row"><button class="btn primary" type="button" id="backBtn">Back to the questions</button></div></section>`;
  document.getElementById('backBtn').addEventListener('click', renderCard);
});

renderProgress(); renderList(); renderCard();
</script>
